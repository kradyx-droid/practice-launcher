function createQuickRuntime(config){
 const nodes=[...(config.mainFlow||[]),...(config.branchNodes||[])],byId=new Map(nodes.map(n=>[n.nodeId,n]));
 const state={currentNodeId:nodes[0]?.nodeId??null,status:"running",runtimeKey:null,firstNaturalAnswer:null,answers:[],path:[],routes:[],stopReason:null};
 if(state.currentNodeId)state.path.push({event:"enter",nodeId:state.currentNodeId,kind:byId.get(state.currentNodeId).kind||"main"});
 function runtimeKeyMatches(condition){if(!condition)return true;if(state.runtimeKey===null)return false;if(Object.prototype.hasOwnProperty.call(condition,"equals"))return state.runtimeKey===condition.equals;if(Object.prototype.hasOwnProperty.call(condition,"notEquals"))return state.runtimeKey!==condition.notEquals;return false;}
 function routeFor(node,answer){const routes=(config.routes||[]).filter(r=>r.afterNodeId===node.nodeId&&conditionMatches(r.when,answer)&&runtimeKeyMatches(r.whenRuntimeKey));return routes.find(r=>!r.priorResultGate)||routes.find(r=>r.priorResultGate);}
 function conditionMatches(when,answer){if(!when)return true;const value=answer[when.field];if(Object.prototype.hasOwnProperty.call(when,"equals"))return value===when.equals;const contains=when.contains,notContains=when.notContains;const match=spec=>{if(!spec)return false;if(spec.token!==undefined)return Array.isArray(value)&&value.some(x=>x.token===spec.token);if(spec.range){const {start,end}=spec.range,source=answer.sourceText||"",selected=Array.isArray(value)?value:[];if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<=start||end>source.length)return false;for(let i=start;i<end;i++){if(/\s/u.test(source[i]))continue;if(!selected.some(x=>x.start<=i&&x.end>i))return false}return true}return false};if(contains)return match(contains);if(notContains)return !match(notContains);return false;}
 function readPriorResultGate(gate){if(!gate||!Array.isArray(gate.nodeIds)||!gate.nodeIds.length||new Set(gate.nodeIds).size!==gate.nodeIds.length||gate.allEquals!==1)return {valid:false};const observed={};for(const nodeId of gate.nodeIds){const matches=state.answers.filter(answer=>answer.nodeId===nodeId);if(matches.length!==1||![0,1].includes(matches[0].firstResult))return {valid:false};observed[nodeId]=matches[0].firstResult}return {valid:true,observed,matched:Object.values(observed).every(value=>value===gate.allEquals)};}
 function complete(fromNodeId,terminal=false){state.currentNodeId=null;state.status="completed";state.path.push(terminal?{event:"complete",from:fromNodeId,terminal:"completion"}:{event:"complete"});}
 function routeError(nodeId){state.currentNodeId=null;state.status="stopped";state.stopReason="route_configuration_error";state.path.push({event:"stop",nodeId,reason:"route_configuration_error"});}
 return {state,node:()=>byId.get(state.currentNodeId),submit(answer){if(state.status!=="running")return null;const node=byId.get(state.currentNodeId);if(!node){routeError(state.currentNodeId);return null}if(node.kind==="branch"){const exitCount=Number(node.terminal!==undefined)+Number(Boolean(node.nextNodeId))+Number(Boolean(node.returnTo));if(exitCount!==1||(node.terminal!==undefined&&node.terminal!=="completion")){routeError(node.nodeId);return null}}const saved={...answer,nodeId:node.nodeId,nodeKind:node.kind||"main"};delete saved.firstResult;let firstResultError=false;if(node.firstResultRule){const rule=node.firstResultRule;if(!rule.field||!Object.prototype.hasOwnProperty.call(rule,"equals")||!Object.prototype.hasOwnProperty.call(answer,rule.field))firstResultError=true;else saved.firstResult=answer[rule.field]===rule.equals?1:0}state.answers.push(saved);if(saved.nodeKind==="main"&&!state.firstNaturalAnswer)state.firstNaturalAnswer={...saved};if(firstResultError){routeError(node.nodeId);return null}if(node.setRuntimeKeyOnSubmit!==undefined){if(typeof node.setRuntimeKeyOnSubmit!=="string"||!node.setRuntimeKeyOnSubmit){routeError(node.nodeId);return null}state.runtimeKey=node.setRuntimeKeyOnSubmit}const route=routeFor(node,saved);let nextId=null;if(route?.priorResultGate){const gate=readPriorResultGate(route.priorResultGate);if(!gate.valid){routeError(node.nodeId);return null}nextId=gate.matched?route.priorResultGate.trueTargetNodeId:route.priorResultGate.falseTargetNodeId;state.routes.push({type:"prior_result_gate",from:node.nodeId,to:nextId,routeId:route.id||null,condition:{nodeIds:[...route.priorResultGate.nodeIds],allEquals:route.priorResultGate.allEquals},observed:gate.observed,result:gate.matched})}else if(route){nextId=route.targetNodeId;const routeLog={type:"condition",from:node.nodeId,to:nextId,routeId:route.id||null,condition:route.when??null,observed:{field:route.when?.field??null,value:route.when?saved[route.when.field]??null:null}};if(route.whenRuntimeKey){routeLog.runtimeKeyCondition=route.whenRuntimeKey;routeLog.observedRuntimeKey=state.runtimeKey}state.routes.push(routeLog)}else if(node.kind==="branch"){if(node.terminal==="completion"){complete(node.nodeId,true);return null}if(node.nextNodeId)nextId=node.nextNodeId;else if(node.returnTo){nextId=node.returnTo;state.routes.push({type:"return",from:node.nodeId,to:nextId});}else{routeError(node.nodeId);return null}}else{const ix=(config.mainFlow||[]).findIndex(x=>x.nodeId===node.nodeId);if(ix<0){routeError(node.nodeId);return null}nextId=config.mainFlow[ix+1]?.nodeId??null;if(!nextId){complete(node.nodeId);return null}}if(!byId.has(nextId)){routeError(node.nodeId);return null}state.currentNodeId=nextId;state.path.push({event:node.kind==="branch"&&node.returnTo?"return":"enter",from:node.nodeId,nodeId:nextId,kind:byId.get(nextId).kind||"main"});return byId.get(nextId)},stop(reason="manual",draftAtStop=null){if(state.status!=="running")return;state.status="stopped";state.stopReason=reason;state.draftAtStop=draftAtStop;state.path.push({event:"stop",nodeId:state.currentNodeId,reason})},exportSession(){const session={status:state.status,stopReason:state.stopReason,currentNodeId:state.currentNodeId,firstNaturalAnswer:state.firstNaturalAnswer,draftAtStop:state.draftAtStop??null,answers:state.answers,path:state.path,routes:state.routes};if(state.runtimeKey!==null)session.runtimeKey=state.runtimeKey;return JSON.parse(JSON.stringify(session))}};

function auditQuickRouteConfig(config){
 const mainFlow=config.mainFlow||[],branchNodes=config.branchNodes||[],routes=config.routes||[],nodes=[...mainFlow,...branchNodes],byId=new Map(nodes.map(node=>[node.nodeId,node])),issues=[];

 for(const route of routes){if(!byId.has(route.afterNodeId))add("unknown_route_source",route.afterNodeId,"route 来源节点不存在");if(route.whenRuntimeKey){const condition=route.whenRuntimeKey,hasEquals=Object.prototype.hasOwnProperty.call(condition,"equals"),hasNotEquals=Object.prototype.hasOwnProperty.call(condition,"notEquals");if(hasEquals===hasNotEquals||typeof (hasEquals?condition.equals:condition.notEquals)!=="string"||!(hasEquals?condition.equals:condition.notEquals))add("invalid_runtime_key_condition",route.afterNodeId,"runtimeKey 条件必须且只能声明非空字符串 equals 或 notEquals");const readerIndex=mainFlow.findIndex(node=>node.nodeId===route.afterNodeId),hasEarlierWrite=readerIndex>=0&&mainFlow.some((node,index)=>index<=readerIndex&&typeof node.setRuntimeKeyOnSubmit==="string"&&node.setRuntimeKeyOnSubmit.length>0);if(!hasEarlierWrite)add("runtime_key_read_before_write",route.afterNodeId,"runtimeKey 在明确写入以前被读取")}if(route.priorResultGate){const gate=route.priorResultGate;if(route.targetNodeId!==undefined)add("mixed_gate_target",route.afterNodeId,"前序结果 Gate 不得同时声明普通 targetNodeId");if(!Array.isArray(gate.nodeIds)||!gate.nodeIds.length||new Set(gate.nodeIds).size!==gate.nodeIds.length||gate.allEquals!==1)add("invalid_prior_result_gate",route.afterNodeId,"Gate 必须指定不重复的 nodeIds，并使用 allEquals: 1");for(const nodeId of gate.nodeIds||[]){const referenced=byId.get(nodeId);if(!referenced)add("unknown_gate_node",route.afterNodeId,`Gate 引用的 nodeId 不存在: ${nodeId}`);else if(!referenced.firstResultRule||!referenced.firstResultRule.field||!Object.prototype.hasOwnProperty.call(referenced.firstResultRule,"equals"))add("gate_node_missing_first_result_rule",route.afterNodeId,`Gate 引用的 nodeId 未配置合法 firstResultRule: ${nodeId}`)}for(const target of [gate.trueTargetNodeId,gate.falseTargetNodeId])if(!byId.has(target))add("unknown_route_target",route.afterNodeId,"Gate true / false 目标节点必须存在")}else if(!byId.has(route.targetNodeId))add("unknown_route_target",route.afterNodeId,"route 目标节点不存在");}
 for(const branch of branchNodes){const hasTerminal=branch.terminal!==undefined,hasNext=Boolean(branch.nextNodeId),hasReturn=Boolean(branch.returnTo),exitCount=Number(hasTerminal)+Number(hasNext)+Number(hasReturn);if(hasTerminal&&branch.terminal!=="completion")add("invalid_terminal",branch.nodeId,"terminal 只允许使用 completion");if(exitCount!==1)add("branch_exit_not_explicit",branch.nodeId,"branch 必须且只能声明一个默认出口：nextNodeId、returnTo 或 terminal:completion");const target=hasNext?branch.nextNodeId:hasReturn?branch.returnTo:null;if(target&&!byId.has(target))add("unknown_branch_exit",branch.nodeId,"branch 默认出口目标节点不存在");}
 const branchClosureValid=!issues.some(issue=>["duplicate_node_id","unknown_route_source","unknown_route_target","invalid_terminal","branch_exit_not_explicit","unknown_branch_exit","invalid_first_result_rule","invalid_runtime_key_write","invalid_runtime_key_condition","runtime_key_read_before_write","unknown_gate_node","gate_node_missing_first_result_rule","mixed_gate_target","invalid_prior_result_gate"].includes(issue.code));

}

let runtimeConfig=defaultRuntimeConfig,flow=runtimeConfig.mainFlow,runtime=createQuickRuntime(runtimeConfig),stepIndex=0,feedbackState=null,inputValue="",choiceValue=null;
const card=document.querySelector("#card"),stepCount=document.querySelector("#stepCount"),progressFill=document.querySelector("#progressFill");
function renderQuickMathText(target,value){const source=String(value??"");const pattern=/\\frac\{([^{}]+)\}\{([^{}]+)\}|\\frac([0-9])([0-9])|(\d+)\s*\/\s*(\d+)/g;let cursor=0;target.replaceChildren();for(const match of source.matchAll(pattern)){if(match[5]!==undefined&&(source[match.index-1]==="/"||source[match.index+match[0].length]==="/"))continue;const index=match.index;if(index>cursor)target.append(document.createTextNode(source.slice(cursor,index)));const numerator=match[1]??match[3]??match[5],denominator=match[2]??match[4]??match[6],fraction=document.createElement("span");fraction.className="quick-fraction";fraction.setAttribute("role","math");fraction.setAttribute("aria-label",`${numerator} over ${denominator}`);const top=document.createElement("span");top.className="quick-fraction__numerator";top.textContent=numerator;const bar=document.createElement("span");bar.className="quick-fraction__bar";bar.setAttribute("aria-hidden","true");const bottom=document.createElement("span");bottom.className="quick-fraction__denominator";bottom.textContent=denominator;fraction.append(top,bar,bottom);target.append(fraction);cursor=index+match[0].length}if(cursor<source.length)target.append(document.createTextNode(source.slice(cursor)))}
window.QuickMathDisplay=Object.freeze({render:renderQuickMathText});
function current(){return runtime.node()||flow[stepIndex]}
function canSubmit(){const step=current();return step.answerMode==="free_input"?inputValue.trim().length>0:choiceValue!==null}
function paintProgress(step){const current=step.progressCurrent;stepCount.textContent=`${current} / 20`;progressFill.style.width=`${current/20*100}%`}
function draw(){const step=current();paintProgress(step);card.classList.remove("done");card.classList.toggle("free-input-scroll-layout",step.answerMode==="free_input");card.replaceChildren();const scroller=document.createElement("div");scroller.className="text-scroll";const text=document.createElement("p");text.className="text-block";text.setAttribute("aria-label","题目");QuickMathDisplay.render(text,step.displayText??step.text);scroller.append(text);card.append(scroller);const task=document.createElement("p");task.className="instruction";QuickMathDisplay.render(task,step.task);card.append(task);
 if(step.answerMode==="free_input"){const field=document.createElement("textarea");field.id="freeInput";field.className="free-input";field.rows=1;field.autocomplete="off";field.setAttribute("enterkeyhint","send");field.setAttribute("aria-label","输入回答");field.placeholder="输入简短回答";field.value=inputValue;field.addEventListener("input",()=>{inputValue=field.value;resizeFreeInput(field);syncSubmit()});field.addEventListener("keydown",handleFreeInputKeydown);card.append(field);resizeFreeInput(field)}
 if(step.options){const prompt=document.createElement("p");prompt.className="instruction";QuickMathDisplay.render(prompt,step.options.prompt);card.append(prompt);const opts=document.createElement("div");opts.className="options";step.options.items.forEach((label,index)=>{const button=document.createElement("button");button.type="button";button.className="option";button.setAttribute("aria-pressed",String(choiceValue===index));const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+index);const value=document.createElement("span");QuickMathDisplay.render(value,label);button.append(letter,value);button.addEventListener("click",()=>{choiceValue=index;draw()});opts.append(button)});card.append(opts)}
 const actions=document.createElement("div");actions.className="actions";const submit=document.createElement("button");submit.className="primary";submit.id="submit";submit.textContent="提交";submit.disabled=!canSubmit();submit.addEventListener("click",submitCurrent);actions.append(submit);card.append(actions)}
function resizeFreeInput(field){field.style.height="var(--free-input-height)";field.classList.remove("is-scrollable");const maxHeight=parseFloat(getComputedStyle(field).maxHeight),borderSize=field.offsetHeight-field.clientHeight,contentHeight=field.scrollHeight+borderSize;if(contentHeight>maxHeight){field.style.height=`${maxHeight}px`;field.classList.add("is-scrollable")}else field.style.height=`${Math.max(parseFloat(getComputedStyle(field).height),contentHeight)}px`}
function syncSubmit(){const button=card.querySelector("#submit");if(button)button.disabled=!canSubmit()}
function handleFreeInputKeydown(event){if(event.key!=="Enter"||event.shiftKey||event.isComposing||event.keyCode===229)return;if(!canSubmit())return;event.preventDefault();submitCurrent()}
function submitCurrent(){if(!canSubmit()||feedbackState)return;const step=current(),record=step.answerMode==="free_input"?{item:step.item,step:step.step,sourceText:step.text,textSelection:[],optionChoice:null,answerMode:"free_input",rawInputText:inputValue,submittedAt:new Date().toISOString(),probeRule:null,judgement:null}:(()=>{const selectedOptionValue=step.options.values[choiceValue];return {item:step.item,step:step.step,sourceText:step.text,textSelection:[],answerMode:"option_selection",selectedOptionId:String.fromCharCode(65+choiceValue),selectedOptionValue,optionChoice:selectedOptionValue}})();const index=stepIndex;runtime.submit(record);feedbackState={step,record,index};drawFeedback()}

function drawComplete(){card.classList.add("done");card.classList.remove("free-input-scroll-layout");card.replaceChildren();const title=document.createElement("h1");title.className="step-title";title.textContent="已完成";const button=document.createElement("button");button.className="primary";button.textContent="复制结果";button.addEventListener("click",copyResults);card.append(title,button)}
const UNIVERSAL_QUICK_RESULT_V1_HEADER=[
 "FORMAT UNIVERSAL_QUICK_RESULT_V1",
 "Universal Quick｜结果导出协议 v1",
 "以下为一次运行结果，正文 JSON 位于本说明之后。顶层 status/stopReason/currentNodeId 表示会话状态；firstNaturalAnswer 是首条已提交 main 节点答案的快照；draftAtStop 是停止时当前节点尚未提交的草稿（正常完成时为 null）。answers 按提交顺序记录作答，path 记录实际经过的节点及结束/停止事件，routes 只列本次实际命中的路由。nodeKind 区分 main/branch，item/step/nodeId 定位节点；sourceText 是题面或文字；Choice 的提交选项保存在 selectedOptionId、selectedOptionValue 和 optionChoice 中。selectedOptionId 是界面顺序对应的 A、B 等标识，selectedOptionValue 是实际选项值。textSelection 保存所选 token 及其在 sourceText 中的 UTF-16 零起点半开区间。配置 firstResultRule 的节点会在首次提交时把该答案的二元结果 0 / 1 写入同一 answers 记录的 firstResult；未配置时该字段缺失。运行时忽略提交 payload 自带的 firstResult。Free Input 的正式提交在 answers / firstNaturalAnswer 中以 answerMode:\"free_input\" 标识，rawInputText 是提交时原样保存的完整文本，submittedAt 是提交时间，probeRule 是本题配置的判读参考（未配置时为 null），judgement 固定为 null，表示前端未进行业务判定；这些 Free Input 字段不会出现在 Choice 答案中。停止在 Free Input 题目时，draftAtStop.rawInputText 保存当时未提交的原文；停止草稿始终带有 rawInputText、textSelection、optionChoice，其中非适用输入/选择为 null。未提交草稿不属于正式 answers，也不代表已判定答案。字段可能因节点类型而缺失；字段缺失或 null 仅表示该记录未提供相应类型的数据，不能据此推断学生表现。routes 的 from/to 是起终节点地址；type:\"condition\" 记录普通条件 route，type:\"prior_result_gate\" 记录一次前序结果 Gate、其 nodeIds 条件和读取值；普通条件 route 如使用 runtimeKey，会记录 runtimeKeyCondition 与 observedRuntimeKey。顶层 runtimeKey 仅在配置并写入时导出，未使用时省略；return 等其他 route 可以没有这些字段，routeId 也可能为 null。recordSpec 是节点预设记录说明，evidenceLevel 是该记录的预设证据等级，feedback 是节点配置值；这些字段未配置时可能直接缺失，不保证输出 null，字段缺失不构成学生表现。Independent、Prompted、Taught 表示记录节点预设的执行条件/记录语义，不是最终能力结论。若当前批次预置了某 branch，但它未出现在本次 answers/path 中，表示本次运行没有进入该 branch；这不提供孩子在该 branch 上会如何作答的证据。Grammar 仍需结合冻结教研目标、首次真实表现及 answers/path/routes 作最终判断。",
 "【运行记录 JSON】"
].join("\n");
function formatResults(){return `${UNIVERSAL_QUICK_RESULT_V1_HEADER}\n${JSON.stringify(runtime.exportSession(),null,2)}`}
async function copyResults(event){const button=event.currentTarget,text=formatResults();let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch{}if(!copied){const field=document.createElement("textarea");field.value=text;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}if(copied){button.textContent="已复制";button.disabled=true;setTimeout(()=>{button.textContent="复制结果";button.disabled=false},1200)}}
window.QuickRuntime={create:createQuickRuntime,exportSession:()=>runtime.exportSession()};
draw();
