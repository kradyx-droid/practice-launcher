tions":null,"instruction":"不用算出商，只写你准备怎样改写这个算式再计算。","feedback":true,"referenceAnswer":"2.8÷0.7 → 28÷7","explanation":"两边一起移动，让除数变成整数。"}]},{"item":"Q08","target":"优惠券后的实际付款重建","steps":[{"step":"S1","text":"练习本每本 9 元。\n\n小明买了 3 本，结账时使用了一张 6 元优惠券。\n\n平均每本实际花了多少钱？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最后答案，只列完整算式。","feedback":true,"referenceAnswer":"(9×3－6)÷3","explanation":"先扣掉优惠券，再把实付的钱平均到 3 本。"}]},{"item":"Q09","target":"乘小于 1 的数｜大小方向","steps":[{"step":"S1","text":"不算具体结果，判断：\n\n6×0.4\n\n结果和 6 相比：","answerMode":"option_selection","freeInput":false,"options":{"kind":"single","prompt":"选择一个答案。","items":["大","小","相等"]},"instruction":null,"feedback":true,"referenceAnswer":"小","explanation":"0.4 份不到一整份，所以结果比 6 小。"}]},{"item":"Q10","target":"小数数量级 / 结果合理性检查","steps":[{"step":"S1","text":"有人算：\n\n3.1×4.2＝130.2\n\n先不要重新笔算。\n\n你觉得这个结果合理吗？为什么？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"写出判断和一个简单依据。","feedback":true,"referenceAnswer":"不合理。3.1接近3，4.2接近4，3×4大约是12。","explanation":"结果应该在十几附近。130.2 明显太大。"}]},{"item":"Q11","target":"活动规格变化后的实际单价重建","steps":[{"step":"S1","text":"一种饼干普通装每袋 450 克，售价 10 元。\n\n活动包装上写：比普通装多 50 克，价格不变。\n\n活动装平均每 100 克实际多少钱？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最后答案，只写你准备怎么算。","feedback":true,"referenceAnswer":"先算450＋50＝500克，再算10÷5。","explanation":"活动后是一袋 500 克，再算每 100 克多少钱。"}]},{"item":"Q12","target":"算前单位统一","steps":[{"step":"S1","text":"水壶里原有 0.9 升水，又倒进去 350 毫升。\n\n现在一共有多少毫升水？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最后答案，只写你准备怎么处理。","feedback":true,"referenceAnswer":"先把0.9升换成900毫升，再和350毫升相加。","explanation":"两个数量的单位不同，先都变成毫升。"}]},{"item":"Q13","target":"不同促销方式后的实际单价重建","steps":[{"step":"S1","text":"同一种牛奶，两家店的活动不同。\n\n甲店：\n4 盒组合价 18 元。\n\n乙店：\n每盒 5 元，买 3 盒送 1 盒。\n\n想知道哪家活动后平均每盒更便宜，你准备怎么比？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最终结果，只写比较方法或算式。","feedback":true,"referenceAnswer":"甲店：18÷4；乙店：(5×3)÷4；再比较。","explanation":"甲店付 18 元拿 4 盒。乙店付 3 盒的钱拿 4 盒。"}],"displayBlocks":["同一种牛奶，两家店的活动不同。","甲店：\n4 盒组合价 18 元。","乙店：\n每盒 5 元，买 3 盒送 1 盒。","想知道哪家活动后平均每盒更便宜，你准备怎么比？"]},{"item":"Q14","target":"普通统一比较基准","steps":[{"step":"S1","text":"甲走了 5 千米，用了 40 分钟。\n乙走了 6 千米，用了 45 分钟。\n\n想比较谁走得更快，你准备怎么比？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最终结果，只写比较方法。","feedback":true,"referenceAnswer":"分别算每分钟走多少千米：5÷40，6÷45，再比较。","explanation":"路程和时间都不同，先换成同一种比较标准。"}]},{"item":"Q15","target":"包装层级 + 活动组合价重建","steps":[{"step":"S1","text":"一种饼干原价每盒 10 元，每盒里面有 3 小包。\n\n活动是：2 盒组合价 18 元。\n\n活动后平均每小包实际多少钱？","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最后答案，只写你准备怎么算。","feedback":true,"referenceAnswer":"18÷(2×3)；或：先算2×3＝6小包，再算18÷6。","explanation":"活动价 18 元可以买到 2 盒，也就是 6 小包。所以：18÷6。"}]},{"item":"Q16","target":"小数乘法程序区分","steps":[{"step":"S1","text":"计算：\n\n0.32×1.5","answerMode":"free_input","freeInput":true,"options":null,"instruction":"不用算出最后的积，只写你准备怎样处理。","feedback":true,"referenceAnswer":"先按32×15算，再在积中从右往左点出3位小数。","explanation":"两个因数一共 3 位小数，积中从右往左点出 3 位。"}]}];
const mainFlow=items.flatMap(item=>item.steps.map(step=>({...step,item:item.item,itemTarget:item.target,itemTitle:item.title||"",displayBlocks:item.displayBlocks||null,kind:"main",nodeId:`${item.item}:${step.step}`})));

const defaultRuntimeConfig={mainFlow,branchNodes:[],routes:[]};
function createQuickRuntime(config){
 const nodes=[...(config.mainFlow||[]),...(config.branchNodes||[])],byId=new Map(nodes.map(n=>[n.nodeId,n]));
 const state={currentNodeId:nodes[0]?.nodeId??null,status:"running",runtimeKey:null,firstNaturalAnswer:null,answers:[],path:[],routes:[],stopReason:null};
 if(state.currentNodeId)state.path.push({event:"enter",nodeId:state.currentNodeId,kind:byId.get(state.currentNodeId).kind||"main"});
 function runtimeKeyMatches(condition){if(!condition)return true;if(state.runtimeKey===null)return false;if(Object.prototype.hasOwnProperty.call(condition,"equals"))return state.runtimeKey===condition.equals;if(Object.prototype.hasOwnProperty.call(condition,"notEquals"))return state.runtimeKey!==condition.notEquals;return false;}
 function routeFor(node,answer){const routes=(config.routes||[]).filter(r=>r.afterNodeId===node.nodeId&&conditionMatches(r.when,answer)&&runtimeKeyMatches(r.whenRuntimeKey));return routes.find(r=>!r.priorResultGate)||routes.find(r=>r.priorResultGate);}
 function conditionMatches(when,answer){if(!when)return true;const value=answer[when.field];if(Object.prototype.hasOwnProperty.call(when,"equals"))return value===when.equals;const contains=when.contains,notContains=when.notContains;const match=spec=>{if(!spec)return false;if(spec.token!==undefined)return Array.isArray(value)&&value.some(x=>x.token===spec.token);if(spec.range){const {start,end}=spec.range,source=answer.sourceText||"",selected=Array.isArray(value)?value:[];if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<=start||end>source.length)return false;for(let i=start;i<end;i++){if(/\s/u.test(source[i]))continue;if(!selected.some(x=>x.start<=i&&x.end>i))return false}return true}return false};if(contains)return match(contains);if(notContains)return !match(notContains);return false;}
 function readPriorResultGate(gate){if(!gate||!Array.isArray(gate.nodeIds)||!gate.nodeIds.length||new Set(gate.nodeIds).size!==gate.nodeIds.length||gate.allEquals!==1)return {valid:false};const observed={};for(const nodeId of gate.nodeIds){const matches=state.answers.filter(answer=>answer.nodeId===nodeId);if(matches.length!==1||![0,1].includes(matches[0].firstResult))return {valid:false};observed[nodeId]=matches[0].firstResult}return {valid:true,observed,matched:Object.values(observed).every(value=>value===gate.allEquals)};}
 function complete(fromNodeId,terminal=false){state.currentNodeId=null;state.status="completed";state.path.push(terminal?{event:"complete",from:fromNodeId,terminal:"completion"}:{event:"complete"});}
 function routeError(nodeId){state.currentNodeId=null;state.status="stopped";state.stopReason="route_configuration_error";state.path.push({event:"stop",nodeId,reason:"route_configuration_error"});}
 return {state,node:()=>byId.get(state.currentNodeId),submit(answer){if(state.status!=="running")return null;const node=byId.get(state.currentNodeId);if(!node){routeError(state.currentNodeId);return null}if(node.kind==="branch"){const exitCount=Number(node.terminal!==undefined)+Number(Boolean(node.nextNodeId))+Number(Boolean(node.returnTo));if(exitCount!==1||(node.terminal!==undefined&&node.terminal!=="completion")){routeError(node.nodeId);return null}}const saved={...answer,nodeId:node.nodeId,nodeKind:node.kind||"main"};delete saved.firstResult;let firstResultError=false;const recordAnswer=node.recordAnswer!==false;if(node.firstResultRule){const rule=node.firstResultRule;if(!recordAnswer||!rule.field||!Object.prototype.hasOwnProperty.call(rule,"equals")||!Object.prototype.hasOwnProperty.call(answer,rule.field))firstResultError=true;else saved.firstResult=answer[rule.field]===rule.equals?1:0}if(recordAnswer){state.answers.push(saved);if(saved.nodeKind==="main"&&!state.firstNaturalAnswer)state.firstNaturalAnswer={...saved}}if(firstResultError){routeError(node.nodeId);return null}if(node.setRuntimeKeyOnSubmit!==undefined){if(typeof node.setRuntimeKeyOnSubmit!=="string"||!node.setRuntimeKeyOnSubmit){routeError(node.nodeId);return null}state.runtimeKey=node.setRuntimeKeyOnSubmit}const route=routeFor(node,saved);let nextId=null;if(route?.priorResultGate){const gate=readPriorResultGate(route.priorResultGate);if(!gate.valid){routeError(node.nodeId);return null}nextId=gate.matched?route.priorResultGate.trueTargetNodeId:route.priorResultGate.falseTargetNodeId;state.routes.push({type:"prior_result_gate",from:node.nodeId,to:nextId,routeId:route.id||null,condition:{nodeIds:[...route.priorResultGate.nodeIds],allEquals:route.priorResultGate.allEquals},observed:gate.observed,result:gate.matched})}else if(route){nextId=route.targetNodeId;const routeLog={type:"condition",from:node.nodeId,to:nextId,routeId:route.id||null,condition:route.when??null,observed:{field:route.when?.field??null,value:route.when?saved[route.when.field]??null:null}};if(route.whenRuntimeKey){routeLog.runtimeKeyCondition=route.whenRuntimeKey;routeLog.observedRuntimeKey=state.runtimeKey}state.routes.push(routeLog)}else if(node.kind==="branch"){if(node.terminal==="completion"){complete(node.nodeId,true);return null}if(node.nextNodeId)nextId=node.nextNodeId;else if(node.returnTo){nextId=node.returnTo;state.routes.push({type:"return",from:node.nodeId,to:nextId});}else{routeError(node.nodeId);return null}}else{const ix=(config.mainFlow||[]).findIndex(x=>x.nodeId===node.nodeId);if(ix<0){routeError(node.nodeId);return null}nextId=config.mainFlow[ix+1]?.nodeId??null;if(!nextId){complete(node.nodeId);return null}}if(!byId.has(nextId)){routeError(node.nodeId);return null}state.currentNodeId=nextId;state.path.push({event:node.kind==="branch"&&node.returnTo?"return":"enter",from:node.nodeId,nodeId:nextId,kind:byId.get(nextId).kind||"main"});return byId.get(nextId)},stop(reason="manual",draftAtStop=null){if(state.status!=="running")return;state.status="stopped";state.stopReason=reason;state.draftAtStop=draftAtStop;state.path.push({event:"stop",nodeId:state.currentNodeId,reason})},exportSession(){const session={status:state.status,stopReason:state.stopReason,currentNodeId:state.currentNodeId,firstNaturalAnswer:state.firstNaturalAnswer,draftAtStop:state.draftAtStop??null,answers:state.answers,path:state.path,routes:state.routes};if(state.runtimeKey!==null)session.runtimeKey=state.runtimeKey;return JSON.parse(JSON.stringify(session))}};
}
function auditQuickRouteConfig(config){
 const mainFlow=config.mainFlow||[],branchNodes=config.branchNodes||[],routes=config.routes||[],nodes=[...mainFlow,...branchNodes],byId=new Map(nodes.map(node=>[node.nodeId,node])),issues=[];

function onUp(e){if(!drag||drag.pointerId!==e.pointerId)return;const d=drag;drag=null;applySelectionOperation(selectionGroupsByStep[stepIndex],selectionByStep[stepIndex],d.start,d.moved?d.end:d.start);paint();syncSubmit()}
function onCancel(){drag=null;paint()}
function onClick(e){e.preventDefault()}
function paint(preview=null){const selected=selectionByStep[stepIndex];card.querySelectorAll(".token").forEach(el=>{const i=Number(el.dataset.tokenIndex);el.classList.toggle("selected",selected.has(i)||(preview&&i>=preview[0]&&i<=preview[1]))})}
draw();
