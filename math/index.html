function createQuickRuntime(config){

const card=document.querySelector("#card"),stepCount=document.querySelector("#stepCount"),progressFill=document.querySelector("#progressFill");

function resizeFreeInput(field){field.style.height="var(--free-input-height)";field.classList.remove("is-scrollable");const maxHeight=parseFloat(getComputedStyle(field).maxHeight),borderSize=field.offsetHeight-field.clientHeight,contentHeight=field.scrollHeight+borderSize;if(contentHeight>maxHeight){field.style.height=`${maxHeight}px`;field.classList.add("is-scrollable")}else field.style.height=`${Math.max(parseFloat(getComputedStyle(field).height),contentHeight)}px`}

function submitCurrent(){if(!canSubmit()||feedbackState)return;const step=current(),field=card.querySelector("#freeInput"),rawInputText=field?field.value:inputByStep[stepIndex];if(field)field.blur();const record={item:step.item,step:step.step,sourceText:step.text,textSelection:[],optionChoice:null,answerMode:"free_input",rawInputText,submittedAt:new Date().toISOString(),probeRule:null,judgement:null},index=stepIndex;inputByStep[stepIndex]="";runtime.submit(record);feedbackState={step,record,index};drawFeedback()}

const UNIVERSAL_QUICK_RESULT_V1_HEADER=[
 "FORMAT UNIVERSAL_QUICK_RESULT_V1",
 "Universal Quick｜结果导出协议 v1",
 "以下为一次运行结果，正文 JSON 位于本说明之后。顶层 status/stopReason/currentNodeId 表示会话状态；firstNaturalAnswer 是首条已提交 main 节点答案的快照；draftAtStop 是停止时当前节点尚未提交的草稿（正常完成时为 null）。answers 按提交顺序记录作答，path 记录实际经过的节点及结束/停止事件，routes 只列本次实际命中的路由。nodeKind 区分 main/branch，item/step/nodeId 定位节点；sourceText 是题面或文字；Choice 的提交选项保存在 optionChoice（该字段在无选项或停止草稿中可能为 null）。textSelection 保存所选 token 及其在 sourceText 中的 UTF-16 零起点半开区间。Free Input 的正式提交在 answers / firstNaturalAnswer 中以 answerMode:\"free_input\" 标识，rawInputText 是提交时原样保存的完整文本，submittedAt 是提交时间，probeRule 是本题配置的判定参考（未配置时为 null），judgement 是前端 mock 或外部判定接口的返回对象；这些 Free Input 字段不会出现在 Choice 答案中。停止在 Free Input 题目时，draftAtStop.rawInputText 保存当时未提交的原文；停止草稿始终带有 rawInputText、textSelection、optionChoice，其中非适用输入/选择为 null。未提交草稿不属于正式 answers，也不代表已判定答案。字段可能因节点类型而缺失；字段缺失或 null 仅表示该记录未提供相应类型的数据，不能据此推断学生表现。routes 的 from/to 是起终节点地址；只有 type:\"condition\" 的 route 才有 condition/observed，分别表示触发条件和实际观察值；return 等其他 route 可以没有这些字段，routeId 也可能为 null。recordSpec 是节点预设记录说明，evidenceLevel 是该记录的预设证据等级，feedback 是节点配置值；这些字段未配置时可能直接缺失，不保证输出 null，字段缺失不构成学生表现。Independent、Prompted、Taught 表示记录节点预设的执行条件/记录语义，不是最终能力结论。若当前批次预置了某 branch，但它未出现在本次 answers/path 中，表示本次运行没有进入该 branch；这不提供孩子在该 branch 上会如何作答的证据。Grammar 仍需结合冻结教研目标、首次真实表现及 answers/path/routes 作最终判断。",
