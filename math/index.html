function canSubmitStep(step,selected,choice,freeText=""){return (!step.textSelection||selected.size>0)&&(!step.options||choice!==null)&&(step.answerMode!=="free_input"||String(freeText).trim().length>0)}
function canSubmit(i){return canSubmitStep(flow[i],selectionByStep[i],choiceByStep[i],inputByStep[i])}
function syncSubmit(){const button=card.querySelector("#submit");if(button)button.disabled=!canSubmit(stepIndex)}
function draw(){const step=current(),progress=itemProgress(step);let selectableTextElement=null;stepCount.textContent=`${progress.index+1} / ${progress.total}`;progressFill.style.width=`${(progress.index+1)/progress.total*100}%`;card.classList.remove("done");card.replaceChildren();
 
 const scroller=document.createElement("div");scroller.className="text-scroll";const textElement=document.createElement("p");textElement.className="text-block";textElement.setAttribute("aria-label","题目");tokenList=tokenize(step.text);let cursor=0;tokenList.forEach((token,i)=>{if(token.start>cursor)textElement.append(document.createTextNode(step.text.slice(cursor,token.start)));const span=document.createElement("span");span.className="token";span.dataset.tokenIndex=String(i);span.textContent=token.text;textElement.append(span);cursor=token.end});if(cursor<step.text.length)textElement.append(document.createTextNode(step.text.slice(cursor)));scroller.append(textElement);card.append(scroller);if(step.textSelection===true&&typeof step.text==="string"&&step.text.length>0)selectableTextElement=textElement;
 if(step.textSelection===true&&selectableTextElement){selectableTextElement.addEventListener("pointerdown",onDown);selectableTextElement.addEventListener("pointermove",onMove);selectableTextElement.addEventListener("pointerup",onUp);selectableTextElement.addEventListener("pointercancel",onCancel);selectableTextElement.addEventListener("click",onClick)}
 if(step.answerMode==="free_input"){const field=document.createElement("textarea");field.id="freeInput";field.className="free-input";field.rows=1;field.autocomplete="off";field.setAttribute("aria-label","简短自由输入答案");field.placeholder="输入简短答案";field.value=inputByStep[stepIndex]||"";field.addEventListener("input",()=>{inputByStep[stepIndex]=field.value;resizeFreeInput(field);syncSubmit()});card.append(field);resizeFreeInput(field)}
 if(step.options){if(step.options.prompt){const p=document.createElement("p");p.className="instruction";p.textContent=step.options.prompt;card.append(p)}const opts=document.createElement("div");opts.className="options";step.options.items.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed",String(choiceByStep[stepIndex]===i));const mark=document.createElement("span");mark.className="letter";mark.textContent=String.fromCharCode(65+i);const name=document.createElement("span");name.textContent=label;b.append(mark,name);b.onclick=()=>{choiceByStep[stepIndex]=i;draw()};opts.append(b)});card.append(opts)}
 const actions=document.createElement("div");actions.className="actions";const submit=document.createElement("button");submit.className="primary";submit.id="submit";submit.textContent="提交";submit.disabled=!canSubmit(stepIndex);submit.onclick=()=>submitCurrent();actions.append(submit);card.append(actions);paint()}
function parseRational(source){
 let s=String(source).trim().replace(/[×·]/g,"*").replace(/[÷]/g,"/").replace(/[−–]/g,"-").replace(/\s+/g,"");
 let i=0;function expr(){let v=term();while(i<s.length&&(s[i]==="+"||s[i]==="-")){const op=s[i++],w=term();v=op==="+"?[v[0]*w[1]+w[0]*v[1],v[1]*w[1]]:[v[0]*w[1]-w[0]*v[1],v[1]*w[1]]}return v}
 function term(){let v=factor();while(i<s.length&&(s[i]==="*"||s[i]==="/")){const op=s[i++],w=factor();if(op==="*")v=[v[0]*w[0],v[1]*w[1]];else {if(w[0]===0n)throw Error();v=[v[0]*w[1],v[1]*w[0]]}}return v}
 function factor(){if(s[i]==="+"){i++;return factor()}if(s[i]==="-"){i++;const v=factor();return [-v[0],v[1]]}if(s[i]==="("){i++;const v=expr();if(s[i++]!==")")throw Error();return v}const m=s.slice(i).match(/^(\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error();i+=m[0].length;const bits=m[0].split("."),den=10n**BigInt((bits[1]||"").length),num=BigInt((bits[0]||"0")+(bits[1]||""));return [num,den]}
 const value=expr();if(i!==s.length||value[1]===0n)throw Error();let a=value[0],b=value[1];if(b<0n){a=-a;b=-b}const gcd=(x,y)=>y===0n?(x<0n?-x:x):gcd(y,x%y);const g=gcd(a,b)||1n;return [a/g,b/g]
}
function finalText(raw){let s=String(raw).trim();const eq=Math.max(s.lastIndexOf("="),s.lastIndexOf("≈"));if(eq>=0)s=s.slice(eq+1).trim();return s}
function rationalFromAnswer(raw,probeId){let s=finalText(raw);if(probeId==="F03"&&/^0\.6+…$/.test(s))return [2n,3n];if(probeId==="F03"&&/^0\.\overline\{6\}$/.test(s))return [2n,3n];s=s.replace(/(?:新加坡元|人民币|平方厘米|立方米|千米\/小时|分钟|平方厘米|厘米|cm²|cm2|平方米|平方分米|元|分|度|个|位|人|cm)$/g,"").trim();return parseRational(s)}
function equalRational(a,b){return a[0]===b[0]&&a[1]===b[1]}
function judgeProbe(step,raw){const id=step.probeId;let normalizedResponse=null,correct=false,passive=null;const final=finalText(raw);
 if(id==="Q15"){correct=(final==="7.85"||/(^|[^0-9.])7\.85\s*$/.test(String(raw).trim()));}
 else if(id==="Q20"){const s=String(raw).replace(/\s/g,"");correct=["(4,3)","(4，3)","4,3"].includes(s)||/^第4列[,，、]第3行$/.test(s);normalizedResponse=s;}
 else {try{const actual=rationalFromAnswer(raw,id),expected=rationalFromAnswer(step.judgementRule.referenceAnswer,id);correct=equalRational(actual,expected);normalizedResponse=`${actual[0]}${actual[1]===1n?"":"/"+(actual[1])}`;}catch{correct=false}}
 if(id==="F03"){const f=finalText(raw).replace(/\s/g,"");passive=f==="2/3"?"自然化简":f==="4/6"?"未自然化简":"不适用 / 不可判定";}
 if(id==="Q01")passive={status:"not_evaluated",definition:"同一次自然作答中明显的小数点落位或数量级异常",rawResponseRetained:true};
 return {status:"judged",primary:correct?"correct":"incorrect",normalizedResponse,passiveSignal:passive};
}
function mockFreeInputJudge(payload){return judgeProbe(items.find(x=>x.probeId===payload.probeId),payload.rawInputText)}

function resizeFreeInput(field){field.style.height="var(--free-input-height)";field.classList.remove("is-scrollable");const maxHeight=parseFloat(getComputedStyle(field).maxHeight),borderSize=field.offsetHeight-field.clientHeight,contentHeight=field.scrollHeight+borderSize;if(contentHeight>maxHeight){field.style.height=`${maxHeight}px`;field.classList.add("is-scrollable")}else{field.style.height=`${Math.max(parseFloat(getComputedStyle(field).height),contentHeight)}px`}}
const freeInputJudge=window.QUICK_FREE_INPUT_JUDGE||mockFreeInputJudge;
function selectedTokensForStep(index){return [...selectionByStep[index]].sort((a,b)=>a-b).map(i=>({token:tokenList[i].text,start:tokenList[i].start,end:tokenList[i].end}))}
function advanceSubmitted(step,record){submittedByStep[stepIndex]=record;const next=runtime.submit(record);if(next){stepIndex=flow.findIndex(n=>n.nodeId===next.nodeId);draw()}else drawComplete()}
function submitCurrent(){if(!canSubmit(stepIndex))return;const step=current(),selected=selectedTokensForStep(stepIndex),chosen=choiceByStep[stepIndex];if(step.answerMode==="free_input"){const field=card.querySelector("#freeInput"),rawInputText=field?field.value:inputByStep[stepIndex],judgePayload={probeId:step.probeId,item:step.item,step:step.step,rawInputText,submittedAt:new Date().toISOString(),probeRule:step.judgementRule??null},button=card.querySelector("#submit");if(button)button.disabled=true;if(field)field.disabled=true;const submittedRuntime=runtime;Promise.resolve(freeInputJudge(judgePayload)).then(judgement=>{if(runtime!==submittedRuntime||runtime.state.status!=="running"||runtime.state.currentNodeId!==step.nodeId)return;if(field)field.blur();inputByStep[stepIndex]="";advanceSubmitted(step,{item:step.item,probeId:step.probeId,step:step.step,domain:step.domain,responseMode:step.answerMode,sourceText:step.text,textSelection:selected,optionChoice:null,answerMode:"free_input",rawInputText,normalizedResponse:judgement?.normalizedResponse??null,submittedAt:judgePayload.submittedAt,probeRule:judgePayload.probeRule,recordSpec:step.recordSpec,judgement})}).catch(()=>{if(runtime===submittedRuntime&&runtime.state.status==="running"&&runtime.state.currentNodeId===step.nodeId){if(field)field.disabled=false;if(button)button.disabled=!canSubmit(stepIndex)}});return}const optionChoice=chosen===null?null:step.options?.values?.[chosen]??step.options?.items[chosen]??null;const record={item:step.item,probeId:step.probeId,step:step.step,domain:step.domain,responseMode:step.answerMode,sourceText:step.text,textSelection:selected,optionChoice,recordSpec:step.recordSpec,judgement:{status:"judged",primary:String.fromCharCode(65+chosen)===step.correctOption?"correct":"incorrect"}};advanceSubmitted(step,record)}
function drawComplete(){card.classList.add("done");card.replaceChildren();const title=document.createElement("h1");title.className="step-title";title.textContent=runtime.state.status==="stopped"?"本次已停止":"已完成";const button=document.createElement("button");button.className="primary";button.textContent="复制结果";button.addEventListener("click",copyResults);card.append(title,button)}
const UNIVERSAL_QUICK_RESULT_V1_HEADER=[
 "FORMAT UNIVERSAL_QUICK_RESULT_V1",
 "Universal Quick｜结果导出协议 v1",
 "以下为一次运行结果，正文 JSON 位于本说明之后。顶层 status/stopReason/currentNodeId 表示会话状态；firstNaturalAnswer 是首条已提交 main 节点答案的快照；draftAtStop 是停止时当前节点尚未提交的草稿（正常完成时为 null）。answers 按提交顺序记录作答，path 记录实际经过的节点及结束/停止事件，routes 只列本次实际命中的路由。nodeKind 区分 main/branch，item/step/nodeId 定位节点；sourceText 是题面或文字；Choice 的提交选项保存在 optionChoice（该字段在无选项或停止草稿中可能为 null）。textSelection 保存所选 token 及其在 sourceText 中的 UTF-16 零起点半开区间。Free Input 的正式提交在 answers / firstNaturalAnswer 中以 answerMode:\"free_input\" 标识，rawInputText 是提交时原样保存的完整文本，submittedAt 是提交时间，probeRule 是本题配置的判定参考（未配置时为 null），judgement 是前端 mock 或外部判定接口的返回对象；这些 Free Input 字段不会出现在 Choice 答案中。停止在 Free Input 题目时，draftAtStop.rawInputText 保存当时未提交的原文；停止草稿始终带有 rawInputText、textSelection、optionChoice，其中非适用输入/选择为 null。未提交草稿不属于正式 answers，也不代表已判定答案。字段可能因节点类型而缺失；字段缺失或 null 仅表示该记录未提供相应类型的数据，不能据此推断学生表现。routes 的 from/to 是起终节点地址；只有 type:\"condition\" 的 route 才有 condition/observed，分别表示触发条件和实际观察值；return 等其他 route 可以没有这些字段，routeId 也可能为 null。recordSpec 是节点预设记录说明，evidenceLevel 是该记录的预设证据等级，feedback 是节点配置值；这些字段未配置时可能直接缺失，不保证输出 null，字段缺失不构成学生表现。Independent、Prompted、Taught 表示记录节点预设的执行条件/记录语义，不是最终能力结论。若当前批次预置了某 branch，但它未出现在本次 answers/path 中，表示本次运行没有进入该 branch；这不提供孩子在该 branch 上会如何作答的证据。业务侧仍需结合本轮冻结材料、首次真实表现及 answers/path/routes 作最终解释。",
 "【运行记录 JSON】"
].join("\n");
function formatResults(){return `${UNIVERSAL_QUICK_RESULT_V1_HEADER}\n${JSON.stringify(runtime.exportSession(),null,2)}`}
async function copyResults(event){const button=event.currentTarget,text=formatResults();let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch{}if(!copied){const field=document.createElement("textarea");field.value=text;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}if(copied){button.textContent="已复制";button.disabled=true;setTimeout(()=>{button.textContent="复制结果";button.disabled=false},1200)}}
function targetIndex(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el||!el.classList.contains("token")||!card.contains(el))return null;return Number(el.dataset.tokenIndex)}
function onDown(e){if(e.button!==undefined&&e.button!==0)return;const ix=targetIndex(e);if(ix===null)return;drag={pointerId:e.pointerId,start:ix,end:ix,startX:e.clientX,startY:e.clientY,moved:false};if(e.pointerType==="mouse")e.preventDefault()}
function onMove(e){if(!drag||drag.pointerId!==e.pointerId)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5)drag.moved=true;const ix=targetIndex(e);if(ix===null)return;if(drag.moved){drag.end=ix;paint([Math.min(drag.start,drag.end),Math.max(drag.start,drag.end)])}}
function applySelectionOperation(groups,selected,start,end=start){
 if(start===end){const groupIndex=groups.findIndex(group=>group.includes(start));if(groupIndex>=0){for(const token of groups[groupIndex])selected.delete(token);groups.splice(groupIndex,1)}else{groups.push([start]);selected.add(start)}return}
 const merged=new Set();for(let i=Math.min(start,end);i<=Math.max(start,end);i++)merged.add(i);
 let changed=true;while(changed){changed=false;for(let i=groups.length-1;i>=0;i--){const group=groups[i];if(group.some(token=>merged.has(token))){group.forEach(token=>merged.add(token));groups.splice(i,1);changed=true}}}
 const group=[...merged].sort((a,b)=>a-b);groups.push(group);group.forEach(token=>selected.add(token));
}
function onUp(e){if(!drag||drag.pointerId!==e.pointerId)return;const d=drag;drag=null;applySelectionOperation(selectionGroupsByStep[stepIndex],selectionByStep[stepIndex],d.start,d.moved?d.end:d.start);paint();syncSubmit()}
function onCancel(){drag=null;paint()}
function onClick(e){e.preventDefault()}
function paint(preview=null){const selected=selectionByStep[stepIndex];card.querySelectorAll(".token").forEach(el=>{const i=Number(el.dataset.tokenIndex);el.classList.toggle("selected",selected.has(i)||(preview&&i>=preview[0]&&i<=preview[1]))})}
window.QuickRuntime={create:createQuickRuntime,exportSession:()=>runtime.exportSession(),stop:()=>{const step=current();const chosen=choiceByStep[stepIndex];const selected=selectedTokensForStep(stepIndex);runtime.stop("manual",{nodeId:step.nodeId,item:step.item,probeId:step.probeId,step:step.step,answerMode:step.answerMode??null,rawInputText:step.answerMode==="free_input"?inputByStep[stepIndex]:null,textSelection:selected,optionChoice:chosen===null?null:step.options?.values?.[chosen]??step.options?.items[chosen]??null});drawComplete()},selfTest:null};
draw();
</script>
