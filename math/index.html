<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小挑战</title>
<style>
:root{--ink:#202938;--muted:#697587;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff;--warn:#9e342c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(780px,calc(100% - 32px));min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,48px);box-shadow:0 12px 36px #23304a0b}.center{text-align:center}.title{font-size:32px;line-height:1.25;margin:0 0 12px}.sub{color:var(--muted);margin:0 0 26px}.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 22px;font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#edf0f5;color:var(--ink)}.danger{background:#fff0ef;color:var(--warn)}button:disabled{opacity:.5;cursor:not-allowed}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:15px}.progress{height:5px;background:#e3e7ee;border-radius:9px;margin-bottom:24px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue)}.question{font-size:clamp(20px,3vw,25px);line-height:1.8;white-space:pre-line;margin:0 0 10px}.ask{font-size:20px;font-weight:650;margin:12px 0}.answer{display:block;width:100%;min-height:58px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}.answer:focus{outline:3px solid #315ee833;border-color:var(--blue)}.actions{display:flex;justify-content:flex-end;margin-top:18px}.notice{min-height:30px;color:var(--muted);margin-top:16px}.adult{position:fixed;inset:0;background:#131b2acc;display:grid;place-items:center;padding:16px;z-index:5}.adult[hidden]{display:none}.panel{width:min(760px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 20px 70px #0004}.panel h2{margin:0 0 4px}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel small,.muted{color:var(--muted)}.panel-buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.panel button{font-size:14px;padding:9px 12px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-weight:600;font-size:15px}.field textarea,.field select,.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:15px system-ui,sans-serif}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.events{font-size:14px;white-space:pre-wrap;color:var(--muted)}.results{white-space:pre-wrap;max-height:45vh;overflow:auto;background:#f5f7fa;padding:14px;border-radius:10px;font:13px/1.55 ui-monospace,SFMono-Regular,monospace}.stopopts{display:grid;gap:8px}.childdone{font-size:22px}@media(max-width:520px){body{font-size:17px}main{width:calc(100% - 20px)}.card{padding:24px 18px;border-radius:16px}.title{font-size:29px}}
</style>
</head>
<body>
<main id="app" class="center"><section class="card"><h1 class="title">小挑战</h1><p class="sub">每一题不用算到底，只要告诉我：你第一步准备怎么做？</p><button id="start" class="primary">开始</button></section></main>
<aside id="adult" class="adult" hidden aria-modal="true" role="dialog" aria-label="成人控制区"><section id="panel" class="panel"></section></aside>
<script>
"use strict";
const KEY="temporary_trigger_session_v1";
const TRIGGER_ID="ACCUMULATED_READING_TO_INTERVAL_USE";
const questions=[
 {item_id:"Q1_SAFE_BASELINE",hidden_role:"safe_control",expected_first_action_hidden:"18 + 5 或等价自然语言",prompt_text:"一桶水原来有 18 升，又倒进去 5 升。\n现在要知道桶里一共有多少升。\n你第一步准备怎么做？"},
 {item_id:"Q2_TARGET_A",hidden_role:"target",expected_first_action_hidden:"412 - 348 或本次减上次",prompt_text:"水表上个月抄表时显示 348，这个月抄表时显示 412。\n要知道这一个月实际用了多少水。\n你第一步准备怎么做？"},
 {item_id:"Q3_NEAR_MISS",hidden_role:"near_miss",expected_first_action_hidden:"不需要做 1395 - 1268；可回答不用算，就是 1395、直接看这次的读数或等价表达",prompt_text:"电表上次显示 1268，这次显示 1395。\n现在只问：这次抄表时电表显示多少？\n你第一步准备怎么做？"},
 {item_id:"Q4_TARGET_B",hidden_role:"target_transfer",expected_first_action_hidden:"12735 - 12560 或等价自然语言",prompt_text:"一辆车出发前里程表显示 12560 km，回来以后显示 12735 km。\n要知道这趟车一共开了多少千米。\n你第一步准备怎么做？"}
];
const levels={1:["你再看看。","你确定吗？"],2:["这两个数分别表示什么时候的什么量？"],3:["你要找的是两个时点之间发生的那一段，还是某一个时点本身的数？"],4:["想想是不是要用后面的累计数减前面的累计数。"]};
const app=document.querySelector("#app"), adult=document.querySelector("#adult"), panel=document.querySelector("#panel");
let data=null,active=false,replyMode="initial",pendingPrompt=null,shownPerf=0;
const now=()=>{const d=new Date(),pad=n=>String(n).padStart(2,"0"),off=-d.getTimezoneOffset(),sign=off>=0?"+":"-";return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,"0")}${sign}${pad(Math.floor(Math.abs(off)/60))}:${pad(Math.abs(off)%60)}`};
function fresh(){return {schema_version:"REVERIE_TRIGGER_ACCUMULATED_READING_V1",trigger_internal_id:TRIGGER_ID,run_id:"run-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),session_started_at:now(),_session_epoch:Date.now(),session_ended_at:"",session_total_ms:0,completed_normally:false,stopped_early:false,stop_reason:"",stop_note:"",teaching_occurred:false,teaching_note:"",_reply_mode:"initial",_pending_prompt:null,items:questions.map((q,i)=>({...q,item_index:i+1,item_shown_at:"",_item_shown_epoch:null,first_input_at:"",initial_submit_at:"",initial_response_ms:null,initial_response:"",_last_response:"",_draft:"",prompt_events:[],item_completed_at:"",item_total_ms:null,adult_note:""}))};}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function load(){try{const s=sessionStorage.getItem(KEY);if(s){data=JSON.parse(s);return true}}catch(e){}return false}
function start(){data=fresh();active=true;showItem(0);save()}
function showItem(i){active=true;replyMode="initial";pendingPrompt=null;data._reply_mode=replyMode;data._pending_prompt=null;const it=data.items[i];it.item_shown_at=now();it._item_shown_epoch=Date.now();shownPerf=performance.now();renderCurrent()}
function renderCurrent(){const i=currentIndex(),it=data.items[i];if(i<0)return;replyMode=data._reply_mode||"initial";pendingPrompt=data._pending_prompt;shownPerf=performance.now();app.className="";app.innerHTML=`<div class="top"><span>小挑战</span><span>${i+1} / 4</span></div><div class="progress" aria-hidden="true"><i style="width:${i/4*100}%"></i></div><section class="card"><p class="question"></p><p class="ask">你第一步准备怎么做？</p><textarea id="response" class="answer" rows="2" aria-label="你的回答"></textarea><div class="actions"><button id="submit" class="primary" disabled>提交</button></div><div id="notice" class="notice" aria-live="polite"></div></section>`;app.querySelector(".question").textContent=it.prompt_text.replace(/\n你第一步准备怎么做\?$/,"\n");const input=document.querySelector("#response"),submit=document.querySelector("#submit");input.value=it._draft||"";if(replyMode==="locked"){input.disabled=true;input.value=it._last_response||it.initial_response;document.querySelector("#notice").textContent="已记录。"}else if(replyMode==="prompt"&&pendingPrompt!==null){document.querySelector("#notice").textContent=""}else if(it.initial_submit_at){input.disabled=true;input.value=it._last_response||it.initial_response;document.querySelector("#notice").textContent="已记录。";replyMode="locked";data._reply_mode="locked"}submit.disabled=!input.value.trim()||input.disabled;input.addEventListener("input",()=>{it._draft=input.value;if(input.value.length&&!it.first_input_at){it.first_input_at=now()}submit.disabled=!input.value.trim();save()});submit.addEventListener("click",submitResponse);save()}
function submitResponse(){const field=document.querySelector("#response"),value=field.value.trim();if(!value)return;const i=currentIndex(),it=data.items[i],at=now();if(replyMode==="initial"){it.initial_response=value;it.initial_submit_at=at;it.initial_response_ms=Math.max(0,Date.now()-it._item_shown_epoch)}else{const ev=it.prompt_events[pendingPrompt];ev.response_after_prompt=value;ev.response_after_prompt_at=at;ev.response_after_prompt_ms=Math.max(0,Date.now()-ev._prompt_epoch);pendingPrompt=null;data._pending_prompt=null}it._last_response=value;replyMode="locked";data._reply_mode="locked";it._draft="";field.disabled=true;document.querySelector("#submit").disabled=true;document.querySelector("#notice").textContent="已记录。";save();renderAdult()}
function currentIndex(){if(!data)return -1;return data.items.findIndex(i=>!i.item_completed_at&&i.item_shown_at)}
function finishItem(){const i=currentIndex();if(i<0)return;const it=data.items[i];it.item_completed_at=now();it.item_total_ms=Math.max(0,Date.now()-it._item_shown_epoch);save();const next=i+1;if(next<4)showItem(next);else finish(false,"","")}
function finish(stopped,reason,note){data.session_ended_at=now();data.session_total_ms=Math.max(0,Date.now()-data._session_epoch);data.completed_normally=!stopped&&data.items.every(i=>i.item_completed_at);data.stopped_early=!!stopped;data.stop_reason=reason||"";data.stop_note=note||"";active=false;save();app.className="center";app.innerHTML=`<section class="card center"><h1 class="title childdone">${stopped?"本次记录已完成。":"本次记录完成。"}</h1><p class="sub">${stopped?"":""}</p><button id="done" class="primary">完成</button></section>`;document.querySelector("#done").addEventListener("click",()=>{adult.hidden=true});renderAdult()}
function markSessionStart(){if(data&&!data._session_epoch)data._session_epoch=Date.now()}
function renderAdult(){if(!data)return;const i=currentIndex(),it=i>=0?data.items[i]:null;let html=`<div class="panelhead"><div><h2>成人控制</h2><small>快捷键：Ctrl / Command + Shift + P</small></div><button class="secondary" id="close">关闭</button></div>`;
if(active&&it){html+=`<div class="section"><b>当前题 ${i+1} / 4</b><p class="muted">${it.item_id} · 已${it.initial_submit_at?"提交初答":"呈现"}</p><div class="panel-buttons">${[1,2,3,4].map(n=>`<button class="secondary" data-level="${n}">L${n} ${["通用复核","弱关系提示","明确关系方向","具体动作提示"][n-1]}</button>`).join("")}<button class="danger" id="l5">L5 教学（停止本次）</button></div><div class="field"><label>本题成人备注（可选）</label><textarea id="adultnote" rows="2" placeholder="记录现场事实"></textarea></div><div class="row"><button class="primary" id="next">完成本题 / 下一题</button><button class="danger" id="stop">停止本次</button></div><div class="section"><b>本题提示记录</b><div class="events" id="events"></div></div></div>`}
if(!active){html+=`<div class="section"><b>本次结果</b><p class="muted">${data.run_id}</p><div class="row"><button class="primary" id="copy">复制结构化结果</button><button class="secondary" id="json">下载 JSON</button><button class="secondary" id="txt">下载原始记录 TXT</button><button class="secondary" id="new">新建一次</button></div><pre id="result" class="results"></pre></div>`}
html+=`<div class="section row"><button class="secondary" id="view">${active?"查看当前记录":"查看结果"}</button></div>`;panel.innerHTML=html;
document.querySelector("#close").onclick=()=>adult.hidden=true;document.querySelector("#view").onclick=()=>{if(!active)document.querySelector("#result").textContent=markdown();else adult.hidden=true};
if(active&&it){const note=document.querySelector("#adultnote");note.value=it.adult_note||"";note.addEventListener("input",()=>{it.adult_note=note.value;save()});const evbox=document.querySelector("#events");evbox.textContent=it.prompt_events.length?it.prompt_events.map(e=>`L${e.prompt_level}｜${e.prompt_text}${e.response_after_prompt_at?`\n提示后回答：${e.response_after_prompt}`:"\n等待提示后回答"}`).join("\n\n"):"无";panel.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>promptLevel(Number(b.dataset.level)));document.querySelector("#l5").onclick=teaching;document.querySelector("#next").onclick=()=>{adult.hidden=true;finishItem()};document.querySelector("#stop").onclick=stopFlow}
else if(!active){document.querySelector("#result").textContent=markdown();document.querySelector("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(markdown());document.querySelector("#copy").textContent="已复制"}catch(e){fallbackCopy(markdown(),document.querySelector("#copy"))}};document.querySelector("#json").onclick=()=>download(JSON.stringify(cleanData(),null,2),`trigger_accumulated_reading_${data.run_id}.json`,`application/json`);document.querySelector("#txt").onclick=()=>download(markdown(),`trigger_accumulated_reading_${data.run_id}.txt`,`text/plain;charset=utf-8`);document.querySelector("#new").onclick=newRun}
}
function promptLevel(level){const it=data.items[currentIndex()];if(!it||!it.initial_submit_at)return;let text;if(level===1){text=prompt("请选择本次实际使用的 L1 文案：\n1. 你再看看。\n2. 你确定吗？","1");if(text==="1")text=levels[1][0];else if(text==="2")text=levels[1][1];else return}else{text=levels[level][0]}const ev={sequence:it.prompt_events.length+1,prompt_level:level,prompt_text:text,prompt_at:now(),_prompt_epoch:Date.now(),response_after_prompt:"",response_after_prompt_at:"",response_after_prompt_ms:null};it.prompt_events.push(ev);pendingPrompt=it.prompt_events.length-1;replyMode="prompt";data._reply_mode=replyMode;data._pending_prompt=pendingPrompt;it._draft="";save();adult.hidden=true;renderCurrent()}
function showReplyField(text){renderCurrent()}
function stopFlow(){const reason=prompt("选择停止原因：\n1. 关系已经明显接通\n2. 发现关系理解问题，退回分项\n3. 发现方法本身不会，退回分项\n4. 发生教学，本轮停止\n5. 其他","5");if(reason===null)return;const opts={"1":"关系已经明显接通","2":"发现关系理解问题，退回分项","3":"发现方法本身不会，退回分项","4":"发生教学，本轮停止","5":"其他"};if(!opts[reason])return alert("请输入 1 到 5。");let note=prompt("补充备注（可留空）：","");if(note===null)note="";if(reason==="4"){data.teaching_occurred=true;data.teaching_note=note;data._teaching_at=now()}finish(true,opts[reason],note)}
function teaching(){const it=data.items[currentIndex()];if(!it)return;const note=prompt("备注实际发生的教学内容（可留空）：","")||"";data.teaching_occurred=true;data.teaching_note=note;data._teaching_at=now();it.prompt_events.push({sequence:it.prompt_events.length+1,prompt_level:5,prompt_text:"教学",prompt_at:data._teaching_at,teaching_note:note,response_after_prompt:"",response_after_prompt_at:"",response_after_prompt_ms:null});const stopNote=prompt("停止备注（可留空）：","")||"";finish(true,"发生教学，本轮 Trigger 强化停止",stopNote)}
function cleanData(){const copy=JSON.parse(JSON.stringify(data));delete copy._session_epoch;delete copy._reply_mode;delete copy._pending_prompt;for(const x of copy.items||[]){delete x._item_shown_epoch;delete x._draft;delete x._last_response;for(const e of x.prompt_events||[])delete e._prompt_epoch}return copy}
function esc(s){return String(s||"").replace(/\r/g,"").replace(/\n/g,"\n")}
function markdown(){const lines=["# Trigger 最小强化｜执行记录","",`RUN_ID: ${data.run_id}`,`SCHEMA: ${data.schema_version}`,`TRIGGER_INTERNAL_ID: ${data.trigger_internal_id}`,`SESSION_STARTED_AT: ${data.session_started_at}`,`SESSION_ENDED_AT: ${data.session_ended_at||"未结束"}`,`SESSION_TOTAL_MS: ${data.session_ended_at?data.session_total_ms:"未结束"}`,`COMPLETED_NORMALLY: ${data.completed_normally}`,`STOPPED_EARLY: ${data.stopped_early}`,`STOP_REASON: ${data.stop_reason||"无"}`,`TEACHING_OCCURRED: ${data.teaching_occurred}`,""];
for(const it of data.items){const wasShown=!!it.item_shown_at;lines.push(`## Q${it.item_index}｜${it.item_id}`,"",`后台角色：${it.hidden_role}`,`预期第一动作（后台）：${it.expected_first_action_hidden}`,"","题目：",it.prompt_text,"",`首次回答：${it.initial_submit_at?esc(it.initial_response):wasShown?"未提交":"未执行"}`,`首次呈现到首次提交：${it.initial_submit_at?it.initial_response_ms+" ms":wasShown?"未提交":"未执行"}`,"","提示：");if(!it.prompt_events.length)lines.push("- 无");else for(const e of it.prompt_events)lines.push(`- L${e.prompt_level}｜${e.prompt_text}｜提示时间：${e.prompt_at}｜提示后回答：${e.response_after_prompt_at?esc(e.response_after_prompt):"未提交"}｜提示后到提交：${e.response_after_prompt_ms===null?"未提交":e.response_after_prompt_ms+" ms"}`);lines.push("",`成人备注：${it.adult_note?esc(it.adult_note):"无"}`,`ITEM_SHOWN_AT: ${it.item_shown_at||"未执行"}`,`FIRST_INPUT_AT: ${it.first_input_at||"无"}`,`INITIAL_SUBMIT_AT: ${it.initial_submit_at|| (wasShown?"未提交":"未执行")}`,`ITEM_COMPLETED_AT: ${it.item_completed_at||"未执行"}`,`ITEM_TOTAL_MS: ${it.item_total_ms===null?"未执行":it.item_total_ms}`,"")}
const reached=data.items.filter(i=>i.item_shown_at).length;lines.push("## 本轮停止信息","",`实际完成到：${reached?"Q"+reached:"未完成任何题"}`,`停止原因：${data.stop_reason|| (data.completed_normally?"按顺序完成全部 4 题":"未结束")}`,`停止备注：${data.stop_note||"无"}`,`是否发生教学：${data.teaching_occurred?"是":"否"}`,`教学备注：${data.teaching_note||"无"}`,"","## 原始时间说明","","以上时间为页面后台静默记录的原始过程数据。本页面没有向孩子显示计时，也没有依据时间做任何 Skill / Trigger 判断。");return lines.join("\n")}
function download(content,name,type){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}function fallbackCopy(text,button){const t=document.createElement("textarea");t.value=text;document.body.append(t);t.select();document.execCommand("copy");t.remove();button.textContent="已复制"}
function newRun(){if(!confirm("新建一次将清除当前临时记录，是否继续？"))return;sessionStorage.removeItem(KEY);data=null;active=false;adult.hidden=true;app.className="center";app.innerHTML=`<section class="card center"><h1 class="title">小挑战</h1><p class="sub">每一题不用算到底，只要告诉我：你第一步准备怎么做？</p><button id="start" class="primary">开始</button></section>`;document.querySelector("#start").onclick=start}
function toggleAdult(){if(!data)return;renderAdult();adult.hidden=!adult.hidden;if(!adult.hidden&&active){const box=document.querySelector("#result");if(box)box.textContent=markdown()}}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==="p"){e.preventDefault();toggleAdult()}});adult.addEventListener("click",e=>{if(e.target===adult)adult.hidden=true});
if(load()){active=!data.session_ended_at;if(!data._session_epoch)markSessionStart();if(active){const i=currentIndex();if(i>=0){if(!data.items[i]._item_shown_epoch)data.items[i]._item_shown_epoch=Date.now();if(!data.items[i].item_shown_at)data.items[i].item_shown_at=now();renderCurrent()}else start()}else{app.className="center";app.innerHTML=`<section class="card center"><h1 class="title childdone">本次记录完成。</h1><button id="done" class="primary">完成</button></section>`;document.querySelector("#done").onclick=()=>{} }}else document.querySelector("#start").onclick=start;
</script>
</body>
</html>
