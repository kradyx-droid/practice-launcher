<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语 Grammar · 双教学点 Quick</title><style>
:root {font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#171717;background:#f6f7f8;}
*{box-sizing:border-box} body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}

.heading span:last-child{font-size:12px;color:#6b7280;font-weight:500}.progress{display:flex;gap:4px;margin-top:10px}.piece{height:4px;flex:1;min-width:1px;border-radius:9px;background:#e5e7eb}.piece.done{background:#16835d}.piece.now{background:#171717}

.stage{font-size:12px;letter-spacing:.02em;color:#64748b;margin:2px 0 10px}.itemtitle{font-size:18px;font-weight:650;line-height:1.35;margin:0 0 14px}
.question{font-size:20px;font-weight:600;line-height:1.42;overflow-wrap:anywhere}.question p{margin:0 0 11px}.question blockquote{margin:11px 0 14px;padding:12px 13px;background:#f3f3f3;border:0;border-radius:10px}.question blockquote p{margin:0}.question strong{font-weight:700}
.options{display:flex;flex-direction:column;gap:7px;margin-top:14px}.option{appearance:none;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:48px;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;background:white;color:#171717;font:400 16px/1.4 inherit;transition:background .12s,border-color .12s;white-space:normal}
.option-letter{flex:0 0 20px;text-align:center;font-weight:650;color:#6b7280;font-size:16px}.option-text{flex:1;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.option:focus-visible{outline:2px solid #171717;outline-offset:2px}.option.selected{border-color:#171717;background:#fafafa}.option.good{border-color:#16835d;background:#f0f8f3;color:#16835d;cursor:default}.option.bad{border-color:#dc2626;background:#fff4f4;color:#dc2626;cursor:default}.option.good .option-letter,.option.bad .option-letter{color:inherit}
.feedback-title{font-size:17px;font-weight:650;line-height:1.45;margin:14px 0 9px;display:flex;gap:8px;align-items:center}.feedback-title.good{color:#16835d}.feedback-title.bad{color:#dc2626}
.analysis{background:#f3f3f3;border-radius:10px;padding:13px;margin:0 0 9px;font-size:15.5px;line-height:1.63;overflow-wrap:anywhere}
.analysis p{margin:0 0 9px}.analysis p:last-child{margin-bottom:0}.analysis blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid #16835d;background:#fff;border-radius:4px}.analysis strong{font-weight:700;color:#16835d}.analysis em{color:#9a5709}.analysis h3,.analysis h4{font-size:16px;margin:12px 0 6px}.analysis table{border-collapse:collapse;max-width:100%;font-size:14px}.analysis th,.analysis td{border:1px solid #ddd;padding:5px 8px}
footer{flex:0 0 auto;padding-top:12px;display:flex;flex-direction:column;gap:8px}#primary{width:100%;height:48px;min-height:48px;max-height:48px;border:0;border-radius:10px;background:#171717;color:white;font:600 16px/1.1 inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;padding:0 12px}#primary:disabled{background:#e5e7eb;color:#9ca3af;cursor:default}
.end{text-align:center;padding:75px 10px 20px}.check{display:flex;align-items:center;justify-content:center;margin:0 auto 24px;width:112px;height:112px;background:#f0f8f3;color:#16835d;border-radius:50%;font-size:64px}.end h2{margin:0 0 12px;font-size:26px}.end p{font-size:15px;color:#52525b;line-height:1.6}.extra{display:flex;justify-content:center;gap:24px;margin-top:20px}.textaction{background:none;border:0;color:#737373;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}

</style></head><body><main id="quick" tabindex="0" aria-label="英语 Grammar 双教学点交互练习"><header><div class="heading"><span id="top-title">英语 Grammar · 双教学点</span><span id="counter">1 / 35</span></div><div class="progress" id="progress" aria-label="学习进度"></div></header><section id="body" aria-live="polite"></section><footer><div id="message" aria-live="polite"></div><button id="primary" type="button" disabled>提交答案</button></footer></main><script>
const PACK = [{"id":"T01","title":"先找到 who 描述的一群人","stage":"Teaching 1","promptHtml":"<p>Six students work at the school library.</p>\n<p>Nora is one of them.</p>\n<p>现在看：</p>\n<blockquote>\n<p>Nora is one of the students <strong>who work at the library</strong>.</p>\n</blockquote>\n<p><strong>这里的 who work at the library 描述的是谁？</strong></p>\n","options":[{"id":"A","text":"那六名在图书馆工作的学生。"},{"id":"B","text":"只有 Nora 一个人。"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。这里先描述<strong>在图书馆工作的六名学生</strong>，Nora 是其中一个。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"A":"<p>对。这里先描述<strong>在图书馆工作的六名学生</strong>，Nora 是其中一个。</p>\n","B":"<p>Nora 是其中一个人，但 <code>who work</code> 描述的是前面那群学生。</p>\n<p>先找到是谁在做这件事。</p>\n"},"explanationHtml":"<p><strong>① 谁在工作？</strong></p>\n<blockquote>\n<p>Six students <strong>work</strong> at the library.</p>\n</blockquote>\n<p>是六名学生，不只是 Nora。</p>\n<p><strong>② 六个人，普通句怎么说？</strong></p>\n<blockquote>\n<p>They <strong>work</strong>.</p>\n</blockquote>\n<p>不是 <em>They works</em>。</p>\n<p><strong>③ 放回关系从句</strong></p>\n<blockquote>\n<p>Nora is one of the students who <strong>work</strong> at the library.</p>\n</blockquote>\n<p><strong>students → They work → who work</strong></p>\n<p>所以这里用 <strong>work</strong>。</p>\n"},{"id":"T02","title":"只描述一个人，动词怎样变化？","stage":"Teaching 1","promptHtml":"<p>Five technicians work in the repair center.</p>\n<p>Only Nora repairs the cameras.</p>\n<p>完成句子：</p>\n<blockquote>\n<p>Nora is the only one of the technicians who ___ the cameras.</p>\n</blockquote>\n","options":[{"id":"A","text":"repair"},{"id":"B","text":"repairs"}],"answer":"B","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。这里说的是 <strong>Nora 一个人修相机</strong>。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"B":"<p>对。这里说的是 <strong>Nora 一个人修相机</strong>。</p>\n","A":"<p>五名技术员都在维修中心工作，但修相机的只有 Nora。</p>\n<p>所以先看 Nora 一个人的动作。</p>\n"},"explanationHtml":"<p><strong>① 谁修相机？</strong></p>\n<p>只有 Nora。</p>\n<p><strong>② 一个女孩，普通句怎么说？</strong></p>\n<blockquote>\n<p>She <strong>repairs</strong> the cameras.</p>\n</blockquote>\n<p>一般现在时，<code>she</code> 后面的 <code>repair</code> 要加 <strong>-s</strong>。</p>\n<p><strong>③ 放回关系从句</strong></p>\n<blockquote>\n<p>Nora is the only one of the technicians who <strong>repairs</strong> the cameras.</p>\n</blockquote>\n<p><strong>Nora → She repairs → who repairs</strong></p>\n<p>所以这里用 <strong>repairs</strong>。</p>\n"},{"id":"T03","title":"同样有 students，为什么动词不同？","stage":"Teaching 1","promptHtml":"<p>比较两种不同情况。</p>\n<p><strong>情况①</strong></p>\n<p>Six students help the teacher.</p>\n<p>Nora is one of them.</p>\n<p><strong>情况②</strong></p>\n<p>There are six students, but only Nora helps the teacher.</p>\n<p>完成两句话：</p>\n<p>① Nora is one of the students who ___ the teacher.</p>\n<p>② Nora is the only one of the students who ___ the teacher.</p>\n<p><strong>选择合适的组合。</strong></p>\n","options":[{"id":"A","text":"help / helps"},{"id":"B","text":"helps / help"},{"id":"C","text":"helps / helps"},{"id":"D","text":"help / help"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。① 是六名学生都帮忙，② 是只有 Nora 帮忙。</p>\n<p>所以两个动词的形式不同。</p>\n","wrongFeedbackHtml":"<p>先不要看 <code>one</code> 或 <code>only</code>。</p>\n<p>看实际帮老师的是<strong>六个人</strong>，还是 <strong>Nora 一个人</strong>。</p>\n","feedbackByChoice":{"A":"<p>对。① 是六名学生都帮忙，② 是只有 Nora 帮忙。</p>\n<p>所以两个动词的形式不同。</p>\n","other":"<p>先不要看 <code>one</code> 或 <code>only</code>。</p>\n<p>看实际帮老师的是<strong>六个人</strong>，还是 <strong>Nora 一个人</strong>。</p>\n"},"explanationHtml":"<p><strong>① 六名学生帮忙</strong></p>\n<blockquote>\n<p>Six students help the teacher.</p>\n</blockquote>\n<p>↓</p>\n<blockquote>\n<p>They <strong>help</strong>.</p>\n</blockquote>\n<p>↓</p>\n<blockquote>\n<p>one of the students who <strong>help</strong> the teacher</p>\n</blockquote>\n<p><strong>六个人 → help</strong></p>\n<p><strong>② 只有 Nora 帮忙</strong></p>\n<blockquote>\n<p>Only Nora helps the teacher.</p>\n</blockquote>\n<p>↓</p>\n<blockquote>\n<p>She <strong>helps</strong>.</p>\n</blockquote>\n<p>↓</p>\n<blockquote>\n<p>the only one of the students who <strong>helps</strong> the teacher</p>\n</blockquote>\n<p><strong>一个人 → helps</strong></p>\n<p>同样出现 <code>students</code>，但两句话实际描述的对象不同。</p>\n<p><strong>先找到动作描述谁，再决定动词形式。</strong></p>\n"},{"id":"T04","title":"一句话有两个动词，为什么形式不同？","stage":"Teaching 1","promptHtml":"<p>Six students practise every day.</p>\n<p>Today, only one of them was late.</p>\n<p>现在看：</p>\n<blockquote>\n<p>Only one of the students who <strong>practise</strong> every day <strong>was late</strong> today.</p>\n</blockquote>\n<p><strong>两个动作分别在说谁？</strong></p>\n","options":[{"id":"A","text":"`practise` 说的是六名学生；`was late` 说的是其中一个人。"},{"id":"B","text":"`practise` 说的是一个人；`was late` 说的是六名学生。"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。虽然只有一个句子，但两个动作描述的人数不同。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"A":"<p>对。虽然只有一个句子，但两个动作描述的人数不同。</p>\n","B":"<p>六个人都每天练习，但今天只有一个人迟到。</p>\n<p>要分别找到两个动作对应的人。</p>\n"},"explanationHtml":"<p><strong>动作①：谁每天练习？</strong></p>\n<p>六名学生。</p>\n<blockquote>\n<p>They <strong>practise</strong> every day.</p>\n</blockquote>\n<p>所以：</p>\n<blockquote>\n<p>the students who <strong>practise</strong> every day</p>\n</blockquote>\n<p><strong>动作②：谁今天迟到？</strong></p>\n<p>只有一个人。</p>\n<blockquote>\n<p>One student <strong>was late</strong> today.</p>\n</blockquote>\n<p>合起来：</p>\n<blockquote>\n<p>Only one of the students who <strong>practise</strong> every day <strong>was late</strong> today.</p>\n</blockquote>\n<p><strong>practise → 六个人</strong></p>\n<p><strong>was late → 一个人</strong></p>\n<p>两个动词各有自己的对应对象，不必使用同一种形式。</p>\n\n<p><strong>这是一道已经给出答案的例子，不需要作答。</strong></p>\n<p>Six exhibits were damaged during last month's storm.</p>\n<p>Vase X is one of those six exhibits.</p>\n<p>合起来：</p>\n<blockquote>\n<p>Vase X is one of the exhibits that <strong>were damaged</strong> during last month's storm.</p>\n</blockquote>\n<p>看看后面的 <strong>were damaged</strong> 是怎么来的。</p>\n<p><strong>① 谁受损了？</strong></p>\n<p>六件展品。</p>\n<blockquote>\n<p>The exhibits ...</p>\n</blockquote>\n<p>描述六件展品，是复数。</p>\n<p><strong>② 什么时候受损？</strong></p>\n<p>上个月，是过去的事情。</p>\n<p><strong>③ 展品损坏了别人，还是展品被损坏？</strong></p>\n<p>展品<strong>被暴风雨损坏</strong>。</p>\n<p>所以：</p>\n<blockquote>\n<p>The exhibits <strong>were damaged</strong>.</p>\n</blockquote>\n<p>放回原句：</p>\n<blockquote>\n<p>Vase X <strong>is</strong> one of the exhibits that <strong>were damaged</strong> during last month's storm.</p>\n</blockquote>\n<p>这里的两个动词表达不同的事情：</p>\n<ul>\n<li><strong>is</strong>：现在说 Vase X 是其中一件。</li>\n<li><strong>were damaged</strong>：六件展品过去被损坏。</li>\n</ul>\n<p><strong>先找到谁，再结合时间和实际发生的事情决定形式。</strong></p>\n"},{"id":"P01","title":"五名厨师的共同工作","stage":"Feedback Practice 1","promptHtml":"<p>Five chefs bake bread every morning.</p>\n<p>Ida is one of these five chefs.</p>\n<p>按前面五名厨师的共同工作完成句子：</p>\n<blockquote>\n<p>Ida is one of the chefs who ___ bread every morning.</p>\n</blockquote>\n","options":[{"id":"A","text":"bake"},{"id":"B","text":"bakes"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。</p>\n<p><strong>who 描述五名厨师 → They bake → who bake</strong></p>\n<p>所以用 <strong>bake</strong>。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"A":"<p>对。</p>\n<p><strong>who 描述五名厨师 → They bake → who bake</strong></p>\n<p>所以用 <strong>bake</strong>。</p>\n","B":"<p>先看谁每天烤面包：五名厨师。</p>\n<p>普通句是 <strong>They bake</strong>，所以放回去用 <strong>bake</strong>，不加 <code>-s</code>。</p>\n"},"explanationHtml":""},{"id":"P02","title":"唯一负责夜间徒步的向导","stage":"Feedback Practice 1","promptHtml":"<p>Six guides work at the nature center.</p>\n<p>Only Leon leads the overnight walks.</p>\n<p>完成句子：</p>\n<blockquote>\n<p>Leon is the only one of the guides who ___ the overnight walks.</p>\n</blockquote>\n","options":[{"id":"A","text":"lead"},{"id":"B","text":"leads"}],"answer":"B","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。</p>\n<p><strong>who 描述 Leon → He leads → who leads</strong></p>\n<p>一个人做这件事，所以用 <strong>leads</strong>。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"B":"<p>对。</p>\n<p><strong>who 描述 Leon → He leads → who leads</strong></p>\n<p>一个人做这件事，所以用 <strong>leads</strong>。</p>\n","A":"<p>只有 Leon 带领夜间徒步。</p>\n<p>普通句是 <strong>He leads</strong>，第三人称单数要加 <code>-s</code>。</p>\n<p>所以填 <strong>leads</strong>。</p>\n"},"explanationHtml":""},{"id":"P03","title":"有 only，但 who 仍然描述一群人","stage":"Feedback Practice 1","promptHtml":"<p>Eight technicians test the alarms every weekday.</p>\n<p>Yesterday, only one technician arrived late.</p>\n<blockquote>\n<p>Only one of the technicians who ___ the alarms every weekday arrived late yesterday.</p>\n</blockquote>\n","options":[{"id":"A","text":"test"},{"id":"B","text":"tests"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。</p>\n<p><strong>八名技术员 → They test → who test</strong></p>\n<p><code>arrived late</code> 才是在说迟到的一个人。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"A":"<p>对。</p>\n<p><strong>八名技术员 → They test → who test</strong></p>\n<p><code>arrived late</code> 才是在说迟到的一个人。</p>\n","B":"<p>这里有两件事：</p>\n<p>八名技术员每天都测试警报器 → <strong>They test</strong>。</p>\n<p>昨天只有一人迟到 → <strong>One technician arrived late</strong>。</p>\n<p>空格对应前一件事，所以用 <strong>test</strong>。</p>\n"},"explanationHtml":""},{"id":"T05","title":"I think 插在中间，谁准备好了？","stage":"Teaching 2","promptHtml":"<p>先看：</p>\n<blockquote>\n<p>Mia <strong>is ready</strong>.</p>\n<p>I <strong>think</strong> Mia is ready.</p>\n</blockquote>\n<p>合起来：</p>\n<blockquote>\n<p>Mia is the student <strong>who I think is ready</strong>.</p>\n</blockquote>\n<p><strong>这里的 is ready 描述谁？</strong></p>\n","options":[{"id":"A","text":"Mia。"},{"id":"B","text":"I。"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。<strong>I think</strong> 只是表达我的看法，真正准备好的是 Mia。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"A":"<p>对。<strong>I think</strong> 只是表达我的看法，真正准备好的是 Mia。</p>\n","B":"<p>句子中有两个不同的意思：</p>\n<p>我<strong>认为</strong>，Mia <strong>准备好了</strong>。</p>\n<p>所以 <code>is ready</code> 描述 Mia。</p>\n"},"explanationHtml":"<p><strong>① 谁在想？</strong></p>\n<blockquote>\n<p>I <strong>think</strong>.</p>\n</blockquote>\n<p><code>think</code> 对应 I。</p>\n<p><strong>② 谁准备好了？</strong></p>\n<blockquote>\n<p>Mia <strong>is ready</strong>.</p>\n</blockquote>\n<p><code>is ready</code> 对应 Mia 一个人。</p>\n<p><strong>③ 放到一起</strong></p>\n<blockquote>\n<p>Mia is the student who <strong>I think</strong> <strong>is ready</strong>.</p>\n</blockquote>\n<p><strong>I → think</strong></p>\n<p><strong>Mia → is ready</strong></p>\n<p>即使中间隔着 <strong>I think</strong>，后面的 <strong>is</strong> 仍然对应 Mia。</p>\n"},{"id":"T06","title":"说的是一群队员，不跟中间的 coach 走","stage":"Teaching 2","promptHtml":"<p>Five players are ready for the match.</p>\n<p>The coach thinks all five players are ready.</p>\n<p>完成句子：</p>\n<blockquote>\n<p>These are the players who the coach thinks ___ ready.</p>\n</blockquote>\n","options":[{"id":"A","text":"is"},{"id":"B","text":"are"}],"answer":"B","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。准备好的是五名队员，所以用 <strong>are</strong>。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"B":"<p>对。准备好的是五名队员，所以用 <strong>are</strong>。</p>\n","A":"<p>先把两个动作分开。</p>\n<p>教练是在<strong>认为</strong>，准备好的是五名队员。</p>\n<p>所以后面用 <strong>are</strong>。</p>\n"},"explanationHtml":"<p><strong>① 谁认为他们准备好了？</strong></p>\n<p>教练。</p>\n<blockquote>\n<p>The coach <strong>thinks</strong>.</p>\n</blockquote>\n<p>一个人，<code>think</code> 加 <strong>-s</strong>。</p>\n<p><strong>② 谁准备好了？</strong></p>\n<p>五名队员。</p>\n<blockquote>\n<p>The players <strong>are ready</strong>.</p>\n</blockquote>\n<p>多人，用 <strong>are</strong>。</p>\n<p><strong>③ 放回关系从句</strong></p>\n<blockquote>\n<p>These are the players who the coach <strong>thinks</strong> <strong>are ready</strong>.</p>\n</blockquote>\n<p><strong>coach → thinks</strong></p>\n<p><strong>players → are</strong></p>\n<p>不要因为 <code>coach</code> 离后面的动词近，就让两个动词都跟着 coach 变化。</p>\n"},{"id":"T07","title":"两个动词，两个对应对象","stage":"Teaching 2","promptHtml":"<p>The coach thinks the players are ready.</p>\n<p>现在要说：</p>\n<blockquote>\n<p>The players who the coach ___ ___ ready will start first.</p>\n</blockquote>\n<p><strong>选择两个空格的正确组合。</strong></p>\n","options":[{"id":"A","text":"thinks / are"},{"id":"B","text":"think / is"},{"id":"C","text":"thinks / is"},{"id":"D","text":"think / are"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。<code>thinks</code> 对应教练，<code>are</code> 对应队员们。</p>\n","wrongFeedbackHtml":"<p>先分别看两个动作由谁完成：</p>\n<p>教练认为，队员们准备好了。</p>\n<p>再选择各自动词的形式。</p>\n","feedbackByChoice":{"A":"<p>对。<code>thinks</code> 对应教练，<code>are</code> 对应队员们。</p>\n","other":"<p>先分别看两个动作由谁完成：</p>\n<p>教练认为，队员们准备好了。</p>\n<p>再选择各自动词的形式。</p>\n"},"explanationHtml":"<p><strong>① 教练认为</strong></p>\n<blockquote>\n<p>The coach <strong>thinks</strong>.</p>\n</blockquote>\n<p>一个人 → <strong>thinks</strong></p>\n<p><strong>② 队员们准备好了</strong></p>\n<blockquote>\n<p>The players <strong>are ready</strong>.</p>\n</blockquote>\n<p>多个人 → <strong>are</strong></p>\n<p><strong>③ 放进关系从句</strong></p>\n<blockquote>\n<p>The players who the coach <strong>thinks</strong> <strong>are</strong> ready will start first.</p>\n</blockquote>\n<p><strong>coach → thinks</strong></p>\n<p><strong>players → are</strong></p>\n<p>虽然两个动词连在同一句话里，仍要分别找到它们对应的人。</p>\n"},{"id":"P04","title":"I believe 插在中间","stage":"Feedback Practice 2","promptHtml":"<p>There is one student ready to lead the discussion.</p>\n<p>I believe that student is ready.</p>\n<p>完成句子：</p>\n<blockquote>\n<p>This is the student who I believe ___ ready to lead the discussion.</p>\n</blockquote>\n","options":[{"id":"A","text":"are"},{"id":"B","text":"is"}],"answer":"B","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。</p>\n<p><strong>the student → one person → is ready</strong></p>\n<p><code>I believe</code> 只是中间的判断表达。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"B":"<p>对。</p>\n<p><strong>the student → one person → is ready</strong></p>\n<p><code>I believe</code> 只是中间的判断表达。</p>\n","A":"<p>真正准备好的是那一名学生。</p>\n<p>普通句是 <strong>The student is ready</strong>，所以用 <strong>is</strong>。</p>\n"},"explanationHtml":""},{"id":"P05","title":"中间是 the guide thinks","stage":"Feedback Practice 2","promptHtml":"<p>Four hikers are ready to leave.</p>\n<p>The guide thinks all four are ready.</p>\n<p>完成句子：</p>\n<blockquote>\n<p>These are the hikers who the guide thinks ___ ready to leave.</p>\n</blockquote>\n","options":[{"id":"A","text":"are"},{"id":"B","text":"is"}],"answer":"A","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。</p>\n<p><strong>hikers → four people → are ready</strong></p>\n<p>准备好的是徒步者们。</p>\n","wrongFeedbackHtml":"","feedbackByChoice":{"A":"<p>对。</p>\n<p><strong>hikers → four people → are ready</strong></p>\n<p>准备好的是徒步者们。</p>\n","B":"<p>向导是在想，徒步者们才是准备离开的人。</p>\n<p>普通句是 <strong>The hikers are ready</strong>，所以填 <strong>are</strong>。</p>\n"},"explanationHtml":""},{"id":"P06","title":"两个动词，两个形式","stage":"Feedback Practice 2","promptHtml":"<p>The director thinks the members are ready.</p>\n<p>完成句子：</p>\n<blockquote>\n<p>The members who the director ___ ___ ready will meet us tomorrow.</p>\n</blockquote>\n","options":[{"id":"A","text":"think / is"},{"id":"B","text":"thinks / is"},{"id":"C","text":"thinks / are"},{"id":"D","text":"think / are"}],"answer":"C","feedbackMode":"instant_correctness","correctFeedbackHtml":"<p>对。</p>\n<p><strong>director → He thinks</strong></p>\n<p><strong>members → They are ready</strong></p>\n","wrongFeedbackHtml":"<p>分别看两个动词：</p>\n<p>一个 director → <strong>thinks</strong></p>\n<p>多个 members → <strong>are</strong></p>\n<p>所以选择 <strong>thinks / are</strong>。</p>\n","feedbackByChoice":{"C":"<p>对。</p>\n<p><strong>director → He thinks</strong></p>\n<p><strong>members → They are ready</strong></p>\n","other":"<p>分别看两个动词：</p>\n<p>一个 director → <strong>thinks</strong></p>\n<p>多个 members → <strong>are</strong></p>\n<p>所以选择 <strong>thinks / are</strong>。</p>\n"},"explanationHtml":""},{"id":"P07","title":"观鸟者的共同活动","stage":"Continuous Practice","promptHtml":"<p>Eight birdwatchers spend every weekend writing down the birds they see.</p>\n<p>Lea is one of them.</p>\n<blockquote>\n<p>Lea is one of the birdwatchers who ___ their sightings every weekend.</p>\n</blockquote>\n","options":[{"id":"A","text":"records"},{"id":"B","text":"record"},{"id":"C","text":"recording"},{"id":"D","text":"recorded"}],"answer":"B","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P08","title":"只有 Ava 负责校准","stage":"Continuous Practice","promptHtml":"<p>Five technicians work in the laboratory.</p>\n<p>Every morning, only Ava adjusts the sensors so that they give accurate readings.</p>\n<blockquote>\n<p>Ava is the only one of the technicians who ___ the sensors every morning.</p>\n</blockquote>\n","options":[{"id":"A","text":"calibrate"},{"id":"B","text":"calibrated"},{"id":"C","text":"calibrates"},{"id":"D","text":"calibrating"}],"answer":"C","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P09","title":"教练认为四名运动员都适合比赛","stage":"Continuous Practice","promptHtml":"<p>Four athletes have passed the fitness test.</p>\n<p>Their trainer considers all four fit enough to compete.</p>\n<blockquote>\n<p>The athletes who the trainer believes ___ fit to compete will start first.</p>\n</blockquote>\n","options":[{"id":"A","text":"are"},{"id":"B","text":"is"},{"id":"C","text":"am"},{"id":"D","text":"be"}],"answer":"A","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P10","title":"每天检查设备，昨天只有一人迟到","stage":"Continuous Practice","promptHtml":"<p>Every morning, twelve nurses examine the equipment before work begins.</p>\n<p>Yesterday, one nurse arrived late. The other eleven arrived on time.</p>\n<blockquote>\n<p>Only one of the nurses who ___ the equipment every morning ___ late yesterday.</p>\n</blockquote>\n","options":[{"id":"A","text":"checks / were"},{"id":"B","text":"checks / was"},{"id":"C","text":"check / was"},{"id":"D","text":"check / were"}],"answer":"C","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P11","title":"我认为艺术家已经准备好了","stage":"Continuous Practice","promptHtml":"<p>The mural artist has finished preparing a short talk.</p>\n<p>In my opinion, the artist can give the talk at noon.</p>\n<blockquote>\n<p>The artist who I think ___ ready to speak will begin the presentation at noon.</p>\n</blockquote>\n","options":[{"id":"A","text":"are"},{"id":"B","text":"is"},{"id":"C","text":"be"},{"id":"D","text":"am"}],"answer":"B","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P12","title":"两个动词分别描述谁？","stage":"Continuous Practice","promptHtml":"<p>Eight firefighters all take part in morning training.</p>\n<p>Yesterday, one firefighter missed work.</p>\n<p>现在看：</p>\n<blockquote>\n<p>Only one of the firefighters who <strong>train</strong> every morning <strong>was absent</strong> yesterday.</p>\n</blockquote>\n<p><strong>这里的 train 和 was absent 分别在说谁？</strong></p>\n","options":[{"id":"A","text":"`train` 说的是一个人；`was absent` 说的是八个人。"},{"id":"B","text":"两个动作都只在说一个人。"},{"id":"C","text":"两个动作都在说八个人。"},{"id":"D","text":"`train` 说的是八个人；`was absent` 说的是其中一个人。"}],"answer":"D","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P13","title":"评委认为所有决赛选手都准备好了","stage":"Continuous Practice","promptHtml":"<p>Five finalists have finished preparing.</p>\n<p>The judge believes all five can go on stage now.</p>\n<blockquote>\n<p>The finalists who the judge ___ ___ ready will go on stage.</p>\n</blockquote>\n","options":[{"id":"A","text":"think / is"},{"id":"B","text":"thinks / are"},{"id":"C","text":"think / are"},{"id":"D","text":"thinks / is"}],"answer":"B","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P14","title":"五名博物馆向导的共同工作","stage":"Continuous Practice","promptHtml":"<p>Five museum guides lead tours every morning.</p>\n<p>Rina is one of them.</p>\n<blockquote>\n<p>Rina is one of the guides who ___ visitors around the museum every morning.</p>\n</blockquote>\n","options":[{"id":"A","text":"shows"},{"id":"B","text":"showing"},{"id":"C","text":"show"},{"id":"D","text":"showed"}],"answer":"C","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P15","title":"我们认为两位候选人都可以开始面试","stage":"Continuous Practice","promptHtml":"<p>Two candidates have completed their interview preparation.</p>\n<p>We believe both can go in now.</p>\n<blockquote>\n<p>The two candidates who we think ___ ready will enter first.</p>\n</blockquote>\n","options":[{"id":"A","text":"is"},{"id":"B","text":"am"},{"id":"C","text":"be"},{"id":"D","text":"are"}],"answer":"D","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"P16","title":"两个教学点放在一起","stage":"Continuous Practice","promptHtml":"<p>Six volunteers regularly help at the shelter.</p>\n<p>Juno belongs to this group.</p>\n<p>I believe Juno can lead the team now.</p>\n<p>完成两句话：</p>\n<p>① 描述六名志愿者的共同工作：</p>\n<blockquote>\n<p>Juno belongs to the group of six volunteers who ___ at the shelter.</p>\n</blockquote>\n<p>② 表达“我认为 Juno 已经准备好带队”：</p>\n<blockquote>\n<p>The volunteer who I think ___ ready to lead the team can start now.</p>\n</blockquote>\n<p><strong>选择正确组合。</strong></p>\n","options":[{"id":"A","text":"work / is"},{"id":"B","text":"works / are"},{"id":"C","text":"work / are"},{"id":"D","text":"works / is"}],"answer":"A","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M17","title":"天文社成员的共同活动","stage":"Mixed Retrieval","promptHtml":"<p>Nine members of the astronomy club spend every Friday evening watching the sky.</p>\n<p>Lila is one of them.</p>\n<blockquote>\n<p>Lila is one of the members who ___ the sky every Friday.</p>\n</blockquote>\n","options":[{"id":"A","text":"observes"},{"id":"B","text":"observed"},{"id":"C","text":"observe"},{"id":"D","text":"observing"}],"answer":"C","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M18","title":"Reason：编辑提到的理由","stage":"Mixed Retrieval","promptHtml":"<p>The reason ___ the director mentioned for the delay seemed reasonable.</p>\n","options":[{"id":"A","text":"why"},{"id":"B","text":"which"},{"id":"C","text":"where"},{"id":"D","text":"whose"}],"answer":"B","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M19","title":"导师认为 Simon 已准备好","stage":"Mixed Retrieval","promptHtml":"<p>Simon has finished practising his presentation.</p>\n<p>The tutor considers him fully prepared.</p>\n<blockquote>\n<p>The student who the tutor believes ___ ready for the presentation will speak first.</p>\n</blockquote>\n","options":[{"id":"A","text":"are"},{"id":"B","text":"be"},{"id":"C","text":"am"},{"id":"D","text":"is"}],"answer":"D","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M20","title":"Event 16：`the same ... as`","stage":"Mixed Retrieval","promptHtml":"<p>The second team reported the same issue ___ the first team did.</p>\n","options":[{"id":"A","text":"as"},{"id":"B","text":"than"},{"id":"C","text":"whom"},{"id":"D","text":"where"}],"answer":"A","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M21","title":"普通介词宾语：介词前置","stage":"Mixed Retrieval","promptHtml":"<p>The researcher ___ the interns spoke after the seminar thanked them for their questions.</p>\n","options":[{"id":"A","text":"who"},{"id":"B","text":"where"},{"id":"C","text":"to whom"},{"id":"D","text":"whose"}],"answer":"C","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M22","title":"一群潜水员每天训练，只有一人迟到","stage":"Mixed Retrieval","promptHtml":"<p>Eight divers attend a training session every morning.</p>\n<p>Yesterday, one of them arrived late. The other seven arrived on time.</p>\n<blockquote>\n<p>Only one of the divers who ___ every morning ___ late yesterday.</p>\n</blockquote>\n","options":[{"id":"A","text":"trains / was"},{"id":"B","text":"trains / were"},{"id":"C","text":"train / were"},{"id":"D","text":"train / was"}],"answer":"D","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M23","title":"The way：方式关系","stage":"Mixed Retrieval","promptHtml":"<p>The way ___ the nurses organized the emergency supplies impressed the director.</p>\n","options":[{"id":"A","text":"which"},{"id":"B","text":"in which"},{"id":"C","text":"whose"},{"id":"D","text":"whom"}],"answer":"B","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M24","title":"地点名词作为动作对象","stage":"Mixed Retrieval","promptHtml":"<p>The studio ___ the city council renovated reopened on Monday.</p>\n","options":[{"id":"A","text":"which"},{"id":"B","text":"where"},{"id":"C","text":"in which"},{"id":"D","text":"when"}],"answer":"A","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M25","title":"我认为两名研究人员熟悉设备","stage":"Mixed Retrieval","promptHtml":"<p>Two researchers have used this equipment for years.</p>\n<p>In my view, both know how to use it well.</p>\n<blockquote>\n<p>The two researchers who I believe ___ familiar with this equipment will supervise the test.</p>\n</blockquote>\n","options":[{"id":"A","text":"are"},{"id":"B","text":"is"},{"id":"C","text":"am"},{"id":"D","text":"be"}],"answer":"A","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M26","title":"Reason：事情为什么发生","stage":"Mixed Retrieval","promptHtml":"<p>The reason ___ the concert started late was never explained.</p>\n","options":[{"id":"A","text":"which"},{"id":"B","text":"whom"},{"id":"C","text":"why"},{"id":"D","text":"whose"}],"answer":"C","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M27","title":"普通介词宾语：介词后置","stage":"Mixed Retrieval","promptHtml":"<p>The project ___ the interns worked on won an award.</p>\n","options":[{"id":"A","text":"on which"},{"id":"B","text":"which"},{"id":"C","text":"where"},{"id":"D","text":"whose"}],"answer":"B","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""},{"id":"M28","title":"唯一负责夜间维护的技术员","stage":"Mixed Retrieval","promptHtml":"<p>Five technicians work in the data center.</p>\n<p>At night, Ezra alone is responsible for keeping the servers running smoothly.</p>\n<blockquote>\n<p>Ezra is the only one of the technicians who ___ the servers at night.</p>\n</blockquote>\n","options":[{"id":"A","text":"maintain"},{"id":"B","text":"maintaining"},{"id":"C","text":"maintained"},{"id":"D","text":"maintains"}],"answer":"D","feedbackMode":"silent","correctFeedbackHtml":"","wrongFeedbackHtml":"","feedbackByChoice":{},"explanationHtml":""}];
const KEY = 'grammar_quick_dual_connection_v2_local';
const card=document.querySelector('#quick'), panel=document.querySelector('#body'),primary=document.querySelector('#primary');
const title=document.querySelector('#top-title'),counter=document.querySelector('#counter'),progress=document.querySelector('#progress'),message=document.querySelector('#message');
const blank=()=>({index:0,mode:'ask',selected:null,records:[],path:[],completed:false,sent:false});
let state=blank();
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old && Array.isArray(old.records) && old.index >=0 && old.index<=PACK.length) state=old;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function stageLabel(x){if(x.startsWith('Teaching')) return '互动教学'; if(x.startsWith('Feedback'))return '即时练习';if(x==='Mixed Retrieval')return '综合练习';return '连续练习';}
function optionMarkup(option,cls='',enabled=true){return `<button type="button" class="option ${cls}" data-choice="${esc(option.id)}" ${enabled?'':'aria-disabled="true" tabindex="-1"'}><span class="option-letter">${esc(option.id)}</span><span class="option-text">${esc(option.text)}</span></button>`;}
function feedbackHtml(n,chosen){const isCorrect=chosen===n.answer, selectedMsg=n.feedbackByChoice[chosen] || (!isCorrect?n.wrongFeedbackHtml:n.correctFeedbackHtml) || '';
 const boxes=n.options.filter(o=>o.id===chosen || o.id===n.answer).map(o=>optionMarkup(o,o.id===n.answer?'good':'bad',false)).join('');
 const details=[selectedMsg,n.explanationHtml].filter(Boolean).join('');
 return `<div class="options">${boxes}</div><div class="feedback-title ${isCorrect?'good':'bad'}"><span aria-hidden="true">${isCorrect?'✓':'✕'}</span>${isCorrect?'答对了':'答错了'}</div>${details?`<div class="analysis">${details}</div>`:''}`;
}
function render(){
 let end=state.completed||state.index>=PACK.length;
 counter.textContent=end?`${PACK.length} / ${PACK.length}`:`${state.index+1} / ${PACK.length}`;
 progress.innerHTML=PACK.map((_,i)=>`<span class="piece ${i<state.index?'done':i===state.index&&!end?'now':end?'done':''}"></span>`).join('');
 message.textContent='';
 if(end){title.textContent='英语 Grammar · 完成'; panel.innerHTML=`<div class="end"><div class="check" aria-hidden="true">✓</div><h2>本轮完成啦！</h2><p>35 次互动已记录。<br>可以复制完整记录，交回教研窗口。</p><div class="extra"><button type="button" class="textaction" id="copy">复制完整记录</button><button type="button" class="textaction" id="restart">重新开始</button></div></div>`;primary.textContent='下载完整记录';primary.disabled=false;primary.onclick=download;
 document.querySelector('#copy').onclick=copy;document.querySelector('#restart').onclick=reset;
 }else {
 const n=PACK[state.index]; title.textContent='英语 Grammar · 双教学点';
 const feedback=state.mode==='feedback',rec=state.records.find(r=>r.itemId===n.id);
 const q='<div class="stage">'+esc(stageLabel(n.stage))+' · '+esc(n.id)+'</div><h2 class="itemtitle">'+esc(n.title)+'</h2><div class="question">'+n.promptHtml+'</div>';
 const body = feedback?feedbackHtml(n,rec.first):`<div class="options">${n.options.map(o=>optionMarkup(o,o.id===state.selected?'selected':'')).join('')}</div>`;
 panel.innerHTML=q+body;
 if(feedback){primary.textContent='下一步';primary.disabled=false;primary.onclick=next;}
 else{primary.textContent='提交答案';primary.disabled=!state.selected;primary.onclick=submit;
 panel.querySelectorAll('button[data-choice]').forEach(el=>el.addEventListener('click',()=>{
 if(state.mode!=='ask')return;
 state.selected=el.dataset.choice;save();panel.querySelectorAll('button[data-choice]').forEach(btn=>btn.classList.toggle('selected',btn.dataset.choice===state.selected));primary.disabled=false;card.focus({preventScroll:true});
 }));
 }
 }
 panel.scrollTop=0;
}
function submit(){if(state.mode!=='ask'||!state.selected||state.completed)return;
 const n=PACK[state.index];if(state.records.some(r=>r.itemId===n.id))return;
 const record={itemId:n.id,stage:n.stage,feedbackMode:n.feedbackMode,first:state.selected,reference:n.answer,correct:state.selected===n.answer,scored:!n.stage.startsWith('Teaching'),sequence:state.records.length+1,submittedAt:new Date().toISOString()};
 state.records.push(record);state.path.push(n.id);state.selected=null;
 if(n.feedbackMode==='instant_correctness')state.mode='feedback';
 else advance();
 save();render();
}
function next(){if(state.mode!=='feedback'||state.completed)return;advance();save();render();}
function advance(){state.index++;state.mode='ask';state.selected=null;if(state.index>=PACK.length){state.completed=true;state.completedAt=new Date().toISOString();}}
function report(){const formal=state.records.filter(x=>x.scored),teach=state.records.filter(x=>!x.scored), correct=xs=>xs.filter(x=>x.correct).length;
 const lines=['英语 Grammar｜双教学点 Quick｜完整真实执行记录','Event: RELATIVE_AGREEMENT_DUAL_CONNECTION_V1','Material: REVISED CANDIDATE','Interface: Universal Quick v2.0 lightweight shell','Source: independent Mac/browser clickable card','Status: '+(state.completed?'COMPLETED':'PARTIAL'),'Recorded count: '+state.records.length+' / '+PACK.length,'Teaching: '+teach.length+' (guided, NOT SCORED)','Formal first attempts: '+formal.length+', correct: '+correct(formal),'Feedback practice: '+state.records.filter(r=>r.stage.startsWith('Feedback')).length,'Silent: '+state.records.filter(r=>r.feedbackMode==='silent').length,'Completion time: '+(state.completedAt||'not completed'),'Execution path: '+state.path.join(' → '),'Skip: none','Gate/Recovery: none','', 'ITEM RECORDS'];
 for(const r of state.records){lines.push(`${r.sequence}. ${r.itemId} | ${r.stage} | ${r.feedbackMode} | first=${r.first} | answer=${r.reference} | ${r.correct?'CORRECT':'INCORRECT'} | ${r.scored?'FORMAL':'GUIDED'} | submittedAt=${r.submittedAt}`);}
 lines.push('','Evidence boundary: Teaching is guided; Practice and Mixed are post-teaching, not delayed Independent.','Return channel: text export; NOT automatically sent to ChatGPT.');
 return lines.join('\n');
}
async function copy(){const t=report();try{await navigator.clipboard.writeText(t);message.textContent='完整记录已复制';}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();message.textContent='已尝试复制完整记录';}}
function download(){const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Grammar_双教学点_真实执行记录.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);message.textContent='完整记录已下载（未自动发送到聊天）';}
function reset(){if(!confirm('将清空本机保存的本轮全部首答，重新开始。确定吗？'))return;state=blank();save();render();}
card.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.repeat||e.isComposing||e.defaultPrevented)return;const target=e.target;if(target.closest('input,textarea,[contenteditable="true"]'))return;if(target.matches('button'))return;if(target.closest('#quick')){e.preventDefault();if(!primary.disabled)primary.click();}});
card.addEventListener('click',()=>card.focus({preventScroll:true}));
render();
</script></body></html>
