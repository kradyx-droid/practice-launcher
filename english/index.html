function auditQuickRouteConfig(config){

 for(const route of routes){if(!byId.has(route.afterNodeId))add("unknown_route_source",route.afterNodeId,"route 来源节点不存在");if(route.whenRuntimeKey){const condition=route.whenRuntimeKey,hasEquals=Object.prototype.hasOwnProperty.call(condition,"equals"),hasNotEquals=Object.prototype.hasOwnProperty.call(condition,"notEquals");if(hasEquals===hasNotEquals||typeof (hasEquals?condition.equals:condition.notEquals)!=="string"||!(hasEquals?condition.equals:condition.notEquals))add("invalid_runtime_key_condition",route.afterNodeId,"runtimeKey 条件必须且只能声明非空字符串 equals 或 notEquals");const readerIndex=mainFlow.findIndex(node=>node.nodeId===route.afterNodeId),hasEarlierWrite=readerIndex>=0&&mainFlow.some((node,index)=>index<=readerIndex&&typeof node.setRuntimeKeyOnSubmit==="string"&&node.setRuntimeKeyOnSubmit.length>0);if(!hasEarlierWrite)add("runtime_key_read_before_write",route.afterNodeId,"runtimeKey 在明确写入以前被读取")}if(route.priorResultGate){const gate=route.priorResultGate;if(route.targetNodeId!==undefined)add("mixed_gate_target",route.afterNodeId,"前序结果 Gate 不得同时声明普通 targetNodeId");if(!Array.isArray(gate.nodeIds)||!gate.nodeIds.length||new Set(gate.nodeIds).size!==gate.nodeIds.length||gate.allEquals!==1)add("invalid_prior_result_gate",route.afterNodeId,"Gate 必须指定不重复的 nodeIds，并使用 allEquals: 1");for(const nodeId of gate.nodeIds||[]){const referenced=byId.get(nodeId);if(!referenced)add("unknown_gate_node",route.afterNodeId,`Gate 引用的 nodeId 不存在: ${nodeId}`);else if(!referenced.firstResultRule||!referenced.firstResultRule.field||!Object.prototype.hasOwnProperty.call(referenced.firstResultRule,"equals"))add("gate_node_missing_first_result_rule",route.afterNodeId,`Gate 引用的 nodeId 未配置合法 firstResultRule: ${nodeId}`)}for(const target of [gate.trueTargetNodeId,gate.falseTargetNodeId])if(!byId.has(target))add("unknown_route_target",route.afterNodeId,"Gate true / false 目标节点必须存在")}else if(!byId.has(route.targetNodeId))add("unknown_route_target",route.afterNodeId,"route 目标节点不存在");}

let runtimeConfig=defaultRuntimeConfig,flow=runtimeConfig.mainFlow,runtime=createQuickRuntime(runtimeConfig),stepIndex=0,feedbackState=null,choiceByStep=flow.map(()=>null);
const card=document.querySelector("#card"),stepCount=document.querySelector("#stepCount"),progressFill=document.querySelector("#progressFill");
function renderQuickMathText(target,value){const source=String(value??"");const pattern=/\\frac\{([^{}]+)\}\{([^{}]+)\}|\\frac([0-9])([0-9])|(\d+)\s*\/\s*(\d+)/g;let cursor=0;target.replaceChildren();for(const match of source.matchAll(pattern)){if(match[5]!==undefined&&(source[match.index-1]==="/"||source[match.index+match[0].length]==="/"))continue;const index=match.index;if(index>cursor)target.append(document.createTextNode(source.slice(cursor,index)));const numerator=match[1]??match[3]??match[5],denominator=match[2]??match[4]??match[6],fraction=document.createElement("span");fraction.className="quick-fraction";fraction.setAttribute("role","math");fraction.setAttribute("aria-label",`${numerator} over ${denominator}`);const top=document.createElement("span");top.className="quick-fraction__numerator";top.textContent=numerator;const bar=document.createElement("span");bar.className="quick-fraction__bar";bar.setAttribute("aria-hidden","true");const bottom=document.createElement("span");bottom.className="quick-fraction__denominator";bottom.textContent=denominator;fraction.append(top,bar,bottom);target.append(fraction);cursor=index+match[0].length}if(cursor<source.length)target.append(document.createTextNode(source.slice(cursor)))}
window.QuickMathDisplay=Object.freeze({render:renderQuickMathText});
function current(){return runtime.node()||flow[stepIndex]}
function renderInline(target,value){const source=String(value??""),pattern=/\*\*(.+?)\*\*|`([^`]+)`/g;let cursor=0;target.replaceChildren();for(const match of source.matchAll(pattern)){if(match.index>cursor)target.append(document.createTextNode(source.slice(cursor,match.index)));const element=document.createElement(match[1]!==undefined?"strong":"code");element.textContent=match[1]??match[2];target.append(element);cursor=match.index+match[0].length}if(cursor<source.length)target.append(document.createTextNode(source.slice(cursor)))}
function canSubmit(){return choiceByStep[stepIndex]!==null}
function paintProgress(step){stepCount.textContent=`${step.progressCurrent} / 30`;progressFill.style.width=`${step.progressCurrent/30*100}%`}
function draw(){const step=current();paintProgress(step);card.classList.remove("done","free-input-scroll-layout");card.replaceChildren();const scroller=document.createElement("div");scroller.className="text-scroll";const text=document.createElement("p");text.className="text-block";text.setAttribute("aria-label","题目");renderInline(text,step.text);scroller.append(text);card.append(scroller);const task=document.createElement("p");task.className="instruction";renderInline(task,step.task);card.append(task);const opts=document.createElement("div");opts.className="options";step.options.items.forEach((label,index)=>{const button=document.createElement("button");button.type="button";button.className="option";button.setAttribute("aria-pressed",String(choiceByStep[stepIndex]===index));const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+index);const value=document.createElement("span");renderInline(value,label);button.append(letter,value);button.addEventListener("click",()=>{choiceByStep[stepIndex]=index;draw()});opts.append(button)});card.append(opts);const actions=document.createElement("div");actions.className="actions";const submit=document.createElement("button");submit.className="primary";submit.id="submit";submit.textContent="提交";submit.disabled=!canSubmit();submit.addEventListener("click",submitCurrent);actions.append(submit);card.append(actions)}

const UNIVERSAL_QUICK_RESULT_V1_HEADER=[
 "FORMAT UNIVERSAL_QUICK_RESULT_V1",
 "Universal Quick｜结果导出协议 v1",
 "以下为一次运行结果，正文 JSON 位于本说明之后。顶层 status/stopReason/currentNodeId 表示会话状态；firstNaturalAnswer 是首条已提交 main 节点答案的快照；draftAtStop 是停止时当前节点尚未提交的草稿（正常完成时为 null）。answers 按提交顺序记录作答，path 记录实际经过的节点及结束/停止事件，routes 只列本次实际命中的路由。nodeKind 区分 main/branch，item/step/nodeId 定位节点；sourceText 是题面或文字；Choice 的提交选项保存在 selectedOptionId、selectedOptionValue 和 optionChoice 中。selectedOptionId 是界面顺序对应的 A、B 等标识，selectedOptionValue 是实际选项值。textSelection 保存所选 token 及其在 sourceText 中的 UTF-16 零起点半开区间。配置 firstResultRule 的节点会在首次提交时把该答案的二元结果 0 / 1 写入同一 answers 记录的 firstResult；未配置时该字段缺失。运行时忽略提交 payload 自带的 firstResult。Free Input 的正式提交在 answers / firstNaturalAnswer 中以 answerMode:\"free_input\" 标识，rawInputText 是提交时原样保存的完整文本，submittedAt 是提交时间，probeRule 是本题配置的判读参考（未配置时为 null），judgement 固定为 null，表示前端未进行业务判定；这些 Free Input 字段不会出现在 Choice 答案中。停止在 Free Input 题目时，draftAtStop.rawInputText 保存当时未提交的原文；停止草稿始终带有 rawInputText、textSelection、optionChoice，其中非适用输入/选择为 null。未提交草稿不属于正式 answers，也不代表已判定答案。字段可能因节点类型而缺失；字段缺失或 null 仅表示该记录未提供相应类型的数据，不能据此推断学生表现。routes 的 from/to 是起终节点地址；type:\"condition\" 记录普通条件 route，type:\"prior_result_gate\" 记录一次前序结果 Gate、其 nodeIds 条件和读取值；普通条件 route 如使用 runtimeKey，会记录 runtimeKeyCondition 与 observedRuntimeKey。顶层 runtimeKey 仅在配置并写入时导出，未使用时省略；return 等其他 route 可以没有这些字段，routeId 也可能为 null。recordSpec 是节点预设记录说明，evidenceLevel 是该记录的预设证据等级，feedback 是节点配置值；这些字段未配置时可能直接缺失，不保证输出 null，字段缺失不构成学生表现。Independent、Prompted、Taught 表示记录节点预设的执行条件/记录语义，不是最终能力结论。若当前批次预置了某 branch，但它未出现在本次 answers/path 中，表示本次运行没有进入该 branch；这不提供孩子在该 branch 上会如何作答的证据。Grammar 仍需结合冻结教研目标、首次真实表现及 answers/path/routes 作最终判断。",
 "【运行记录 JSON】"
].join("\n");
function formatResults(){return `${UNIVERSAL_QUICK_RESULT_V1_HEADER}\n${JSON.stringify(runtime.exportSession(),null,2)}`}
async function copyResults(event){const button=event.currentTarget,text=formatResults();let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch{}if(!copied){const field=document.createElement("textarea");field.value=text;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}if(copied){button.textContent="已复制";button.disabled=true;setTimeout(()=>{button.textContent="复制结果";button.disabled=false},1200)}}
