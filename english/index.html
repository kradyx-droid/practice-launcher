<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quick Check</title>
<style>
:root{color-scheme:light;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(960px,100% - 32px);min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:14px}.brand{font-weight:650;color:var(--ink);letter-spacing:.01em}
.progress{height:5px;background:#e3e7ee;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--blue);width:0}
.card{height:clamp(260px,calc(100svh - 150px),860px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,48px);box-shadow:0 12px 36px #23304a0b}
.prompt{font-size:clamp(20px,3vw,20px);line-height:1.65;margin:0 0 26px;white-space:pre-line}.options{display:grid;gap:12px}.option{width:100%;text-align:left;display:flex;align-items:flex-start;gap:15px;padding:15px 18px;border:1.5px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit;cursor:pointer;white-space:pre-line}.option[aria-pressed="true"]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f0f2f6;font-weight:700;font-size:16px}.option[aria-pressed="true"] .letter{background:var(--blue);color:white}
.actions{display:flex;justify-content:flex-end;margin-top:24px;gap:12px;flex-wrap:wrap}.primary{border:0;border-radius:11px;background:var(--blue);color:white;padding:13px 25px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;min-width:134px}.primary:disabled{background:#b9c1d0;cursor:not-allowed}.secondary{border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);padding:12px 20px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.intro{text-align:center}.intro h1,.done h1{font-size:32px;line-height:1.2;margin:0 0 12px}.intro p,.done p{color:var(--muted);margin:0 0 26px}.center{justify-content:center}.center .primary{align-self:center;min-width:160px}.center .card{display:flex;flex-direction:column;justify-content:center}.done{text-align:center}.copy-status{min-height:28px;color:var(--muted);font-size:15px;margin-top:12px!important}.step-copy{white-space:pre-line;margin:0 0 18px}
@media(max-width:520px){body{font-size:17px}main{width:min(100% - 20px,760px)}.card{border-radius:16px;padding:24px 18px}.top{margin-bottom:12px}.option{padding:13px 14px}}
</style>
</head>
<body>
<main id="app" class="center">
<section class="card intro" aria-labelledby="welcome-title"><h1 id="welcome-title">English Quick Check</h1><p>Choose the best answer for each sentence.</p><button id="start" class="primary">Start</button></section>
</main>
<script>
"use strict";
const BATCH_ID="RELATIVE_REASON_SLOT_TRANSFER_CAL_V1",BATCH_VERSION="1.0",STORE_KEY="english_quick_check_RELATIVE_REASON_SLOT_TRANSFER_CAL_V1";
const relation=["which","why"];
const core=[
 {item_id:"P1",sentence:"This is the reason ___ Maya left early.",focus_clause:"Maya left early",internal_structure:"complete",options:["which","why"],correct_relation:"why",correct_option:"B",support_type:"complete_clause",support_sentence:"Maya left early.",support_reason_sentence:"Maya left early because she was tired."},
 {item_id:"P2",sentence:"This is one reason ___ we cannot ignore.",focus_clause:"we cannot ignore",internal_structure:"missing_object",options:["which","why"],correct_relation:"which",correct_option:"A",support_type:"missing_object",support_sentence:"We cannot ignore this reason.",support_blank:"We cannot ignore ___."},
 {item_id:"P3",sentence:"I know the reason ___ he changed his mind.",focus_clause:"he changed his mind",internal_structure:"complete",options:["why","which"],correct_relation:"why",correct_option:"A",support_type:"complete_clause",support_sentence:"He changed his mind.",support_reason_sentence:"He changed his mind because he heard the news."},
 {item_id:"P4",sentence:"This is one reason ___ may explain the delay.",focus_clause:"may explain the delay",internal_structure:"missing_subject",options:["why","which"],correct_relation:"which",correct_option:"B",support_type:"missing_subject",support_sentence:"This reason may explain the delay.",support_blank:"___ may explain the delay."},
 {item_id:"P5",sentence:"The reason ___ she gave surprised me.",focus_clause:"she gave",internal_structure:"missing_object",options:["which","why"],correct_relation:"which",correct_option:"A",support_type:"missing_object",support_sentence:"She gave the reason.",support_blank:"She gave ___."},
 {item_id:"P6",sentence:"That is the reason ___ the shop closed early.",focus_clause:"the shop closed early",internal_structure:"complete",options:["which","why"],correct_relation:"why",correct_option:"B",support_type:"complete_clause",support_sentence:"The shop closed early.",support_reason_sentence:"The shop closed early because the power went out."}
];
const pathSteps=[
 {source_item_id:"P2",part:"path_report",sentence:"This is one reason ___ we cannot ignore.",prompt:"刚才你做这题时，第一步更接近哪一种？",options:["看到 reason，先想到应该用哪个连接词","先看后半句自己完整不完整、有没有缺东西","主要凭整句话读起来的感觉","说不清 / 其他"]},
 {source_item_id:"P2",part:"structure_check",sentence:"we cannot ignore",prompt:"这段自己是：",options:["完整","缺一个东西"],correct:"缺一个东西"},
 {source_item_id:"P6",part:"path_report",sentence:"That is the reason ___ the shop closed early.",prompt:"刚才你做这题时，第一步更接近哪一种？",options:["看到 reason，先想到应该用哪个连接词","先看后半句自己完整不完整、有没有缺东西","主要凭整句话读起来的感觉","说不清 / 其他"]},
 {source_item_id:"P6",part:"structure_check",sentence:"the shop closed early",prompt:"这段自己是：",options:["完整","缺一个东西"],correct:"完整"}
];
const app=document.querySelector("#app");let run=null,coreIndex=0,pathIndex=0,diagnosisQueue=[],diagnosisIndex=0,currentId=null,selected=null,shownAt=0,stage="start",supportLevel=1,structureResolved=false;
const nowISO=()=>new Date().toISOString();
function makeRecord(q,i){return {item_id:q.item_id,evidence_layer:"calibration_core",presented_order:i+1,sentence:q.sentence,focus_clause:q.focus_clause,internal_structure:q.internal_structure,correct_relation:q.correct_relation,options:q.options.slice(),initial_answer:null,initial_answer_option:null,initial_answer_correct:null,initial_response_time_ms:null,diagnosis_triggered:false,diagnosis_step1_answer:null,diagnosis_step1_option:null,diagnosis_step1_correct:null,diagnosis_step1_response_time_ms:null,reselect_answer:null,reselect_option:null,reselect_correct:null,reselect_response_time_ms:null,support_triggered:false,support_type:q.support_type,support_answer:null,support_option:null,support_correct:null,support_response_time_ms:null,support_level2_answer:null,support_level2_option:null,support_level2_correct:null,support_level2_response_time_ms:null,post_support_reselect_answer:null,post_support_reselect_option:null,post_support_reselect_correct:null,post_support_reselect_response_time_ms:null,teaching_triggered:false,immediate_transfer_triggered:false,immediate_transfer_answer:null,immediate_transfer_option:null,immediate_transfer_correct:null,immediate_transfer_response_time_ms:null,final_state:null,response_times_ms:{}}}
function persist(){if(run){run.saved_at=nowISO();try{localStorage.setItem(STORE_KEY,JSON.stringify(run))}catch(e){run.local_persistence_available=false}}}
function answerValue(key,opts){const n=key.charCodeAt(0)-65;return Number.isInteger(n)&&n>=0&&n<opts.length?opts[n]:null}
function rec(id=currentId){return run.items.find(x=>x.item_id===id)}
function header(label,progress){return `<div class="top"><span class="brand">English Quick Check</span><span>${label}</span></div><div class="progress" aria-hidden="true"><div style="width:${Math.max(0,Math.min(100,progress))}%"></div></div>`}
function renderScreen({label,pct,sentence=null,prompt,options,button="提交",onSubmit}){stage=stage||"";selected=null;shownAt=performance.now();app.className="";app.innerHTML=`${header(label,pct)}<section class="card">${sentence!==null?'<p class="prompt" id="sentence"></p>':''}<p class="step-copy" id="prompt"></p><div id="answers" class="options"></div><div class="actions"><button class="primary" id="submit" disabled>${button}</button></div></section>`;if(sentence!==null)app.querySelector("#sentence").textContent=sentence;app.querySelector("#prompt").textContent=prompt;const wrap=app.querySelector("#answers");options.forEach((value,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed","false");const letter=String.fromCharCode(65+i);b.innerHTML=`<span class="letter">${letter}</span><span></span>`;b.querySelector("span:last-child").textContent=value;b.onclick=()=>{selected={option:letter,value};wrap.querySelectorAll(".option").forEach((x,j)=>x.setAttribute("aria-pressed",String(j===i)));document.querySelector("#submit").disabled=false};wrap.append(b)});document.querySelector("#submit").onclick=()=>{if(!selected)return;document.querySelector("#submit").disabled=true;onSubmit(selected,Math.round(performance.now()-shownAt))}}
function start(){run={batch_id:BATCH_ID,batch_version:BATCH_VERSION,run_id:"run-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),started_at:nowISO(),started_ms:Date.now(),completed_at:null,completed_ms:null,completed_normally:false,completed_core_items:0,core_initial_correct_count:0,core_initial_total:6,path_check_completed:false,path_check:[],diagnosis_triggered_items:[],branch_reason_surface_shortcut_triggered:false,branch_subject_slot_only_triggered:false,teaching_triggered:false,immediate_transfer_completed:false,batch_final_state:"incomplete",items:core.map(makeRecord)};coreIndex=0;pathIndex=0;diagnosisQueue=[];diagnosisIndex=0;currentId=null;persist();showCore()}
function showCore(){const q=core[coreIndex];currentId=q.item_id;renderScreen({label:`${coreIndex+1} / 6`,pct:coreIndex/6*100,sentence:q.sentence,prompt:"",options:q.options,onSubmit:(s,ms)=>{const r=rec();r.initial_answer=s.value;r.initial_answer_option=s.option;persist();r.initial_answer_correct=s.option===q.correct_option;r.initial_response_time_ms=ms;r.response_times_ms.initial_answer=ms;if(r.initial_answer_correct)r.final_state="direct_success";run.completed_core_items=coreIndex+1;run.core_initial_correct_count=run.items.filter(x=>x.initial_answer_correct===true).length;persist();if(coreIndex<core.length-1){coreIndex++;showCore()}else{pathIndex=0;showPath()}}})}
function showPath(){const p=pathSteps[pathIndex];currentId=p.source_item_id;renderScreen({label:`路径确认 ${Math.floor(pathIndex/2)+1} / 2`,pct:100,sentence:p.sentence,prompt:p.prompt,options:p.options,onSubmit:(s,ms)=>{let entry=run.path_check.find(x=>x.source_item_id===p.source_item_id);if(!entry){entry={source_item_id:p.source_item_id,evidence_layer:"post_core_path_check",path_report:null,path_report_option:null,path_report_response_time_ms:null,structure_check_answer:null,structure_check_option:null,structure_check_correct:null,structure_check_response_time_ms:null};run.path_check.push(entry)}if(p.part==="path_report"){entry.path_report=s.value;entry.path_report_option=s.option;entry.path_report_response_time_ms=ms}else{entry.structure_check_answer=s.value;entry.structure_check_option=s.option;entry.structure_check_correct=s.value===p.correct;entry.structure_check_response_time_ms=ms}persist();pathIndex++;if(pathIndex<pathSteps.length)showPath();else{run.path_check_completed=true;computeBranches();persist();beginDiagnoses()}}})}
function computeBranches(){const by=Object.fromEntries(run.items.map(x=>[x.item_id,x]));run.core_initial_total=6;const whichItems=["P2","P4","P5"];const whyFull=["P1","P3","P6"];const whySurfaceCount=whichItems.filter(id=>by[id].initial_answer==="why").length;const fullCorrectCount=whyFull.filter(id=>by[id].initial_answer_correct===true).length;run.branch_reason_surface_shortcut_triggered=whySurfaceCount>=2&&fullCorrectCount>=2;const errors=run.items.filter(x=>x.initial_answer_correct===false).map(x=>x.item_id);run.branch_subject_slot_only_triggered=errors.length===1&&errors[0]==="P4";diagnosisQueue=errors;run.diagnosis_triggered_items=diagnosisQueue.slice();}
function beginDiagnoses(){if(diagnosisQueue.length===0){finish("core_complete_no_diagnosis");return}diagnosisIndex=0;beginDiagnosisItem()}
function beginDiagnosisItem(){if(diagnosisIndex>=diagnosisQueue.length){finish("diagnosis_completed");return}currentId=diagnosisQueue[diagnosisIndex];const r=rec();r.diagnosis_triggered=true;persist();structureResolved=false;supportLevel=1;showStep1()}
function showStep1(){const r=rec();renderScreen({label:`${r.presented_order} / 6`,pct:100,sentence:r.focus_clause,prompt:"这段自己是：",options:["完整","缺一个东西"],onSubmit:(s,ms)=>{r.diagnosis_step1_answer=s.value;r.diagnosis_step1_option=s.option;persist();r.diagnosis_step1_correct=s.value===(r.internal_structure==="complete"?"完整":"缺一个东西");r.diagnosis_step1_response_time_ms=ms;r.response_times_ms.diagnosis_step1=ms;persist();if(r.diagnosis_step1_correct){structureResolved=true;showReselect(false)}else{r.support_triggered=true;persist();showSupport()}}})}
function supportPrompt(r,level){if(r.support_type==="complete_clause"){if(level===1)return {sentence:r.sentenceForSupport||core.find(x=>x.item_id===r.item_id).support_sentence,prompt:"这句话自己能不能站住？",options:["能","不能"],correct:"能"};return {sentence:`${core.find(x=>x.item_id===r.item_id).support_sentence}\n\n${core.find(x=>x.item_id===r.item_id).support_sentence.replace(/\\.$/,"")} because she was tired.`,prompt:"第二句加上的内容是：",options:["句子必须有的东西","额外告诉我们“为什么”"],correct:"额外告诉我们“为什么”"}}
 const q=core.find(x=>x.item_id===r.item_id);return {sentence:`${q.support_sentence}\n\n${q.support_blank}`,prompt:"这里是：",options:["完整","缺一个东西"],correct:"缺一个东西"}}
function showSupport(){const r=rec(),q=core.find(x=>x.item_id===r.item_id),p=supportPrompt(r,supportLevel);if(r.support_type==="complete_clause"&&supportLevel===2){p.sentence=`${q.support_sentence}\n\n${q.support_reason_sentence}`}
 renderScreen({label:`${r.presented_order} / 6`,pct:100,sentence:p.sentence,prompt:p.prompt,options:p.options,onSubmit:(s,ms)=>{if(supportLevel===1){r.support_answer=s.value;r.support_option=s.option;persist();r.support_correct=s.value===p.correct;r.support_response_time_ms=ms;r.response_times_ms.support=ms;persist()}else{r.support_level2_answer=s.value;r.support_level2_option=s.option;persist();r.support_level2_correct=s.value===p.correct;r.support_level2_response_time_ms=ms;r.response_times_ms.support_level2=ms;persist()}
 if(s.value===p.correct){structureResolved=true;showReselect(true);return}if(r.support_type==="complete_clause"&&supportLevel===1){supportLevel=2;showSupport();return}r.final_state="unresolved";persist();nextDiagnosis()}})}
function showReselect(afterSupport){const r=rec();renderScreen({label:`${r.presented_order} / 6`,pct:100,sentence:r.sentence,prompt:"现在重新选一次。",options:r.options,onSubmit:(s,ms)=>{if(afterSupport){r.post_support_reselect_answer=s.value;r.post_support_reselect_option=s.option;persist();r.post_support_reselect_correct=s.value===r.correct_relation;r.post_support_reselect_response_time_ms=ms;r.response_times_ms.post_support_reselect=ms;persist()}else{r.reselect_answer=s.value;r.reselect_option=s.option;persist();r.reselect_correct=s.value===r.correct_relation;r.reselect_response_time_ms=ms;r.response_times_ms.reselect=ms;persist()}
 const correct=s.value===r.correct_relation;if(correct){r.final_state=afterSupport?"scaffolded_recovery":"prompted_recovery";persist();nextDiagnosis()}else if(structureResolved){r.teaching_triggered=true;run.teaching_triggered=true;r.immediate_transfer_triggered=true;persist();showTeaching()}else{r.final_state="unresolved";persist();nextDiagnosis()}}})}
function showTeaching(){app.className="";app.innerHTML=`${header("",100)}<section class="card"><p class="step-copy">如果后半句自己已经完整，空格不需要进去替一个位置；这里是在连接“这个原因”和“为什么发生”，用 why。\n\n如果后半句里面缺一个东西，而这个东西就是前面的 reason，连接词要进去承担那个位置；在这两个选项里用 which。</p><div class="actions"><button class="primary" id="continue">继续</button></div></section>`;document.querySelector("#continue").onclick=showTransfer}
function showTransfer(){const r=rec(),q=core.find(x=>x.item_id===r.item_id),gap=q.internal_structure!=="complete";const sentence=gap?"This is a reason ___ nobody should forget.":"I understand the reason ___ Leo stayed home.";const correct=gap?"which":"why";renderScreen({label:"",pct:100,sentence,prompt:"",options:relation,onSubmit:(s,ms)=>{r.immediate_transfer_answer=s.value;r.immediate_transfer_option=s.option;persist();r.immediate_transfer_correct=s.value===correct;r.immediate_transfer_response_time_ms=ms;r.response_times_ms.immediate_transfer=ms;r.final_state=r.immediate_transfer_correct?"taught_recovery":"unresolved";run.immediate_transfer_completed=true;persist();finish("stopped_after_teaching")}})}
function nextDiagnosis(){diagnosisIndex++;beginDiagnosisItem()}
function finish(state){run.items.forEach(x=>{if(x.initial_answer_correct===false&&x.final_state===null)x.final_state="unresolved"});run.completed_at=nowISO();run.completed_ms=Date.now();run.total_duration_ms=run.completed_ms-run.started_ms;run.completed_normally=run.completed_core_items===6&&run.path_check_completed;run.batch_final_state=state;persist();showDone()}
function resultText(){return "# English Quick Check｜执行记录\n\n"+JSON.stringify(run,null,2)}
function showDone(){app.className="center";app.innerHTML=`<section class="card done"><h1>完成啦。</h1><p>今天这轮已经结束。</p><div class="actions" style="justify-content:center"><button class="primary" id="copy">复制结果</button><button class="secondary" id="save">保存结果</button></div><p class="copy-status" id="status" aria-live="polite"></p></section>`;document.querySelector("#copy").onclick=copyResult;document.querySelector("#save").onclick=saveResult}
async function copyResult(){const text=resultText();try{await navigator.clipboard.writeText(text);document.querySelector("#status").textContent="已复制 ✓"}catch(e){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.append(t);t.select();const ok=document.execCommand("copy");t.remove();document.querySelector("#status").textContent=ok?"已复制 ✓":"复制未成功，请重试"}}
function saveResult(){const blob=new Blob([resultText()],{type:"text/markdown;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${BATCH_ID}_${run.run_id}.md`;a.click();URL.revokeObjectURL(a.href);document.querySelector("#status").textContent="已保存"}
document.querySelector("#start").onclick=start;
</script>
</body>
</html>
