<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quick Check</title>
<style>
:root{color-scheme:light;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(960px,100% - 32px);min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:14px}.brand{font-weight:650;color:var(--ink);letter-spacing:.01em}
.progress{height:5px;background:#e3e7ee;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--blue);width:0;transition:none}
.card{height:clamp(260px,calc(100svh - 150px),860px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,48px);box-shadow:0 12px 36px #23304a0b}
.prompt{font-size:clamp(20px,3vw,20px);line-height:1.65;margin:0 0 26px;white-space:pre-line}.options{display:grid;gap:12px}.option{width:100%;text-align:left;display:flex;align-items:flex-start;gap:15px;padding:15px 18px;border:1.5px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit;cursor:pointer;white-space:pre-line;transition:none}.option:hover{border-color:#9aabe6}.option[aria-pressed="true"]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f0f2f6;font-weight:700;font-size:16px}.option[aria-pressed="true"] .letter{background:var(--blue);color:white}
.actions{display:flex;justify-content:flex-end;margin-top:24px}.primary{border:0;border-radius:11px;background:var(--blue);color:white;padding:13px 25px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;min-width:134px}.primary:disabled{background:#b9c1d0;cursor:not-allowed}.intro{text-align:center}.intro h1,.done h1{font-size:32px;line-height:1.2;margin:0 0 12px}.intro p,.done p{color:var(--muted);margin:0 0 26px}.center{justify-content:center}.center .primary{align-self:center;min-width:160px}.center .card{display:flex;flex-direction:column;justify-content:center}.done{text-align:center}.done .primary{min-width:160px}.copy-status{min-height:28px;color:var(--muted);font-size:15px;margin-top:12px!important}.hint{color:var(--muted);font-size:14px;margin-top:14px;text-align:center}
@media(max-width:520px){body{font-size:17px}main{width:min(100% - 20px,760px)}.card{border-radius:16px;padding:24px 18px}.top{margin-bottom:12px}.option{padding:13px 14px}}
.phase-label{color:var(--muted);font-size:14px;margin:0 0 10px}.step-copy{white-space:pre-line;margin:0 0 18px}
</style>
</head>
<body>
<main id="app" class="center">
  <section class="card intro" aria-labelledby="welcome-title">
    <h1 id="welcome-title">English Quick Check</h1>
    <p>Choose the best answer for each sentence.</p>
    <button id="start" class="primary">Start</button>
  </section>
</main>
<script>
"use strict";
const batch={batch_id:"RELATIVE_SLOT_SURFACE_CONFLICT_PRACTICE",batch_version:"1.0"};
const relationOptions=["which","when","where"];
const step1Options=["完整","缺一个东西"];
const items=[
 {item_id:"P1",sentence:"I still remember the two hours ___ the repair took.",focus_clause:"the repair took",internal_structure:"missing",correct_relation:"which",correct_option:"A",step1_correct:"缺一个东西",support:{prompt:"The repair took two hours.\n\nThe repair took ___.",options:["完整","缺一个东西"],correct:"B"}},
 {item_id:"P2",sentence:"This is the café ___ we waited for the bus.",focus_clause:"we waited for the bus",internal_structure:"complete",correct_relation:"where",correct_option:"C",step1_correct:"完整",support:{prompt:"We waited for the bus.\n\n这句话自己能不能站住？",options:["能","不能"],correct:"A"}},
 {item_id:"P3",sentence:"This is the restaurant ___ my aunt owns.",focus_clause:"my aunt owns",internal_structure:"missing",correct_relation:"which",correct_option:"A",step1_correct:"缺一个东西",support:{prompt:"My aunt owns the restaurant.\n\nMy aunt owns ___.\n\n这里还缺不缺东西？",options:["完整","缺一个东西"],correct:"B"}},
 {item_id:"P4",sentence:"That was the evening ___ we spent preparing for the show.",focus_clause:"we spent preparing for the show",internal_structure:"missing",correct_relation:"which",correct_option:"A",step1_correct:"缺一个东西",support:{prompt:"We spent the evening preparing for the show.\n\nWe spent ___ preparing for the show.",options:["完整","缺一个东西"],correct:"B"}}
];
const app=document.querySelector("#app"),letters=["A","B","C","D"];
let run=null,index=0,stage="start",selected=null,shownAt=0;
const iso=()=>new Date().toISOString();
function newRecord(q,i){return {item_id:q.item_id,presented_order:i+1,sentence:q.sentence,focus_clause:q.focus_clause,internal_structure:q.internal_structure,correct_relation:q.correct_relation,correct_option:q.correct_option,initial_answer:null,initial_answer_option:null,initial_answer_correct:null,initial_response_time_ms:null,step1_triggered:false,step1_answer:null,step1_answer_option:null,step1_correct_answer:q.step1_correct,step1_correct:null,step1_response_time_ms:null,support_triggered:false,support_prompt:q.support.prompt,support_options:q.support.options.slice(),support_correct_answer:q.support.options[q.support.correct.charCodeAt(0)-65],support_answer:null,support_answer_option:null,support_correct:null,support_response_time_ms:null,recovered_final_answer:null,recovered_final_answer_option:null,recovered_final_correct:null,final_answer:null,final_correct:null,final_state:null,response_times_ms:{}}}
function record(){return run.items[index]}function item(){return items[index]}
function answerLabel(key,options){const i=key.charCodeAt(0)-65;return Number.isInteger(i)&&i>=0&&i<options.length?options[i]:null}
function header(){return `<div class="top"><span class="brand">English Quick Check</span><span>${index+1} / 4</span></div><div class="progress" aria-hidden="true"><div style="width:${index/4*100}%"></div></div>`}
function renderOptions(options){const wrap=document.createElement("div");wrap.className="options";options.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed","false");b.innerHTML=`<span class="letter">${letters[i]}</span><span></span>`;b.querySelector("span:last-child").textContent=label;b.onclick=()=>{selected=letters[i];wrap.querySelectorAll(".option").forEach((x,j)=>x.setAttribute("aria-pressed",String(letters[j]===selected)));document.querySelector("#submit").disabled=false};wrap.append(b)});return wrap}
function showQuestion(mode){stage=mode;selected=null;shownAt=performance.now();const q=item();const recovery=mode==="step1"||mode==="support";const options=mode==="initial"||mode==="recovered_relation"?relationOptions:mode==="step1"?step1Options:q.support.options;let label="",copy="",sentence=q.sentence;if(mode==="step1"){sentence=null;label="Step 1";copy=`只看 ${q.focus_clause}。\n它本身是：`}else if(mode==="support"){sentence=null;label="";copy=q.support.prompt}else if(mode==="recovered_relation"){label="";copy=""}app.className="";app.innerHTML=`${header()}<section class="card">${sentence!==null?'<p class="prompt" id="sentence"></p>':''}${label?'<p class="phase-label" id="phase"></p>':''}${copy?'<p class="step-copy" id="copy"></p>':''}<div id="answers"></div><div class="actions"><button class="primary" id="submit" disabled>提交</button></div></section>`;if(sentence!==null)app.querySelector("#sentence").textContent=sentence;if(label)app.querySelector("#phase").textContent=label;if(copy)app.querySelector("#copy").textContent=copy;app.querySelector("#answers").append(renderOptions(options));document.querySelector("#submit").onclick=submitAnswer}
function start(){run={batch_id:batch.batch_id,batch_version:batch.batch_version,run_id:"run-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),started_at:iso(),started_ms:Date.now(),completed_at:null,completed_ms:null,completed_normally:false,items:items.map(newRecord)};index=0;showQuestion("initial")}
function logTime(key){record().response_times_ms[key]=Math.round(performance.now()-shownAt)}
function submitAnswer(){if(!selected)return;const q=item(),r=record(),answer=selected,elapsed=Math.round(performance.now()-shownAt);document.querySelector("#submit").disabled=true;document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(stage==="initial"){r.initial_answer_option=answer;r.initial_answer=answerLabel(answer,relationOptions);r.initial_answer_correct=answer===q.correct_option;r.initial_response_time_ms=elapsed;logTime("initial_answer");if(r.initial_answer_correct){r.final_answer=r.initial_answer;r.final_correct=true;r.final_state="direct_success";advance();return}r.step1_triggered=true;showQuestion("step1");return}
 if(stage==="step1"){r.step1_answer_option=answer;r.step1_answer=answerLabel(answer,step1Options);r.step1_correct=r.step1_answer===q.step1_correct;r.step1_response_time_ms=elapsed;logTime("step1");if(r.step1_correct){showQuestion("recovered_relation");return}r.support_triggered=true;showQuestion("support");return}
 if(stage==="support"){r.support_answer_option=answer;r.support_answer=answerLabel(answer,q.support.options);r.support_correct=answer===q.support.correct;r.support_response_time_ms=elapsed;logTime("support");if(!r.support_correct){r.final_answer=r.initial_answer;r.final_correct=false;r.final_state="unresolved";advance();return}showQuestion("recovered_relation");return}
 if(stage==="recovered_relation"){r.recovered_final_answer_option=answer;r.recovered_final_answer=answerLabel(answer,relationOptions);r.recovered_final_correct=answer===q.correct_option;r.final_answer=r.recovered_final_answer;r.final_correct=r.recovered_final_correct;r.final_state=r.recovered_final_correct?(r.support_triggered?"scaffold_recovered":"step1_recovered"):"unresolved";logTime("recovered_final_answer");advance()}
}
function advance(){if(index>=items.length-1){complete();return}index++;showQuestion("initial")}
function complete(){run.completed_at=iso();run.completed_ms=Date.now();run.completed_normally=true;showDone()}
function showDone(){app.className="center";app.innerHTML=`<section class="card done"><h1>本轮记录已完成</h1><p>请把结果交回分析</p><button class="primary" id="copy">复制结果</button><p class="copy-status" id="status" aria-live="polite"></p></section>`;document.querySelector("#copy").onclick=copyResult}
function resultText(){const out=["# Relative Slot Surface Conflict Practice｜执行记录","",`BATCH_ID: ${run.batch_id}`,`BATCH_VERSION: ${run.batch_version}`,`RUN_ID: ${run.run_id}`,`STARTED_AT: ${run.started_at}`,`COMPLETED_AT: ${run.completed_at}`,`TOTAL_DURATION_MS: ${run.completed_ms-run.started_ms}`,`COMPLETED_NORMALLY: ${run.completed_normally}`,`COMPLETED_ITEMS: ${run.items.filter(x=>x.final_state!==null).length}/4`,""];
 run.items.forEach((r,i)=>{out.push(`## ${r.item_id}`,`evidence_layer: practice`, `presented_order: ${r.presented_order}`,`sentence: ${r.sentence}`,`focus_clause: ${r.focus_clause}`,`internal_structure: ${r.internal_structure}`,`correct_relation: ${r.correct_relation}`,`correct_option: ${r.correct_option}`,`initial_answer: ${r.initial_answer??"null"}`,`initial_answer_option: ${r.initial_answer_option??"null"}`,`initial_answer_correct: ${r.initial_answer_correct??"null"}`,`initial_response_time_ms: ${r.initial_response_time_ms??"null"}`,`step1_triggered: ${r.step1_triggered}`,`step1_answer: ${r.step1_answer??"null"}`,`step1_answer_option: ${r.step1_answer_option??"null"}`,`step1_correct_answer: ${r.step1_correct_answer}`,`step1_correct: ${r.step1_correct??"null"}`,`step1_response_time_ms: ${r.step1_response_time_ms??"null"}`,`support_triggered: ${r.support_triggered}`,`support_prompt: ${r.support_prompt}`,`support_options: ${JSON.stringify(r.support_options)}`,`support_correct_answer: ${r.support_correct_answer}`,`support_answer: ${r.support_answer??"null"}`,`support_answer_option: ${r.support_answer_option??"null"}`,`support_correct: ${r.support_correct??"null"}`,`support_response_time_ms: ${r.support_response_time_ms??"null"}`,`recovered_final_answer: ${r.recovered_final_answer??"null"}`,`recovered_final_answer_option: ${r.recovered_final_answer_option??"null"}`,`recovered_final_correct: ${r.recovered_final_correct??"null"}`,`final_answer: ${r.final_answer??"null"}`,`final_correct: ${r.final_correct??"null"}`,`final_state: ${r.final_state??"not_reached"}`,`response_times_ms: ${JSON.stringify(r.response_times_ms)}`);if(i<run.items.length-1)out.push("---")});return out.join("\n")}
async function copyResult(){const text=resultText();try{await navigator.clipboard.writeText(text);document.querySelector("#status").textContent="已复制 ✓"}catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();const ok=document.execCommand("copy");ta.remove();document.querySelector("#status").textContent=ok?"已复制 ✓":"复制未成功，请重试"}}
document.querySelector("#start").onclick=start;
</script>
</body>
</html>
