<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick · 通用交互 Demo</title>
<meta name="apple-mobile-web-app-title" content="Quick">
<link rel="icon" type="image/svg+xml" href="./quick-icon.svg">
<link rel="icon" type="image/png" sizes="180x180" href="./quick-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./quick-icon.png">
<style>
:root{color-scheme:light;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff;--selection:#dce5ff}
*{box-sizing:border-box}body{min-height:100svh;margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;height:100svh;margin:auto;padding:16px;display:flex;flex-direction:column;background:transparent}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:14px}.brand{font-weight:650;color:var(--ink);letter-spacing:.01em}
.progress{height:5px;flex:none;background:#e3e7ee;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--blue);transition:width .2s}
.card{flex:1;min-height:0;background:var(--paper);background-clip:padding-box;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 36px #23304a0b;display:flex;flex-direction:column;overflow:hidden}
.card.done{justify-content:center;align-items:center;text-align:center}
.step-title{font-size:22px;margin:0 0 8px;flex:none}.hint{font-size:15px;color:var(--muted);margin:0 0 18px;flex:none}.text-scroll{min-height:0;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;margin:0;scrollbar-gutter:stable;touch-action:pan-y;-webkit-overflow-scrolling:touch}.text-block{font-size:20px;line-height:1.95;margin:0;overflow-wrap:anywhere;white-space:pre-wrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.char{transition:background-color .08s}.char.selected{background:var(--selection)}
.instruction{font-size:18px;line-height:1.7;margin:24px 0 14px}.options{display:grid;gap:12px}.option{width:100%;min-height:24px;text-align:left;display:flex;align-items:center;gap:15px;padding:12px 16px;border:1.5px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit;cursor:pointer}.option[aria-pressed="true"]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f0f2f6;font-weight:700;font-size:16px}.option[aria-pressed="true"] .letter{background:var(--blue);color:white}
.actions{display:flex;justify-content:flex-end;margin-top:24px;gap:12px;flex-wrap:wrap}.primary,.secondary{min-height:24px;border-radius:11px;padding:11px 22px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.primary{border:0;background:var(--blue);color:white;min-width:140px}.primary:disabled{background:#b9c1d0;cursor:not-allowed}.secondary{border:1px solid var(--line);background:white;color:var(--ink);min-width:112px}
@media(max-width:520px){body{font-size:17px}main{padding:10px}.card{border-radius:16px}.text-block{font-size:19px;line-height:1.95}.option{padding:12px 14px}}
@media (display-mode: standalone){
  main{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);width:auto;height:auto;padding:10px}
}
</style>
</head>
<body>
<main id="app">
  <div class="top"><span class="brand">Quick</span><span id="stepCount">Step 1 / 3</span></div>
  <div class="progress"><div id="progressFill"></div></div>
  <section class="card" id="card"></section>
</main>
<script>
"use strict";
// One small capability config per step; the page frame stays the same.
const steps=[
 {title:"Demo 1｜英文短文本",mode:"single-range",options:null,text:"A quiet paper kite drifted above the little garden while two curious sparrows watched from the fence."},
 {title:"Demo 2｜英文长文本",mode:"multi-range",options:null,text:Array(18).fill("On a bright afternoon, a small blue cart rolled slowly along the path beside the old greenhouse. Its wheels made a soft sound over the stones, and a yellow ribbon fluttered from the handle. Near the gate, a round wooden sign leaned toward a patch of tall grass. A breeze moved through the leaves, carrying the scent of warm soil and fresh paint. Farther down the path, a paper lantern rested on a bench beside three smooth river rocks. Nothing hurried; clouds passed overhead, shadows shifted across the ground, and the cart continued its gentle journey toward the open courtyard.").join(" ")},
 {title:"Demo 3｜中文长文本",mode:"multi-range",options:null,text:Array(18).fill("午后的风从窗边慢慢经过，桌上的纸船轻轻转了半圈。院子里有一棵不高的树，枝叶之间挂着几颗雨滴，阳光照过来时，亮点便在地面上移动。小路旁放着一只木盒，盒盖没有合紧，里面露出蓝色的布带和一枚光滑的石子。远处传来几声鸟鸣，随后又安静下来。云朵缓缓飘过屋顶，墙上的影子变短又变长，纸船仍停在原处，像是在等待下一阵微风。今天没有什么特别的事情发生，只是光线、树叶和空气都在悄悄变化。").join("\n\n")},
 {title:"Demo 4｜纯选项",mode:"off",options:{kind:"single",prompt:"点选一个选项。文本选择能力关闭。",items:["圆形","三角形","方形"]},text:"A red button sat beside a green notebook. The notebook was closed, and a small silver key rested on top."},
 {title:"Demo 5｜文本 + 选项",mode:"single-range",options:{kind:"single",prompt:"在上方文本中拖选一个范围，并在这里选一个选项；两项操作互不依赖。",items:["圆形","三角形","方形"]},text:"A paper boat rested near the edge of a quiet blue pond."}
];
let stepIndex=0,selectionByStep=steps.map(()=>[]),choiceByStep=steps.map(()=>null),submittedByStep=steps.map(()=>null),drag=null;
const card=document.querySelector("#card");
const graphemes=s=>Array.from(s);
function draw(){const step=steps[stepIndex];document.querySelector("#stepCount").textContent=`Step ${stepIndex+1} / ${steps.length}`;document.querySelector("#progressFill").style.width=`${(stepIndex+1)/steps.length*100}%`;card.replaceChildren();
 const h=document.createElement("h1");h.className="step-title";h.textContent=step.title;card.append(h);
 const hint=document.createElement("p");hint.className="hint";hint.textContent=`Text Selection：${step.mode} · Option Selection：${step.options?"single":"off"}`;card.append(hint);
 const scroller=document.createElement("div");scroller.className="text-scroll";const text=document.createElement("p");text.className="text-block";text.setAttribute("aria-label","可选择的示例文本");graphemes(step.text).forEach((ch,i)=>{const span=document.createElement("span");span.className="char";span.dataset.index=i;span.textContent=ch;text.append(span)});scroller.append(text);card.append(scroller);
 if(step.mode!=="off"){text.addEventListener("pointerdown",onDown);text.addEventListener("pointermove",onMove);text.addEventListener("pointerup",onUp);text.addEventListener("pointercancel",onCancel);text.addEventListener("click",onClick);}
 if(step.options){const p=document.createElement("p");p.className="instruction";p.textContent=step.options.prompt;card.append(p);const opts=document.createElement("div");opts.className="options";step.options.items.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed",String(choiceByStep[stepIndex]===i));const mark=document.createElement("span");mark.className="letter";mark.textContent=String.fromCharCode(65+i);const name=document.createElement("span");name.textContent=label;b.append(mark,name);b.onclick=()=>{choiceByStep[stepIndex]=i;draw()};opts.append(b)});card.append(opts)}
 const actions=document.createElement("div");actions.className="actions";actions.style.flex="none";const submit=document.createElement("button");submit.className="primary";submit.textContent="提交";submit.onclick=()=>{const ranges=selectionByStep[stepIndex].map(([a,b])=>graphemes(step.text).slice(a,b+1).join(""));const chosen=choiceByStep[stepIndex];submittedByStep[stepIndex]={textRanges:ranges,optionChoice:chosen===null?null:step.options?.items[chosen]??null};if(stepIndex<steps.length-1){stepIndex++;draw()}else{drawComplete()}};actions.append(submit);card.append(actions);paint();}
function drawComplete(){card.classList.add("done");card.replaceChildren();const title=document.createElement("h1");title.className="step-title";title.textContent="已完成";const button=document.createElement("button");button.className="primary";button.textContent="复制结果";button.addEventListener("click",copyResults);card.append(title,button)}
function formatResults(){return submittedByStep.map((result,i)=>`Step ${i+1}｜textRanges:${JSON.stringify(result?.textRanges??[])}｜optionChoice:${result?.optionChoice===null||result?.optionChoice===undefined?"null":JSON.stringify(result.optionChoice)}`).join("\n")}
async function copyResults(event){const button=event.currentTarget,text=formatResults();let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch{}if(!copied){const field=document.createElement("textarea");field.value=text;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}if(copied){button.textContent="已复制";button.disabled=true;setTimeout(()=>{button.textContent="复制结果";button.disabled=false},1200)}}
function targetIndex(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el||!el.classList.contains("char")||!card.contains(el))return null;return Number(el.dataset.index)}
function onDown(e){if(e.button!==undefined&&e.button!==0)return;const ix=targetIndex(e);if(ix===null)return;const hit=selectionByStep[stepIndex].findIndex(([a,b])=>ix>=a&&ix<=b);drag={pointerId:e.pointerId,start:ix,end:ix,moved:false,remove:hit};if(e.pointerType==="mouse")e.preventDefault();}
function onMove(e){if(!drag||drag.pointerId!==e.pointerId)return;const ix=targetIndex(e);if(ix===null)return;if(ix!==drag.start)drag.moved=true;drag.end=ix;paintPreview()}
function onUp(e){if(!drag||drag.pointerId!==e.pointerId)return;const d=drag;drag=null;if(d.remove>=0&&!d.moved){selectionByStep[stepIndex].splice(d.remove,1)}else if(d.moved){const range=[Math.min(d.start,d.end),Math.max(d.start,d.end)];if(steps[stepIndex].mode==="single-range")selectionByStep[stepIndex]=[range];else selectionByStep[stepIndex].push(range)}paint()}
function onCancel(){drag=null;paint()}
function onClick(e){e.preventDefault()}
function paintPreview(){paint(drag?[Math.min(drag.start,drag.end),Math.max(drag.start,drag.end)]:null)}
function paint(preview=null){card.querySelectorAll(".char").forEach(el=>{const i=Number(el.dataset.index),selected=selectionByStep[stepIndex].some(([a,b])=>i>=a&&i<=b)||(preview&&i>=preview[0]&&i<=preview[1]);el.classList.toggle("selected",!!selected)})}
draw();
</script>
</body>
</html>
