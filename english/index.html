<!doctype html>
<html lang="zh-CN">

<title>English Quick Check</title>
<style>
:root{color-scheme:light;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff;--selection:#e8edff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(960px,100% - 32px);min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:14px}.brand{font-weight:650;color:var(--ink);letter-spacing:.01em}
.progress{height:5px;background:#e3e7ee;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--blue);width:0}
.card{min-height:clamp(300px,calc(100svh - 150px),860px);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,48px);box-shadow:0 12px 36px #23304a0b}
.sentence{font-size:20px;line-height:1.8;white-space:pre-wrap;margin:0 0 20px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.token{display:inline;padding:3px 0;border-radius:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.token.selected{background:var(--selection)}
.instruction{font-size:18px;line-height:1.7;margin:0 0 22px}.options{display:grid;gap:12px}.option{width:100%;min-height:48px;text-align:left;display:flex;align-items:center;gap:15px;padding:12px 16px;border:1.5px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit;cursor:pointer}.option[aria-pressed="true"]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f0f2f6;font-weight:700;font-size:16px}.option[aria-pressed="true"] .letter{background:var(--blue);color:white}
.actions{display:flex;justify-content:flex-end;margin-top:24px;gap:12px;flex-wrap:wrap}.primary,.secondary{min-height:48px;border-radius:11px;padding:11px 22px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.primary{border:0;background:var(--blue);color:white;min-width:140px}.primary:disabled{background:#b9c1d0;cursor:not-allowed}.secondary{border:1px solid var(--line);background:white;color:var(--ink);min-width:112px}
.intro,.done{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.intro h1,.done h1{font-size:32px;line-height:1.2;margin:0 0 12px}.intro p,.done p{color:var(--muted);margin:0 0 26px}.copy-status{min-height:28px;color:var(--muted);font-size:15px;margin-top:12px!important}
.question{font-size:19px;line-height:1.7;margin:0 0 18px}.text-answer{display:block;width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);background:white}
@media(max-width:520px){body{font-size:17px}main{width:min(100% - 20px,760px)}.card{border-radius:16px;padding:24px 18px}.top{margin-bottom:12px}.sentence{font-size:20px;line-height:1.8}.option{padding:12px 14px}}
</style>
</head>

function loadRun(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return null;const value=JSON.parse(raw);return value.batch_id===BATCH_ID&&!value.completed_at?value:null}catch(e){return null}}
function record(i=coreIndex){return run.items[i]}
function qdata(i=coreIndex){return allItems[i]}
function header(label,pct){return `<div class="top"><span class="brand">English Quick Check</span><span>${label||""}</span></div><div class="progress" aria-hidden="true"><div style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>`}
function shell(label,pct){app.className="";app.innerHTML=`${header(label,pct)}<section class="card" id="card"></section>`;return app.querySelector("#card")}
function showLanding(){app.className="center";app.innerHTML=`<section class="card intro"><h1>English Quick Check</h1><p>Look at each sentence and follow the prompts.</p><button id="start" class="primary">Start</button></section>`;app.querySelector("#start").onclick=startRun}
function startRun(){run={batch_id:BATCH_ID,batch_version:BATCH_VERSION,run_id:"run-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),started_at:timestamp(),started_ms:Date.now(),completed_at:null,completed_ms:null,total_duration_ms:null,completed_normally:false,total_items:allItems.length,completed_item_count:0,completed_core_items:0,core_role_initial_correct_count:0,core_role_initial_total:6,diagnosis_triggered_items:[],diagnosis_planned_items:[],diagnosis_cursor:0,teaching_triggered:false,teaching_transfer_completed:false,batch_final_state:"incomplete",current_core_index:0,current_stage:"core",path_check:null,items:[...core.map((q,i)=>makeRecord(q,i)),...continuousPractice.map((q,i)=>makeContinuousRecord(q,i+core.length))]};coreIndex=0;diagnosisQueue=[];diagnosisIndex=0;stage="attention";persist();showAttention(true)}
function renderSentenceTokens(container,sentence){container.className="sentence";container.setAttribute("aria-label",sentence);const re=/\S+|\s+/g;let match,tokenIndex=0;while((match=re.exec(sentence))){const text=match[0];if(/^\s+$/.test(text)){container.append(document.createTextNode(text));continue}const span=document.createElement("span");span.className="token";span.dataset.start=String(match.index);span.dataset.end=String(match.index+text.length);span.dataset.token=String(tokenIndex++);span.textContent=text;container.append(span)}return tokenIndex}
function applyHighlight(){const card=document.querySelector("#card");if(!card||!run)return;const r=record();const start=stage==="attention"?r._working_attention_start:r.initial_attention_start;const end=stage==="attention"?r._working_attention_end:r.initial_attention_end;card.querySelectorAll(".token").forEach(t=>{const a=Number(t.dataset.start),b=Number(t.dataset.end);t.classList.toggle("selected",start!==null&&start!==undefined&&end!==null&&end!==undefined&&a<end&&b>start)})}
function showAttention(isNew=false){const r=record();stage="attention";run.current_stage=coreIndex<core.length?"core":"continuous_practice";run.current_core_index=coreIndex;if(coreIndex<core.length)r.core_stage="attention_unconfirmed";else r.practice_stage="attention_unconfirmed";if(isNew||!r.attention_screen_shown_at){r.attention_screen_shown_at=timestamp();attentionStartMs=Date.now();r._attention_screen_shown_ms=attentionStartMs}else{attentionStartMs=Date.now();r.attention_screen_shown_at=timestamp();r._attention_screen_shown_ms=attentionStartMs}anchorToken=null;persist();const card=shell(`${coreIndex+1} / ${allItems.length}`,coreIndex/allItems.length*100);const sentence=document.createElement("div");sentence.id="sentence";renderSentenceTokens(sentence,r.sentence);card.append(sentence);const instruction=document.createElement("p");instruction.className="instruction";instruction.textContent="请选择你第一眼看的部分，或者你最初用来判断的部分，可以直接点题面。";card.append(instruction);const actions=document.createElement("div");actions.className="actions";actions.innerHTML='<button class="secondary" id="reset">重选</button><button class="primary" id="confirm" disabled>确认</button>';card.append(actions);card.querySelector("#sentence").addEventListener("click",onTokenClick);card.querySelector("#reset").onclick=()=>{anchorToken=null;r._working_attention_start=null;r._working_attention_end=null;applyHighlight();card.querySelector("#confirm").disabled=true};card.querySelector("#confirm").onclick=confirmAttention}

function confirmAttention(){const r=record();if(r._working_attention_start===null||r._working_attention_end===null)return;const start=r._working_attention_start,end=r._working_attention_end,selection=r.sentence.slice(start,end);if(!selection)return;r.initial_attention_selection=selection;r.initial_attention_start=start;r.initial_attention_end=end;r.attention_selection_confirmed_at=timestamp();r._attention_selection_confirmed_ms=Date.now();r.attention_selection_response_time_ms=Math.max(0,Date.now()-r._attention_screen_shown_ms);run.current_stage=coreIndex<core.length?"core":"continuous_practice";run.current_core_index=coreIndex;if(coreIndex<core.length){r.core_stage="attention_confirmed_role_pending";persist();stage="role";showRole(true)}else{r.practice_stage="attention_confirmed_answer_pending";persist();showPracticeAnswer()}}

function submitRole(){if(!selectedRole)return;const r=record(),choice=selectedRole;r.initial_role_answer=choice.value;r.initial_role_answer_option=choice.option;persist();r.initial_role_answer_correct=choice.value===r.correct_role_answer;r.initial_role_answer_response_time_ms=Math.max(0,Date.now()-Number(r._role_answer_shown_ms||Date.now()));r.response_times_ms.role_initial=r.initial_role_answer_response_time_ms;r.core_stage="role_submitted";run.completed_core_items=run.items.filter(x=>x.core_stage==="role_submitted").length;run.core_role_initial_correct_count=run.items.filter(x=>x.initial_role_answer_correct===true).length;persist();advanceCore()}

function submitPracticeAnswer(){const r=record(),card=document.querySelector("#card"),choice=card&&card._selected;if(!choice||r.practice_answer_submitted)return;r.initial_answer=choice.value;r.initial_answer_option=choice.option;persist();r.initial_answer_correct=choice.value===r.correct_answer;r.initial_answer_response_time_ms=Math.max(0,Date.now()-Number(r._answer_shown_ms||Date.now()));r.response_times_ms.answer_initial=r.initial_answer_response_time_ms;r.practice_answer_submitted=true;r.practice_stage="answer_submitted";run.completed_item_count=run.items.filter(x=>x.initial_role_answer!==null||x.practice_answer_submitted===true).length;persist();advanceCore()}
function advanceCore(){const current=record();if(coreIndex<core.length){if(current.core_stage!=="role_submitted")return}else if(current.practice_answer_submitted!==true)return;run.completed_item_count=run.items.filter(x=>x.initial_role_answer!==null||x.practice_answer_submitted===true).length;if(coreIndex<core.length-1){coreIndex++;run.current_core_index=coreIndex;run.current_stage="core";record().core_stage="attention_unconfirmed";persist();showAttention(true);return}if(coreIndex<allItems.length-1){if(coreIndex===core.length-1)run.completed_core_items=core.length;coreIndex++;run.current_core_index=coreIndex;run.current_stage="continuous_practice";record().practice_stage="attention_unconfirmed";persist();showAttention(true);return}run.completed_core_items=core.length;finish("continuous_practice_completed")}
function routeAfterCore(){run.completed_core_items=6;run.core_role_initial_correct_count=run.items.filter(x=>x.initial_role_answer_correct===true).length;persist();const errors=run.items.filter(x=>x.initial_role_answer_correct===false).map(x=>x.item_id);run.diagnosis_planned_items=errors.slice();run.diagnosis_triggered_items=[];run.diagnosis_cursor=0;if(errors.length===0){finish("core_complete_no_diagnosis");return}diagnosisQueue=errors;diagnosisIndex=0;run.current_stage="diagnosis";persist();beginDiagnosis()}
function normalizeAnswer(s){return String(s||"").trim().replace(/[\p{P}]+$/gu,"").replace(/\s+/g," ").toLocaleLowerCase()}
function acceptedCompleteAnswer(answer,q){const value=normalizeAnswer(answer);return q.accepted_complete_answers.some(x=>normalizeAnswer(x)===value)}
function beginDiagnosis(){if(diagnosisIndex>=diagnosisQueue.length){finish("diagnosis_completed");return}const id=diagnosisQueue[diagnosisIndex],i=core.findIndex(x=>x.item_id===id),r=run.items[i];coreIndex=i;run.current_core_index=i;run.current_stage="diagnosis";if(r.diagnosis_stage==="diagnosis_done"){if(r.teaching_triggered){run.current_stage="teaching";persist();showTeaching()}else nextDiagnosis();return}if(!r.diagnosis_triggered){r.diagnosis_triggered=true;r.support_triggered=true;r.diagnosis_stage="complete_sentence_pending";persist()}if(r.diagnosis_stage==="reduced_role_pending"){showReducedClauseDiagnosis();return}showCompleteSentenceDiagnosis();if(!run.diagnosis_triggered_items.includes(id)){run.diagnosis_triggered_items.push(id);persist()}}
function showCompleteSentenceDiagnosis(){const q=qdata(),r=record();stage="complete_sentence";run.current_stage="diagnosis";r.diagnosis_stage="complete_sentence_pending";r.complete_sentence_prompt=q.complete_question;const card=shell(`诊断 ${diagnosisIndex+1} / ${diagnosisQueue.length}`,100);const sentence=document.createElement("p");sentence.className="sentence";sentence.textContent=q.complete_sentence;card.append(sentence);const question=document.createElement("p");question.className="question";question.textContent=q.complete_question;card.append(question);const input=document.createElement("input");input.className="text-answer";input.type="text";input.autocomplete="off";input.setAttribute("aria-label",q.complete_question);card.append(input);const actions=document.createElement("div");actions.className="actions";actions.innerHTML='<button class="primary" id="submit">提交</button>';card.append(actions);shownPerf=Date.now();input.focus();card.querySelector("#submit").onclick=submitCompleteAnswer;input.onkeydown=e=>{if(e.key==="Enter")submitCompleteAnswer()}}
function submitCompleteAnswer(){const r=record(),q=qdata(),answer=document.querySelector(".text-answer").value;r.complete_sentence_answer=answer;persist();r.complete_sentence_correct=acceptedCompleteAnswer(answer,q);r.complete_sentence_response_time_ms=Math.max(0,Date.now()-shownPerf);r.response_times_ms.complete_sentence=r.complete_sentence_response_time_ms;r.diagnosis_stage="reduced_role_pending";run.current_stage="diagnosis";persist();showReducedClauseDiagnosis()}
function showReducedClauseDiagnosis(){const q=qdata(),r=record();stage="reduced_role";const card=shell(`诊断 ${diagnosisIndex+1} / ${diagnosisQueue.length}`,100);const clause=document.createElement("p");clause.className="sentence";clause.textContent=q.reduced_clause;card.append(clause);const question=document.createElement("p");question.className="instruction";question.textContent=`在这部分里，${q.target_phrase} 是：`;card.append(question);renderRoleOptions(card,choice=>{r.reduced_clause_role_answer=choice.value;r.reduced_clause_role_option=choice.option;persist();r.reduced_clause_role_correct=choice.value===q.correct_role_answer;r.reduced_clause_role_response_time_ms=Math.max(0,Date.now()-shownPerf);r.response_times_ms.reduced_clause_role=r.reduced_clause_role_response_time_ms;r.diagnosis_stage="diagnosis_done";if(r.reduced_clause_role_correct){r.final_state=r.complete_sentence_correct?"prompted_recovery":"scaffolded_recovery";run.current_stage="diagnosis"}else{r.teaching_triggered=true;run.teaching_triggered=true;run.current_stage="teaching"}persist();if(r.reduced_clause_role_correct)nextDiagnosis();else showTeaching()});shownPerf=Date.now()}
function renderRoleOptions(card,onChoose){const options=document.createElement("div");options.className="options";roleOptions.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed","false");b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.querySelector("span:last-child").textContent=label;b.onclick=()=>{options.querySelectorAll(".option").forEach((x,j)=>x.setAttribute("aria-pressed",String(j===i)));card.querySelector("#submit").disabled=false;card._selected={value:label,option:String.fromCharCode(65+i)}};options.append(b)});card.append(options);const actions=document.createElement("div");actions.className="actions";actions.innerHTML='<button class="primary" id="submit" disabled>提交</button>';card.append(actions);card.querySelector("#submit").onclick=()=>{if(card._selected)onChoose(card._selected)};return options}
function nextDiagnosis(){diagnosisIndex++;run.diagnosis_cursor=diagnosisIndex;persist();beginDiagnosis()}
function showTeaching(){stage="teaching";run.current_stage="teaching";const card=shell("",100);const p=document.createElement("p");p.className="instruction";p.style.whiteSpace="pre-line";p.textContent="一句话里，发出动作的那个位置叫主语位置。\n动作指向、作用到的那个位置叫宾语位置。\n\n___ called Mia\n\n这里少掉的人在做 call Mia 这个动作，所以这是主语位置。\n\nMia called ___\n\nMia 发出 call，这里少掉的人是动作落到的人，所以这是宾语位置。";card.append(p);const actions=document.createElement("div");actions.className="actions";actions.innerHTML='<button class="primary" id="continue">继续</button>';card.append(actions);card.querySelector("#continue").onclick=()=>{transferIndex=0;run.current_stage="teaching_transfer";persist();showTransfer()}}
function showTransfer(){stage="teaching_transfer";const transfer=transfers[transferIndex],card=shell(`${transferIndex+1} / 2`,transferIndex/2*100);const sentence=document.createElement("p");sentence.className="sentence";sentence.textContent=transfer.sentence;card.append(sentence);const question=document.createElement("p");question.className="instruction";question.textContent=`在后半句里，${transfer.target_phrase} 是：`;card.append(question);shownPerf=Date.now();renderRoleOptions(card,choice=>{const r=record(),n=transferIndex+1;r[`teaching_transfer_${n}_answer`]=choice.value;persist();r[`teaching_transfer_${n}_correct`]=choice.value===transfer.correct;r[`teaching_transfer_${n}_response_time_ms`]=Math.max(0,Date.now()-shownPerf);r.response_times_ms[`teaching_transfer_${n}`]=r[`teaching_transfer_${n}_response_time_ms`];if(n===2){r.final_state=(r.teaching_transfer_1_correct&&r.teaching_transfer_2_correct)?"taught_recovery":"unresolved";run.teaching_transfer_completed=true;persist();finish("teaching_completed")}else{transferIndex=1;persist();showTransfer()}})}
function finish(state){for(const r of run.items){if(r.initial_role_answer_correct===true)r.final_state="direct_success";else if(r.initial_role_answer_correct===false&&r.final_state===null)r.final_state="unresolved"}run.completed_at=timestamp();run.completed_ms=Date.now();run.total_duration_ms=run.completed_ms-run.started_ms;run.completed_normally=run.completed_core_items===core.length&&run.completed_item_count===allItems.length;run.batch_final_state=state;run.current_stage="complete";persist();showDone()}
function resultText(){return `# English Quick Check｜执行记录\n\n${JSON.stringify(run,null,2)}`}
function showDone(){app.className="center";app.innerHTML=`<section class="card done"><h1>完成啦。</h1><div class="actions" style="justify-content:center"><button class="primary" id="copy">复制结果</button><button class="secondary" id="save">保存结果</button></div><p class="copy-status" id="status" aria-live="polite"></p></section>`;app.querySelector("#copy").onclick=copyResult;app.querySelector("#save").onclick=saveResult}
async function copyResult(){const text=resultText();try{await navigator.clipboard.writeText(text);document.querySelector("#status").textContent="已复制 ✓"}catch(e){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.append(t);t.select();const ok=document.execCommand("copy");t.remove();document.querySelector("#status").textContent=ok?"已复制 ✓":"复制未成功，请重试"}}
function saveResult(){const blob=new Blob([resultText()],{type:"text/markdown;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${BATCH_ID}_${run.run_id}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector("#status").textContent="已保存"}
function resume(){const saved=loadRun();if(!saved){showLanding();return}run=saved;coreIndex=Number(run.current_core_index)||0;diagnosisQueue=run.diagnosis_planned_items||run.diagnosis_triggered_items||[];diagnosisIndex=Number(run.diagnosis_cursor)||0;if(run.current_stage==="complete"){showLanding();return}if(run.current_stage==="teaching_transfer"){stage="teaching_transfer";transferIndex=run.items[coreIndex].teaching_transfer_1_answer!==null?1:0;showTransfer();return}if(run.current_stage==="teaching"){showTeaching();return}if(run.current_stage==="diagnosis"){diagnosisIndex=Number(run.diagnosis_cursor)||0;beginDiagnosis();return}if(run.current_stage==="core"||run.current_stage==="continuous_practice"){const r=record();if(coreIndex<core.length){if(r.core_stage==="role_submitted"){if(coreIndex<core.length-1){coreIndex++;run.current_core_index=coreIndex;showAttention(true)}else{coreIndex++;run.current_core_index=coreIndex;run.completed_core_items=core.length;showAttention(true)}return}if(r.core_stage==="attention_confirmed_role_pending"){showRole(false);return}}else{if(r.practice_answer_submitted){if(coreIndex<allItems.length-1){coreIndex++;run.current_core_index=coreIndex;showAttention(true)}else finish("continuous_practice_completed");return}if(r.practice_stage==="attention_confirmed_answer_pending"||r.practice_stage==="answer_pending"){showPracticeAnswer();return}}showAttention(true);return}showLanding()}
resume();
</script>
