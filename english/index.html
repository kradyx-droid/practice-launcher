<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quick Check</title>
<style>
:root{color-scheme:light;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(960px,100% - 32px);min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:14px}.brand{font-weight:650;color:var(--ink);letter-spacing:.01em}
.progress{height:5px;background:#e3e7ee;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--blue);width:0;transition:none}
.card{height:clamp(260px,calc(100svh - 150px),860px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,48px);box-shadow:0 12px 36px #23304a0b}
.prompt{font-size:clamp(20px,3vw,20px);line-height:1.65;margin:0 0 26px;white-space:pre-line}.options{display:grid;gap:12px}.option{width:100%;text-align:left;display:flex;align-items:flex-start;gap:15px;padding:15px 18px;border:1.5px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit;cursor:pointer;white-space:pre-line;transition:none}.option:hover{border-color:#9aabe6}.option[aria-pressed="true"]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f0f2f6;font-weight:700;font-size:16px}.option[aria-pressed="true"] .letter{background:var(--blue);color:white}
.actions{display:flex;justify-content:flex-end;margin-top:24px}.primary{border:0;border-radius:11px;background:var(--blue);color:white;padding:13px 25px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;min-width:134px}.primary:disabled{background:#b9c1d0;cursor:not-allowed}.intro{text-align:center}.intro h1,.done h1{font-size:32px;line-height:1.2;margin:0 0 12px}.intro p,.done p{color:var(--muted);margin:0 0 26px}.center{justify-content:center}.center .primary{align-self:center;min-width:160px}.center .card{display:flex;flex-direction:column;justify-content:center}.done{text-align:center}.done .primary{min-width:160px}.copy-status{min-height:28px;color:var(--muted);font-size:15px;margin-top:12px!important}.hint{color:var(--muted);font-size:14px;margin-top:14px;text-align:center}
@media(max-width:520px){body{font-size:17px}main{width:min(100% - 20px,760px)}.card{border-radius:16px;padding:24px 18px}.top{margin-bottom:12px}.option{padding:13px 14px}}
.stop-button{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:#697586;border:0;background:transparent;text-decoration:underline;cursor:pointer;padding:2px 6px}.feedback{white-space:pre-line;font-size:clamp(20px,3vw,20px);line-height:1.65;margin:0 0 24px}.phase-label{color:#697586;font-size:14px;margin:0 0 10px}.step-copy{white-space:pre-line;margin:0 0 18px}
</style>
</head>
<body>
<main id="app" class="center">
  <section class="card intro" aria-labelledby="title">
    <h1 id="title">English Quick Check</h1>
    <p>选一个最合适的关系词。</p>
    <button id="start" class="primary">开始</button>
  </section>
</main>
<script>
"use strict";
const batch={batch_id:"RELATIVE_SLOT_BRIDGE_PRACTICE_V3",version:"3.0"};
const items=[
 {item_id:"P01",sentence:"I remember the summer ___ we moved to Singapore.",focus:"we moved to Singapore",structure:"complete",correct:"B",pathCheck:false,recovery:{deepText:"We moved to Singapore.\n\n这句话自己能不能站住？",deepOptions:["能","不能"],deepCorrect:"A"},surface_lure:"summer → when"},
 {item_id:"P02",sentence:"This is the park ___ we visited after school.",focus:"we visited after school",structure:"missing",correct:"A",pathCheck:true,recovery:{deepText:"把前面的东西放回来：\n\nWe visited the park after school.\n\n再拿掉：\n\nWe visited ___ after school.\n\n这里还缺不缺东西？",deepOptions:["缺一个东西","不缺"],deepCorrect:"A"},surface_lure:"park → where",special_observation:"visit slot"},
 {item_id:"P03",sentence:"This is the apartment ___ they stayed for two weeks.",focus:"they stayed for two weeks",structure:"complete",correct:"C",pathCheck:false,recovery:{deepText:"They stayed for two weeks.\n\n这句话自己能不能站住？",deepOptions:["不能","能"],deepCorrect:"B"},surface_lure:"apartment → where",special_observation:"stay optional place complement"},
 {item_id:"P04",sentence:"That was the night ___ I will never forget.",focus:"I will never forget",structure:"missing",correct:"A",pathCheck:false,recovery:{deepText:"把前面的东西放回来：\n\nI will never forget the night.\n\n再拿掉：\n\nI will never forget ___.\n\n这里还缺不缺东西？",deepOptions:["不缺","缺一个东西"],deepCorrect:"B"},surface_lure:"night → when",special_observation:"forget slot"},
 {item_id:"P05",sentence:"This is the park ___ we met after school.",focus:"we met after school",structure:"complete",correct:"C",pathCheck:false,recovery:{deepText:"We met after school.\n\n这句话自己能不能站住？",deepOptions:["不能","能"],deepCorrect:"B"},surface_lure:"park → where"},
 {item_id:"P06",sentence:"I remember the summer ___ we spent with my grandparents.",focus:"we spent with my grandparents",structure:"missing",correct:"A",pathCheck:false,recovery:{deepText:"把前面的东西放回来：\n\nWe spent the summer with my grandparents.\n\n再拿掉：\n\nWe spent ___ with my grandparents.\n\n这里还缺不缺东西？",deepOptions:["不缺","缺一个东西"],deepCorrect:"B"},surface_lure:"summer → when"},
 {item_id:"P07",sentence:"Do you remember the day ___ we arrived in Beijing?",focus:"we arrived in Beijing",structure:"complete",correct:"B",pathCheck:true,recovery:{deepText:"We arrived in Beijing.\n\n这句话自己能不能站住？",deepOptions:["能","不能"],deepCorrect:"A"},surface_lure:"day → when"},
 {item_id:"P08",sentence:"This is the village ___ my grandfather grew up in.",focus:"my grandfather grew up in",structure:"missing",correct:"A",pathCheck:false,recovery:{deepText:"把前面的东西放回来：\n\nMy grandfather grew up in the village.\n\n再拿掉：\n\nMy grandfather grew up in ___.\n\n这里还缺不缺东西？",deepOptions:["缺一个东西","不缺"],deepCorrect:"A"},surface_lure:"village → where",contrast_pair_id:"VILLAGE_01"},
 {item_id:"P09",sentence:"This is the apartment ___ they rented for two weeks.",focus:"they rented for two weeks",structure:"missing",correct:"A",pathCheck:false,recovery:{deepText:"把前面的东西放回来：\n\nThey rented the apartment for two weeks.\n\n再拿掉：\n\nThey rented ___ for two weeks.\n\n这里还缺不缺东西？",deepOptions:["不缺","缺一个东西"],deepCorrect:"B"},surface_lure:"apartment → where"},
 {item_id:"P10",sentence:"That was the night ___ the power went out.",focus:"the power went out",structure:"complete",correct:"B",pathCheck:false,recovery:{deepText:"The power went out.\n\n这句话自己能不能站住？",deepOptions:["能","不能"],deepCorrect:"A"},surface_lure:"night → when"},
 {item_id:"P11",sentence:"This is the village ___ my grandfather grew up.",focus:"my grandfather grew up",structure:"complete",correct:"C",pathCheck:true,recovery:{deepText:"My grandfather grew up.\n\n这句话自己能不能站住？",deepOptions:["不能","能"],deepCorrect:"B"},surface_lure:"village → where",contrast_pair_id:"VILLAGE_01"},
 {item_id:"P12",sentence:"Do you remember the day ___ we picked for the picnic?",focus:"we picked for the picnic",structure:"missing",correct:"A",pathCheck:false,recovery:{deepText:"把前面的东西放回来：\n\nWe picked the day for the picnic.\n\n再拿掉：\n\nWe picked ___ for the picnic.\n\n这里还缺不缺东西？",deepOptions:["缺一个东西","不缺"],deepCorrect:"A"},surface_lure:"day → when"}
];
const relationOptions=["which","when","where"];
const pathOptions=["主要看前面的时间 / 地点词","先看后半句自己完整不完整、有没有缺东西","主要凭感觉 / 说不清"];
const app=document.querySelector("#app"),letters=["A","B","C","D"];
let run=null,index=0,stage="start",selected=null,shownAt=0;
const iso=()=>new Date().toISOString();
function makeRecord(q,i){return {item_id:q.item_id,presented_order:i+1,sentence:q.sentence,focus_clause:q.focus,internal_structure:q.structure,correct_relation_answer:q.correct,relation_options:relationOptions.slice(),path_check_target_answer:q.pathCheck?"B":null,step1_recovery_correct_answer:q.structure==="complete"?"A":"B",recovery_relation_correct_answer:q.correct,deeper_structure_recovery_correct_answer:q.recovery.deepCorrect,surface_lure:q.surface_lure,special_observation:q.special_observation??null,contrast_pair_id:q.contrast_pair_id??null,path_check_item:q.pathCheck,initial_relation_answer:null,initial_answer_correct:null,initial_response_time_ms:null,path_check_triggered:false,path_check_answer:null,autonomous_path_confirmed:q.pathCheck?null:"not sampled",target_path_correct:"not sampled",step1_recovery_triggered:false,step1_recovery_first_answer:null,step1_recovery_first_correct:null,deeper_structure_recovery_triggered:false,deeper_structure_recovery_prompt:q.recovery.deepText,deeper_structure_recovery_options:q.recovery.deepOptions.slice(),deeper_structure_recovery_answer:null,deeper_structure_recovery_correct:null,step1_reconfirmed_answer:null,step1_reconfirmed_correct:null,recovery_relation_answer:null,recovery_relation_correct:null,final_relation_answer:null,final_answer_correct:null,initial_answer_correct_target_path_not_confirmed:false,final_state:null,stop_triggered:false,stop_reason:null,response_times_ms:{}}}
function item(){return items[index]}function rec(){return run.items[index]}
function header(){return `<div class="top"><span class="brand">English Quick Check</span><span>${index+1} / 12</span><button class="stop-button" id="stopRun">停止本轮</button></div><div class="progress" aria-hidden="true"><div style="width:${index/12*100}%"></div></div>`}
function renderOptions(options){const wrap=document.createElement("div");wrap.className="options";options.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed","false");b.innerHTML=`<span class="letter">${letters[i]}</span><span></span>`;b.querySelector("span:last-child").textContent=label;b.onclick=()=>{selected=letters[i];wrap.querySelectorAll(".option").forEach((x,j)=>x.setAttribute("aria-pressed",String(letters[j]===selected)));document.querySelector("#submit").disabled=false};wrap.append(b)});return wrap}
function renderChoice(label,copy,options,mode,withSentence=true){stage=mode;selected=null;shownAt=performance.now();const q=item();app.className="";app.innerHTML=`${header()}<section class="card">${withSentence?'<p class="prompt" id="sentence"></p>':''}<p class="phase-label" id="phase"></p><p class="step-copy" id="copy"></p><div id="answers"></div><div class="actions"><button class="primary" id="submit" disabled>提交</button></div></section>`;if(withSentence)app.querySelector("#sentence").textContent=q.sentence;app.querySelector("#phase").textContent=label;app.querySelector("#copy").textContent=copy;app.querySelector("#answers").append(renderOptions(options));document.querySelector("#submit").onclick=submitAnswer;wireStop()}
function showInitial(){renderChoice("","",relationOptions,"initial",true);app.querySelector("#phase").remove();app.querySelector("#copy").remove()}
function showStep1(reconfirm=false){const q=item();renderChoice("Recovery Step 1",`只看 ${q.focus}。\n它本身是：`,["完整","缺一个东西"],reconfirm?"step1_reconfirm":"step1_recovery",false)}
function showDeepRecovery(){const q=item();renderChoice("结构 Recovery",q.recovery.deepText,q.recovery.deepOptions,"deep_recovery",false)}
function showPathCheck(){renderChoice("","你刚才主要是怎么判断的？",pathOptions,"path_check",false)}
function showRecoveryRelation(){renderChoice("","",relationOptions,"recovery_relation",true);app.querySelector("#phase").remove();app.querySelector("#copy").remove()}
function wireStop(){const b=document.querySelector("#stopRun");if(b)b.onclick=manualStop}
function showFeedback(message,buttonText,onContinue){stage="feedback";app.className="";app.innerHTML=`${header()}<section class="card"><p class="feedback"></p><div class="actions"><button class="primary" id="next">${buttonText}</button></div></section>`;app.querySelector(".feedback").textContent=message;document.querySelector("#next").onclick=onContinue;wireStop()}
function start(){run={batch_id:batch.batch_id,batch_version:batch.version,run_id:"run-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),started_at:iso(),started_ms:Date.now(),completed_at:null,completed_ms:null,completed_normally:false,stop_triggered:false,stop_reason:null,items:items.map(makeRecord)};index=0;showInitial()}
function logTime(key){rec().response_times_ms[key]=Math.round(performance.now()-shownAt)}
function submitAnswer(){if(!selected)return;const q=item(),r=rec(),answer=selected,elapsed=Math.round(performance.now()-shownAt);document.querySelector("#submit").disabled=true;document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(stage==="initial"){r.initial_relation_answer=answer;r.initial_answer_correct=answer===q.correct;r.initial_response_time_ms=elapsed;logTime("initial_relation");if(!r.initial_answer_correct){beginStep1();return}if(q.pathCheck){r.path_check_triggered=true;showPathCheck();return}r.final_relation_answer=answer;r.final_answer_correct=true;r.target_path_correct="not sampled";r.final_state="direct success";showFeedback("对。","下一题",advance);return}
 if(stage==="path_check"){r.path_check_answer=answer;logTime("path_check");r.autonomous_path_confirmed=answer==="B";r.target_path_correct=answer==="B";if(answer==="B"){r.final_relation_answer=r.initial_relation_answer;r.final_answer_correct=true;r.final_state="direct success / path confirmed";showFeedback("对。","下一题",advance);return}r.initial_answer_correct_target_path_not_confirmed=true;beginStep1();return}
 if(stage==="step1_recovery"){r.step1_recovery_first_answer=answer;r.step1_recovery_first_correct=answer===(q.structure==="complete"?"A":"B");logTime("step1_recovery_first");if(r.step1_recovery_first_correct){showRecoveryRelation();return}r.deeper_structure_recovery_triggered=true;showDeepRecovery();return}
 if(stage==="deep_recovery"){r.deeper_structure_recovery_answer=answer;r.deeper_structure_recovery_correct=answer===q.recovery.deepCorrect;logTime("deeper_structure_recovery");if(!r.deeper_structure_recovery_correct){markUnresolved();return}showStep1(true);return}
 if(stage==="step1_reconfirm"){r.step1_reconfirmed_answer=answer;r.step1_reconfirmed_correct=answer===(q.structure==="complete"?"A":"B");logTime("step1_reconfirm");if(!r.step1_reconfirmed_correct){markUnresolved();return}showRecoveryRelation();return}
 if(stage==="recovery_relation"){r.recovery_relation_answer=answer;r.recovery_relation_correct=answer===q.correct;r.final_relation_answer=answer;r.final_answer_correct=r.recovery_relation_correct;logTime("recovery_relation");if(!r.recovery_relation_correct){markUnresolved();return}setRecoveredState();showFeedback("对。","下一题",advance)}
}
function beginStep1(){rec().step1_recovery_triggered=true;showStep1(false)}
function setRecoveredState(){const r=rec();if(r.path_check_item&&r.initial_answer_correct){r.final_state="answer correct / path not confirmed → recovered";r.target_path_correct=false;r.initial_answer_correct_target_path_not_confirmed=true;return}r.final_state=r.deeper_structure_recovery_triggered?"wrong → structure recovery recovered":"wrong → Step1 recovered";if(r.path_check_item&&!r.initial_answer_correct){r.target_path_correct="not sampled";r.autonomous_path_confirmed="not sampled"}else{r.target_path_correct="not sampled"}}
function markUnresolved(){const r=rec();r.final_state="unresolved";if(r.recovery_relation_answer!==null){r.final_relation_answer=r.recovery_relation_answer;r.final_answer_correct=r.recovery_relation_correct}else{r.final_relation_answer=r.initial_relation_answer;r.final_answer_correct=r.initial_answer_correct}advance()}
function advance(){if(index>=items.length-1){complete();return}index++;showInitial()}
function manualStop(){const reason=prompt("停止原因：\n1. guessing_mode\n2. engagement_breakdown\n3. needs_dialogue_diagnosis\n4. recovery_insufficient","4");const map={"1":"guessing_mode","2":"engagement_breakdown","3":"needs_dialogue_diagnosis","4":"recovery_insufficient"};if(!map[reason])return;run.stop_triggered=true;run.stop_reason=map[reason];run.stopped_at=iso();run.stopped_ms=Date.now();run.completed_normally=false;rec().stop_triggered=true;rec().stop_reason=map[reason];finishPage()}
function complete(){run.completed_at=iso();run.completed_ms=Date.now();run.completed_normally=true;finishPage()}
function finishPage(){app.className="center";app.innerHTML=`<section class="card done"><h1>本轮记录已完成</h1><p>请把结果交回分析</p><button class="primary" id="copy">复制结果</button><p class="copy-status" id="status" aria-live="polite"></p></section>`;document.querySelector("#copy").onclick=copyResult}
function resultText(){const ended=run.completed_ms??run.stopped_ms??Date.now(),out=["# Relative Slot Bridge Practice V3｜执行记录","",`BATCH_ID: ${run.batch_id}`,`BATCH_VERSION: ${run.batch_version}`,`RUN_ID: ${run.run_id}`,`STARTED_AT: ${run.started_at}`,`COMPLETED_AT: ${run.completed_at||run.stopped_at||"未完成"}`,`TOTAL_DURATION_MS: ${ended-run.started_ms}`,`COMPLETED_NORMALLY: ${run.completed_normally}`,`STOP_TRIGGERED: ${run.stop_triggered}`,`STOP_REASON: ${run.stop_reason||"none"}`,`COMPLETED_ITEMS: ${run.items.filter(x=>x.final_state!==null).length}/12`,""];
 run.items.forEach((r,i)=>{out.push(`## ${r.item_id}`,`presented_order: ${r.presented_order}`,`sentence: ${r.sentence}`,`focus_clause: ${r.focus_clause}`,`internal_structure: ${r.internal_structure}`,`surface_lure: ${r.surface_lure}`,`special_observation: ${r.special_observation??"null"}`,`contrast_pair_id: ${r.contrast_pair_id??"null"}`,`initial_relation_answer: ${r.initial_relation_answer??"null"}`,`initial_answer_correct: ${r.initial_answer_correct??"null"}`,`initial_response_time_ms: ${r.initial_response_time_ms??"null"}`,`path_check_item: ${r.path_check_item}`,`path_check_target_answer: ${r.path_check_target_answer??"null"}`,`path_check_triggered: ${r.path_check_triggered}`,`path_check_options: ${r.path_check_item?JSON.stringify(pathOptions):"null"}`,`path_check_answer: ${r.path_check_answer??"null"}`,`autonomous_path_confirmed: ${r.autonomous_path_confirmed??"not sampled"}`,`target_path_correct: ${r.target_path_correct??"null"}`,`step1_recovery_triggered: ${r.step1_recovery_triggered}`,`step1_recovery_options: ${JSON.stringify(["完整","缺一个东西"])}`,`step1_recovery_correct_answer: ${r.step1_recovery_correct_answer}`,`step1_recovery_first_answer: ${r.step1_recovery_first_answer??"null"}`,`step1_recovery_first_correct: ${r.step1_recovery_first_correct??"null"}`,`deeper_structure_recovery_triggered: ${r.deeper_structure_recovery_triggered}`,`deeper_structure_recovery_prompt: ${r.deeper_structure_recovery_prompt}`,`deeper_structure_recovery_options: ${JSON.stringify(r.deeper_structure_recovery_options)}`,`deeper_structure_recovery_correct_answer: ${r.deeper_structure_recovery_correct_answer}`,`deeper_structure_recovery_answer: ${r.deeper_structure_recovery_answer??"null"}`,`deeper_structure_recovery_correct: ${r.deeper_structure_recovery_correct??"null"}`,`step1_reconfirmed_answer: ${r.step1_reconfirmed_answer??"null"}`,`step1_reconfirmed_correct: ${r.step1_reconfirmed_correct??"null"}`,`recovery_relation_correct_answer: ${r.recovery_relation_correct_answer}`,`recovery_relation_answer: ${r.recovery_relation_answer??"null"}`,`recovery_relation_correct: ${r.recovery_relation_correct??"null"}`,`final_relation_answer: ${r.final_relation_answer??"null"}`,`final_answer_correct: ${r.final_answer_correct??"null"}`,`initial_answer_correct_target_path_not_confirmed: ${r.initial_answer_correct_target_path_not_confirmed}`,`response_times_ms: ${JSON.stringify(r.response_times_ms)}`,`final_state: ${r.final_state??"not_reached"}`,`stop_triggered: ${r.stop_triggered}`,`stop_reason: ${r.stop_reason??"null"}`);if(i<run.items.length-1)out.push("---")});return out.join("\n")}
async function copyResult(){const text=resultText();try{await navigator.clipboard.writeText(text);document.querySelector("#status").textContent="已复制 ✓"}catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();const ok=document.execCommand("copy");ta.remove();document.querySelector("#status").textContent=ok?"已复制 ✓":"复制未成功，请重试"}}
document.querySelector("#start").onclick=start;
</script>
</body>
</html>
