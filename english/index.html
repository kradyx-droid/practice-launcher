<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quick Check</title>
<style>
:root{color-scheme:light;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(960px,100% - 32px);min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:14px}.brand{font-weight:650;color:var(--ink);letter-spacing:.01em}
.progress{height:5px;background:#e3e7ee;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress>div{height:100%;background:var(--blue);width:0;transition:none}
.card{height:clamp(260px,calc(100svh - 150px),860px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,6vw,48px);box-shadow:0 12px 36px #23304a0b}
.prompt{font-size:clamp(20px,3vw,20px);line-height:1.65;margin:0 0 26px;white-space:pre-line}.options{display:grid;gap:12px}.option{width:100%;text-align:left;display:flex;align-items:flex-start;gap:15px;padding:15px 18px;border:1.5px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit;cursor:pointer;white-space:pre-line;transition:none}.option:hover{border-color:#9aabe6}.option[aria-pressed="true"]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.letter{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f0f2f6;font-weight:700;font-size:16px}.option[aria-pressed="true"] .letter{background:var(--blue);color:white}
.actions{display:flex;justify-content:flex-end;margin-top:24px}.primary{border:0;border-radius:11px;background:var(--blue);color:white;padding:13px 25px;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;min-width:134px}.primary:disabled{background:#b9c1d0;cursor:not-allowed}.intro{text-align:center}.intro h1,.done h1{font-size:32px;line-height:1.2;margin:0 0 12px}.intro p,.done p{color:var(--muted);margin:0 0 26px}.center{justify-content:center}.center .primary{align-self:center;min-width:160px}.center .card{display:flex;flex-direction:column;justify-content:center}.done{text-align:center}.done .primary{min-width:160px}.copy-status{min-height:28px;color:var(--muted);font-size:15px;margin-top:12px!important}.hint{color:var(--muted);font-size:14px;margin-top:14px;text-align:center}
@media(max-width:520px){body{font-size:17px}main{width:min(100% - 20px,760px)}.card{border-radius:16px;padding:24px 18px}.top{margin-bottom:12px}.option{padding:13px 14px}}
.feedback{white-space:pre-line;font-size:clamp(20px,3vw,20px);line-height:1.65;margin:0 0 24px}.phase-label{color:var(--muted);font-size:14px;margin:0 0 10px}.step-copy{white-space:pre-line;margin:0 0 18px}
</style>
</head>
<body>
<main id="app" class="center">
  <section class="card intro" aria-labelledby="welcome">
    <p id="welcome">Choose the best answer for each sentence.</p>
    <button id="start" class="primary">Start</button>
  </section>
</main>
<script>
"use strict";
const batch={batch_id:"RELATIVE_SLOT_TRANSFER_PROBE_V1",version:"1.0"};
const relationOptions=["which","when","where"];
const step1Options=["完整","缺一个东西"];
const pathOptions=["主要看前面的时间 / 地点词","先看后半句自己完整不完整、有没有缺东西","主要凭感觉 / 说不清"];
const coreItems=[
 {item_id:"CORE_P01",sentence:"The week ___ the school play opened was unusually busy.",source_type:"controlled_probe",focus_clause:"the school play opened",internal_structure:"complete",correct_relation:"when",correct_option:"B",surface_lure:"week → when",primary_evidence_role:"delayed autonomous-trigger opening sample",deep:{prompt:"The school play opened.\n\n这句话自己能不能站住？",options:["能","不能"],correct:"A"}},
 {item_id:"CORE_P02",sentence:"This is the room ___ the team used for rehearsals.",source_type:"controlled_probe",focus_clause:"the team used for rehearsals",internal_structure:"missing",correct_relation:"which",correct_option:"A",surface_lure:"room → where",primary_evidence_role:"new-surface missing-slot transfer",deep:{prompt:"The team used the room for rehearsals.\n\n现在把 the room 拿掉：\n\nThe team used ___ for rehearsals.\n\n这里还缺不缺东西？",options:["缺一个东西","不缺"],correct:"A"}},
 {item_id:"CORE_P03",sentence:"I still remember the afternoon ___ we chose for the meeting.",source_type:"controlled_probe",focus_clause:"we chose for the meeting",internal_structure:"missing",correct_relation:"which",correct_option:"A",surface_lure:"afternoon → when",primary_evidence_role:"time-antecedent missing-slot transfer",deep:{prompt:"We chose the afternoon for the meeting.\n\n现在把 the afternoon 拿掉：\n\nWe chose ___ for the meeting.\n\n这里还缺不缺东西？",options:["缺一个东西","不缺"],correct:"A"}},
 {item_id:"CORE_P04",sentence:"This is the bench ___ we waited for the bus.",source_type:"controlled_probe",focus_clause:"we waited for the bus",internal_structure:"complete",correct_relation:"where",correct_option:"C",surface_lure:"bench → where",primary_evidence_role:"new-surface optional-place observation",special_observation:"optional-place / completeness",deep:{prompt:"We waited for the bus.\n\n这句话自己能不能站住？",options:["能","不能"],correct:"A"}},
 {item_id:"CORE_P05",sentence:"There was a time ___ each teacher spent an hour, one day a week, testing pupils in every subject.",source_type:"authentic_bank_low_load",focus_clause:"each teacher spent an hour, one day a week, testing pupils in every subject",internal_structure:"complete",correct_relation:"when",correct_option:"B",original_accepted_answer:"when / during which",controlled_probe_answer:"when",primary_evidence_role:"authentic-language complete-clause transfer",deep:{prompt:"Each teacher spent an hour, one day a week, testing pupils in every subject.\n\n这句话自己能不能站住？",options:["能","不能"],correct:"A"}},
 {item_id:"CORE_P06",sentence:"This is the TV station ___ we visited last year.",source_type:"authentic_bank_low_load",focus_clause:"we visited last year",internal_structure:"missing",correct_relation:"which",correct_option:"A",surface_lure:"TV station → where",primary_evidence_role:"authentic-language missing-slot transfer",original_accepted_answer:"omission / which",controlled_probe_answer:"which",deep:{prompt:"We visited the TV station last year.\n\n现在把 the TV station 拿掉：\n\nWe visited ___ last year.\n\n这里还缺不缺东西？",options:["缺一个东西","不缺"],correct:"A"}}
];
const branchSpecs=[
 {branch_id:"BRANCH_OPTIONAL_PLACE",sentence:"They waited for nearly an hour.",question:"这句话自己能不能站住？",options:["能","不能"],correct:"A"},
 {branch_id:"BRANCH_REQUIRED_SLOT",sentence:"We chose ___ for the meeting.",question:"这里是不是还缺一个东西？",options:["缺","不缺"],correct:"A"}
];
const app=document.querySelector("#app"),letters=["A","B","C","D"];
let run=null,coreIndex=0,stage="start",selected=null,shownAt=0,diagnosisQueue=[],diagnosisPosition=0,branchQueue=[],branchPosition=0;
const iso=()=>new Date().toISOString();
function newDiagnosis(){return {evidence_layer:"post_probe_diagnosis",diagnosis_triggered:false,diagnosis_step1_answer:null,diagnosis_step1_correct:null,diagnosis_step1_response_time_ms:null,deeper_structure_recovery_triggered:false,deeper_structure_recovery_answer:null,deeper_structure_recovery_correct:null,deeper_structure_recovery_response_time_ms:null,step1_reconfirmed_answer:null,step1_reconfirmed_correct:null,step1_reconfirmed_response_time_ms:null,diagnosis_relation_answer:null,diagnosis_relation_correct:null,diagnosis_relation_response_time_ms:null,diagnosis_state:null}}
function newCoreRecord(q,i){return {evidence_layer:"core_probe",item_id:q.item_id,presented_order:i+1,sentence:q.sentence,source_type:q.source_type,focus_clause:q.focus_clause,internal_structure:q.internal_structure,correct_relation:q.correct_relation,correct_option:q.correct_option,original_accepted_answer:q.original_accepted_answer??null,controlled_probe_answer:q.controlled_probe_answer??null,surface_lure:q.surface_lure??null,special_observation:q.special_observation??null,primary_evidence_role:q.primary_evidence_role,initial_relation_answer:null,initial_relation_option:null,initial_answer_correct:null,initial_response_time_ms:null,core_feedback_shown:false,core_hint_shown:false,core_recovery_shown:false,diagnosis:newDiagnosis()}}
function newBranchRecord(spec){return {evidence_layer:"branch",branch_id:spec.branch_id,trigger_condition_met:false,presented:false,trigger_source_item_ids:[],sentence:spec.sentence,question:spec.question,options:spec.options.slice(),correct_answer:spec.options[spec.correct.charCodeAt(0)-65],answer:null,correct:null,response_time_ms:null}}
function coreItem(){return coreItems[coreIndex]}function coreRecord(){return run.core_items[coreIndex]}
function currentDiagnosisRecord(){return run.core_items[diagnosisQueue[diagnosisPosition]]}
function currentDiagnosisItem(){return coreItems[diagnosisQueue[diagnosisPosition]]}
function currentBranchRecord(){return run.branch_items[branchQueue[branchPosition]]}
function currentBranchSpec(){return branchSpecs[branchQueue[branchPosition]]}
function header(counter,progress){return `<div class="top"><span class="brand">English Quick Check</span><span>${counter||""}</span></div><div class="progress" aria-hidden="true"><div style="width:${progress}%"></div></div>`}
function renderOptions(options){const wrap=document.createElement("div");wrap.className="options";options.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed","false");b.innerHTML=`<span class="letter">${letters[i]}</span><span></span>`;b.querySelector("span:last-child").textContent=label;b.onclick=()=>{selected=letters[i];wrap.querySelectorAll(".option").forEach((x,j)=>x.setAttribute("aria-pressed",String(letters[j]===selected)));document.querySelector("#submit").disabled=false};wrap.append(b)});return wrap}
function mountQuestion({counter,progress,sentence,label="",copy="",options,mode,showSubmit=true}){stage=mode;selected=null;shownAt=performance.now();app.className="";app.innerHTML=`${header(counter,progress)}<section class="card">${sentence!==null?'<p class="prompt" id="sentence"></p>':''}${label?'<p class="phase-label" id="phase"></p>':''}${copy?'<p class="step-copy" id="copy"></p>':''}<div id="answers"></div>${showSubmit?'<div class="actions"><button class="primary" id="submit" disabled>提交</button></div>':''}</section>`;if(sentence!==null)app.querySelector("#sentence").textContent=sentence;if(label)app.querySelector("#phase").textContent=label;if(copy)app.querySelector("#copy").textContent=copy;app.querySelector("#answers").append(renderOptions(options));if(showSubmit)document.querySelector("#submit").onclick=submitAnswer}
function showCore(){const q=coreItem();mountQuestion({counter:`${coreIndex+1} / 6`,progress:coreIndex/6*100,sentence:q.sentence,options:relationOptions,mode:"core"})}
function showNeutralCore(){stage="core_neutral";app.className="";app.innerHTML=`${header(`${coreIndex+1} / 6`,(coreIndex+1)/6*100)}<section class="card"><p class="feedback">已记录</p><div class="actions"><button class="primary" id="continue">继续</button></div></section>`;document.querySelector("#continue").onclick=continueCore}
function showDiagnosisStep1(reconfirm=false){const q=currentDiagnosisItem();const d=currentDiagnosisRecord().diagnosis;d.evidence_layer="post_probe_diagnosis";const prompt=reconfirm?`${q.focus_clause}\n\n它本身是：`:`只看：\n\n${q.focus_clause}\n\n它本身是：`;mountQuestion({counter:"",progress:100,sentence:null,label:"",copy:prompt,options:step1Options,mode:reconfirm?"diagnosis_reconfirm":"diagnosis_step1"})}
function showDiagnosisDeep(){const q=currentDiagnosisItem();mountQuestion({counter:"",progress:100,sentence:null,label:"",copy:q.deep.prompt,options:q.deep.options,mode:"diagnosis_deep"})}
function showDiagnosisRelation(){const q=currentDiagnosisItem();mountQuestion({counter:"",progress:100,sentence:q.sentence,options:relationOptions,mode:"diagnosis_relation"})}
function showBranch(){const r=currentBranchRecord(),spec=currentBranchSpec();r.presented=true;mountQuestion({counter:"",progress:100,sentence:spec.sentence,label:"",copy:spec.question,options:spec.options,mode:"branch"})}
function start(){run={batch_id:batch.batch_id,batch_version:batch.version,run_id:"run-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),started_at:iso(),started_ms:Date.now(),core_completed:false,core_locked:false,core_completed_at:null,core_locked_at:null,completed_at:null,completed_ms:null,completed_normally:false,core_items:coreItems.map(newCoreRecord),branch_items:branchSpecs.map(newBranchRecord)};coreIndex=0;showCore()}
function answerLabel(key,options){return options[Number(key.slice(1))-1]}
function submitAnswer(){if(!selected)return;const elapsed=Math.round(performance.now()-shownAt);document.querySelector("#submit").disabled=true;document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(stage==="core"){const r=coreRecord(),q=coreItem();r.initial_relation_option=selected;r.initial_relation_answer=answerLabel(selected,relationOptions);r.initial_answer_correct=selected===q.correct_option;r.initial_response_time_ms=elapsed;r.core_feedback_shown=false;r.core_hint_shown=false;r.core_recovery_shown=false;if(coreIndex===coreItems.length-1)lockCore();showNeutralCore();return}
 if(stage==="diagnosis_step1"){const q=currentDiagnosisItem(),d=currentDiagnosisRecord().diagnosis;d.diagnosis_triggered=true;d.diagnosis_step1_answer=answerLabel(selected,step1Options);d.diagnosis_step1_correct=selected===(q.internal_structure==="complete"?"A":"B");d.diagnosis_step1_response_time_ms=elapsed;if(d.diagnosis_step1_correct){showDiagnosisRelation();return}d.deeper_structure_recovery_triggered=true;showDiagnosisDeep();return}
 if(stage==="diagnosis_deep"){const q=currentDiagnosisItem(),d=currentDiagnosisRecord().diagnosis;d.deeper_structure_recovery_answer=answerLabel(selected,q.deep.options);d.deeper_structure_recovery_correct=selected===q.deep.correct;d.deeper_structure_recovery_response_time_ms=elapsed;if(!d.deeper_structure_recovery_correct){d.diagnosis_state="STRUCTURE_UNRESOLVED";nextDiagnosis();return}showDiagnosisStep1(true);return}
 if(stage==="diagnosis_reconfirm"){const q=currentDiagnosisItem(),d=currentDiagnosisRecord().diagnosis;d.step1_reconfirmed_answer=answerLabel(selected,step1Options);d.step1_reconfirmed_correct=selected===(q.internal_structure==="complete"?"A":"B");d.step1_reconfirmed_response_time_ms=elapsed;if(!d.step1_reconfirmed_correct){d.diagnosis_state="STRUCTURE_UNRESOLVED";nextDiagnosis();return}d.diagnosis_state="STRUCTURE_SCAFFOLD_RECOVERED";showDiagnosisRelation();return}
 if(stage==="diagnosis_relation"){const q=currentDiagnosisItem(),d=currentDiagnosisRecord().diagnosis;d.diagnosis_relation_answer=answerLabel(selected,relationOptions);d.diagnosis_relation_correct=selected===q.correct_option;d.diagnosis_relation_response_time_ms=elapsed;if(d.diagnosis_state!=="STRUCTURE_SCAFFOLD_RECOVERED")d.diagnosis_state=d.diagnosis_relation_correct?"STEP1_PROMPT_RECOVERED":"MAPPING_STILL_UNSTABLE";nextDiagnosis();return}
 if(stage==="branch"){const spec=currentBranchSpec(),r=currentBranchRecord();r.answer=answerLabel(selected,spec.options);r.correct=selected===spec.correct;r.response_time_ms=elapsed;nextBranch()}
}
function lockCore(){run.core_completed=true;run.core_locked=true;run.core_completed_at=iso();run.core_locked_at=iso();run.core_initial_correct_count=run.core_items.filter(x=>x.initial_answer_correct).length;run.core_initial_error_items=run.core_items.filter(x=>!x.initial_answer_correct).map(x=>x.item_id)}
function continueCore(){if(coreIndex<coreItems.length-1){coreIndex++;showCore();return}beginPostProbe()}
function beginPostProbe(){diagnosisQueue=run.core_items.map((x,i)=>x.initial_answer_correct?null:i).filter(i=>i!==null);diagnosisPosition=0;if(diagnosisQueue.length){showDiagnosisStep1();return}prepareBranches()}
function nextDiagnosis(){diagnosisPosition++;if(diagnosisPosition<diagnosisQueue.length){showDiagnosisStep1();return}prepareBranches()}
function prepareBranches(){const byId=Object.fromEntries(run.core_items.map(x=>[x.item_id,x]));const optSource=byId.CORE_P04.initial_answer_correct===false&&byId.CORE_P04.diagnosis.diagnosis_step1_answer==="缺一个东西"?["CORE_P04"]:[];const reqSource=["CORE_P02","CORE_P03","CORE_P06"].filter(id=>byId[id].initial_answer_correct===false&&byId[id].diagnosis.diagnosis_step1_answer==="完整");run.branch_items[0].trigger_condition_met=optSource.length>0;run.branch_items[0].trigger_source_item_ids=optSource;run.branch_items[1].trigger_condition_met=reqSource.length>0;run.branch_items[1].trigger_source_item_ids=reqSource;branchQueue=run.branch_items.map((x,i)=>x.trigger_condition_met?i:null).filter(i=>i!==null);branchPosition=0;if(branchQueue.length){showBranch();return}finishRun()}
function nextBranch(){branchPosition++;if(branchPosition<branchQueue.length){showBranch();return}finishRun()}
function finishRun(){run.completed_at=iso();run.completed_ms=Date.now();run.completed_normally=true;showDone()}
function showDone(){app.className="center";app.innerHTML=`<section class="card done"><h1>完成。</h1><button class="primary" id="copy">复制结果</button><p class="copy-status" id="status" aria-live="polite"></p></section>`;document.querySelector("#copy").onclick=copyResult}
function nullText(value){return value===null||value===undefined?"null":String(value)}
function resultText(){const coreRight=run.core_items.filter(x=>x.initial_answer_correct).length;const postCount=run.core_items.filter(x=>x.diagnosis.diagnosis_triggered).length;const branchCount=run.branch_items.filter(x=>x.presented).length;const out=["# Relative Slot Transfer Probe V1｜执行记录","",`BATCH_ID: ${run.batch_id}`,`BATCH_VERSION: ${run.batch_version}`,`RUN_ID: ${run.run_id}`,`STARTED_AT: ${run.started_at}`,`CORE_COMPLETED_AT: ${run.core_completed_at}`,`CORE_LOCKED_AT: ${run.core_locked_at}`,`COMPLETED_AT: ${run.completed_at}`,`TOTAL_DURATION_MS: ${run.completed_ms-run.started_ms}`,`COMPLETED_NORMALLY: ${run.completed_normally}`,`CORE_COMPLETED: ${run.core_completed}`,`CORE_LOCKED: ${run.core_locked}`,`CORE_COMPLETED_ITEMS: ${run.core_items.filter(x=>x.initial_relation_answer!==null).length}/6`,`CORE_SCORE_RAW: ${coreRight}/6`,`CORE_INITIAL_CORRECT_COUNT: ${coreRight}`,`CORE_INITIAL_ERROR_COUNT: ${6-coreRight}`,`CORE_INITIAL_ERROR_ITEMS: ${JSON.stringify(run.core_initial_error_items)}`,`POST_DIAGNOSIS_ITEMS: ${postCount}`,`BRANCH_ITEMS_PRESENTED: ${branchCount}`,"","# CORE PROBE","" ];
 run.core_items.forEach((r,i)=>{out.push(`## ${r.item_id}`,`evidence_layer: ${r.evidence_layer}`,`item_id: ${r.item_id}`,`presented_order: ${r.presented_order}`,`sentence: ${r.sentence}`,`source_type: ${r.source_type}`,`focus_clause: ${r.focus_clause}`,`internal_structure: ${r.internal_structure}`,`correct_relation: ${r.correct_relation}`,`correct_option: ${r.correct_option}`,`original_accepted_answer: ${r.original_accepted_answer??"null"}`,`controlled_probe_answer: ${r.controlled_probe_answer??"null"}`,`surface_lure: ${r.surface_lure??"null"}`,`special_observation: ${r.special_observation??"null"}`,`primary_evidence_role: ${r.primary_evidence_role}`,`initial_relation_answer: ${r.initial_relation_answer??"null"}`,`initial_relation_option: ${r.initial_relation_option??"null"}`,`initial_answer_correct: ${r.initial_answer_correct??"null"}`,`initial_response_time_ms: ${r.initial_response_time_ms??"null"}`,`core_feedback_shown: ${r.core_feedback_shown}`,`core_hint_shown: ${r.core_hint_shown}`,`core_recovery_shown: ${r.core_recovery_shown}`);if(i<run.core_items.length-1)out.push("---")});
 out.push("","# POST-PROBE DIAGNOSIS","");run.core_items.forEach((r,i)=>{const d=r.diagnosis;out.push(`## DIAG ${r.item_id}`,`evidence_layer: post_probe_diagnosis`,`source_core_item_id: ${r.item_id}`,`diagnosis_triggered: ${d.diagnosis_triggered}`,`diagnosis_step1_answer: ${nullText(d.diagnosis_step1_answer)}`,`diagnosis_step1_correct: ${nullText(d.diagnosis_step1_correct)}`,`diagnosis_step1_response_time_ms: ${nullText(d.diagnosis_step1_response_time_ms)}`,`deeper_structure_recovery_triggered: ${d.deeper_structure_recovery_triggered}`,`deeper_structure_recovery_answer: ${nullText(d.deeper_structure_recovery_answer)}`,`deeper_structure_recovery_correct: ${nullText(d.deeper_structure_recovery_correct)}`,`deeper_structure_recovery_response_time_ms: ${nullText(d.deeper_structure_recovery_response_time_ms)}`,`step1_reconfirmed_answer: ${nullText(d.step1_reconfirmed_answer)}`,`step1_reconfirmed_correct: ${nullText(d.step1_reconfirmed_correct)}`,`step1_reconfirmed_response_time_ms: ${nullText(d.step1_reconfirmed_response_time_ms)}`,`diagnosis_relation_answer: ${nullText(d.diagnosis_relation_answer)}`,`diagnosis_relation_correct: ${nullText(d.diagnosis_relation_correct)}`,`diagnosis_relation_response_time_ms: ${nullText(d.diagnosis_relation_response_time_ms)}`,`diagnosis_state: ${nullText(d.diagnosis_state)}`);if(i<run.core_items.length-1)out.push("---")});
 out.push("","# CONDITIONAL BRANCHES","");run.branch_items.forEach((r,i)=>{out.push(`## ${r.branch_id}`,`evidence_layer: branch`,`branch_id: ${r.branch_id}`,`trigger_condition_met: ${r.trigger_condition_met}`,`presented: ${r.presented}`,`trigger_source_item_ids: ${JSON.stringify(r.trigger_source_item_ids)}`,`answer: ${nullText(r.answer)}`,`correct: ${nullText(r.correct)}`,`response_time_ms: ${nullText(r.response_time_ms)}`);if(i<run.branch_items.length-1)out.push("---")});return out.join("\n")}
async function copyResult(){const text=resultText();try{await navigator.clipboard.writeText(text);document.querySelector("#status").textContent="已复制 ✓"}catch(e){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();const ok=document.execCommand("copy");ta.remove();document.querySelector("#status").textContent=ok?"已复制 ✓":"复制未成功，请重试"}}
document.querySelector("#start").onclick=start;
</script>
</body>
</html>
