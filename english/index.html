function tokenize(source){let parts;if(typeof Intl.Segmenter==="function"){parts=Array.from(new Intl.Segmenter(undefined,{granularity:"word"}).segment(source),x=>({text:x.segment,start:x.index}))}else{const re=/\s+|[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}]+|[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*|[^\s]/gu;parts=Array.from(source.matchAll(re),m=>({text:m[0],start:m.index}))}return parts.filter(x=>!/^[\s]+$/u.test(x.text)).map(x=>({text:x.text,start:x.start,end:x.start+x.text.length}))}

function itemProgress(step,mainFlow=activeMainFlow){const anchor=step.kind==="branch"?(step.progressItem||step.returnItem||step.item):step.item;const items=[...new Set(mainFlow.map(x=>x.item))];const itemIndex=Math.max(0,items.indexOf(anchor));return {index:itemIndex,total:items.length}}
function canSubmitStep(step,selected,choice){return (!step.textSelection||selected.size>0)&&(!step.options||choice!==null)}
function canSubmit(i){return canSubmitStep(flow[i],selectionByStep[i],choiceByStep[i])}
function syncSubmit(){const button=card.querySelector("#submit");if(button)button.disabled=!canSubmit(stepIndex)}
function draw(){const step=current(),progress=itemProgress(step);stepCount.textContent=`${progress.index+1} / ${progress.total}`;progressFill.style.width=`${(progress.index+1)/progress.total*100}%`;card.classList.remove("done");card.replaceChildren();
 if(step.title){const h=document.createElement("h1");h.className="step-title";h.textContent=step.title;card.append(h)}
 const scroller=document.createElement("div");scroller.className="text-scroll";const text=document.createElement("p");text.className="text-block";text.setAttribute("aria-label","可选择的示例文本");tokenList=tokenize(step.text);let cursor=0;tokenList.forEach((token,i)=>{if(token.start>cursor)text.append(document.createTextNode(step.text.slice(cursor,token.start)));const span=document.createElement("span");span.className="token";span.dataset.tokenIndex=String(i);span.textContent=token.text;text.append(span);cursor=token.end});if(cursor<step.text.length)text.append(document.createTextNode(step.text.slice(cursor)));scroller.append(text);card.append(scroller);
 if(step.textSelection){text.addEventListener("pointerdown",onDown);text.addEventListener("pointermove",onMove);text.addEventListener("pointerup",onUp);text.addEventListener("pointercancel",onCancel);text.addEventListener("click",onClick)}
 if(step.instruction){const p=document.createElement("p");p.className="instruction";p.textContent=step.instruction;card.append(p)}
 if(step.options){const opts=document.createElement("div");opts.className="options";step.options.items.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.setAttribute("aria-pressed",String(choiceByStep[stepIndex]===i));const mark=document.createElement("span");mark.className="letter";mark.textContent=String.fromCharCode(65+i);const name=document.createElement("span");name.textContent=label;b.append(mark,name);b.onclick=()=>{choiceByStep[stepIndex]=i;draw()};opts.append(b)});card.append(opts)}
 const actions=document.createElement("div");actions.className="actions";const submit=document.createElement("button");submit.className="primary";submit.id="submit";submit.textContent="提交";submit.disabled=!canSubmit(stepIndex);submit.onclick=()=>{if(!canSubmit(stepIndex))return;const selected=[...selectionByStep[stepIndex]].sort((a,b)=>a-b).map(i=>({token:tokenList[i].text,start:tokenList[i].start,end:tokenList[i].end}));const chosen=choiceByStep[stepIndex];submittedByStep[stepIndex]={item:step.item,step:step.step,sourceText:step.text,textSelection:selected,optionChoice:chosen===null?null:step.options?.items[chosen]??null};const next=runtime.submit(submittedByStep[stepIndex]);if(next){stepIndex=flow.findIndex(n=>n.nodeId===next.nodeId);draw()}else drawComplete()};actions.append(submit);card.append(actions);paint()}
function drawComplete(){card.classList.add("done");card.replaceChildren();const title=document.createElement("h1");title.className="step-title";title.textContent=runtime.state.status==="stopped"?"本次已停止":"已完成";const button=document.createElement("button");button.className="primary";button.textContent="复制结果";button.addEventListener("click",copyResults);card.append(title,button)}
function formatResults(){return JSON.stringify(runtime.exportSession(),null,2)}
async function copyResults(event){const button=event.currentTarget,text=formatResults();let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch{}if(!copied){const field=document.createElement("textarea");field.value=text;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}if(copied){button.textContent="已复制";button.disabled=true;setTimeout(()=>{button.textContent="复制结果";button.disabled=false},1200)}}
function targetIndex(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el||!el.classList.contains("token")||!card.contains(el))return null;return Number(el.dataset.tokenIndex)}
function onDown(e){if(e.button!==undefined&&e.button!==0)return;const ix=targetIndex(e);if(ix===null)return;drag={pointerId:e.pointerId,start:ix,end:ix,startX:e.clientX,startY:e.clientY,moved:false};if(e.pointerType==="mouse")e.preventDefault()}
function onMove(e){if(!drag||drag.pointerId!==e.pointerId)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5)drag.moved=true;const ix=targetIndex(e);if(ix===null)return;if(drag.moved){drag.end=ix;paint([Math.min(drag.start,drag.end),Math.max(drag.start,drag.end)])}}
function applySelectionOperation(groups,selected,start,end=start){
 if(start===end){const groupIndex=groups.findIndex(group=>group.includes(start));if(groupIndex>=0){for(const token of groups[groupIndex])selected.delete(token);groups.splice(groupIndex,1)}else{groups.push([start]);selected.add(start)}return}
 const merged=new Set();for(let i=Math.min(start,end);i<=Math.max(start,end);i++)merged.add(i);
 let changed=true;while(changed){changed=false;for(let i=groups.length-1;i>=0;i--){const group=groups[i];if(group.some(token=>merged.has(token))){group.forEach(token=>merged.add(token));groups.splice(i,1);changed=true}}}
 const group=[...merged].sort((a,b)=>a-b);groups.push(group);group.forEach(token=>selected.add(token));
}
function onUp(e){if(!drag||drag.pointerId!==e.pointerId)return;const d=drag;drag=null;applySelectionOperation(selectionGroupsByStep[stepIndex],selectionByStep[stepIndex],d.start,d.moved?d.end:d.start);paint();syncSubmit()}
function onCancel(){drag=null;paint()}
function onClick(e){e.preventDefault()}
function paint(preview=null){const selected=selectionByStep[stepIndex];card.querySelectorAll(".token").forEach(el=>{const i=Number(el.dataset.tokenIndex);el.classList.toggle("selected",selected.has(i)||(preview&&i>=preview[0]&&i<=preview[1]))})}
function currentDraft(){const step=current(),chosen=choiceByStep[stepIndex];const selected=[...selectionByStep[stepIndex]].sort((a,b)=>a-b).map(i=>({token:tokenList[i].text,start:tokenList[i].start,end:tokenList[i].end}));return {nodeId:step.nodeId,item:step.item,step:step.step,textSelection:selected,optionChoice:chosen===null?null:step.options?.items[chosen]??null}}
window.QuickRuntime={create:createQuickRuntime,exportSession:()=>runtime.exportSession(),stop:()=>{runtime.stop("manual",currentDraft());drawComplete()},getProgress:()=>({current:itemProgress(current()).index+1,total:itemProgress(current()).total})};
draw();
</script>
</body>
