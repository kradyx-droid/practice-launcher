:root{color-scheme:light;--quick-control-height:44px;--free-input-height:120px;--answer-start-gap:24px;--ink:#202733;--muted:#697586;--blue:#315ee8;--line:#dce2eb;--paper:#fff;--bg:#f4f6fa;--soft:#eef2ff;--selection:#dce5ff}
*{box-sizing:border-box}body{min-height:100svh;margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}

.quick-fraction{display:inline-grid;grid-template-rows:minmax(0,auto) 1px minmax(0,auto);justify-items:stretch;align-items:center;vertical-align:middle;white-space:nowrap;line-height:1;margin:0 .08em;padding-block:.08em;flex:none}.quick-fraction__numerator,.quick-fraction__denominator{display:block;min-width:100%;padding-inline:.08em;text-align:center;white-space:nowrap;line-height:1.08;font-size:.74em}.quick-fraction__bar{display:block;min-width:100%;height:0;border-top:1px solid currentColor}

@media(max-width:520px){body{font-size:17px}main{padding:10px}.card{border-radius:16px}.text-block{font-size:19px;line-height:1.95}.quick-fraction{margin-inline:.07em}.quick-fraction__numerator,.quick-fraction__denominator{font-size:.72em}.option{padding:12px 14px}}

"use strict";
const items = [{"item":"CNQ_000004","steps":[{"step":"S1","text":"___ 图书馆今天临时调整了开放时间，___ 我们把原定的小组讨论改到了教室。","instruction":"用合适的关联词补完整，并用语音说出完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可以这样说","content":"因为图书馆今天临时调整了开放时间，所以我们把原定的小组讨论改到了教室。","explanation":"前面说明原因，后面说明因此发生的变化。"}}]},{"item":"CNQ_000001","steps":[{"step":"S1","text":"教室门刚打开，等在外面的同学一下子 ___ 了进来，门口很快就挤满了人。","instruction":"用语音补出自己想到的词，必要时说完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可以这样说","content":"“涌”了进来，突出很多人一起快速进入；“挤”了进来，更突出人多、空间有些拥挤。","explanation":"后面的“很快就挤满了人”，说明进来的人多，而且比较集中。"}}]},{"item":"CNQ_000012","steps":[{"step":"S1","text":"负责讲解的小林清楚地介绍这次实验的步骤。","instruction":"在原句中点选缩句后要保留的主要词语；支持选择多个不连续范围。","textSelection":true,"answerMode":null,"feedback":{"title":"参考缩句","content":"小林介绍步骤。","explanation":"去掉人物特点和动作方式以后，主要意思仍然完整。"}}]},{"item":"CNQ_000019","steps":[{"step":"S1","text":"这次阅读分享，我最喜欢的是小林讲的那个故事给我的启发。","instruction":"先标记自己觉得有问题的文字范围；可标记一个或多个不连续范围。","textSelection":true,"answerMode":null},{"step":"S2","text":"这次阅读分享，我最喜欢的是小林讲的那个故事给我的启发。","instruction":"用语音说出修改后的完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"一种修改方式","content":"这次阅读分享中，小林讲的那个故事给我的启发最大。","explanation":"原句把两种说法接在了一起，重新选一种说法，句子就清楚了。"}}]},{"item":"CNQ_000007","steps":[{"step":"S1","text":"___ 把采访时记下的细节整理清楚，写活动报道时 ___ 不容易漏掉重要信息。","instruction":"用合适的关联词补完整，并用语音说出完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可以这样说","content":"只要把采访时记下的细节整理清楚，写活动报道时就不容易漏掉重要信息。","explanation":"前面提出一个条件，后面说明满足条件后的结果。"}}]},{"item":"CNQ_000005","steps":[{"step":"S1","text":"同桌还在犹豫，她没有催，只是 ___ 地说：“你再想一会儿也没关系。”","instruction":"用语音补词或短语。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可以这样说","content":"“耐心”地说，突出她没有催促对方的态度；“轻声”地说，突出说话声音轻。","explanation":"换一个词，表现出来的重点也会有所不同。"}}]},{"item":"CNQ_000020","steps":[{"step":"S1","text":"操场边的银杏树投下一片凉爽的树荫。","instruction":"在原句中点选缩句后要保留的主要词语；支持选择多个不连续范围。","textSelection":true,"answerMode":null,"feedback":{"title":"参考缩句","content":"银杏树投下树荫。","explanation":"“操场边的”“一片凉爽的”补充了位置和特点，主要骨架是“银杏树—投下—树荫”。"}}]},{"item":"CNQ_000014","steps":[{"step":"S1","text":"走进科技馆，我一下子就被大厅中央的巨大模型吸引了我的目光。","instruction":"先标记自己觉得有问题的文字范围；可标记一个或多个不连续范围。","textSelection":true,"answerMode":null},{"step":"S2","text":"走进科技馆，我一下子就被大厅中央的巨大模型吸引了我的目光。","instruction":"用语音说出修改后的完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"一种修改方式","content":"走进科技馆，我一下子就被大厅中央的巨大模型吸引住了。","explanation":"“被模型吸引住了”和“模型吸引了我的目光”都能成立，原句把两种说法混在了一起。"}}]},{"item":"CNQ_000018","steps":[{"step":"S1","text":"___ 这次展示只有三分钟，我们 ___ 要先把最想讲的内容理清楚。","instruction":"用合适的关联词补完整，并用语音说出完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可以这样说","content":"即使这次展示只有三分钟，我们也要先把最想讲的内容理清楚。","explanation":"时间虽然很短，但这件事仍然需要做好。"}}]},{"item":"CNQ_000009","steps":[{"step":"S1","text":"听到自己负责的那一段临时被删掉，他愣了一下，有些 ___ 地把稿子折好放进书包。","instruction":"用语音补出自己想到的词，也可以说完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可以这样说","content":"“失落”，表示原本准备好的内容突然不能展示，心里有些不好受；“沮丧”，情绪比“失落”更重一些。","explanation":"“愣了一下”和后面的动作，都在提示他当时的心情。"}}]},{"item":"CNQ_000002","steps":[{"step":"S1","text":"五年级的同学认真地整理这次采访的记录。","instruction":"在原句中点选缩句后要保留的主要词语；支持选择多个不连续范围。","textSelection":true,"answerMode":null,"feedback":{"title":"参考缩句","content":"同学整理记录。","explanation":"留下主要人物、动作和对象，句子的骨架就出来了。"}}]},{"item":"CNQ_000006","steps":[{"step":"S1","text":"这次活动让我们既学会了怎样分工，也增加了彼此之间的了解。","instruction":"先标记自己觉得有问题的文字范围；可标记一个或多个不连续范围。","textSelection":true,"answerMode":null},{"step":"S2","text":"这次活动让我们既学会了怎样分工，也增加了彼此之间的了解。","instruction":"用语音说出修改后的完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"一种修改方式","content":"这次活动让我们既学会了怎样分工，也加深了彼此之间的了解。","explanation":"“了解”通常和“加深”搭配，这样说更自然。"}}]},{"item":"CNQ_000010","steps":[{"step":"S1","text":"___ 小组最后一次实验没有成功，___ 大家没有马上换方案，而是重新检查了前面的记录。","instruction":"用合适的关联词补完整，并用语音说出完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"可 一个或多个不连续范围。","textSelection":true,"answerMode":null},{"step":"S2","text":"班级要做植物观察册，我们每天都记录叶子的颜色、大小和有没有长出新叶。","instruction":"用语音说出修改后的完整句子。","textSelection":false,"answerMode":"free_input","feedback":{"title":"一种修改方式","content":"班级要做植物观察册，我们每天都记录叶子的颜色、大小以及新叶的生长情况。","explanation":"原句并列的几项形式不一致，调整后表达更整齐、自然。"}}]}];
const mainFlow=items.flatMap(item=>item.steps.map(step=>({...step,item:item.item,kind:"main",nodeId:`${item.item}::${step.step}`})));
const defaultRuntimeConfig={mainFlow,branchNodes:[],routes:[]};
function createQuickRuntime(config){
 const nodes=[...config.mainFlow,...(config.branchNodes||[])],byId=new Map(nodes.map(n=>[n.nodeId,n]));
 const state={currentNodeId:nodes[0]?.nodeId??null,status:"running",firstNaturalAnswer:null,answers:[],path:[],routes:[],stopReason:null};
 if(state.currentNodeId)state.path.push({event:"enter",nodeId:state.currentNodeId,kind:byId.get(state.currentNodeId).kind||"main"});
 function routeFor(node,answer){return (config.routes||[]).find(r=>r.afterNodeId===node.nodeId&&conditionMatches(r.when,answer));}
 function conditionMatches(when,answer){if(!when)return true;const value=answer[when.field];if(Object.prototype.hasOwnProperty.call(when,"equals"))return value===when.equals;const contains=when.contains,notContains=when.notContains;const match=spec=>{if(!spec)return false;if(spec.token!==undefined)return Array.isArray(value)&&value.some(x=>x.token===spec.token);if(spec.range){const {start,end}=spec.range,source=answer.sourceText||"",selected=Array.isArray(value)?value:[];if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<=start||end>source.length)return false;for(let i=start;i<end;i++){if(/\s/u.test(source[i]))continue;if(!selected.some(x=>x.start<=i&&x.end>i))return false}return true}return false};if(contains)return match(contains);if(notContains)return !match(notContains);return false;}
 return {state,node:()=>byId.get(state.currentNodeId),submit(answer){if(state.status!=="running")return null;const node=byId.get(state.currentNodeId);const saved={...answer,nodeId:node.nodeId,nodeKind:node.kind||"main"};state.answers.push(saved);if(saved.nodeKind==="main"&&!state.firstNaturalAnswer)state.firstNaturalAnswer={...saved};const route=routeFor(node,saved);let nextId=null;if(route){nextId=route.targetNodeId;state.routes.push({type:"condition",from:node.nodeId,to:nextId,routeId:route.id||null,condition:route.when??null,observed:{field:route.when?.field??null,value:route.when?saved[route.when.field]??null:null}})}else if(node.kind==="branch"&&node.nextNodeId)nextId=node.nextNodeId;else if(node.kind==="branch"&&node.returnTo){nextId=node.returnTo;state.routes.push({type:"return",from:node.nodeId,to:nextId});}else{const ix=config.mainFlow.findIndex(x=>x.nodeId===node.nodeId);nextId=config.mainFlow[ix+1]?.nodeId??null}if(!nextId||!byId.has(nextId)){state.currentNodeId=null;state.status="completed";state.path.push({event:"complete"});return null}state.currentNodeId=nextId;state.path.push({event:node.kind==="branch"&&node.returnTo?"return":"enter",from:node.nodeId,nodeId:nextId,kind:byId.get(nextId).kind||"main"});return byId.get(nextId)},stop(reason="manual",draftAtStop=null){if(state.status!=="running")return;state.status="stopped";state.stopReason=reason;state.draftAtStop=draftAtStop;state.path.push({event:"stop",nodeId:state.currentNodeId,reason})},exportSession(){return JSON.parse(JSON.stringify({status:state.status,stopReason:state.stopReason,currentNodeId:state.currentNodeId,firstNaturalAnswer:state.firstNaturalAnswer,draftAtStop:state.draftAtStop??null,answers:state.answers,path:state.path,routes:state.routes}))}};
}

let runtime=createQuickRuntime(defaultRuntimeConfig),flow=[...mainFlow];
let feedbackState=null,stepIndex=0,selectionByStep=flow.map(()=>new Set()),selectionGroupsByStep=flow.map(()=>[]),choiceByStep=flow.map(()=>null),inputByStep=flow.map(()=>""),submittedByStep=flow.map(()=>null),tokenList=[],drag=null;
const card=document.querySelector("#card"),stepCount=document.querySelector("#stepCount"),progressFill=document.querySelector("#progressFill");
if(window.visualViewport){const syncViewportHeight=()=>document.documentElement.style.setProperty("--quick-viewport-height",`${window.visualViewport.height}px`);window.visualViewport.addEventListener("resize",syncViewportHeight);syncViewportHeight()}
function tokenize(source){let parts;if(typeof Intl.Segmenter==="function"){parts=Array.from(new Intl.Segmenter(undefined,{granularity:"word"}).segment(source),x=>({text:x.segment,start:x.index}))}else{const re=/\s+|[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}]+|[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*|[^\s]/gu;parts=Array.from(source.matchAll(re),m=>({text:m[0],start:m.index}))}return parts.filter(x=>!/^[\s]+$/u.test(x.text)).map(x=>({text:x.text,start:x.start,end:x.start+x.text.length}))}
function renderQuickMathText(target,value){const source=String(value??"");const pattern=/\\frac\{([^{}]+)\}\{([^{}]+)\}|\\frac([0-9])([0-9])|(\d+)\s*\/\s*(\d+)/g;let cursor=0;target.replaceChildren();for(const match of source.matchAll(pattern)){if(match[5]!==undefined&&(source[match.index-1]==="/"||source[match.index+match[0].length]==="/"))continue;const index=match.index;if(index>cursor)target.append(document.createTextNode(source.slice(cursor,index)));const numerator=match[1]??match[3]??match[5],denominator=match[2]??match[4]??match[6],fraction=document.createElement("span");fraction.className="quick-fraction";fraction.setAttribute("role","math");fraction.setAttribute("aria-label",`${numerator} over ${denominator}`);const top=document.createElement("span");top.className="quick-fraction__numerator";top.textContent=numerator;const bar=document.createElement("span");bar.className="quick-fraction__bar";bar.setAttribute("aria-hidden","true");const bottom=document.createElement("span");bottom.className="quick-fraction__denominator";bottom.textContent=denominator;fraction.append(top,bar,bottom);target.append(fraction);cursor=index+match[0].length}if(cursor<source.length)target.append(document.createTextNode(source.slice(cursor)))}
window.QuickMathDisplay=Object.freeze({render:renderQuickMathText});

function current(){return runtime.node()||flow[stepIndex]}
function itemProgress(step){const i=Math.max(0,items.findIndex(x=>x.item===step.item));return {index:i,total:items.length}}
function canSubmitStep(step,selected,choice,freeText=""){return (!step.textSelection||selected.size>0)&&(!step.options||choice!==null)&&(step.answerMode!=="free_input"||String(freeText).trim().length>0)}
function canSubmit(i){return canSubmitStep(flow[i],selectionByStep[i],choiceByStep[i],inputByStep[i])}
function syncSubmit(){const button=card.querySelector("#submit");if(button)button.disabled=!canSubmit(stepIndex)}
function draw(){const step=current(),p=itemProgress(step);if(feedbackState){drawFeedback();return}stepCount.textContent=`${p.index+1} / ${p.total}`;progressFill.style.width=`${(p.index+1)/p.total*100}%`;card.classList.remove("done");card.replaceChildren();let selectable=null;const scroller=document.createElement("div");scroller.className="text-scroll";const text=document.createElement("p");text.className="text-block";text.setAttribute("aria-label","题目");tokenList=tokenize(step.text);if(step.textSelection){let cursor=0;tokenList.forEach((t,i)=>{if(t.start>cursor)text.append(document.createTextNode(step.text.slice(cursor,t.start)));const span=document.createElement("span");span.className="token";span.dataset.tokenIndex=String(i);span.textContent=t.text;text.append(span);cursor=t.end});if(cursor<step.text.length)text.append(document.createTextNode(step.text.slice(cursor)));selectable=text}else QuickMathDisplay.render(text,step.text);scroller.append(text);card.append(scroller);if(selectable){for(const ev of ["pointerdown","pointermove","pointerup","pointercancel","click"])selectable.addEventListener(ev,{pointerdown:onDown,pointermove:onMove,pointerup:onUp,pointercancel:onCancel,click:onClick}[ev])}const instruction=document.createElement("p");instruction.className="instruction";instruction.textContent=step.instruction;card.append(instruction);if(step.answerMode==="free_input"){const field=document.createElement("textarea");field.id="freeInput";field.className="free-input";field.rows=1;field.autocomplete="off";field.setAttribute("aria-label","简短自由输入答案");field.placeholder="输入简短答案";field.value=inputByStep[stepIndex]||"";field.addEventListener("input",()=>{inputByStep[stepIndex]=field.value;resizeFreeInput(field);const b=card.querySelector("#submit");if(b)b.disabled=!canSubmit(stepIndex)});card.append(field);resizeFreeInput(field)}const actions=document.createElement("div");actions.className="actions";const submit=document.createElement("button");submit.className="primary";submit.id="submit";submit.textContent="提交";submit.disabled=!canSubmit(stepIndex);submit.onclick=submitCurrent;actions.append(submit);card.append(actions);paint()}
function resizeFreeInput(field){field.style.height="var(--free-input-height)";field.classList.remove("is-scrollable");const max=parseFloat(getComputedStyle(field).maxHeight),border=field.offsetHeight-field.clientHeight,height=field.scrollHeight+border;if(height>max){field.style.height=`${max}px`;field.classList.add("is-scrollable")}else field.style.height=`${Math.max(parseFloat(getComputedStyle(field).height),height)}px`}
function selectedTokensForStep(i){return [...selectionByStep[i]].sort((a,b)=>a-b).map(n=>({token:tokenList[n].text,start:tokenList[n].start,end:tokenList[n].end}))}
function selectedText(record){const src=record.sourceText||"",rs=(record.textSelection||[]).map(x=>[x.start,x.end]).sort((a,b)=>a[0]-b[0]),merged=[];for(const r of rs){const last=merged[merged.length-1];if(last&&r[0]<=last[1])last[1]=Math.max(last[1],r[1]);else merged.push(r)}return merged.map(([a,b])=>src.slice(a,b)).join(" / ")}
function advanceSubmitted(step,record){submittedByStep[stepIndex]=record;const index=stepIndex,next=runtime.submit(record);if(step.feedback){feedbackState={step,record,index};drawFeedback();return}if(next){stepIndex=flow.findIndex(n=>n.nodeId===next.nodeId);draw()}else drawComplete()}
function drawFeedback(){const {step,record,index}=feedbackState,p=itemProgress(flow[index]);stepCount.textContent=`${p.index+1} / ${p.total}`;progressFill.style.width=`${(p.index+1)/p.total*100}%`;card.classList.remove("done");card.replaceChildren();const body=document.createElement("div");body.className="feedback-scroll";const own=record.answerMode==="free_input"?record.rawInputText:selectedText(record),ownLabel=record.answerMode==="free_input"?"你的回答":"你的标记";for(const [label,value] of [[ownLabel,own],[step.feedback.title,step.feedback.content],["解析",step.feedback.explanation]]){const section=document.createElement("section");section.className="feedback-block";const h=document.createElement("h2");h.className="feedback-label";h.textContent=label;const v=document.createElement("p");v.className="feedback-value";QuickMathDisplay.render(v,value);section.append(h,v);body.append(section)}card.append(body);const actions=document.createElement("div");actions.className="actions";const next=document.createElement("button");next.className="primary";next.textContent=p.index+1===p.total?"完成":"下一题";next.onclick=()=>{feedbackState=null;if(runtime.state.status==="completed"){drawComplete();return}stepIndex=flow.findIndex(n=>n.nodeId===runtime.state.currentNodeId);draw()};actions.append(next);card.append(actions)}
function submitCurrent(){if(!canSubmit(stepIndex))return;const step=current(),selected=selectedTokensForStep(stepIndex);if(step.answerMode==="free_input"){const field=card.querySelector("#freeInput"),rawInputText=field?field.value:inputByStep[stepIndex],submittedAt=new Date().toISOString();if(field)field.blur();inputByStep[stepIndex]="";advanceSubmitted(step,{item:step.item,step:step.step,sourceText:step.text,textSelection:selected,optionChoice:null,answerMode:"free_input",rawInputText,submittedAt,probeRule:null,judgement:null});return}advanceSubmitted(step,{item:step.item,step:step.step,sourceText:step.text,textSelection:selected,optionChoice:null})}
function drawComplete(){card.classList.add("done");card.replaceChildren();const h=document.createElement("h1");h.className="step-title";h.textContent=runtime.state.status==="stopped"?"本次已停止":"已完成";const b=document.createElement("button");b.className="primary";b.textContent="复制结果";b.addEventListener("click",copyResults);card.append(h,b)}
const UNIVERSAL_QUICK_RESULT_V1_HEADER=[
 "FORMAT UNIVERSAL_QUICK_RESULT_V1",
 "Universal Quick｜结果导出协议 v1",
 "以下为一次运行结果，正文 JSON 位于本说明之后。顶层 status/stopReason/currentNodeId 表示会话状态；firstNaturalAnswer 是首条已提交 main 节点答案的快照；draftAtStop 是停止时当前节点尚未提交的草稿（正常完成时为 null）。answers 按提交顺序记录作答，path 记录实际经过的节点及结束/停止事件，routes 只列本次实际命中的路由。nodeKind 区分 main/branch，item/step/nodeId 定位节点；sourceText 是题面或文字；Choice 的提交选项保存在 optionChoice（该字段在无选项或停止草稿中可能为 null）。textSelection 保存所选 token 及其在 sourceText 中的 UTF-16 零起点半开区间。Free Input 的正式提交在 answers / firstNaturalAnswer 中以 answerMode:\"free_input\" 标识，rawInputText 是提交时原样保存的完整文本，submittedAt 是提交时间，probeRule 是本题配置的判读参考（未配置时为 null），judgement 固定为 null，表示前端未进行业务判定；这些 Free Input 字段不会出现在 Choice 答案中。停止在 Free Input 题目时，draftAtStop.rawInputText 保存当时未提交的原文；停止草稿始终带有 rawInputText、textSelection、optionChoice，其中非适用输入/选择为 null。未提交草稿不属于正式 answers，也不代表已判定答案。字段可能因节点类型而缺失；字段缺失或 null 仅表示该记录未提供相应类型的数据，不能据此推断学生表现。routes 的 from/to 是起终节点地址；只有 type:\"condition\" 的 route 才有 condition/observed，分别表示触发条件和实际观察值；return 等其他 route 可以没有这些字段，routeId 也可能为 null。recordSpec 是节点预设记录说明，evidenceLevel 是该记录的预设证据等级，feedback 是节点配置值；这些字段未配置时可能直接缺失，不保证输出 null，字段缺失不构成学生表现。Independent、Prompted、Taught 表示记录节点预设的执行条件/记录语义，不是最终能力结论。若当前批次预置了某 branch，但它未出现在本次 answers/path 中，表示本次运行没有进入该 branch；这不提供孩子在该 branch 上会如何作答的证据。Grammar 仍需结合冻结教研目标、首次真实表现及 answers/path/routes 作最终判断。",
 "【运行记录 JSON】"
].join("\n");
function formatResults(){return `${UNIVERSAL_QUICK_RESULT_V1_HEADER}\n${JSON.stringify(runtime.exportSession(),null,2)}`}
async function copyResults(event){const button=event.currentTarget,text=formatResults();let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch{}if(!copied){const field=document.createElement("textarea");field.value=text;field.setAttribute("readonly","");field.style.position="fixed";field.style.opacity="0";document.body.append(field);field.select();try{copied=document.execCommand("copy")}catch{}field.remove()}if(copied){button.textContent="已复制";button.disabled=true;setTimeout(()=>{button.textContent="复制结果";button.disabled=false},1200)}}
function targetIndex(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el||!el.classList.contains("token")||!card.contains(el))return null;return Number(el.dataset.tokenIndex)}
function onDown(e){if(e.button!==undefined&&e.button!==0)return;const ix=targetIndex(e);if(ix===null)return;drag={pointerId:e.pointerId,start:ix,end:ix,startX:e.clientX,startY:e.clientY,moved:false};if(e.pointerType==="mouse")e.preventDefault()}
function onMove(e){if(!drag||drag.pointerId!==e.pointerId)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5)drag.moved=true;const ix=targetIndex(e);if(ix===null)return;if(drag.moved){drag.end=ix;paint([Math.min(drag.start,drag.end),Math.max(drag.start,drag.end)])}}
function applySelectionOperation(groups,selected,start,end=start){
 if(start===end){const groupIndex=groups.findIndex(group=>group.includes(start));if(groupIndex>=0){for(const token of groups[groupIndex])selected.delete(token);groups.splice(groupIndex,1)}else{groups.push([start]);selected.add(start)}return}
 const merged=new Set();for(let i=Math.min(start,end);i<=Math.max(start,end);i++)merged.add(i);
 let changed=true;while(changed){changed=false;for(let i=groups.length-1;i>=0;i--){const group=groups[i];if(group.some(token=>merged.has(token))){group.forEach(token=>merged.add(token));groups.splice(i,1);changed=true}}}
 const group=[...merged].sort((a,b)=>a-b);groups.push(group);group.forEach(token=>selected.add(token));
}
function onUp(e){if(!drag||drag.pointerId!==e.pointerId)return;const d=drag;drag=null;applySelectionOperation(selectionGroupsByStep[stepIndex],selectionByStep[stepIndex],d.start,d.moved?d.end:d.start);paint();syncSubmit()}
function onCancel(){drag=null;paint()}
function onClick(e){e.preventDefault()}
function paint(preview=null){const selected=selectionByStep[stepIndex];card.querySelectorAll(".token").forEach(el=>{const i=Number(el.dataset.tokenIndex);el.classList.toggle("selected",selected.has(i)||(preview&&i>=preview[0]&&i<=preview[1]))})}

window.QuickRuntime={create:createQuickRuntime,exportSession:()=>runtime.exportSession(),stop:(draftAtStop=null)=>{runtime.stop("manual",draftAtStop);drawComplete()}};
draw();
</script>
</body>
