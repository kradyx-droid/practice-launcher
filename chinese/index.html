.copyrow{display:flex;gap:10px;margin:15px 0}.mini-btn{border-radius:10px;border:1px solid #c9ccd1;background:#fff;color:#111;padding:10px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.mini-btn:focus-visible{outline:2px solid #111}.record-view{white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;border:1px solid #e5e7eb;background:#f8f9fa;border-radius:9px;padding:10px;font-size:11px;line-height:1.5;color:#52525b}

</style></head><body><section class="card" id="card" tabindex="0" role="region" aria-label="古诗文 Quick 己亥杂诗"><header class="card-head"><div class="head-row"><div class="brand">古诗文 Quick · 己亥杂诗</div><div class="head-end"><span class="counter" id="counter"></span><button type="button" class="small-reset" id="reset" title="重新开始" aria-label="重新开始" hidden>↻</button></div></div><div class="progress" id="progress" aria-label="学习进度"></div></header><main class="content" id="main"></main><footer class="card-foot"><button type="button" id="primary" class="main-action" disabled>开始</button></footer></section><noscript><p class="noscript">需要开启 JavaScript 才能使用交互学习卡片。</p></noscript><script>
'use strict';
const ITEMS=[{"id": "JH-T00", "kind": "reading", "stage": "原文阅读", "title": "自主阅读", "context": "<p><strong>《己亥杂诗》｜龚自珍<\/strong><\/p>\n<blockquote>\n<p>九州生气恃风雷，<br />\n万马齐喑究可哀。<br />\n我劝天公重抖擞，<br />\n不拘一格降人才。<\/p>\n<\/blockquote>\n<p>先自己读一遍。<\/p>\n<p>注意三个字的读音：<\/p>\n<p><strong>恃 shì　喑 yīn　重 chóng<\/strong><\/p>\n<p>「重抖擞」的「重」读 chóng。<\/p>\n<p>这首诗中的一些词和平时的意思不太一样。我们先把四句读通，再认识诗人和他生活的时代。<\/p>\n", "button": "开始"}, {"id": "JH-T01", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "「生气」为什么不是发脾气？", "context": "<p>此前学过的《示儿》中有：<\/p>\n<blockquote>\n<p>但悲不见九州同。<\/p>\n<\/blockquote>\n<p>这里又出现了「九州」：<\/p>\n<blockquote>\n<p>九州生气恃风雷。<\/p>\n<\/blockquote>\n<p>两首诗中的「九州」都指中国。<\/p>\n<p>那么，这首诗中的「生气」是什么意思？<\/p>\n", "options": {"A": "全国的人都在生气，心里充满怒火。", "B": "中国大地充满生机与活力。", "C": "中国各地的天气变得温暖。", "D": "全国的人因为风雷而感到惊讶。"}, "reference": "B", "feedback": {"A": "这里不能按现代常见的「发脾气」理解。", "B": "正确。「生气」在这里指生机、活力。", "C": "生机不等于气温升高。", "D": "诗句关注的是国家的活力，不只是人的惊讶。"}, "explanation": "<p>「九州」是中国，「生气」是生机、活力。<\/p>\n<p>因此，「九州生气」说的是<strong>国家焕发生机<\/strong>。<\/p>\n<p>接下来看看，诗人认为这种生机需要依靠什么。<\/p>\n"}, {"id": "JH-T02", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "「恃」决定了什么关系？", "context": "<blockquote>\n<p>九州生气恃风雷。<\/p>\n<\/blockquote>\n<p>这里有一个不太常见的字：<\/p>\n<p><strong>恃（shì）：依靠、凭借。<\/strong><\/p>\n<p>「风雷」字面上指大风和雷声。<\/p>\n<p>先不急着研究诗人为什么写风雷。<\/p>\n<p>根据「恃」的意思，这句话中的关系是什么？<\/p>\n", "options": {"A": "风雷需要依靠九州的生机才能出现。", "B": "国家要焕发生机，需要依靠风雷的力量。", "C": "风雷一旦出现，国家就一定会失去生机。", "D": "国家是否有生机，与风雷没有关系。"}, "reference": "B", "feedback": {"A": "把「依靠」的方向弄反了。", "B": "正确。「九州生气」依靠的是「风雷」。", "C": "「恃」不是导致失去的意思。", "D": "忽略了「恃」连接两者的作用。"}, "explanation": "<p><strong>恃＝依靠。<\/strong><\/p>\n<p>第一句说：要让国家焕发生机，需要风雷般的力量。<\/p>\n<p>这里先弄清楚<strong>谁依靠谁<\/strong>。<\/p>\n<p>为什么诗人偏偏选择「风雷」，后面再理解。<\/p>\n"}, {"id": "JH-T03", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "「万马齐喑」是一幅怎样的画面？", "context": "<p>读第二句：<\/p>\n<blockquote>\n<p>万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p>先认识：<\/p>\n<p><strong>喑（yīn）：不出声、不能说话。<\/strong><\/p>\n<p>「齐」有一起、同时的意思。<\/p>\n<p>想象「万马齐喑」，哪幅画面最符合原句？<\/p>\n", "options": {"A": "许多匹马一起高声嘶鸣，声音此起彼伏。", "B": "一些马在嘶鸣，另一些马安静地听着。", "C": "数不清的马聚在一起，却都不发出声音。", "D": "许多匹马同时向一个方向奔跑，队伍十分整齐。"}, "reference": "C", "feedback": {"A": "「齐」对了，但「喑」恰好不是发声。", "B": "只有部分马安静，不符合「齐喑」。", "C": "正确。数量众多的马竟然全部沉默。", "D": "把「齐」理解成动作整齐，忽略了「喑」。"}, "explanation": "<p>「万马」突出数量之多。<\/p>\n<p>「齐喑」却说它们一起沉默，没有声音。<\/p>\n<p><strong>许多匹马，却一声不响。<\/strong><\/p>\n<p>这幅画面有些特别。<\/p>\n<p>它为什么会让诗人感到悲哀，我们继续读。<\/p>\n"}, {"id": "JH-T04", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "诗人怎样评价「万马齐喑」？", "context": "<blockquote>\n<p>万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p>后面还有两个需要注意的字：<\/p>\n<p><strong>究：终究、毕竟。<\/strong><\/p>\n<p><strong>哀：悲哀、令人难过。<\/strong><\/p>\n<p>诗人说「究可哀」，哪种理解最能保留他的语气？<\/p>\n", "options": {"A": "万马安静下来，也许过一会儿就会热闹，不必在意。", "B": "万马不出声只是普通现象，诗人没有特别的感受。", "C": "即使表面上很安静，这种万马无声的景象终究令人悲哀。", "D": "诗人只是觉得马群数量太多，饲养起来十分辛苦。"}, "reference": "C", "feedback": {"A": "将「终究可哀」弱化成了无须在意。", "B": "忽略了诗人明确表达的悲哀。", "C": "正确。「究可哀」带有明确的判断。", "D": "把悲哀误解成饲养马匹的困难。"}, "explanation": "<p>「究可哀」不是说可能有一点遗憾。<\/p>\n<p>诗人明确认为：<\/p>\n<p><strong>这种万马沉默的景象，终究令人悲哀。<\/strong><\/p>\n<p>现在已经读懂第二句的字面意思。<\/p>\n<p>为什么这样一幅画面会让诗人悲哀，还需要进一步理解。<\/p>\n"}, {"id": "JH-T05", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "「重抖擞」是什么意思？", "context": "<p>读第三句：<\/p>\n<blockquote>\n<p>我劝天公重抖擞。<\/p>\n<\/blockquote>\n<p>「天公」是古人想象中的天神、老天爷。<\/p>\n<p>「抖擞」就是振作精神。<\/p>\n<p>这里的「重」读 chóng。<\/p>\n<p><strong>「重抖擞」是什么意思？<\/strong><\/p>\n", "options": {"A": "因为受到重用，所以振作精神。", "B": "重新振作精神。", "C": "把身上的灰尘用力抖落下来。", "D": "比以前更加重视自己的身份。"}, "reference": "B", "feedback": {"A": "「重」不是受到重用。", "B": "正确。「重」在这里是重新、再次。", "C": "把「抖擞」误解成抖落物品。", "D": "把「重」误解成重视。"}, "explanation": "<p><strong>重＝重新。<\/strong><\/p>\n<p><strong>抖擞＝振作精神。<\/strong><\/p>\n<p>所以「我劝天公重抖擞」，就是诗人劝天公重新振作精神。<\/p>\n<p>这里先读通句意。<\/p>\n<p>为什么诗人会劝起天公来，后面会结合写作背景理解。<\/p>\n"}, {"id": "JH-T06", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "「不拘一格」到底放宽了什么？", "context": "<p>最后一句：<\/p>\n<blockquote>\n<p>不拘一格降人才。<\/p>\n<\/blockquote>\n<p>先认识两个字：<\/p>\n<p><strong>拘：拘泥、受到限制。<\/strong><\/p>\n<p><strong>格：规格、标准或方式。<\/strong><\/p>\n<p>如果说选人才时「不拘一格」，下面哪种做法最符合它的意思？<\/p>\n", "options": {"A": "不管有没有本领，所有人都应该直接录用。", "B": "只从一种出身或经历的人里面选人才。", "C": "只要某个人满足过去一直使用的固定标准，就不必再看其他方面。", "D": "不只按一种固定标准挑人，而是让不同方面有真本领的人都有机会。"}, "reference": "D", "feedback": {"A": "不拘一格不等于不要求有真本领。", "B": "仍然局限于一种出身。", "C": "仍然受单一固定标准限制。", "D": "正确。重点是打破单一限制，让不同人才有机会。"}, "explanation": "<p><strong>不拘一格＝不局限于一种固定的标准或方式。<\/strong><\/p>\n<p>它不是说随便选择，也不是说不需要能力。<\/p>\n<p>这里说的是选用人才不能只看某一种条件。<\/p>\n"}, {"id": "JH-T07", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "「降人才」中的「降」", "context": "<p>再看：<\/p>\n<blockquote>\n<p>不拘一格降人才。<\/p>\n<\/blockquote>\n<p>诗人前一句是在劝「天公」。<\/p>\n<p>联系这个说话对象，这里的「降人才」更接近什么意思？<\/p>\n", "options": {"A": "让有本领的人降低身份和职位。", "B": "让各种有本领的人降生、出现。", "C": "让有本领的人向别人投降。", "D": "把已经选出的人才全部调离原来的地方。"}, "reference": "B", "feedback": {"A": "将「降」理解成降低职位。", "B": "正确。这里是希望人才降生、出现。", "C": "混淆了「投降」与「降生」。", "D": "诗句并没有说要调离人才。"}, "explanation": "<p>这里的「降」是<strong>降生、降下<\/strong>的意思。<\/p>\n<p>「降人才」就是希望出现更多人才。<\/p>\n<p>诗人不是要求有能力的人降低身份，而是希望更多有才能的人出现。<\/p>\n"}, {"id": "JH-T08", "kind": "choice", "mode": "instant", "stage": "字词与句意", "title": "后两句连起来，诗人希望什么？", "context": "<p>现在连起来读：<\/p>\n<blockquote>\n<p>我劝天公重抖擞，<br />\n不拘一格降人才。<\/p>\n<\/blockquote>\n<p>前面已经学过「重抖擞」「不拘一格」「降人才」。<\/p>\n<p><strong>两句连起来，诗人说了什么？<\/strong><\/p>\n", "options": {"A": "诗人希望天公重新振作，不拘泥于一种方式，让各种有才能的人出现。", "B": "诗人希望有本领的人重新振作，但暂时不要出来做事。", "C": "诗人劝天公只按照原来的一种固定标准选择人才，避免改变旧办法。", "D": "诗人认为只有天上的神仙才有本领，普通人不可能成为人才。"}, "reference": "A", "feedback": {"A": "正确。将第三、四句的关键字词连成了完整愿望。", "B": "把希望人才出现误解成不让人才发挥作用。", "C": "与「不拘一格」相反。", "D": "诗人希望的是人间出现人才，而非只有神仙有本领。"}, "explanation": "<p>诗人劝天公重新振作，用不拘一格的方式让更多人才出现。<\/p>\n<p>现在四句诗的基本意思已经建立。<\/p>\n<p>但还有几个问题值得继续思考：<\/p>\n<p><strong>为什么万马沉默会令人悲哀？为什么需要风雷？诗人为什么把希望放在人才身上？<\/strong><\/p>\n<p>接下来认识诗人和他生活的时代，再回头理解这些问题。<\/p>\n"}, {"id": "JH-H00", "kind": "reading", "stage": "认识诗人", "title": "认识诗人龚自珍", "context": "<p><strong>认识龚自珍<\/strong><\/p>\n<p>龚自珍生活在<strong>清代<\/strong>，是一位诗人，也是一位关心国家社会问题的思想家。<\/p>\n<p>他曾在朝廷做官，对当时一些陈旧的制度提出过批评，希望国家能够发生改变。<\/p>\n<p>1839年，他辞官离开京城，南行途中写下了许多诗，合称《己亥杂诗》。<\/p>\n<p>「己亥」就是古人对1839年这一年的称呼。<\/p>\n<p><strong>这首诗还有一段特别的写作背景。<\/strong><\/p>\n<p>龚自珍经过镇江时，看见人们正在举行祭祀天神、风神和雷神的活动。<\/p>\n<p>有人请他写祭祀用的文字。<\/p>\n<p>于是，诗中的「天公」「风雷」，就与他看到的场景联系了起来。<\/p>\n", "button": "继续思考"}, {"id": "JH-H01", "kind": "choice", "mode": "instant", "stage": "作者与历史", "title": "诗人为什么借用了「风雷」「天公」？", "context": "<p>刚才知道，龚自珍曾在朝廷做官，关心国家的问题。<\/p>\n<p>他经过镇江时，又看到了祭祀天神、风神和雷神的活动。<\/p>\n<p>把这两件事放在一起想。<\/p>\n<p><strong>诗中的「风雷」「天公」，更可能起到什么作用？<\/strong><\/p>\n", "options": {"A": "诗人只想记录当天祭祀活动中出现了什么天气。", "B": "诗人借祭祀场景中的天公、风雷，表达自己对国家现实的思考和期待。", "C": "诗人主要想告诉大家，镇江的祭祀活动十分热闹，值得前来观看。", "D": "诗人认为只要多举行祭祀活动，就不需要再考虑社会中的问题。"}, "reference": "B", "feedback": {"A": "真实场景提供了写作材料，但不能解释诗中对国家和人才的关切。", "B": "正确。诗人借熟悉的祭神形象，寄托了更深的想法。", "C": "诗里并没有着重介绍祭祀活动的热闹。", "D": "诗人关心的是社会现实，不是把祭祀当作解决一切问题的办法。"}, "explanation": "<p>龚自珍借用了当时见到的祭神场景，却没有只写祭神。<\/p>\n<p>他还把自己对国家现实的思考写进了诗里。<\/p>\n<p>当时清代社会的一些制度比较陈旧，人们表达不同意见、施展才能，也会受到种种限制。<\/p>\n<p>对于一个希望国家有所改变的诗人来说，这样的社会局面值得忧虑。<\/p>\n<p>现在再回头看：<\/p>\n<blockquote>\n<p>九州生气恃风雷，<br />\n万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p><strong>「风雷」和「万马齐喑」就不一定只是天气和马群了。<\/strong><\/p>\n"}, {"id": "JH-T09", "kind": "choice", "mode": "instant", "stage": "文学理解", "title": "「万马齐喑」为什么可哀？", "context": "<blockquote>\n<p>万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p>刚才已经知道，「万马齐喑」的字面画面是许多匹马全部沉默。<\/p>\n<p>再联系龚自珍所处的时代。<\/p>\n<p><strong>如果诗人是在借这幅景象表现当时的社会，哪种理解更贴近他的意思？<\/strong><\/p>\n", "options": {"A": "社会秩序非常好，人人都能安心生活，所以诗人赞美这种安静。", "B": "许多人即使有想法，也难以发出自己的声音，整个社会显得沉闷、缺少活力。", "C": "人们虽然不愿说话，但大家的本领都能得到充分发挥，所以不需要改变。", "D": "诗人主要担心朝廷缺少战马，因此无法组织强大的军队。"}, "reference": "B", "feedback": {"A": "把沉默理解成理想的安定，忽略了「可哀」。", "B": "正确。万马无声让人联想到社会受到压抑、缺乏生气。", "C": "既然不需要改变，就难以解释诗人为什么感到悲哀。", "D": "将诗中的马理解成实际军需，偏离了诗人的社会关切。"}, "explanation": "<p>诗人借「万马齐喑」表现一种令人压抑的社会状态：<\/p>\n<p><strong>人们缺少表达和施展才能的机会，社会显得沉闷、缺乏活力。<\/strong><\/p>\n<p>这不是在讨论马为什么不叫。<\/p>\n<p>现在回头看，「究可哀」就有了更深的含义。<\/p>\n"}, {"id": "JH-T10", "kind": "choice", "mode": "instant", "stage": "文学理解", "title": "为什么偏偏需要「风雷」？", "context": "<p>再读第一句：<\/p>\n<blockquote>\n<p>九州生气恃风雷。<\/p>\n<\/blockquote>\n<p>前面已经读懂：<\/p>\n<p>「生气」是生机，「恃」是依靠。<\/p>\n<p>现在也知道了「万马齐喑」表现社会沉闷。<\/p>\n<p><strong>诗人为什么希望出现「风雷」般的力量？<\/strong><\/p>\n", "options": {"A": "因为雷声很响，足以把不愿说话的人全部吓得开口。", "B": "因为风雷是国家兴旺的自然条件，只要天气变化，社会问题就会消失。", "C": "因为风雷有强烈的力量感，诗人借它表达打破沉闷局面、推动社会改变的愿望。", "D": "因为诗人喜欢狂风暴雨，认为越猛烈的自然灾害越好。"}, "reference": "C", "feedback": {"A": "把诗中的改变缩小成用雷声吓人。", "B": "误把自然天气当成解决社会问题的直接办法。", "C": "正确。风雷象征能够冲破沉闷、带来变化的力量。", "D": "诗人期待的是国家焕发生机，不是自然灾害。"}, "explanation": "<p>「万马齐喑」让人想到<strong>沉闷、没有活力<\/strong>。<\/p>\n<p>「风雷」则让人想到<strong>强烈、足以打破沉闷的力量<\/strong>。<\/p>\n<p>诗人希望借这样的力量推动社会变化，让国家重新焕发生机。<\/p>\n"}, {"id": "JH-T11", "kind": "choice", "mode": "instant", "stage": "文学理解", "title": "诗人为什么要「劝天公」？", "context": "<blockquote>\n<p>我劝天公重抖擞，<br />\n不拘一格降人才。<\/p>\n<\/blockquote>\n<p>龚自珍经过镇江时，曾看到人们祭祀天神的场景。<\/p>\n<p>在诗中，他却不只是向天公祈求平安，而是劝天公重新振作，让更多人才出现。<\/p>\n<p><strong>这样的写法有什么特别之处？<\/strong><\/p>\n", "options": {"A": "诗人只是想借写诗宣传一次祭祀活动。", "B": "诗人用对天公说话的想象方式，把自己希望改变现状、让人才出现的愿望表达出来。", "C": "诗人认为人才只可能出现在天上，不可能在人间发挥作用。", "D": "诗人主要想劝天公以后不要再让风和雷出现。"}, "reference": "B", "feedback": {"A": "忽略了诗人对国家和人才的期待。", "B": "正确。向天公发出劝告，是表达强烈愿望的一种诗歌写法。", "C": "「降人才」期待的是人间出现有才能的人。", "D": "前面诗句恰恰期待风雷般的力量。"}, "explanation": "<p>诗人借向天公说话的方式，表达自己的期待。<\/p>\n<p>他希望改变沉闷的现实，让更多有才能的人出现。<\/p>\n<p><strong>诗里是在劝天公，诗外表达的却是对现实社会的主张。<\/strong><\/p>\n<p>这里不必把「天公」机械地认定为某一位具体人物。<\/p>\n"}, {"id": "JH-T12", "kind": "choice", "mode": "instant", "stage": "文学理解", "title": "为什么诗人最后落到了「人才」？", "context": "<p>现在重新读完整首诗：<\/p>\n<blockquote>\n<p>九州生气恃风雷，<br />\n万马齐喑究可哀。<br />\n我劝天公重抖擞，<br />\n不拘一格降人才。<\/p>\n<\/blockquote>\n<p>前两句写到国家需要生机，也写出诗人对沉闷现实的悲哀。<\/p>\n<p>后两句却没有继续诉说悲哀，而是提出了对人才的期待。<\/p>\n<p><strong>为什么诗人要这样写？<\/strong><\/p>\n", "options": {"A": "因为他认为国家不需要改变，只要多写一些赞美人才的诗就够了。", "B": "因为他希望国家恢复古代的马匹数量，人才可以帮助饲养和训练战马。", "C": "因为他只想让自己重新得到官职，并不关心其他有才能的人。", "D": "因为他认为要改变沉闷的局面，就需要打破限制，让不同方面有真本领的人得到机会，为国家带来新的力量。"}, "reference": "D", "feedback": {"A": "忽略了诗人对社会改变的期待。", "B": "把比喻理解成实际的马匹问题。", "C": "将诗人的主张缩小成个人求官。", "D": "正确。期待人才涌现，是诗人提出的改变现实的重要方向。"}, "explanation": "<p>现在把全诗连起来看。<\/p>\n<p><strong>「九州生气恃风雷」<\/strong>：诗人希望国家能够依靠强大的变革力量，重新焕发生机。<\/p>\n<p><strong>「万马齐喑究可哀」<\/strong>：当时社会沉闷、缺少活力，使诗人感到悲哀。<\/p>\n<p><strong>「我劝天公重抖擞」<\/strong>：诗人用劝告天公的方式，表达改变现状的强烈愿望。<\/p>\n<p><strong>「不拘一格降人才」<\/strong>：诗人希望打破对人才的种种限制，让不同方面有真本领的人都能得到机会。<\/p>\n<p>龚自珍不仅为现实感到悲哀，也对未来抱有希望。<\/p>\n<p>他认为，<strong>要让国家改变，就不能把各种有才能的人束缚住。<\/strong><\/p>\n<p>这就是本诗由现实的忧虑走向未来希望的过程。<\/p>\n"}, {"id": "JH-P01", "kind": "choice", "mode": "reference", "stage": "Practice", "title": "换一个字，关系还一样吗？", "context": "<p>原诗写：<\/p>\n<blockquote>\n<p>九州生气<strong>恃<\/strong>风雷。<\/p>\n<\/blockquote>\n<p>如果将「恃」换成「遇」：<\/p>\n<blockquote>\n<p>九州生气<strong>遇<\/strong>风雷。<\/p>\n<\/blockquote>\n<p>改写后，最明显的变化是什么？<\/p>\n", "options": {"A": "两句都表示国家的生机必须依靠风雷，因此没有明显区别。", "B": "原句强调国家焕发生机需要依靠风雷般的力量；改句主要说两者相遇，失去了这种明确的依靠关系。", "C": "改句比原句更能说明风雷是改变社会所必需的力量。", "D": "换成「遇」以后，「生气」就变成了发脾气的意思。"}, "reference": "B", "feedback": {}, "explanation": "<p>「恃」明确建立了依靠关系；「遇」主要表示遇见。换字以后，原句的意思就发生了变化。<\/p>\n"}, {"id": "JH-P02", "kind": "choice", "mode": "reference", "stage": "Practice", "title": "「万马齐喑」为什么比直接说安静更有力量？", "context": "<p>原诗写：<\/p>\n<blockquote>\n<p>万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p>如果诗人只说：<\/p>\n<blockquote>\n<p>大家都安静了。<\/p>\n<\/blockquote>\n<p>同样可以表现没有声音。<\/p>\n<p><strong>但「万马齐喑」更能表现什么？<\/strong><\/p>\n", "options": {"A": "强调马匹十分听话，因此整个社会的秩序很好。", "B": "让人知道诗人特别喜欢马，十分关注马匹的生活。", "C": "用无数匹马竟然一起沉默的画面，强化那种沉闷、压抑、缺少生气的感觉。", "D": "说明没有声音的环境总是令人舒服，因此诗人很满意。"}, "reference": "C", "feedback": {}, "explanation": "<p>「万马」数量众多，「齐喑」却一片沉默。这种鲜明的画面，让诗人对沉闷现实的悲哀更有力量。<\/p>\n"}, {"id": "JH-P03", "kind": "choice", "mode": "reference", "stage": "Practice", "title": "打破旧条件，就可以不看本领了吗？", "context": "<p>学校科技社要选拔负责制作机器人的骨干成员。<\/p>\n<p>过去有一条规定：<\/p>\n<blockquote>\n<p>必须在市级科技比赛中获过奖，才能参加选拔。<\/p>\n<\/blockquote>\n<p>现在有两位同学报名：<\/p>\n<p><strong>小林<\/strong>没有获过奖，但自己做出过能正常运行的机器人，也能讲清楚制作方法。<\/p>\n<p><strong>小方<\/strong>同样没有获过奖，很想参加，不过目前还不熟悉基本操作。<\/p>\n<p>有人提出：<\/p>\n<blockquote>\n<p>「既然要不拘一格，那就取消获奖要求，让他们直接都当骨干，不用再考察能力了。」<\/p>\n<\/blockquote>\n<p><strong>你怎样评价这个建议？<\/strong><\/p>\n", "options": {"A": "完全合理。不拘一格就是不再要求具备相关能力，只要愿意参加就应该直接录用。", "B": "不合理。只要没有获奖，不管实际有多少本领，都不能参加选拔。", "C": "取消「必须获奖」这一单一门槛是合理的，但仍应考察实际能力；可以让不同经历的同学展示本领，再决定谁能胜任。", "D": "只要有人做出过机器人，就应立即让他担任骨干，不需要再了解其他方面是否胜任。"}, "reference": "C", "feedback": {}, "explanation": "<p>「不拘一格」是打破单一选拔标准，不是取消能力要求。应当让不同的人有机会展示本领，再根据实际能力判断是否胜任。<\/p>\n"}, {"id": "JH-N00-A", "kind": "oral", "stage": "新诗口头记忆", "title": "先记住完整原诗", "context": "<p><strong>📖 记一记《己亥杂诗》<\/strong><\/p>\n<p>刚才我们已经读懂了这首诗。<\/p>\n<p>现在再读一遍，试着记住四句诗和它们的顺序。<\/p>\n<p><strong>《己亥杂诗》｜龚自珍<\/strong><\/p>\n<blockquote>\n<p>九州生气恃风雷，<br />\n万马齐喑究可哀。<br />\n我劝天公重抖擞，<br />\n不拘一格降人才。<\/p>\n<\/blockquote>\n<p>可以边读边想：<\/p>\n<p>前两句写了什么样的现实？<\/p>\n<p>后两句又提出了怎样的愿望？<\/p>\n<p>准备好了，就开始口头挖空练习。<\/p>\n", "button": "下一步"}, {"id": "JH-N00-B", "kind": "oral", "stage": "新诗口头记忆", "title": "关键字词挖空", "context": "<p><strong>第一步｜把空缺的字词说出来<\/strong><\/p>\n<p>不看完整原诗，试着口头补出空缺的位置。<\/p>\n<blockquote>\n<p>九州□□□风雷，<br />\n万马齐□究可□。<br />\n我劝天公□□□，<br />\n不拘一□□人才。<\/p>\n<\/blockquote>\n<p>从第一句开始，依次说一说。<\/p>\n<p>有想不起来的地方也没关系。<\/p>\n", "button": "下一步"}, {"id": "JH-N00-C", "kind": "oral", "stage": "新诗口头记忆", "title": "整句挖空", "context": "<p><strong>第二步｜试着接出整首诗<\/strong><\/p>\n<p>现在把四句诗都藏起来。<\/p>\n<p>你能按顺序口头说出它们吗？<\/p>\n<p><strong>《己亥杂诗》<\/strong><\/p>\n<blockquote>\n<p>① □□□□□□□，<br />\n② □□□□□□□。<br />\n③ □□□□□□□，<br />\n④ □□□□□□□。<\/p>\n<\/blockquote>\n<p>从第一句开始，能想起多少就说多少。<\/p>\n<p>忘记了某个字或某一句，也可以继续。<\/p>\n", "button": "下一步"}, {"id": "JH-N00-D", "kind": "oral", "stage": "新诗口头记忆", "title": "对照完整原诗", "context": "<p><strong>📖 核对一下<\/strong><\/p>\n<p>现在重新看看原诗。<\/p>\n<p><strong>《己亥杂诗》｜龚自珍<\/strong><\/p>\n<blockquote>\n<p>九州生气恃风雷，<br />\n万马齐喑究可哀。<br />\n我劝天公重抖擞，<br />\n不拘一格降人才。<\/p>\n<\/blockquote>\n<p>留意刚才挖空的位置。<\/p>\n<p>也看看自己有没有记混四句诗的顺序。<\/p>\n<p>接下来，完整原诗会隐藏，我们再做四道简短的记忆选择题。<\/p>\n", "button": "下一步"}, {"id": "JH-N01", "kind": "choice", "mode": "reference", "stage": "新诗记忆", "title": "这首诗怎样开头？", "context": "<p>先在心里想一想：<\/p>\n<p>《己亥杂诗》的第一句是什么？<\/p>\n", "options": {"A": "九州生气待风雷。", "B": "九州生气恃风雷。", "C": "九州生机恃风雷。", "D": "九州生气倚风雷。"}, "reference": "B", "feedback": {}, "explanation": "<blockquote>\n<p>九州生气恃风雷。<\/p>\n<\/blockquote>\n<p><strong>提示：<\/strong> 注意原诗用的是「生气」「恃」。<\/p>\n"}, {"id": "JH-N02", "kind": "choice", "mode": "reference", "stage": "新诗记忆", "title": "接出第二句", "context": "<p>先自己在心里往下接，再看选项。<\/p>\n<blockquote>\n<p>九州生气恃风雷，<\/p>\n<\/blockquote>\n<p><strong>下一句是什么？<\/strong><\/p>\n", "options": {"A": "万马齐吟究可哀。", "B": "万马齐喑竞可哀。", "C": "万马齐喑究可哀。", "D": "万马齐喑究可叹。"}, "reference": "C", "feedback": {}, "explanation": "<blockquote>\n<p>万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p><strong>提示：<\/strong> 注意「喑」「究」「哀」的准确用字。<\/p>\n"}, {"id": "JH-N03", "kind": "choice", "mode": "reference", "stage": "新诗记忆", "title": "接出第三句", "context": "<p>继续在心里接出下一句。<\/p>\n<blockquote>\n<p>万马齐喑究可哀。<\/p>\n<\/blockquote>\n<p><strong>下一句是什么？<\/strong><\/p>\n", "options": {"A": "我劝天公重抖擞。", "B": "我愿天公重抖擞。", "C": "我劝天公再抖擞。", "D": "我劝天公重振作。"}, "reference": "A", "feedback": {}, "explanation": "<blockquote>\n<p>我劝天公重抖擞。<\/p>\n<\/blockquote>\n<p><strong>提示：<\/strong> 原诗写的是「我劝」「重抖擞」。<\/p>\n"}, {"id": "JH-N04", "kind": "choice", "mode": "reference", "stage": "新诗记忆", "title": "接出最后一句", "context": "<p>已经接到第三句了。<\/p>\n<blockquote>\n<p>我劝天公重抖擞，<\/p>\n<\/blockquote>\n<p><strong>最后一句是什么？<\/strong><\/p>\n", "options": {"A": "不拘一格育人才。", "B": "不拘一格选人才。", "C": "不拘一格降人才。", "D": "不拘一格用人才。"}, "reference": "C", "feedback": {}, "explanation": "<blockquote>\n<p>不拘一格降人才。<\/p>\n<\/blockquote>\n<p><strong>提示：<\/strong> 记住最后是「降人才」。<\/p>\n"}, {"id": "JH-M01", "kind": "choice", "mode": "silent", "stage": "旧诗回收", "title": "《示儿》：根据情境找原句", "context": "<p>陆游在《示儿》中，想到将来宋朝军队收复中原的那一天。<\/p>\n<p><strong>哪一句是原诗？<\/strong><\/p>\n", "options": {"A": "王师北复中原日。", "B": "王师北定中原日。", "C": "王师归定中原日。", "D": "王师北定九州日。"}, "reference": "B", "feedback": {}, "explanation": ""}, {"id": "JH-M02", "kind": "choice", "mode": "silent", "stage": "旧诗回收", "title": "《题临安邸》：接出下一句", "context": "<p>《题临安邸》中有一句：<\/p>\n<blockquote>\n<p>山外青山楼外楼，<\/p>\n<\/blockquote>\n<p><strong>它的下一句是什么？<\/strong><\/p>\n", "options": {"A": "湖上歌舞几时休？", "B": "西湖歌舞何时休？", "C": "杭州歌舞几时休？", "D": "西湖歌舞几时休？"}, "reference": "D", "feedback": {}, "explanation": ""}];
const STORAGE_KEY='GUSHI_JIHAIZASHI_QUICK_V02_LIGHT_2_0_SESSION';
const el=(id)=>document.getElementById(id);
const card=el('card'), main=el('main'), primary=el('primary'), counter=el('counter'), progress=el('progress');
let state={index:0,selected:null,submitted:false,answers:[],completed_nodes:[],actual_path:[],oral_steps:[],started_at:new Date().toISOString(),completed_at:null};
try{const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(old&&Array.isArray(old.answers)&&old.index>=0&&old.index<=ITEMS.length)state=old;}catch(e){}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function item(){return ITEMS[state.index]}
function recordNode(it){if(!state.completed_nodes.includes(it.id)){state.completed_nodes.push(it.id);state.actual_path.push(it.id);if(it.kind==='oral')state.oral_steps.push({id:it.id,completed:true});}}
function nodeMeta(it){if(it.kind==='choice')return `${it.mode==='silent'?'静默回收':it.mode==='instant'?'互动学习':'当轮巩固'} · ${it.stage}`;return it.stage;}
function writeProgress(){const end=state.index>=ITEMS.length;counter.textContent=end?'完成':`${state.index+1} / ${ITEMS.length}`;progress.innerHTML=ITEMS.map((_,i)=>`<span class="seg ${i<state.index?'past':(!end&&i===state.index?'now':'')}"></span>`).join('');}
function hasAnswered(){return state.selected!==null}
function render(){writeProgress();el('reset').hidden=state.index===0&&state.answers.length===0;if(state.index>=ITEMS.length){renderEnd();return;}
const it=item(); const kind=it.kind; const isPoem=(it.id==='JH-T00'||kind==='oral');
const opts=kind==='choice'?`<div class="choice-list" role="group" aria-label="选择答案">${Object.entries(it.options).map(([code,label])=>{let cls='',hide=false;let disabled=false;
if(state.submitted){disabled=true;hide=code!==state.selected&&code!==it.reference;if(code===it.reference)cls='correct';else if(code===state.selected)cls='incorrect';}
else if(code===state.selected)cls='selected';
return `<button type="button" class="option ${cls} ${hide?'hidden':''}" data-option="${code}" ${disabled?'disabled':''} aria-pressed="${code===state.selected}" ><span class="opt-letter">${code}</span><span>${esc(label)}</span></button>`}).join('')}</div>`:'';
let feedback='';if(kind==='choice'&&state.submitted){const good=state.selected===it.reference;const per=it.feedback?.[state.selected];const explanation=it.explanation||''; feedback=`<div class="feedback-title ${good?'good':'bad'}">${good?'答对了':'答错了'}</div>${per?`<div class="feedback-note">${esc(per)}</div>`:''}${explanation?`<div class="explain">${explanation}</div>`:''}`;}
main.className=`content ${isPoem?'poem-view':''} ${kind==='oral'?'oral-view':''}`;
main.innerHTML=`<span class="eyebrow">${esc(nodeMeta(it))}</span><h1 class="node-title">${esc(it.title)}</h1><div class="kid-text">${it.context}</div>${opts}${feedback}`;
main.scrollTop=0;
for(const btn of main.querySelectorAll('[data-option]'))btn.addEventListener('click',()=>{if(state.submitted)return;state.selected=btn.dataset.option;save();render();card.focus({preventScroll:true});});
primary.disabled=kind==='choice'&&!state.submitted&&!hasAnswered();primary.textContent=kind==='choice'?(state.submitted?'下一题':'提交答案'):(it.button||'下一步');
requestAnimationFrame(checkSize);
}
function next(){if(state.index>=ITEMS.length)return;const it=item();if(it.kind==='choice'){
 if(!state.submitted){if(!hasAnswered())return;const first=state.selected;state.answers.push({id:it.id,stage:it.stage,mode:it.mode,first,reference:it.reference,correct:first===it.reference,completed:true});recordNode(it);if(it.mode==='silent'){advance();return;}state.submitted=true;save();render();return;}
 advance();return;
}
recordNode(it);advance();}
function advance(){state.index++;state.selected=null;state.submitted=false;if(state.index>=ITEMS.length){state.completed_at=new Date().toISOString();}save();render();}
function report(){const answers=state.answers;const stageStats=(test)=>{let arr=answers.filter(test);return {first_correct:arr.filter(x=>x.correct).length,total:arr.length}};
return {package_id:'JIHAIZASHI_QUICK_V02',source_work:'己亥杂诗',work_id:'GW0003',status:state.index>=ITEMS.length?'COMPLETED':'INCOMPLETE',started_at:state.started_at,completed_at:state.completed_at,completed_nodes:state.completed_nodes,actual_path:state.actual_path,answers,oral_memory:{id:'JH-N00',mode:'GUIDED_ORAL_MEMORY_PRACTICE',steps:state.oral_steps,accuracy:'NOT_COLLECTED',parent_rating:'NONE'},recitation:'OMITTED_BY_DESIGN',evidence:{teaching:'SUPPORTED_IMMEDIATE',practice:'SAME_SESSION_POST_TEACHING',new_verse:'GUIDED_ORAL_MEMORY_AND_SAME_SESSION_RECOGNITION',old_verse:'DELAYED_RECOGNITION',independent_recitation:'NO_EVIDENCE'},stats:{teaching:stageStats(x=>x.mode==='instant'),practice:stageStats(x=>x.stage==='Practice'),new_verse:stageStats(x=>x.stage==='新诗记忆'),old_verse:stageStats(x=>x.mode==='silent')},return_channel:'MANUAL_COPY_NOT_AUTOMATIC'};
}
function renderEnd(){const d=report();const s=d.stats;main.className='content';main.innerHTML=`<div class="eyebrow">执行完成 · END</div><h1 class="end-title">《己亥杂诗》学习完成 ✓</h1><p class="done-stat">本轮已保存所有首次选择与实际执行路径。口头挖空只记录完成，不记录背诵正确率。</p>
<div class="stat-box"><div class="stat-row"><span>Teaching 首答</span><strong>${s.teaching.first_correct} / ${s.teaching.total}</strong></div><div class="stat-row"><span>Practice 首答</span><strong>${s.practice.first_correct} / ${s.practice.total}</strong></div><div class="stat-row"><span>新诗文字再认</span><strong>${s.new_verse.first_correct} / ${s.new_verse.total}</strong></div><div class="stat-row"><span>旧诗静默回收</span><strong>${s.old_verse.first_correct} / ${s.old_verse.total}</strong></div><div class="stat-row"><span>口头挖空训练</span><strong>${state.oral_steps.length} / 4 步</strong></div></div>
<p class="done-stat">注意：旧诗回收没有向孩子展示正误；此处成绩只供家长查看。数据尚未自动发送到聊天。</p>
<div class="copyrow"><button type="button" id="copy" class="mini-btn">复制完整记录</button><button type="button" id="download" class="mini-btn">保存 JSON</button></div>
<pre class="record-view" id="record">${esc(JSON.stringify(d,null,2))}</pre>`;main.scrollTop=0;primary.textContent='重新学习';primary.disabled=false;
el('copy').addEventListener('click',async()=>{const text=JSON.stringify(report(),null,2);let ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(e){let area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();ok=document.execCommand('copy');area.remove();}el('copy').textContent=ok?'已复制 ✓':'请手动复制下方记录';});
el('download').addEventListener('click',()=>{let blob=new Blob([JSON.stringify(report(),null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='己亥杂诗_学习执行记录.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);});requestAnimationFrame(checkSize);}
function reset(){if(!confirm('重新开始会清除当前这台设备保存的本轮作答记录。确定继续吗？'))return;state={index:0,selected:null,submitted:false,answers:[],completed_nodes:[],actual_path:[],oral_steps:[],started_at:new Date().toISOString(),completed_at:null};save();render();}
function checkSize(){const h=primary.getBoundingClientRect().height;console.assert(Math.abs(h-48)<.1,`底部按钮不是 48px：${h}`);}
primary.addEventListener('click',()=>{if(state.index>=ITEMS.length)reset();else next();});el('reset').addEventListener('click',reset);
card.addEventListener('keydown',(e)=>{if(e.key!=='Enter'||e.repeat||e.isComposing||e.defaultPrevented||e.target.matches('input,textarea,[contenteditable]'))return;if(!card.contains(document.activeElement))return;if(e.target.closest('.option')){e.preventDefault();e.target.click();return;}if(e.target.closest('.small-reset,.mini-btn'))return;e.preventDefault();if(!primary.disabled)primary.click();});
render();
</script></body></html>
