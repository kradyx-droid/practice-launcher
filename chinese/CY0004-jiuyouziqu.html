<script id="book-data" type="application/json">{"id":"CY0004","answer":"咎由自取","maskPhrases":[],"chapters":[{"id":"lang","title":"《狼》","author":"蒲松龄 · 清","source":"蒲松龄《聊斋志异》卷六《狼三则》其二；按 CY0004 教研 FINAL v2.0 锁定电子底本","sourceUrl":"https://zh.wikisource.org/zh-hans/%E8%81%8A%E9%BD%8B%E5%BF%97%E7%95%B0/%E7%AC%AC06%E5%8D%B7","pages":[{"id":"R01","title":"夜路：两狼追来","sub":"蒲松龄《狼》 · 其二 · 第一段","blocks":[{"type":"context","text":"【编者背景｜非原文】蒲松龄写过许多紧凑而有故事味道的小文章。《狼三则》记下三件屠户遇狼的事；这里读的是第二则，一个卖肉的屠户傍晚回家，两只狼一路跟来。"},{"type":"original","text":"一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从；复投之，后狼止而前狼又至；骨已尽，而两狼之并驱如故。"}]},{"id":"R02","title":"麦场：进退之间","sub":"蒲松龄《狼》 · 其二 · 第二段","blocks":[{"type":"original","text":"屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。"}]},{"id":"R03","title":"一只狼走开了","sub":"蒲松龄《狼》 · 其二 · 第三段","blocks":[{"type":"original","text":"少时，一狼迳去；其一犬坐于前，久之，目似瞑，意暇甚。"}]},{"id":"R04","title":"柴草堆的另一边","sub":"蒲松龄《狼》 · 其二 · 第四段","blocks":[{"type":"original","text":"屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。"}]},{"id":"R05","title":"最后的笑声","sub":"蒲松龄《狼》 · 其二 · 第五段","blocks":[{"type":"original","text":"屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣！而顷刻两毙，禽兽之变诈几何哉，止增笑耳！"}]}]}],"scenes":["小乐在游戏里发现一个能让自己反复领取奖励的漏洞。队友劝他别用，他却连续几天靠这个办法抢到第一。系统后来核查异常记录，撤销了那些奖励，也暂停了他的账号。","小组排演时，阿杰坚持把其他人的台词删掉，好让自己成为全场的主角。演出那天，他的长段独白接不上布景转换，整出戏乱了节奏；同伴们决定下次不再让他独自改剧本。","一家店的老板为了多卖几盒饼干，悄悄把盒子里原来的分量减少，却仍按旧价格宣传。老顾客发现后纷纷拿着包装来询问，店里不得不公开解释，原先积累的信任也少了许多。","山间比赛设有一条平缓却绕远的标记路。小俊为了抄近道拿名次，自己翻过路障，走进泥泞的旧路，最后只得原路返回；同伴沿着正规路线早已抵达终点。","为赶在同学前面展示模型，阿宁没等胶水干就把所有零件装了上去。老师提醒过先固定底座，他却嫌耽误时间。展台刚移动，模型便歪向一侧，整晚的抢工只好重新来过。","班长把大家的意见整理成汇报稿时，删掉了几条与自己想法不同的建议，还说全班都赞同。会上有人拿出原始讨论记录，他只好当场说明删改的缘由，老师让大家重新讨论。","棋盘上，小希明明看到了对手暗藏的威胁，却舍不得放弃眼前那枚看似唾手可得的棋子。她执意吃子，下一步自己的主将反而落入包围，只能认输。","学校义卖前，有人提议把宣传海报上的价格写清楚。负责摊位的小哲为了吸引更多顾客，故意把‘每份’两个字去掉。大家按海报上的低价付款时，他再也解释不清，摊位只得按承诺出售。","小禾在网上发布了一条没有核实的传闻，见关注的人越来越多，还添了几句夸张的话。消息被证实不实后，大家翻出他先前的帖子，他发出的正式说明也很难再让人相信。","为了赢得拔河赛，一位队员故意把约定的口令改成只有自己知道的暗号。他本想借机显得厉害，可队友听不懂节奏，绳子一下失了配合；赛后没人再愿意跟他这样组队。","合唱排练时，领唱总是擅自把最后一句唱得更高，好突出自己的声音。老师多次提醒要听整体和声。正式演出时，他抢出的高音盖住了收尾，原本整齐的一段反倒走了调。","园艺社的成员分好了浇水任务，小森却为了证明自己最勤快，每天偷偷给同一盆花加水，也不看泥土已经湿透。过了些日子，花根腐烂，原想得到表扬的人还得向组员解释发生了什么。","一位画师为了早些交稿，把同伴提醒过的画面错误藏在最底层，想着印刷时看不出来。作品制成大幅展板后，那个错误格外醒目；展板只能重印，交期反而拖后了。","图书馆借阅到期前，阿望接连收到两次归还提醒。他明明已经看完，却故意拖着不还，只因还想把书留在自己手边。等他终于送回去时，借阅权限已被暂时限制，正想看的新书也借不成了。","故事里的狐狸嫌分到的果子不够多，偷偷把所有成熟的果子都搬进自己的洞穴，不许别的动物靠近。果子堆得太密，许多很快腐烂了；它费力藏起的一大堆，最后几乎吃不了。","老师把实验步骤写得很清楚，小齐却觉得称量太麻烦，直接估出试剂用量，还把估算的数据写成精确记录。实验结果与所有小组差得很远，复核时找不到原始称量数据，只得重新做。","一家小剧场的负责人临时把演出提前半小时，觉得发通知太麻烦，便只告诉演员。观众按票面时间赶来，看见演出已经开始，要求退票；那天原本想节省的通知费用，反而换来更多损失。","两个朋友约好轮流守门，小博为了多进几个球，每次轮到自己都找借口换人。后来其他人重新组队时没人愿意与他一组，他才发现总让别人替自己出力，会丢掉最想要的上场机会。","一位主播想让视频看起来更惊险，故意把普通的小故障说成严重事故。观众一开始蜂拥而至，后来知道事情经过，许多人退了关注；下一次他真的想提醒大家留意问题，却很少有人相信。","机器人比赛前，队长为了不让别人知道设计细节，拒绝和负责程序的队友共享最新零件尺寸。比赛时机械臂总抓不稳目标，因为程序还按旧尺寸运行，队长也失去了原想独占的好成绩。","小雨负责替班级保管活动照片。她为了让自己的镜头显得特别，未经同意就删掉了同学拍的原片，连备份也没有留。老师后来要用其中几张做展板，大家找不到文件，只能把摄影任务交给别人。","市场里一个卖花的商贩为了多挣一点钱，故意把几枝快枯萎的花藏进花束中间。顾客第二天发现后拿着花回来，同街的邻居也听说了这件事；往后的好花，反而不容易卖出去了。","故事里的城堡管家怕别人分走功劳，把修钟楼的几个工匠都赶走，宣称一个人能完成。钟楼修到一半，他才发现自己不会调整齿轮，庆典当天钟声没响，众人也知道了被赶走的人做过什么。","小安为了在讨论会上显得自己更懂，一次次打断同伴，把别人的解释说成没必要听。轮到他介绍最后方案时，好几处条件答不上来；他错过的，正是同伴先前准备说明的关键内容。","动画社约定每个人负责一段镜头，小陈为了让自己的作品占更多篇幅，偷偷替换了其他人的画面。成片播出时节奏突然断开，观众看不懂故事；社团检查工程文件才发现他改过的部分。","野营队每人都要检查自己的水壶。小锋想减轻背包重量，把装满的水壶换成了半空的，出发前还声称已经准备好了。走到中途，他只能提前折返补水，错过了自己一直期待的山顶景色。","一家餐馆在菜单上写着现做，厨师长却为了省事，要求伙计把前一天没卖完的菜冒充新做的端上桌。几位熟客察觉后要求说明，餐馆只得停止营业整顿，原本想省下的时间成了更大的麻烦。","阿游在群聊里反复拿同学的口误开玩笑，别人请他停下，他还把截图发到另一个群里逗乐。后来同学们组织读书会时没有邀请他，因为大家不愿再让谈话被随意转发。","两支队伍商量好比赛前共同检查场地。一位队员为了让对手走错路线，偷偷移走了转弯处的标记牌；赛会巡查时发现移动痕迹，取消了他的参赛资格。","一名年轻学徒总想证明自己比师傅快，磨木板时一再省掉量尺寸的步骤。等到把四块木板拼在一起，边缘怎么也对不齐，他不得不拆开返工，花的时间比照着步骤做还长。","班里准备出版一本故事集。负责排版的小衡把别人的名字缩到几乎看不见，却把自己的名字放在封面中央。书印好后，几位作者拒绝再交稿，下一期故事集反而凑不齐内容。","一位商人为了抢在竞争者前面开张，明知新门店的屋顶还有漏水处，却一再推迟修理。入秋第一场大雨后，货箱被淋湿，他只能把刚摆好的商品搬走，重新修屋顶。","阿宝为了让自己的推理故事被更多人讨论，在结尾故意留下一个与前文矛盾的关键线索，还说读者看不出来。读书会上，大家几分钟便发现了漏洞，他精心设计的悬念反而失去了说服力。","学校的广播员听说比赛结果尚未正式确认，为了抢先发布消息，仍把未经核实的名单念了出去。后来成绩更正，他不得不向全校澄清；以后再公布消息时，大家都要先问一遍是否已经确认。","园区举办风筝比赛，阿洛为让自己的风筝飞得最高，擅自加上几根又长又重的装饰杆，别人提醒会失去平衡，他不肯拆。风刚起，风筝便摇摇晃晃地栽下去，他只能拿着作品回去重新调整。","电影社要共同评选海报，小路为了让自己的作品胜出，用别人的账号偷偷给自己投票。审核时系统显示异常的登录记录，投票被作废，她原本有机会参加的公开评选也取消了资格。","童话里的乌鸦嫌伙伴一起寻找食物太慢，抢先把找到的食物全藏进一条很窄的树缝。雨后树干膨胀，它再也取不出那些果实，只能眼睁睁看着自己的储藏一点点坏掉。","小轩在网上卖闲置玩具，照片里故意避开了缺少的配件，还告诉买家‘都齐全’。对方收到后要求退货，平台核对聊天记录后让他承担运费；为了图一次成交，他付出的反而更多。","音乐节筹备时，负责人为了让自己的乐队压轴，私自挪动所有人的演出时间，却没有重新通知设备组。轮到他们上台，伴奏设备还在别处调试，乐队最重视的演出只能匆忙收场。","一家小出版社答应几位插画家会保留署名，经理却觉得删掉名字可以让封面更整洁，印刷前擅自去掉。新书刚上市便受到质疑，出版社只好重新加印，经理也失去了下一本书的决定权。"]}</script>
<script>
'use strict';
const CONFIG=JSON.parse(document.getElementById('book-data').textContent);
const $=id=>document.getElementById(id);
let pageIndex=0;
let answerVisible=false;
let sceneIndex=-1;
let order=[];
let nextAt=0;
const pages=CONFIG.chapters.flatMap(ch=>ch.pages.map(page=>({ch,page})));
function make(tag,cl,content){const el=document.createElement(tag);if(cl)el.className=cl;if(content!==undefined)el.textContent=content;return el}
function append(parent,tag,cl,content){const e=make(tag,cl,content);parent.append(e);return e}
function shuffled(){const a=Array.from({length:CONFIG.scenes.length},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextScene(){if(nextAt>=order.length){const last=sceneIndex;order=shuffled();if(order.length>1&&order[0]===last){[order[0],order[1]]=[order[1],order[0]]}nextAt=0}sceneIndex=order[nextAt++];answerVisible=false;renderScene()}
function renderScene(){$('sceneText').textContent=CONFIG.scenes[sceneIndex]||'';$('answerBody').hidden=!answerVisible;$('answerToggle').textContent=answerVisible?'收起表达 −':'看看这个表达 ＋';$('answerToggle').setAttribute('aria-expanded',String(answerVisible))}
function renderOriginal(p,txt){
 const hides=[...new Set([CONFIG.answer,...(CONFIG.maskPhrases||[])])].sort((a,b)=>b.length-a.length);
 let pos=0;
 while(pos<txt.length){
  let hit=-1,phrase='';
  for(const word of hides){const at=txt.indexOf(word,pos);if(at>=0&&(hit<0||at<hit||(at===hit&&word.length>phrase.length))){hit=at;phrase=word}}
  if(hit<0){p.append(document.createTextNode(txt.slice(pos)));break}
  if(hit>pos)p.append(document.createTextNode(txt.slice(pos,hit)));
  const b=append(p,'button','idiom-mask','·'.repeat(phrase.length));b.type='button';b.setAttribute('aria-label','查看遮住的原文');
  b.dataset.reveal=phrase;b.addEventListener('click',()=>{b.textContent=phrase;b.classList.add('revealed')});pos=hit+phrase.length;
 }
}
function renderBook(){const {ch,page}=pages[pageIndex],root=$('bookScroll');root.replaceChildren();$('counter').textContent=`${pageIndex+1} / ${pages.length} 页`;$('barFill').style.width=(100*(pageIndex+1)/pages.length)+'%';$('chapterName').textContent=ch.title;$('topChapter').textContent=ch.author;
const wrap=append(root,'div','content');append(wrap,'div','section',ch.title+' · 第 '+(ch.pages.indexOf(page)+1)+' 页');append(wrap,'h1','book-title',page.title);if(page.sub)append(wrap,'div','book-subtitle',page.sub);
for(const block of page.blocks){if(block.type==='original'){const w=append(wrap,'div','prose'+(ch.id==='chang'?' poem':''));const p=append(w,'p',String(block.text).startsWith('“')?'dialogue':'');renderOriginal(p,block.text)}else if(block.type==='context'){append(wrap,'div','context',block.text)}else if(block.type==='bridge'){const e=append(wrap,'div','bridge');append(e,'span','bridge-tag',block.label||'原作有删节 · 编者说明');append(e,'div','',block.text)}else if(block.type==='pause'){append(wrap,'div','pause',block.text)}}
if(ch.source){const foot=append(wrap,'div','sourceLine',ch.source+' · ');if(ch.sourceUrl){const a=append(foot,'a','','查看原文来源');a.href=ch.sourceUrl;a.target='_blank';a.rel='noopener noreferrer'}}
$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;$('next').textContent=pageIndex===pages.length-1?'已到最后一页':'下一页 →'}
function changePage(n){if(n<0||n>=pages.length)return;pageIndex=n;renderBook();$('bookScroll').scrollTop=0}
$('prev').addEventListener('click',()=>changePage(pageIndex-1));$('next').addEventListener('click',()=>changePage(pageIndex+1));$('nextScene').addEventListener('click',nextScene);
$('answerToggle').addEventListener('click',()=>{answerVisible=!answerVisible;renderScene()});
$('tocBtn').addEventListener('click',()=>{const cover=$('toc');cover.replaceChildren();const panel=append(cover,'div','tocDialog');const header=append(panel,'div','tocH');append(header,'h2','','文学目录');const close=append(header,'button','tocClose','关闭 ✕');close.type='button';close.addEventListener('click',()=>cover.hidden=true);pages.forEach(({ch,page},idx)=>{const b=append(panel,'button','tocItem'+(idx===pageIndex?' active':''),`${String(idx+1).padStart(2,'0')}　${ch.title} · ${page.title}`);b.type='button';b.addEventListener('click',()=>{cover.hidden=true;changePage(idx)})});cover.hidden=false});
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('toc').hidden=true;return}if(e.target.closest('button,input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')changePage(pageIndex-1);if(e.key==='ArrowRight')changePage(pageIndex+1)});
$('brandId').textContent=CONFIG.id;$('answerBody').textContent=CONFIG.answer;order=shuffled();nextScene();renderBook();
</script></body></html>
