<script id="book-data" type="application/json">{"id":"CY0003","answer":"万籁俱寂","maskPhrases":["万籁此都寂"],"chapters":[{"id":"zhang","title":"《湖心亭看雪》","author":"张岱 · 明末清初","source":"张岱《湖心亭看雪》 · 《陶庵梦忆》卷三；按 CY0003 教研 FINAL 核定简体转写","sourceUrl":"https://zh.wikisource.org/zh-hans/湖心亭看雪","pages":[{"id":"Z01","title":"雪后的西湖","sub":"张岱《湖心亭看雪》 · 前半","blocks":[{"type":"context","text":"【编者背景｜非原文】张岱写下这篇小文时，回想的是明朝时的一次看雪经历。“崇祯五年”是1632年，当时明朝还存在。"},{"type":"original","text":"崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。"},{"type":"original","text":"是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云、与山、与水，上下一白。湖上影子，惟长堤一痕，湖心亭一点，与余舟一芥，舟中人两三粒而已。"}]},{"id":"Z02","title":"湖心亭里的相遇","sub":"张岱《湖心亭看雪》 · 后半","blocks":[{"type":"original","text":"到亭上，有两人铺毡对坐，一童子烧酒，炉正沸。见余大喜曰：“湖中焉得更有此人！”拉余同饮，余强饮三大白而别。问其姓氏，是金陵人，客此。"},{"type":"original","text":"及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者。”"},{"type":"bridge","label":"编者后记 · 非原文","text":"读后背景：文章后来收入《陶庵梦忆》，张岱在明朝灭亡后追忆旧日的风景和生活。这是写作时的背景，不是他在湖上看雪那晚已经发生的事。"}]}]},{"id":"chang","title":"《题破山寺后禅院》","author":"常建 · 唐","source":"常建《题破山寺后禅院》 · 据教育部《成语典》所引《全唐诗》卷一四四版本（竹径／此都寂／但余）","sourceUrl":"https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=338&la=0&webMd=2","pages":[{"id":"C01","title":"清晨走进古寺","sub":"常建《题破山寺后禅院》 · 全诗","blocks":[{"type":"context","text":"【编者背景｜非原诗】常建是唐代诗人。诗写清晨走入古寺，沿竹林小路来到寺后的花木深处。"},{"type":"original","text":"清晨入古寺，初日照高林。"},{"type":"original","text":"竹径通幽处，禅房花木深。"},{"type":"original","text":"山光悦鸟性，潭影空人心。"},{"type":"original","text":"万籁此都寂，但余钟磬音。"}]}]}],"scenes":["连下几天雪以后，山间的木屋外铺满了厚厚的白雪。夜深了，风停了，白天能听见的鸟叫和山路上的脚步声全都消失。她站在窗边，听见屋檐落下一小块积雪，随后四周又沉静下来。","黎明前，雾笼着山谷里的湖。平时会经过的游船还没出发，岸边的树林也没有风吹叶子的沙沙声。一条鱼偶尔碰出一圈涟漪，水面很快又恢复平静。","暴雨刚过去，山路上的水还在缓缓流下。雷声远去，鸟儿暂时没有鸣叫，风也停了。他站在半山亭里，忽然听见一滴水从檐角落到石阶上的声音。","深秋的稻田被薄雾盖住，收割机早已离开。往日到处响着的虫鸣不知什么时候停了，田埂上看不到人。远处一只白鹭拍了两下翅膀，随后整片田野仍旧安静。","沙漠营地熄了灯。夜空布满星星，白天刮得人睁不开眼的风现在一丝也没有。帐篷外没有脚步，也没有骆驼的铃声，偶尔有一点沙粒滑落的细响。","冬天清晨，一条小河已经结了厚冰。河边杨树光秃秃地站着，村里的炊烟尚未升起。她走上岸边时，只听见自己踩在雪上的轻微咯吱声。","沿着山间竹径走到寺院后面，游人已经离开。林间原本的说话声消散了，钟声从很远的地方传来一下，声音拖得很长，之后院落与山林仿佛一起沉了下来。","雪夜的松林里，树枝上压着蓬松的积雪。白天经过的滑雪人群早已下山，路灯只照亮一小段小径。远处雪从枝头簌地落下，声音清楚得让人吃惊。","天快亮时，湖边一座小岛还没有亮灯。水面平得能照见星光，树梢不动，岸边也听不见划桨声。他靠在船舷上，连解开绳结的动作都放得很轻。","秋天的山顶，最后一批登山者下去了。云海遮住了低处的村庄，山上的风停了，野草一动不动。她把水壶放在石头上，金属轻轻一碰，山谷里似乎还留着一点回声。","深夜的草原上，篝火已经熄灭，牛羊也安卧下来。白天此起彼伏的叫声听不见了，只有偶尔一点草叶摩擦的细响。星空下的营地像被轻轻按住了声音。","初冬的古桥横在山涧上。水浅得几乎听不到流动，树叶落尽，桥边没有游客。她走到桥中央时，听见一颗小石子落下，清脆的响声很快消失在山间。","海湾背风的一侧，清晨的潮水几乎不动。渔船还系在码头，海鸟尚未飞来，木栈道上一个人也没有。他忽然听见绳索轻碰桅杆，才发现周围有多安静。","小镇外的果园在霜后静了下来。树上只剩稀疏的叶子，采果的人早已离开，连平日忙碌的蜜蜂也看不见。她弯腰拾起一颗落果，听见草叶擦过袖口的声音。","月光照着无人经过的山路。白天热闹的瀑布声在此处已经很远，近旁的树林里没有人声，也没有风声。偶尔有一片枯叶落地，他不由得停下脚步听了一会儿。","河口的芦苇荡在凌晨被白雾包住。昨晚成群的水鸟早已安静栖息，浅滩上只有一层微光。木栈桥上的人忽然听见一滴露水落进水里。","高山牧场刚下过一场初雪。羊群被赶回圈里，牧人也回屋了，远处山脊一片苍白。小路上偶尔滚下一颗雪团，除此之外很久没有动静。","一座山里的旧观星台远离城镇。午夜过后，游客都散去，树林和草坡不再传来脚步。望远镜旁的人拧动一个小旋钮，细小的机械声显得格外清楚。","黎明前的茶山被云雾层层围住。茶农还没上山，昨夜的雨也停了，茶树间没有一丝风。石阶上落下的一滴水声，仿佛能传到很远。","深冬的峡谷里，积雪覆盖住原本崎岖的石块。溪水藏在冰层下面，往日的水声几乎听不见。两个路人在谷口停下来，突然发现彼此的呼吸声都很清晰。","晚秋的桦树林泛着浅金色。天色渐暗，觅食的鸟儿归巢，风也不再吹动枝叶。一枚叶子慢慢落在背包上，发出轻得几乎听不到的一声。","远离公路的石头村庄刚进入夜晚。家家户户关上院门，狗也伏在门边不叫了。屋顶上最后一点风铃声停住，远处的山影一层层融进夜色。","一艘小船驶进两岸高耸的峡湾。引擎关掉后，水面没有别的船只，岩壁上的树林也静静的。同行的人无意碰了一下船沿，那一声轻响在两岸间回荡。","夏末，一片山中湿地的木栈道被月光照亮。白天喧闹的游客走了，夜里的蛙声也渐渐停歇。芦苇没有摇动，偶有水珠从叶尖滑下，落进浅水里。","离村庄很远的一处枫林，凌晨刚起霜。地上落满红叶，没有车辆经过，也没有鸟群掠过。他踩在石阶上时，听到鞋底碾碎一片枯叶的脆响。","偏僻的灯塔下有一处背风的小港。午夜时分，船都安静地泊在港湾内，海面没有大的波浪。守塔人关上门，铜把手轻轻碰响，声音竟格外分明。","高原上的盐湖在日落后成了一面暗色的镜子。远处山群没有灯火，岸边无风，水鸟也不再飞动。她静静站着，连衣服摩擦的声音都能听到。","春天山谷里，最后一场细雨刚结束。树枝挂着水珠，原本在林间穿行的风停了，小鸟藏在枝叶里不作声。雨滴偶尔落在石头上，一声接着很长一段安静。","清晨的杉树林里，晨雾从树干之间缓缓飘过。林中小路空无一人，附近的溪流也隔得很远。他抬头看见一只松鼠掠过树枝，却几乎没有听见动静。","雪山脚下的冰湖边，天空刚刚变亮。周围没有车辆、行人和船只，厚雪覆盖了石岸。一小块浮冰轻轻碰到岸边，发出一下细微的声音。","农庄外的山坡上，谷仓的门已经关好。夜里风停之后，树木不再摇晃，牛羊也不再叫唤。她坐在门廊上，听见远处一声猫头鹰叫，随后四野又沉静下来。","一座高山寺庙在晨钟响过后重新静了下来。石阶上没有来客，风也没有吹动松针。墙角落下一片树叶，清脆的轻响反而让宽阔的院子显得更空。","秋天的海岛内湾，清晨没有起浪。岸边的渔网晾在木架上，船夫还没来收，礁石旁的水面只泛着极细的波纹。她听见一根湿绳慢慢滴水，四周再没有别的声响。","在无人区的一座旧驿站旁，太阳刚落到群山后面。白天的风沙停了，远处的路上没有车马，灌木丛也不再晃动。他合上水壶盖，金属的一声轻响被夜色吞没。","月夜的梅林里，雪还在慢慢飘落。白天来赏花的人已经走尽，树下的小路没有足迹。她站在枝头的白梅前，连花瓣落到雪面的声音都听不见。","一片高处的石林被薄云遮住，雨刚过，山谷的风完全停下。石柱之间没有脚步声，过去会响起的游人谈笑都不见了。远处一只鸟掠过，翅膀带出的轻响短暂地划过空谷。","山村的黎明还没传来第一声鸡鸣。屋檐下挂着的竹篮不再晃动，路边的树一动不动。小孩悄悄打开门，木门轴轻响了一下，四周依旧安静得像还没醒来。","夏天的林间，下午一场骤雨洗净了枝叶。太阳还没有重新照进来，蝉鸣和鸟鸣暂时停了，湿润的空气像凝住一般。他弯腰拾起一枚松果，能听见自己手指碰到松针的细响。","黑夜里，一条结冰的林中小路通向湖边。远处的村庄没有灯光，也没有马达声传来。她停住雪橇，原本细微的滑行声也消失了，只留下沉默的树影。","黄昏的山间梯田没有农人了。天空泛起淡紫色，远处村屋的声音到不了这里，田边树木也不摇晃。她把画笔搁进盒里，盖子的轻响仿佛打破了整面山坡的安静。"]}</script>
<script>
'use strict';
const CONFIG=JSON.parse(document.getElementById('book-data').textContent);
const $=id=>document.getElementById(id);
let pageIndex=0;
let answerVisible=false;
let sceneIndex=-1;
let order=[];
let nextAt=0;
const pages=CONFIG.chapters.flatMap(ch=>ch.pages.map(page=>({ch,page})));
function make(tag,cl,content){const el=document.createElement(tag);if(cl)el.className=cl;if(content!==undefined)el.textContent=content;return el}
function append(parent,tag,cl,content){const e=make(tag,cl,content);parent.append(e);return e}
function shuffled(){const a=Array.from({length:CONFIG.scenes.length},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextScene(){if(nextAt>=order.length){const last=sceneIndex;order=shuffled();if(order.length>1&&order[0]===last){[order[0],order[1]]=[order[1],order[0]]}nextAt=0}sceneIndex=order[nextAt++];answerVisible=false;renderScene()}
function renderScene(){$('sceneText').textContent=CONFIG.scenes[sceneIndex]||'';$('answerBody').hidden=!answerVisible;$('answerToggle').textContent=answerVisible?'收起表达 −':'看看这个表达 ＋';$('answerToggle').setAttribute('aria-expanded',String(answerVisible))}
function renderOriginal(p,txt){
 const hides=[...new Set([CONFIG.answer,...(CONFIG.maskPhrases||[])])].sort((a,b)=>b.length-a.length);
 let pos=0;
 while(pos<txt.length){
  let hit=-1,phrase='';
  for(const word of hides){const at=txt.indexOf(word,pos);if(at>=0&&(hit<0||at<hit||(at===hit&&word.length>phrase.length))){hit=at;phrase=word}}
  if(hit<0){p.append(document.createTextNode(txt.slice(pos)));break}
  if(hit>pos)p.append(document.createTextNode(txt.slice(pos,hit)));
  const b=append(p,'button','idiom-mask','·'.repeat(phrase.length));b.type='button';b.setAttribute('aria-label','查看遮住的原文');
  b.dataset.reveal=phrase;b.addEventListener('click',()=>{b.textContent=phrase;b.classList.add('revealed')});pos=hit+phrase.length;
 }
}
function renderBook(){const {ch,page}=pages[pageIndex],root=$('bookScroll');root.replaceChildren();$('counter').textContent=`${pageIndex+1} / ${pages.length} 页`;$('barFill').style.width=(100*(pageIndex+1)/pages.length)+'%';$('chapterName').textContent=ch.title;$('topChapter').textContent=ch.author;
const wrap=append(root,'div','content');append(wrap,'div','section',ch.title+' · 第 '+(ch.pages.indexOf(page)+1)+' 页');append(wrap,'h1','book-title',page.title);if(page.sub)append(wrap,'div','book-subtitle',page.sub);
for(const block of page.blocks){if(block.type==='original'){const w=append(wrap,'div','prose'+(ch.id==='chang'?' poem':''));const p=append(w,'p',String(block.text).startsWith('“')?'dialogue':'');renderOriginal(p,block.text)}else if(block.type==='context'){append(wrap,'div','context',block.text)}else if(block.type==='bridge'){const e=append(wrap,'div','bridge');append(e,'span','bridge-tag',block.label||'原作有删节 · 编者说明');append(e,'div','',block.text)}else if(block.type==='pause'){append(wrap,'div','pause',block.text)}}
if(ch.source){const foot=append(wrap,'div','sourceLine',ch.source+' · ');if(ch.sourceUrl){const a=append(foot,'a','','查看原文来源');a.href=ch.sourceUrl;a.target='_blank';a.rel='noopener noreferrer'}}
$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;$('next').textContent=pageIndex===pages.length-1?'已到最后一页':'下一页 →'}
function changePage(n){if(n<0||n>=pages.length)return;pageIndex=n;renderBook();$('bookScroll').scrollTop=0}
$('prev').addEventListener('click',()=>changePage(pageIndex-1));$('next').addEventListener('click',()=>changePage(pageIndex+1));$('nextScene').addEventListener('click',nextScene);
$('answerToggle').addEventListener('click',()=>{answerVisible=!answerVisible;renderScene()});
$('tocBtn').addEventListener('click',()=>{const cover=$('toc');cover.replaceChildren();const panel=append(cover,'div','tocDialog');const header=append(panel,'div','tocH');append(header,'h2','','文学目录');const close=append(header,'button','tocClose','关闭 ✕');close.type='button';close.addEventListener('click',()=>cover.hidden=true);pages.forEach(({ch,page},idx)=>{const b=append(panel,'button','tocItem'+(idx===pageIndex?' active':''),`${String(idx+1).padStart(2,'0')}　${ch.title} · ${page.title}`);b.type='button';b.addEventListener('click',()=>{cover.hidden=true;changePage(idx)})});cover.hidden=false});
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('toc').hidden=true;return}if(e.target.closest('button,input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')changePage(pageIndex-1);if(e.key==='ArrowRight')changePage(pageIndex+1)});
$('brandId').textContent=CONFIG.id;$('answerBody').textContent=CONFIG.answer;order=shuffled();nextScene();renderBook();
</script></body></html>
