<script id="book-data" type="application/json">{"id":"CY0002","answer":"欲言又止","chapters":[{"id":"ma","title":"《马伯乐》","author":"萧红","source":"萧红《马伯乐》 · 首学HTML所收选段","sourceUrl":"https://zh.wikisource.org/zh-hans/马伯乐","pages":[{"id":"P01","title":"一件想说又难说的事","sub":"萧红《马伯乐》 · 阅读第一页","blocks":[{"type":"context","text":"萧红是中国现代作家。《马伯乐》写的是战争年代一个普通人的生活。当时不少地方不太平，一些人不得不考虑搬到别的城市去。马伯乐原先从青岛来到上海，现在又担心上海不能久住。他和妻子、孩子暂住旅馆，下一步要去哪里、路费够不够，都需要商量。马伯乐很想问妻子带来了多少钱，好安排接下来的行程。接下来读读他到底是怎样开口的。"},{"type":"original","text":"马伯乐在街上徘徊着，越徘徊越觉得不好。让事情这样拖延下去是不好的，是不能再拖的了。他走回旅馆里，他想一上楼，直接了当地就和太太说："},{"type":"original","text":"“你到底是带来了多少钱，把钱拿出来，我们立刻规划一下，该走就走吧，上海是不好多住的。”"}]},{"id":"P02","title":"话到了嘴边","sub":null,"blocks":[{"type":"original","text":"可是当他一走进房间去，太太那冷森森的脸色，使他一看了就觉得不大好。他想要说的话，几次来到嘴边上都没敢说。马伯乐在地板上绕着圈，绕了三四个圈，到底也没敢说。"},{"type":"original","text":"他看样子说了是不大好的，一说太太一定要发脾气。因为太太是爱钱如命的，如果一问她究竟带来了多少钱，似乎他要把钱拿过来的样子。太太一听就非发脾气不可的。"},{"type":"bridge","text":"他终究没有问出来。原作接着写了这对夫妻平日怎样相处、马伯乐常怎样绕着弯子说话；这里删去相关叙述。又过了几天，这件事仍压在他心里。"},{"type":"original","text":"马伯乐除了白天叹气，夜里也叹气之外，他在旅馆里陪着太太住了三天三夜是什么也没有做。"},{"type":"original","text":"每当他想要直截了当地问一问太太到底是带来了多少钱，但到要问的时候，他就不敢啦，因为他看出来了太太的脸色不对。"}]},{"id":"P03","title":"说了几个字，又逃走","sub":null,"blocks":[{"type":"original","text":"“我们……应该……”"},{"type":"original","text":"马伯乐刚一说了三四个字，就被太太的脸色吓住了。"},{"type":"original","text":"“我们不能这样，我们……”"},{"type":"original","text":"他又勉强他说出了几个不着边际的字来，他一看太太的脸色非常之不对，说不定太太要骂他一顿的，他很害怕。他打开旅馆房间的门，下楼就逃了。"},{"type":"original","text":"而且一边下着楼梯，他一边招呼着正从楼梯往上走的约瑟："},{"type":"original","text":"“约瑟，约瑟，快上街去走走吧！”"},{"type":"original","text":"好像那旅馆的房间里边已经发生了不幸，不但马伯乐他自己要赶快地躲开，就是别人他也要把他招呼住的。"},{"type":"bridge","text":"到了第四天，他又在心里抱怨起来，并决心这回一定把钱的事问清楚。这里略去原作含粗俗语言的两段自语，继续读他如何给自己壮胆。"},{"type":"original","text":"马伯乐这回已经下了决心了，这回他可不管这一套，要问，开口就问的，用不着拐弯抹角。就问她到底是从家里带来了多少钱。马伯乐的决心已经定了。"}]},{"id":"P04","title":"气势汹汹地冲上楼","sub":null,"blocks":[{"type":"original","text":"他找了不少的理论根据之外还说了不少的警句："},{"type":"original","text":"“做人要果断。当断不断必受其乱。”"},{"type":"original","text":"“大丈夫，做起事来要直截了当。”"},{"type":"original","text":"“真英雄要敢做敢为。”"},{"type":"original","text":"“大人物要有气派。”"},{"type":"original","text":"马伯乐气冲冲地从街上走进旅馆来了。又气冲冲地走上旅馆的楼梯了。他看了三十二号是他的房间，他勇猛得和一条鲨鱼似的向着三十二号就冲去了。"},{"type":"original","text":"“做人若没有点气派还行吗？”"},{"type":"original","text":"他一边向前冲着，一边用这句话鼓动着自己的勇气。"},{"type":"original","text":"他走到三十二号的门前了，他好像强盗似的，把门一脚踢开了。非常之勇敢，好像要行凶的样子。"},{"type":"original","text":"他走进房间去一看，太太不在。"},{"type":"original","text":"他想：太太大概是在凉台上晒衣裳。"},{"type":"original","text":"于是他飞一般地快，就追到楼顶晒台上去了。"}]},{"id":"P05","title":"最后说出口的是什么？","sub":null,"blocks":[{"type":"bridge","text":"这里略去他担心自己的勇气很快会消失的几段心理活动。随后，他追到了楼顶。"},{"type":"original","text":"等他冲到了楼顶，他的勇气果然消散了。"},{"type":"original","text":"他开口和太太说了一句很温和的话，而且和他在几分钟之前所想要解决的那件严重的事情毫无关系，他向太太说："},{"type":"original","text":"“晴天里洗衣裳，一会就干了。”"},{"type":"original","text":"好像中国人的习惯，彼此一见了先说“天气哈哈哈”一样。马伯乐说完了，还很驯顺地站在太太的一旁。好像他来到晒台上就是为的和太太说这句闲话才来的。在前一分钟他满身的血气消散尽了，是一点也不差，照着他自己所预料的完全消散尽了。"},{"type":"pause","text":"读到这里，可以停一停。想想他一路冲上楼的样子，和最后说出口的话。"}]},{"id":"P06","title":"事情后来怎样了","sub":null,"blocks":[{"type":"bridge","text":"原作接下来还有许多事情，和刚才晒衣服的场景相隔了一段时间，并非紧接同一天的对话。后来妻子发现马伯乐情绪不对，猜他想要什么。他一连否认了几样东西，直到妻子主动问起钱。"},{"type":"original","text":"太太说：“你要钱吗？”"},{"type":"original","text":"马伯乐一听提到钱了，他就全身颤抖起来，他感动得不得了，他几乎要爆炸了的样子。他觉得他的心脏里边，好像中了个炸弹似的，他觉得他的心脏里边拥塞得不得了，说不定一个好好的人，就要立刻破碎了。"},{"type":"original","text":"马伯乐在这种半昏迷的状态之下，他才敢说："},{"type":"original","text":"“我要去汉口呀……”"}]},{"id":"P07","title":"原来，她是这样回答的","sub":null,"blocks":[{"type":"original","text":"太太就笑起来了，把那烫得很细的波浪的长头发，好像大菌子伞似的，伏在马伯乐的身上，说："},{"type":"original","text":"“这很容易，我以为什么了不起的事呢，就是去汉口！那么咱们就一齐去汉口吧。”说着太太就从床上跳到地上去，她跳得那么灵便而轻快，就像她长着蚂蚱腿似的。"},{"type":"original","text":"而且从床底下就把小箱子拉出来了。从箱子里就拿出来一个通红的上边闪着金字的银行的存款折。"},{"type":"original","text":"太太把这存款折就扔给马伯乐了。"},{"type":"bridge","text":"原作接着写马伯乐紧张地遮起窗帘、细看存款折的数目；这里略去这些动作。故事随后这样收束："},{"type":"original","text":"三天以后，他们就收拾了东西，离开上海了。"}]}]},{"id":"hong","title":"《红楼梦》","author":"曹雪芹","source":"《红楼梦》程甲本第二十八—二十九回","sourceUrl":"https://zh.wikisource.org/zh-hans/红楼梦（程甲本）/二十八","pages":[{"id":"P10","title":"又一位作家怎样写人物的心事","sub":"《红楼梦》· 第二十八回末","blocks":[{"type":"context","text":"曹雪芹写的《红楼梦》，很擅长用人物间的玩笑、眼神和动作写出没有明说的心事。贾宝玉与林黛玉、薛宝钗都很熟悉。书里还有一层背景：有人曾把宝玉的玉与宝钗的金锁联系起来，议论过两人的婚事，这使他们之间的相处有时有些微妙。下面，宝玉向宝钗借看一串珠子，黛玉恰好也在附近。看看这一小段发生了什么。"},{"type":"original","text":"此刻忽见宝玉笑道：“宝姐姐，我瞧瞧你的那香串子？”可巧宝钗左腕上笼着一串，见宝玉问他，少不得褪了下来。"},{"type":"bridge","text":"原作接着写宝玉注意宝钗的容貌，想起旁人议论的“金玉”之事，看得出了神。这里删去相关身体描写和心理描写数句；下面继续接回原文。"}]},{"id":"P11","title":"一个玩笑、一方手帕","sub":"第二十八回末 → 第二十九回初","blocks":[{"type":"original","text":"不觉就呆了，宝钗褪下串子来递与他也忘了接。宝钗见他呆了，自己倒不好意思的，丢下串子，回身才要走，只见林黛玉登着门槛子，嘴里咬着手帕子笑呢。宝钗道：“你又禁不得风吹，怎么又站在那风口里？”林黛玉笑道：“何曾不是在房里的。只因听见天上一声叫，出来瞧了瞧，原来是个呆雁。”宝钗道：“呆雁在那里呢？我也瞧瞧。”林黛玉道：“我才出来，他就‘忒儿’一声飞了。”口里说着，将手里帕子一甩，向宝玉脸上甩来，宝玉不知，正打在眼上，“嗳哟”了一声。"},{"type":"bridge","text":"第二十八回到这里结束。第二十九回开头又从宝玉受惊的瞬间接着写，手帕碰到眼睛仍是同一件事，不是又被甩了一次。"},{"type":"original","text":"话说宝玉正自发怔，不想黛玉将手帕子甩了来，正磞在眼睛上，倒唬了一跳，问：“是谁？”林黛玉摇着头儿笑道：“不敢，是我失了手，因为宝姐姐要看呆雁，我比给他看，不想失了手。”宝玉揉着眼睛，待要说什么，又不好说的。"}]}]}],"scenes":["老师问谁愿意代表班级参加演讲，小远抬起了手，想说自己可以试试。可看到旁边同学紧张地握着报名表，他的手停在半空，准备说的话又收了回去。","安安跑到妈妈身边，刚要承认自己弄坏了相框。见妈妈正忙着照顾生病的弟弟，她张了张口，摸了摸口袋里的碎玻璃，最后只说：“我帮你倒杯水吧。”","讨论小组作业时，阿哲发现大家把日期记错了。他准备提醒，可组长正在兴奋地讲完整个计划。阿哲伸出手示意，犹豫了一瞬，又把手放下来，等对方讲完。","哥哥正得意地展示自己做好的模型，妹妹发现一个零件装反了。她已经叫了一声“哥”，却看见哥哥满脸期待地望过来，剩下的话忽然不知该怎样说出口。","朋友问他为什么这两天闷闷不乐。他心里装着一件难过的事，几次想开口讲出来，却又担心朋友听了会替他着急。话刚到嘴边，他只轻轻摇了摇头。","图书馆里，女孩发现隔壁桌的人拿错了她的笔记本。她本想提醒，对方却正全神贯注地写字。她抬起手，又收回来，等到对方停笔才轻声开口。","爷爷说小时候很喜欢的一家糕点铺已经关门了，脸上有些失落。孙女原想问他是不是很伤心，可看到他望着街角出神，便停住了声音，陪他站了一会儿。","排练结束后，老师问大家还有没有意见。乐乐其实想说最后一段节奏太快了，可看到同学们已经收好乐器准备离开，他动了动嘴唇，终究没有接话。","爸爸问今天的比赛顺不顺利。明明已经准备说自己在最后一局出了错，却看到爸爸刚下夜班疲惫地坐下。他停了一下，把那句话留到了吃晚饭的时候。","校队公布名单后，小北发现好朋友没被选上。他很想上前安慰，但看到朋友努力装作若无其事的样子，才喊出名字便又沉默下来，不知该从哪里说起。","她本来想告诉同桌，自己下学期要转学了。那天同桌正兴冲冲地计划寒假一起去看展览。她听着计划，一连几次想插话，最后只是点了点头。","家长会上，小橙听见老师说起自己最近的进步。他想告诉老师其实有一道难题是同学帮忙讲通的，但话到了嘴边，他又犹豫要不要在这么多人面前说，最终没有开口。","邻居奶奶端来一碗热汤，说这是她第一次照着新菜谱做的。小雨尝出汤稍微咸了一点，本来想提醒，见奶奶满脸期待，就笑着道了谢，决定等下次一起做饭时再说。","小山听到朋友准备报名参加一项很难的比赛，想提醒他先看看规则。可朋友兴奋地说起自己的计划，他已经说了一个“你”，又吞下后半句，想找个不扫兴的说法。","放学路上，晓晓看见同桌独自走在前面，想问他今天为什么在课堂上突然哭了。可走近后，她发现同桌正努力平复情绪，便只轻轻叫了他的名字，没有继续追问。","晚饭后，爷爷拿出一张旧照片。小诺想问照片里那位很久没见过的亲人去了哪里，却听爷爷轻轻叹气。小诺指了指照片，又慢慢放下手，决定换个时候再问。","班长说大家都同意周五出发，小禾其实记得还有一位同学没回话。他把手从桌面抬起来，正想补充，看见会议快要结束，又慢慢放下手，决定会后再说。","外婆问新剪的头发好不好看。她原本想说刘海剪得稍短，可外婆一脸期待地照着镜子。她叫了一声“外婆”，接下来的话却停在了唇边。","小岚收到了梦寐以求的比赛入选通知。她拨通朋友的电话，正准备报喜，却听见朋友说自己刚落选。她握着手机沉默了一会儿，先问了朋友现在怎么样。","老师表扬全组完成展示，小周知道其中一张图的数据标错了。他一度抬头准备解释，看到同学们开心地击掌，又把那句话留住，想等散会后悄悄指出。","她在机场送朋友出发，原本有一大段道别的话。轮到拥抱时，她只说出一个“路上”，便停了下来，怕再多说一句就忍不住哭。","奶奶拿出一个旧相框，问孙子是否还记得照片里的人。孩子其实想问为什么那个人再也没来过，刚叫了一声“奶奶”，便看到奶奶眼眶发红，后面的话暂时没能说出。","志愿者开会时，有人提出把活动安排在周六。阿闻知道自己当天要照顾弟弟，几次准备说明，又担心影响大家的安排。主持人望过来时，他只迟疑地说了句“那个……”。","家里正热闹地庆祝姐姐考上大学。弟弟想告诉父母，自己的小提琴比赛没有进决赛。他看着桌上的蛋糕，准备开口，却又决定先把这份喜悦留给姐姐。","朋友借走的漫画书不小心弄脏了封面，拿回来时不断道歉。小宁本想说自己其实有点心疼，听见对方紧张的语气，刚说“我……”便改成“下次注意就好”。","晚自习后，他准备向同桌解释上午为什么没帮忙。见同桌正埋头做题，他拉开椅子坐下，几次侧过身想开口，最终先把准备好的纸条折进了书里。","老师问小队是否还需要一天准备展览，几个同学立刻说不用。小雨知道道具还没做好，她已经吸了一口气，想提出不同意见，却发现大家正兴冲冲地讨论布展时间。","去参加演出前，父亲帮她整理衣领。她想说自己其实有些害怕上台，可父亲一直鼓励她“你一定行”。她抬头看了看父亲，迟疑了一下，最终只是点头。","小北想向好友承认，上次那条语气生硬的信息是自己写的。两人在楼梯口遇见，他叫住对方，却见对方刚从考场出来，脸色疲惫，到了嘴边的解释又停住。","新来的同学问大家能不能一起打球。原本约好的人数已经满了，小杰很想告诉他这次排不开，可看见对方抱着球站在旁边，他张了张嘴，不知怎样开口才不显得冷淡。","妈妈从厨房端出新试做的点心，问大家喜不喜欢。哥哥已经说了好吃，妹妹想说里面的糖有点多，话刚开头，又看到妈妈忙了一下午，便停住问她有没有休息。","校长来参观社团作品，大家都在介绍自己的部分。轮到小橙时，她本想说作品最初是另一位已转学的同学提的主意，可主持人已经准备进入下一个环节。她微微举手，又收回。","一场误会过去后，阿宁想向朋友说声抱歉。两人在车站站了许久，公交车到了，她仍只说出“上次的事……”，剩下的话随着车门打开又没了下文。","她打开聊天框，想告诉从前的伙伴自己要离开这座城市。字打了几行又全部删掉。第二天见面时，她几次试着提起搬家的事，最后还是从天气聊起。","同学们在讨论一场失败的比赛，有人说全怪守门员。阿泽其实想提醒大家，还有好几个配合出了问题。他开口说了个“可”，见气氛正僵着，后面的话一时没接上。","老先生讲完一段往事，忽然问孩子们还有什么想知道。小心一直想问他最遗憾的决定是什么，可看见老人望着远处出神，她握紧笔，终究没有举手。","彩排时，导演问台词有没有问题。新演员发现其中一句话可能让观众误会。他看着已经忙了很久的大家，想举手，手指刚离开剧本又按了回去。","哥哥准备把自己画的第一幅画送给妹妹。妹妹想说画上的猫少画了一条尾巴，可哥哥正郑重地把画递过来。她指了指画角，最后却只是说：“我会好好收着。”","两人走出医院，朋友轻松地说自己没事了。阿乔本来想问他是不是还在担心，话来到嘴边，却发现朋友正努力露出笑容。阿乔没有追问，只陪他慢慢往前走。","颁奖结束后，摄影师请大家站好合影。阿莫发现获奖名单把队友的名字拼错了，想当场提醒，却又不愿打断队友难得的开心时刻，刚张开的嘴又合上了。"]}</script>
<script>
'use strict';
const CONFIG=JSON.parse(document.getElementById('book-data').textContent);
const $=id=>document.getElementById(id);
let pageIndex=0;
let answerVisible=false;
let sceneIndex=-1;
let order=[];
let nextAt=0;
const pages=CONFIG.chapters.flatMap(ch=>ch.pages.map(page=>({ch,page})));
function make(tag,cl,content){const el=document.createElement(tag);if(cl)el.className=cl;if(content!==undefined)el.textContent=content;return el}
function append(parent,tag,cl,content){const e=make(tag,cl,content);parent.append(e);return e}
function shuffled(){const a=Array.from({length:CONFIG.scenes.length},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextScene(){if(nextAt>=order.length){const last=sceneIndex;order=shuffled();if(order.length>1&&order[0]===last){[order[0],order[1]]=[order[1],order[0]]}nextAt=0}sceneIndex=order[nextAt++];answerVisible=false;renderScene()}
function renderScene(){$('sceneText').textContent=CONFIG.scenes[sceneIndex]||'';$('answerBody').hidden=!answerVisible;$('answerToggle').textContent=answerVisible?'收起表达 −':'看看这个表达 ＋';$('answerToggle').setAttribute('aria-expanded',String(answerVisible))}
function renderOriginal(p,txt){const target=CONFIG.answer;let i=0,pos=0;while((i=txt.indexOf(target,pos))>=0){if(i>pos)p.append(document.createTextNode(txt.slice(pos,i)));const b=append(p,'button','idiom-mask','····');b.type='button';b.setAttribute('aria-label','揭晓原文中遮住的四字表达');b.dataset.reveal=target;b.addEventListener('click',()=>{b.textContent=target;b.classList.add('revealed')});pos=i+target.length}p.append(document.createTextNode(txt.slice(pos)))}
function renderBook(){const {ch,page}=pages[pageIndex],root=$('bookScroll');root.replaceChildren();$('counter').textContent=`${pageIndex+1} / ${pages.length} 页`;$('barFill').style.width=(100*(pageIndex+1)/pages.length)+'%';$('chapterName').textContent=ch.title;$('topChapter').textContent=ch.author;
const wrap=append(root,'div','content');append(wrap,'div','section',ch.title+' · 第 '+(ch.pages.indexOf(page)+1)+' 页');append(wrap,'h1','book-title',page.title);if(page.sub)append(wrap,'div','book-subtitle',page.sub);
for(const block of page.blocks){if(block.type==='original'){const w=append(wrap,'div','prose'+(CONFIG.id==='CY0001'?' poem':''));const p=append(w,'p',String(block.text).startsWith('“')?'dialogue':'');renderOriginal(p,block.text)}else if(block.type==='context'){append(wrap,'div','context',block.text)}else if(block.type==='bridge'){const e=append(wrap,'div','bridge');append(e,'span','bridge-tag','原作有删节 · 编者说明');append(e,'div','',block.text)}else if(block.type==='pause'){append(wrap,'div','pause',block.text)}}
if(ch.source){const foot=append(wrap,'div','sourceLine',ch.source+' · ');if(ch.sourceUrl){const a=append(foot,'a','','查看原文来源');a.href=ch.sourceUrl;a.target='_blank';a.rel='noopener noreferrer'}}
$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;$('next').textContent=pageIndex===pages.length-1?'已到最后一页':'下一页 →'}
function changePage(n){if(n<0||n>=pages.length)return;pageIndex=n;renderBook();$('bookScroll').scrollTop=0}
$('prev').addEventListener('click',()=>changePage(pageIndex-1));$('next').addEventListener('click',()=>changePage(pageIndex+1));$('nextScene').addEventListener('click',nextScene);
$('answerToggle').addEventListener('click',()=>{answerVisible=!answerVisible;renderScene()});
$('tocBtn').addEventListener('click',()=>{const cover=$('toc');cover.replaceChildren();const panel=append(cover,'div','tocDialog');const header=append(panel,'div','tocH');append(header,'h2','','文学目录');const close=append(header,'button','tocClose','关闭 ✕');close.type='button';close.addEventListener('click',()=>cover.hidden=true);pages.forEach(({ch,page},idx)=>{const b=append(panel,'button','tocItem'+(idx===pageIndex?' active':''),`${String(idx+1).padStart(2,'0')}　${ch.title} · ${page.title}`);b.type='button';b.addEventListener('click',()=>{cover.hidden=true;changePage(idx)})});cover.hidden=false});
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('toc').hidden=true;return}if(e.target.closest('button,input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')changePage(pageIndex-1);if(e.key==='ArrowRight')changePage(pageIndex+1)});
$('brandId').textContent=CONFIG.id;$('answerBody').textContent=CONFIG.answer;order=shuffled();nextScene();renderBook();
</script></body></html>
