<script id="book-data" type="application/json">{"id":"CY0005","answer":"望眼欲穿","maskPhrases":[],"chapters":[{"id":"lu","title":"《五猖会》·节选","author":"鲁迅","source":"鲁迅《朝花夕拾·五猖会》；依据 CY0005 教研 FINAL v1.0 锁定的维基文库简体电子底本；开头两段与后段之间有明确删节","sourceUrl":"https://zh.wikisource.org/zh-hans/%E4%BA%94%E7%8C%96%E6%9C%83","pages":[{"id":"R01","title":"一次次等候","sub":"鲁迅《五猖会》· 开头节选","blocks":[{"type":"context","text":"【编者导读｜非鲁迅原文】旧时的迎神赛会有仪仗、游行和表演。小时候的鲁迅盼着看热闹，但家住得偏僻，等赛会队伍来到附近时，往往只剩很短的一点场面。这是《五猖会》开头的真实节选。"},{"type":"original","text":"孩子们所盼望的，过年过节之外，大概要数迎神赛会的时候了。但我家的所在很偏僻，待到赛会的行列经过时，一定已在下午，仪仗之类，也减而又减，所剩的极其寥寥。往往伸著颈子等候多时，却只见十几个人抬著一个金脸或蓝脸红脸的神像匆匆地跑过去。于是，完了。"},{"type":"original","text":"我常存著这样的一个希望：这一次所见的赛会，比前一次繁盛些。可是结果总是一个“差不多”；也总是只留下一个纪念品，就是当神像还未抬过之前，化一文钱买下的，用一点烂泥，一点颜色纸，一枝竹签和两三枝鸡毛所做的，吹起来会发出一种刺耳的声音的哨子，叫作“吹都都”的，吡吡地吹它两三天。"},{"type":"bridge","label":"节选跳接｜编者说明 · 非原文","text":"原作中间还写了其他赛会的见闻、有关古书和庙宇的文字。这些段落没有收进本卡；下面转到一次真正准备乘船去东关看五猖会的早晨。前后并非未经删节的连续原文。"}]},{"id":"R02","title":"终于要出发了","sub":"鲁迅《五猖会》· 连续节选从此开始","blocks":[{"type":"original","text":"因为东关离城远，大清早大家就起来。昨夜预定好的三道明瓦窗的大船，已经泊在河埠头，船椅、饭菜、茶炊、点心盒子，都在陆续搬下去了。我笑著跳著，催他们要搬得快。忽然，工人的脸色很谨肃了，我知道有些蹊跷，四面一看，父亲就站在我背后。"}]},{"id":"R03","title":"父亲让拿书","sub":"鲁迅《五猖会》· 连续节选","blocks":[{"type":"original","text":"“去拿你的书来。”他慢慢地说。"},{"type":"original","text":"这所谓“书”，是指我开蒙时候所读的《鉴略》，因为我再没有第二本了。我们那里上学的岁数是多拣单数的，所以这使我记住我其时是七岁。"},{"type":"original","text":"我忐忑著，拿了书来了。他使我同坐在堂中央的桌子前，教我一句一句地读下去。我担著心，一句一句地读下去。"},{"type":"original","text":"两句一行，大约读了二三十行罢，他说："},{"type":"original","text":"“给我读熟。背不出，就不准去看会。”"},{"type":"original","text":"他说完，便站起来，走进房里去了。"},{"type":"original","text":"我似乎从头上浇了一盆冷水。但是，有什么法子呢？自然是读著，读著，强记著，——而且要背出来。"},{"type":"original","text":"粤自盘古，生于太荒，\n首出御世，肇开混茫。"}]},{"id":"R04","title":"太阳越升越高","sub":"鲁迅《五猖会》· 连续节选","blocks":[{"type":"original","text":"就是这样的书，我现在只记得前四句，别的都忘却了；那时所强记的二三十行，自然也一齐忘却在里面了。记得那时听人说，读《鉴略》比读《千字文》、《百家姓》有用得多，因为可以知道从古到今的大概。知道从古到今的大概，那当然是很好的，然而我一字也不懂。“粤自盘古”就是“粤自盘古”，读下去，记住它，“粤自盘古”呵！“生于太荒”呵！……"},{"type":"original","text":"应用的物件已经搬完，家中由忙乱转成静肃了。朝阳照著西墙，天气很清朗。母亲、工人、长妈妈即阿长，都无法营救，只默默地静候著我读熟，而且背出来。在百静中，我似乎头里要伸出许多铁钳，将什么“生于太荒”之流夹住；也听到自己急急诵读的声音发著抖，仿佛深秋的蟋蟀，在夜中鸣叫似的。"},{"type":"original","text":"他们都等候著；太阳也升得更高了。"}]},{"id":"R05","title":"出发之后","sub":"鲁迅《五猖会》· 连续至篇末","blocks":[{"type":"original","text":"我忽然似乎已经很有把握，便即站了起来，拿书走进父亲的书房，一气背将下去，梦似的就背完了。"},{"type":"original","text":"“不错。去罢。”父亲点著头，说。"},{"type":"original","text":"大家同时活动起来，脸上都露出笑容，向河埠走去。工人将我高高地抱起，仿佛在祝贺我的成功一般，快步走在最前头。"},{"type":"original","text":"我却并没有他们那么高兴。开船以后，水路中的风景，盒子里的点心，以及到了东关的五猖会的热闹，对于我似乎都没有什么大意思。"},{"type":"original","text":"直到现在，别的完全忘却，不留一点痕迹了，只有背诵《鉴略》这一段，却还分明如昨日事。"},{"type":"original","text":"我至今一想起，还诧异我的父亲何以要在那时候叫我来背书。"},{"type":"original","text":"五月二十五日。"},{"type":"pause","text":"读完这篇节选，仍可以回想作者从期待赛会到失去兴致的变化。回忆卡只帮助重新遇见原文，不要求文学问答。"}]}]}],"scenes":["机场的到达屏一遍遍更新，小雅却一直盯着同一个航班。外婆已经在国外住了两年，今天终于回来。广播每响一次，她都踮起脚往出口望，生怕错过那个熟悉的身影。","山区里的信号断断续续。爸爸跟着救援队进山已经好几天了，家里人每天守着那部旧电话。铃声一响，全家都停下手里的事，希望听见他说一句平安。","港口的船每天清晨靠岸，爷爷总是提早来到堤边。儿子在海上工作了大半年，说好这周返航。远处只要出现一点白色船影，他便举起望远镜看个不停。","小时候的伙伴搬走五年了，答应暑假回村里看看。阿禾把两个人以前玩的棋盘擦得干干净净，天天跑到村口张望，连路过的汽车也要仔细辨认。","一整年没见到妈妈的小辰，听说她的火车下午进站。离发车还有几个小时，他已经把接站牌举在手里，坐也坐不住，不停问站台工作人员列车什么时候到。","奶奶等着医院的检查结果，医生说报告最迟周五出来。到了周五，她从早晨起就不肯离电话太远；每次消息提示亮起，都会赶紧拿起眼镜查看。","弟弟在远方参加重要的选拔，约好出考场就打电话。哥哥平时最爱打球，那天下午却把球放在门后，守着手机直到天色渐暗，想尽快知道弟弟是否顺利。","探险队的科考船在极地停留了数月。天气原因让归程一再推迟，码头上等待他们的人每天查看航行消息。终于看到船名出现在靠港名单上时，大家急忙赶往海边。","小宁寄出的第一封信已经过去三个星期。她知道山里的邮路很慢，却还是每天放学先打开家门口的信箱；哪怕里面只有广告纸，也会再翻一遍确认。","老戏迷听说一位多年未登台的演员将在家乡复出。从演出消息公布的那天起，他就把日期圈在日历上，隔三差五到剧院问售票时间，终于等到开票这一天。","春天播下的珍贵花种一直没有动静。阿澄每天清早蹲在窗边看花盆，放学回来又看一遍；盼了许久，终于有一天，他在松软泥土里发现一丝浅绿。","研究站里的一台观测仪器损坏了，替换零件必须靠补给飞机运来。队员每天记录天气、留意飞行通知，数次因暴风雪取消降落后，大家更加急切地盼着螺旋桨声出现。","住在海岛上的孩子已经好几年没见过雪。气象台预报周末可能有一场罕见的降雪，他从星期一就开始守着天气预报，夜里还拉开窗帘看天色，盼第一片雪花落下来。","奶奶答应在生日那天带来一张父亲小时候的照片。孩子提前把相框摆在书桌上，从午后到傍晚几次跑到楼梯口，听到脚步声就赶忙探头张望。","城里的少年合唱团第一次参加全国比赛，结果要到晚上公布。队员们把直播页面打开很久，晚饭也吃得匆忙。主持人终于拿起获奖名单时，每个人都屏住了呼吸。","一场暴雨冲断了山谷的桥，村里几户人家等着运药的车绕远路进来。从清晨到夜晚，他们轮流站在山路转弯处看，特别盼着那两盏熟悉的车灯早一点出现。","爷爷年轻时失散的朋友终于通过一封信联系上了，说要来见面。约好的那天，爷爷把门前的小路扫了又扫，远处每走来一个老人，他都忍不住迎上几步。","志愿者给山区学校寄去一批新书，路途遥远，中间又遇上塌方。孩子们每天看着空空的书架，向老师打听物流。终于听说卡车到了山脚，他们高兴得一齐奔出教室。","连着几个月的旱天，村里的水塘越来越浅。人们日日看云、听预报，却始终不见落雨。那天午后天边终于传来闷雷，田里忙活的人都抬起头望着乌云。","表姐在国外求学，答应年底回家过年。每到节前，家人就拿出那张全家福看看，掰着日子算她还有多久到。春节前夜，他们一直留着餐桌旁最熟悉的那把椅子。","远征队已经失联十多天。家属每天去联络处打听消息，工作人员刚走到门口，大家便围过去，想听到任何一条关于队员平安的确切消息。","小云报了心仪的夏令营，名额很少，录取名单却延期公布。她把网页收藏在最显眼的位置，每天一打开电脑就先去看看；数次刷新都没有变化，还是忍不住再试一次。","镇上很久没有放过露天电影了，听说修好的放映机星期六能回来。孩子们从周一就问大人那天会不会下雨，星期六一到，天还没暗就抱着小板凳往广场跑。","父亲在外地修复一座古桥，工程拖了很久。小博每次视频通话都会问什么时候完工，因为他盼着爸爸回来带他过河散步。那个答应的周末终于临近，他连鞋都提前准备好了。","新开的图书馆宣布将归还一批修复完成的古籍，其中有老师一直寻找的一册。她连续几周留意馆方公告，开放借阅的那天早早到门口等候，只想尽快亲眼见到书页。","妹妹第一次独自参加长途夏令营，走之前说到站会报平安。列车晚点两个小时，父母在家里来回查看车次信息；直到收到她发来的照片，紧绷的神情才松了下来。","家乡的小河多年没有出现洄游的鱼群。保护区连续几年修复河道，村民每逢春季都到岸边观察。一天清晨，水面终于闪过熟悉的银光，老人激动地叫来孩子们看。","一位老木匠答应把修好的小提琴送回学校。乐团正等它参加毕业演出，几次延期后，学生们每天都向传达室打听有没有包裹；快递车停下时，大家齐刷刷望了过去。","姐弟俩分开生活已经许多年，终于约定在旧火车站见面。姐姐从上午就在站外长椅上等，来往的人换了一拨又一拨，她依旧不肯走远，眼睛一直朝入口寻找。","少年一直盼着自己喜爱的作家给读者回信。他把认真写好的问题寄出后，几乎每天都跑去看邮箱。几个月过去，他仍小心保存着那封信的副本，盼某天能收到回答。","天文社守了一个多月的观测窗口，却总被云层挡住。预报说今晚有机会看见期待已久的彗星，社员们提前架好望远镜，盯着云层一点一点散开，谁也舍不得离开观测台。","山村里的人们一直盼着通往县城的公路修好。连下雨天都有人去工地看进度。正式通车那天，路边早早站满了人，听见第一辆班车鸣笛，欢呼声便响了起来。","因大雪被困的旅行队答应在天气转好后下山。山脚的家人一夜没合眼，不断看向白茫茫的路口，直到晨光里出现一串慢慢走近的身影，才终于跑上前去。","外公珍藏的手稿送去修复，工作人员说过程可能要半年。他每隔几周就去信询问，盼着再次看见那些已经模糊的笔迹。取回的通知一到，他当天就赶去了修复室。","小桥两边的村庄隔河相望，学生们曾经每天要绕很远的山路去上学。新桥施工的日子里，他们放学就去岸边看看。终于看到桥面连上的那天，大家舍不得回家。","画展的投稿结果迟迟没有公布。小葵已经把心里准备了无数遍，嘴上说不着急，却每天一到公布时间就去查看网站，手机有新邮件时心跳总会快上一阵。","候鸟研究小组给一只受伤的鹤装了追踪器，放飞后信号中断了很久。队员们反复查看监测地图，几乎每天都盼着那个小光点重新亮起。终于有天夜里，屏幕上出现了熟悉的编号。","母亲曾说等工作调动办妥，就带孩子搬回故乡团聚。文件审批一拖再拖，孩子每天放学第一句话都是“有消息了吗”；即使没有新进展，他仍把自己的小行李箱放在床边。","小村的老人等了几十年，终于听说以前一起唱戏的伙伴要回来。那天他把旧戏服从箱里取出，站在村口听汽车声。每当尘土从路尽头扬起，他就向前挪几步，盼那个人出现。","小镇的少年乐队得到一次和远方乐团同台的机会，但演出时间始终没有定下。每收到一封主办方邮件，他们都立刻围过来；终于见到确定日期，几个人高兴得在排练室里跳起来。"]}</script>
<script>
'use strict';
const CONFIG=JSON.parse(document.getElementById('book-data').textContent);
const $=id=>document.getElementById(id);
let pageIndex=0;
let answerVisible=false;
let sceneIndex=-1;
let order=[];
let nextAt=0;
const pages=CONFIG.chapters.flatMap(ch=>ch.pages.map(page=>({ch,page})));
function make(tag,cl,content){const el=document.createElement(tag);if(cl)el.className=cl;if(content!==undefined)el.textContent=content;return el}
function append(parent,tag,cl,content){const e=make(tag,cl,content);parent.append(e);return e}
function shuffled(){const a=Array.from({length:CONFIG.scenes.length},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextScene(){if(nextAt>=order.length){const last=sceneIndex;order=shuffled();if(order.length>1&&order[0]===last){[order[0],order[1]]=[order[1],order[0]]}nextAt=0}sceneIndex=order[nextAt++];answerVisible=false;renderScene()}
function renderScene(){$('sceneText').textContent=CONFIG.scenes[sceneIndex]||'';$('answerBody').hidden=!answerVisible;$('answerToggle').textContent=answerVisible?'收起表达 −':'看看这个表达 ＋';$('answerToggle').setAttribute('aria-expanded',String(answerVisible))}
function renderOriginal(p,txt){
 const hides=[...new Set([CONFIG.answer,...(CONFIG.maskPhrases||[])])].sort((a,b)=>b.length-a.length);
 let pos=0;
 while(pos<txt.length){
  let hit=-1,phrase='';
  for(const word of hides){const at=txt.indexOf(word,pos);if(at>=0&&(hit<0||at<hit||(at===hit&&word.length>phrase.length))){hit=at;phrase=word}}
  if(hit<0){p.append(document.createTextNode(txt.slice(pos)));break}
  if(hit>pos)p.append(document.createTextNode(txt.slice(pos,hit)));
  const b=append(p,'button','idiom-mask','·'.repeat(phrase.length));b.type='button';b.setAttribute('aria-label','查看遮住的原文');
  b.dataset.reveal=phrase;b.addEventListener('click',()=>{b.textContent=phrase;b.classList.add('revealed')});pos=hit+phrase.length;
 }
}
function renderBook(){const {ch,page}=pages[pageIndex],root=$('bookScroll');root.replaceChildren();$('counter').textContent=`${pageIndex+1} / ${pages.length} 页`;$('barFill').style.width=(100*(pageIndex+1)/pages.length)+'%';$('chapterName').textContent=ch.title;$('topChapter').textContent=ch.author;
const wrap=append(root,'div','content');append(wrap,'div','section',ch.title+' · 第 '+(ch.pages.indexOf(page)+1)+' 页');append(wrap,'h1','book-title',page.title);if(page.sub)append(wrap,'div','book-subtitle',page.sub);
for(const block of page.blocks){if(block.type==='original'){const w=append(wrap,'div','prose'+(ch.id==='chang'?' poem':''));const p=append(w,'p',String(block.text).startsWith('“')?'dialogue':'');renderOriginal(p,block.text)}else if(block.type==='context'){append(wrap,'div','context',block.text)}else if(block.type==='bridge'){const e=append(wrap,'div','bridge');append(e,'span','bridge-tag',block.label||'原作有删节 · 编者说明');append(e,'div','',block.text)}else if(block.type==='pause'){append(wrap,'div','pause',block.text)}}
if(ch.source){const foot=append(wrap,'div','sourceLine',ch.source+' · ');if(ch.sourceUrl){const a=append(foot,'a','','查看原文来源');a.href=ch.sourceUrl;a.target='_blank';a.rel='noopener noreferrer'}}
$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;$('next').textContent=pageIndex===pages.length-1?'已到最后一页':'下一页 →'}
function changePage(n){if(n<0||n>=pages.length)return;pageIndex=n;renderBook();$('bookScroll').scrollTop=0}
$('prev').addEventListener('click',()=>changePage(pageIndex-1));$('next').addEventListener('click',()=>changePage(pageIndex+1));$('nextScene').addEventListener('click',nextScene);
$('answerToggle').addEventListener('click',()=>{answerVisible=!answerVisible;renderScene()});
$('tocBtn').addEventListener('click',()=>{const cover=$('toc');cover.replaceChildren();const panel=append(cover,'div','tocDialog');const header=append(panel,'div','tocH');append(header,'h2','','文学目录');const close=append(header,'button','tocClose','关闭 ✕');close.type='button';close.addEventListener('click',()=>cover.hidden=true);pages.forEach(({ch,page},idx)=>{const b=append(panel,'button','tocItem'+(idx===pageIndex?' active':''),`${String(idx+1).padStart(2,'0')}　${ch.title} · ${page.title}`);b.type='button';b.addEventListener('click',()=>{cover.hidden=true;changePage(idx)})});cover.hidden=false});
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('toc').hidden=true;return}if(e.target.closest('button,input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')changePage(pageIndex-1);if(e.key==='ArrowRight')changePage(pageIndex+1)});
$('brandId').textContent=CONFIG.id;$('answerBody').textContent=CONFIG.answer;order=shuffled();nextScene();renderBook();
</script></body></html>
