<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('card-data').textContent);
const card=document.getElementById('poem-card'), comment=document.getElementById('parent-comment'),status=document.getElementById('copy-status'),copyBtn=document.getElementById('copy-result');
const STORAGE='GW0004-shaonianzhongguoshuo-recall-v1';
let level='high',activePanel='verse',states={};
const labels={author:'作者',era:'时代'};
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x;}
function mask(text,id,desc,kind){const b=el('button','mask');b.type='button';b.dataset.item=id;b.dataset.state=String(states[id]||0);b.dataset.desc=desc;b.dataset.kind=kind||'misc';b.setAttribute('aria-label','揭晓：'+desc);b.appendChild(el('span','ink',text));return b;}
function decorate(parent,text,ranges,id,desc){let p=0;for(let i=0;i<ranges.length;i++){const [s,e]=ranges[i];if(s>p)parent.appendChild(el('span','plain-punc',text.slice(p,s)));const k=`${id}-${level}-${i}`;parent.appendChild(mask(text.slice(s,e),k,`${desc}｜${text.slice(s,e)}`,'verse'));p=e;}if(p<text.length)parent.appendChild(el('span','plain-punc',text.slice(p)));}
function group(container,title,index){const g=el('section','group');const h=el('h2','',title);h.appendChild(el('span','group-number',index));g.appendChild(h);container.appendChild(g);return g;}
function syncMeta(){card.querySelectorAll('.meta .mask').forEach(b=>b.dataset.state=String(states[b.dataset.item]||0));}
function buildVerses(){const root=document.getElementById('verse-groups');root.replaceChildren();let current='',block=null,count=0;for(const v of data.verses){if(v.section!==current){current=v.section;count=0;block=group(root,current,'');block.appendChild(el('div','verse-list'));}count++;const row=el('div','verse-line');row.appendChild(el('span','line-number',String(count).padStart(2,'0')));const words=el('div','verse-text');decorate(words,v.text,v.ranges[level],v.id,v.text);row.appendChild(words);block.lastElementChild.appendChild(row);}card.querySelectorAll('.level').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===level)));}
function buildNotes(){const root=document.getElementById('note-groups');root.replaceChildren();for(const section of data.notes){const g=group(root,section.title,`${section.items.length} 项`);const grid=el('div','notes-grid');for(const item of section.items){const cardN=el('div','note-card');const head=el('div','note-head');head.appendChild(el('span','note-term',item.term));head.appendChild(el('span','note-source',item.source==='教研整理'?'':item.source));cardN.appendChild(head);const answer=el('div','note-answer');answer.appendChild(mask(item.answer,item.id,`注释·${item.term}`,'note'));cardN.appendChild(answer);grid.appendChild(cardN);}g.appendChild(grid);}}
function buildMeanings(){const root=document.getElementById('meaning-groups');root.replaceChildren();let i=0;for(const section of data.meanings){const g=group(root,section.title,`${section.items.length} 组`);const box=el('div','meaning-list');for(const item of section.items){i++;const c=el('div','meaning-card');const p=el('div','meaning-prompt');p.appendChild(el('span','meaning-index',String(i).padStart(2,'0')));p.appendChild(document.createTextNode(item.prompt));const a=el('div','meaning-answer');a.appendChild(mask(item.answer,item.id,`句意·${item.prompt}`,'meaning'));c.append(p,a);box.appendChild(c);}g.appendChild(box);}}
function buildLinks(){const root=document.getElementById('link-groups');root.replaceChildren();const box=el('div','link-list');for(const item of data.links){const c=el('div','link-card');c.appendChild(el('div','link-prompt',item.prompt));const a=el('div','link-answer');a.appendChild(mask(item.answer,item.id,`全文联系·${item.prompt}`,'link'));c.appendChild(a);box.appendChild(c);}root.appendChild(box);}
function setPanel(name,noScroll=false){activePanel=name;card.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==name);card.querySelectorAll('.view').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===name)));if(!noScroll){const scroller=document.getElementById('scroll-area');scroller.scrollTop=0;}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({states,comment:comment.value,activePanel,editedAt:new Date().toISOString()}));}catch(e){/* offline/private mode */}}
function restore(){try{const v=JSON.parse(localStorage.getItem(STORAGE)||'null');if(v&&v.states&&typeof v.states==='object'){states=Object.fromEntries(Object.entries(v.states).filter(([k,x])=>[0,1,2].includes(Number(x))).map(([k,x])=>[k,Number(x)]));}if(v&&typeof v.comment==='string')comment.value=v.comment;if(v&&['verse','notes','meaning'].includes(v.activePanel))activePanel=v.activePanel;else if(v?.activePanel==='links')activePanel='meaning';}catch(e){}level='high';}
function reset(){states={};comment.value='';level='high';status.textContent='';buildVerses();buildNotes();buildMeanings();buildLinks();syncMeta();save();}
function dateNow(){const d=new Date(),two=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;}
function verseModeStatus(v,mode){
  const marks=v.ranges[mode].map(([a,b],i)=>({text:v.text.slice(a,b),state:Number(states[`${v.id}-${mode}-${i}`]||0)}));
  const revealed=marks.filter(m=>m.state>0),weak=marks.filter(m=>m.state===2).map(m=>m.text);
  if(!revealed.length)return {t:'未揭晓',touched:false};
  let t=revealed.length===marks.length?'已揭晓':`部分揭晓（${revealed.length}/${marks.length}处）`;
  if(weak.length)t+=`；不熟练：${[...new Set(weak)].join('、')}`;
  return {t,touched:true};
}
function result(){
  const modes={low:'低',mid:'中',high:'高'};
  const a=[`古诗文回收卡｜GW0004｜少年中国说（节选）`,`记录时间：${dateNow()}`,`原文挖空档：${modes[level]}`];
  a.push('',`【原文背诵】`);
  let lastSection='';
  for(const v of data.verses){
    
    if(v.section!==lastSection){lastSection=v.section;a.push('',`〔${v.section}〕`);}
    const main=verseModeStatus(v,level);
    const extras=[];
    for(const mode of ['high','mid','low']){if(mode===level)continue;const x=verseModeStatus(v,mode);if(x.touched)extras.push(`${modes[mode]}档${x.t}`);}
    a.push(`${v.text}（${[main.t,...extras].join('；')}）`);
  }
  const entries=(items,label,prompt)=>{let rows=[];let last='';for(const section of items){for(const item of section.items){const s=Number(states[item.id]||0);if(!s)continue;if(last!==section.title){rows.push(`〔${section.title}〕`);last=section.title;}rows.push(`${prompt(item)}（${s===2?'不熟练':'已揭晓'}）`);}}if(rows.length)a.push('',`【${label}】`,...rows);return rows.length>0;};
  entries(data.notes,'重点注释',item=>item.term);
  const anyMeaning=entries(data.meanings,'句意理解',item=>item.prompt);
  const rel=data.links.filter(item=>Number(states[item.id]||0)>0);
  if(rel.length){if(!anyMeaning)a.push('','【句意理解】');a.push('〔全文串联〕',...rel.map(item=>`${item.prompt}（${Number(states[item.id])===2?'不熟练':'已揭晓'}）`));}
  const basic=['author','era'].filter(id=>Number(states[id]||0)>0);if(basic.length)a.push('',`【基本信息】`,...basic.map(id=>`${labels[id]}（${Number(states[id])===2?'不熟练':'已揭晓'}）`));
  if(comment.value.trim())a.push('',`家长补充说明：${comment.value.trim()}`);
  return a.join('\n');
}
async function clipboard(s){if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(s);return true;}catch(e){}}const x=el('textarea');x.value=s;x.style.cssText='position:fixed;left:-9999px;opacity:0';document.body.appendChild(x);x.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}x.remove();return ok;}
card.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!card.contains(b))return;if(b.id==='reset-all'){reset();return;}if(b.dataset.view){setPanel(b.dataset.view);save();status.textContent='';return;}if(b.dataset.level){level=b.dataset.level;buildVerses();save();status.textContent='';return;}if(b.classList.contains('mask')){const id=b.dataset.item;const old=Number(states[id]||0);const next=old===0?1:old===1?2:1;states[id]=next;b.dataset.state=String(next);status.textContent='';save();}});
comment.addEventListener('input',save);
copyBtn.addEventListener('click',async()=>{copyBtn.disabled=true;const ok=await clipboard(result());copyBtn.disabled=false;status.textContent=ok?'✓ 已复制，可粘贴给回收小助手':'复制失败，请检查剪贴板权限';});
restore();buildVerses();buildNotes();buildMeanings();buildLinks();syncMeta();setPanel(activePanel,true);
})();
</script>
