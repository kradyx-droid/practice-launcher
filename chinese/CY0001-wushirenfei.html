<script id="book-data" type="application/json">{"id":"CY0001","answer":"物是人非","chapters":[{"id":"cui","title":"《题都城南庄》","author":"崔护 · 唐","source":"崔护《题都城南庄》 · 首学原文","sourceUrl":"https://zh.wikisource.org/zh-hans/题都城南庄","pages":[{"id":"cui","title":"去年与今年","sub":"崔护《题都城南庄》","blocks":[{"type":"original","text":"去年今日此门中，人面桃花相映红。"},{"type":"original","text":"人面不知何处去，桃花依旧笑春风。"}]}]},{"id":"li","title":"《武陵春》","author":"李清照 · 宋","source":"李清照《武陵春》 · 上片，首学原文","sourceUrl":"https://zh.wikisource.org/zh-hans/武陵春_(李清照)","pages":[{"id":"li","title":"一段旧日的感慨","sub":"李清照《武陵春》上片","blocks":[{"type":"original","text":"风住尘香花已尽，日晚倦梳头。"},{"type":"original","text":"物是人非事事休，欲语泪先流。"}]}]}],"scenes":["许多年后，林瑶沿着熟悉的小巷走到旧书店门前。木制书架还在靠窗的位置，门上的铜铃也会响，可当年总为她留下新书的店主已经退休，柜台后站着陌生的年轻人。她轻轻拨了一下那只铜铃。","少年时，几个朋友每天在操场边的大榕树下等人。多年后，他回来参加校庆，树荫仍盖住半条跑道，当年的朋友却已散在不同城市。他独自在树下站了片刻，仿佛又听见从前的笑声。","家里那张大圆桌仍然摆在饭厅，过节时也照旧铺上红桌布。只是过去总抢着夹菜、热闹说笑的一大家人，如今各自定居远方。她摸着桌边一道旧划痕，忽然想起小时候的年夜饭。","他回到从前练琴的小屋，窗旁的旧钢琴还放在原处，琴盖上那道浅浅的裂纹也没修。以前总坐在旁边听他弹错音的外公已经不在了。按下第一个琴键时，他迟迟没有弹第二个。","小城的码头还留着那排刷成蓝色的木桩，潮水涨落的声音也熟悉。可当年每天在这里修船、和他讲笑话的老师傅早已搬走。站在风里，他觉得这个地方既熟悉又陌生。","她翻出小学合唱队的合影，想起教学楼那间有旧木地板的音乐教室。十几年后再走进去，钢琴和窗帘几乎没变，当年的队员却各有自己的生活，再没有人一起排练那首歌了。","山脚下的老茶馆依然挂着那盏竹灯，桌上的茶壶仍散着淡淡的香味。可小时候每到周末一起喝茶、下棋的邻居们，有的迁居，有的年老不再出门。熟悉的茶香让他想起另一个热闹的下午。","火车站边那排银杏树依旧在秋天铺下一地金黄。她还记得年轻时，母亲总会站在树下等她下车。现在每次经过，站台还是那个站台，她却再也见不到那个熟悉的身影。","少年时代常去的游泳池重新开放了，绿色长椅和墙上的蓝色瓷砖还保留着。教她游泳的教练已经退休，曾经一起练习的伙伴也不再出现。他望着那片水面，想起第一次敢松开池边扶手的自己。","旧邮局改成了展览馆，门口的石阶和高高的玻璃窗都没有拆。她记得以前在这里帮父亲寄信的日子，如今那些常常互通消息的人早已断了联系。她站在石阶上，想起一封没有保存下来的信。","一家人回到多年无人居住的老房子，门廊上的风铃仍会被风吹响，墙上还量着兄妹小时候的身高。可他们早已长大，分别过着完全不同的日子。那几道铅笔线，让人忽然想起童年。","学校门口卖早餐的小铺还开在原处，烤面包的香味从街角飘过来。她想起每天和同桌赶来买早餐的早晨，而如今同桌已经去另一座城市工作。买下同样的面包，却找不到一起分着吃的人。","小镇戏班用过的旧鼓仍陈列在文化馆里，鼓皮上一处补丁清清楚楚。曾经一同演出的伙伴如今散落各地，再也无法像那年夏天一样凑齐一场演出。老人看着旧鼓，良久没有说话。","他在搬家前走进熟悉的小院，院角那口水井还在，葡萄架也沿着旧木梁生长。童年时围在井边打水的人们如今各奔东西，他忽然明白，有些日子只能留在记忆里。","渡口的小木棚依旧面对江水，墙上的刻痕还记录着许多年的水位。曾经在那里值班的父亲已不再工作，昔日一起等船的人也少了。每当船笛响起，她仍会想起过去的清晨。","老街的修表铺还摆着一面挂钟，每到整点都会发出沉稳的钟声。但从前在柜台后耐心修表的师傅已经退休，店里换了另一代人。他听着同样的钟声，记起许多年前在这里等表修好的下午。","老家的院门每到夏天都会挂一串贝壳风铃。现在父母搬去了别处，院子里只剩风铃在海风里轻轻碰响。她路过时听见那声音，忽然想起从前一家人一起乘凉的夜晚。","照片里，十年前的五个孩子挤在校园梧桐树下。如今同一棵树仍伸着长枝，他们却分别在不同城市。有人重拍了一张照片，只能站在树下独自举着相机。","每年中秋，老屋门口总会点亮一盏兔子灯。今年那盏修补过的灯还亮着，围着它猜灯谜的几个表兄妹却已长大，难得聚齐。光照在门槛上，像照着从前。","外公的工具箱仍放在窗台下，旧钳子和卷尺都排得整整齐齐。小圆如今自己学会了修理自行车，可从前在旁边耐心教她的人已经不在。她拿起卷尺，想起那双布满机油的手。","河边那座小石桥经历几次修缮，栏杆上童年时刻下的日期还依稀可见。当年一起在桥上数船的伙伴各有去处，他望着江面，想起大家争着喊第一艘船的声音。","旧住宅楼的楼道仍贴着那张发黄的节水通知，三楼的铁门也没有换。曾经每天在门口问他作业写完没的邻居伯伯早已搬走，楼道安静得听得见自己的脚步。","妈妈把年轻时参加合唱团的节目单夹在书里，纸上印的音乐厅如今还在。她再次坐进同一排座位，灯光一暗，想到那些一起排练的人已经散在各处，不由得握紧了节目单。","海边的灯塔每天傍晚依旧准时亮起。小时候，他总和父亲在岸边等那一束光扫过海面；如今父亲住在很远的地方，只有那道光仍按旧时的节奏转动。","许多年前，班里有个约定：毕业时把写着愿望的纸条放进铁盒。铁盒今天终于从储物柜里取出，教室窗外那棵树还在，读纸条的人却早已走上了各自不同的路。","老饭馆仍在菜单第一页写着“番茄炒蛋”，桌角还有一道浅浅的划痕。奶奶曾带他每周来这里吃饭。如今他带着自己的孩子坐下，熟悉的味道突然让他想起那个已经远去的下午。","过去除夕总有一群孩子蹲在院里看叔叔贴春联。如今红纸仍贴在那扇木门两侧，贴春联的成了当年的孩子，老人们坐在一旁看着，院里的热闹却换了模样。","老剧院重新开门时，台口那块褪色的红幕布居然还留着。多年以前，他总坐在第三排替朋友鼓掌；今天舞台上是另一批演员，熟悉的灯光让他想起再也凑不齐的剧团。","她路过小学时的文具店，看见橱窗里还摆着同款铅笔盒。小时候，父母会在开学前牵着她来挑本子。现在她已牵着自己的孩子站在那里，忽然发现记忆里的人和日子都变了。","旧宿舍墙上的身高刻度一直从门框延伸到窗边。兄弟俩回来整理房间，量身高的铅笔早已找不到了；当年抢着站直的两个孩子，如今已是要为各自家庭忙碌的大人。","那个小镇每年春天都会在广场上架起同一座木制花门。她记得小时候和朋友们从花门下跑过，如今朋友们很少回来。鲜花照样开着，广场上的笑声却已不是记忆里的那些声音。","学校的科学教室还放着一架旧地球仪，上面的太平洋被摸得发亮。曾在这里一起争论远航路线的学生们早已毕业，一位新老师指着同一片海，给另一群孩子讲起世界。","有人把旧日的家庭录像放到电视上：窗边那张小桌子、桌上的玻璃花瓶，到今天都没有变。镜头里围坐吃西瓜的亲人如今很难再聚全，大家看着看着，忽然都安静下来。","公交车仍会在老电影院门前停靠，站牌也还写着那个熟悉的名字。以前每天等车时，朋友总会在他身旁说个不停；如今电影散场的人群换了面孔，再没人催他快上车。","旧院子的葡萄藤长得比过去更茂密，藤下那把折叠椅还靠着墙。小时候坐在椅子上给孩子们讲故事的姑姑已去了外地生活。风吹叶子的时候，他仍觉得故事好像刚讲到一半。","她收到一张十年前的生日贺卡，卡上画的蛋糕与如今桌上的蛋糕几乎一样。只是写卡片的朋友如今远在海的另一边。她把卡片靠在蛋糕旁，望着照片里那张熟悉的笑脸。","老厂区的烟囱还立在城市边缘，如今厂房已改成图书馆。父亲年轻时曾在这里上班，和同事一起从那扇门进出。她带父亲走过旧门时，父亲认得每块砖，却认不得眼前的人群。","村口晒谷场旁的槐树依旧高大，树干上还留着小时候绑秋千的绳痕。如今晒谷的人少了，孩子们也大多去了外地。她伸手摸着绳痕，想起从前一群人等着轮流荡秋千。","一份旧地图上标着他们小时候常去的游乐场。几十年后，旋转木马的音乐还会响，可陪她排队的姐姐已在另一座城市定居。她独自听完一遍旋律，没有再去坐木马。","小时候，每逢下雨，楼下杂货铺的老板总借伞给放学的孩子。多年后她再经过，店门的绿漆仍旧，柜台后却是老板的女儿。屋檐滴水的声音熟悉，借伞的人已经换了。"]}</script>
<script>
'use strict';
const CONFIG=JSON.parse(document.getElementById('book-data').textContent);
const $=id=>document.getElementById(id);
let pageIndex=0;
let answerVisible=false;
let sceneIndex=-1;
let order=[];
let nextAt=0;
const pages=CONFIG.chapters.flatMap(ch=>ch.pages.map(page=>({ch,page})));
function make(tag,cl,content){const el=document.createElement(tag);if(cl)el.className=cl;if(content!==undefined)el.textContent=content;return el}
function append(parent,tag,cl,content){const e=make(tag,cl,content);parent.append(e);return e}
function shuffled(){const a=Array.from({length:CONFIG.scenes.length},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextScene(){if(nextAt>=order.length){const last=sceneIndex;order=shuffled();if(order.length>1&&order[0]===last){[order[0],order[1]]=[order[1],order[0]]}nextAt=0}sceneIndex=order[nextAt++];answerVisible=false;renderScene()}
function renderScene(){$('sceneText').textContent=CONFIG.scenes[sceneIndex]||'';$('answerBody').hidden=!answerVisible;$('answerToggle').textContent=answerVisible?'收起表达 −':'看看这个表达 ＋';$('answerToggle').setAttribute('aria-expanded',String(answerVisible))}
function renderOriginal(p,txt){const target=CONFIG.answer;let i=0,pos=0;while((i=txt.indexOf(target,pos))>=0){if(i>pos)p.append(document.createTextNode(txt.slice(pos,i)));const b=append(p,'button','idiom-mask','····');b.type='button';b.setAttribute('aria-label','揭晓原文中遮住的四字表达');b.dataset.reveal=target;b.addEventListener('click',()=>{b.textContent=target;b.classList.add('revealed')});pos=i+target.length}p.append(document.createTextNode(txt.slice(pos)))}
function renderBook(){const {ch,page}=pages[pageIndex],root=$('bookScroll');root.replaceChildren();$('counter').textContent=`${pageIndex+1} / ${pages.length} 页`;$('barFill').style.width=(100*(pageIndex+1)/pages.length)+'%';$('chapterName').textContent=ch.title;$('topChapter').textContent=ch.author;
const wrap=append(root,'div','content');append(wrap,'div','section',ch.title+' · 第 '+(ch.pages.indexOf(page)+1)+' 页');append(wrap,'h1','book-title',page.title);if(page.sub)append(wrap,'div','book-subtitle',page.sub);
for(const block of page.blocks){if(block.type==='original'){const w=append(wrap,'div','prose'+(CONFIG.id==='CY0001'?' poem':''));const p=append(w,'p',String(block.text).startsWith('“')?'dialogue':'');renderOriginal(p,block.text)}else if(block.type==='context'){append(wrap,'div','context',block.text)}else if(block.type==='bridge'){const e=append(wrap,'div','bridge');append(e,'span','bridge-tag','原作有删节 · 编者说明');append(e,'div','',block.text)}else if(block.type==='pause'){append(wrap,'div','pause',block.text)}}
if(ch.source){const foot=append(wrap,'div','sourceLine',ch.source+' · ');if(ch.sourceUrl){const a=append(foot,'a','','查看原文来源');a.href=ch.sourceUrl;a.target='_blank';a.rel='noopener noreferrer'}}
$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;$('next').textContent=pageIndex===pages.length-1?'已到最后一页':'下一页 →'}
function changePage(n){if(n<0||n>=pages.length)return;pageIndex=n;renderBook();$('bookScroll').scrollTop=0}
$('prev').addEventListener('click',()=>changePage(pageIndex-1));$('next').addEventListener('click',()=>changePage(pageIndex+1));$('nextScene').addEventListener('click',nextScene);
$('answerToggle').addEventListener('click',()=>{answerVisible=!answerVisible;renderScene()});
$('tocBtn').addEventListener('click',()=>{const cover=$('toc');cover.replaceChildren();const panel=append(cover,'div','tocDialog');const header=append(panel,'div','tocH');append(header,'h2','','文学目录');const close=append(header,'button','tocClose','关闭 ✕');close.type='button';close.addEventListener('click',()=>cover.hidden=true);pages.forEach(({ch,page},idx)=>{const b=append(panel,'button','tocItem'+(idx===pageIndex?' active':''),`${String(idx+1).padStart(2,'0')}　${ch.title} · ${page.title}`);b.type='button';b.addEventListener('click',()=>{cover.hidden=true;changePage(idx)})});cover.hidden=false});
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('toc').hidden=true;return}if(e.target.closest('button,input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')changePage(pageIndex-1);if(e.key==='ArrowRight')changePage(pageIndex+1)});
$('brandId').textContent=CONFIG.id;$('answerBody').textContent=CONFIG.answer;order=shuffled();nextScene();renderBook();
</script></body></html>
