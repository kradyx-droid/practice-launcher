const BOOK_DATA={"id":"CY0002","title":"欲言又止","heading":"成语 · 文学阅读 CY0002","subtitle":"v0.8 · 双栏文学阅读","storageKey":"literary_reader_CY0002_v07","exportName":"CY0002_文学阅读_交流记录.txt","sourceMode":"candidate","highlights":["他想要说的话，几次来到嘴边上都没敢说。","“我们……应该……”","“我们不能这样，我们……”","“晴天里洗衣裳，一会就干了。”","宝玉揉着眼睛，待要说什么，又不好说的。"],"chapters":[{"id":"ma","title":"《马伯乐》","author":"萧红","source":"萧红《马伯乐》 · Candidate v0.5","sourceUrl":"https://zh.wikisource.org/zh-hans/马伯乐","pages":[{"id":"P01","title":"一件想说又难说的事","sub":"萧红《马伯乐》 · 阅读第一页","blocks":[{"type":"context","text":"萧红是中国现代作家。《马伯乐》写的是战争年代一个普通人的生活。当时不少地方不太平，一些人不得不考虑搬到别的城市去。马伯乐原先从青岛来到上海，现在又担心上海不能久住。他和妻子、孩子暂住旅馆，下一步要去哪里、路费够不够，都需要商量。马伯乐很想问妻子带来了多少钱，好安排接下来的行程。接下来读读他到底是怎样开口的。"},{"type":"original","text":"马伯乐在街上徘徊着，越徘徊越觉得不好。让事情这样拖延下去是不好的，是不能再拖的了。他走回旅馆里，他想一上楼，直接了当地就和太太说："},{"type":"original","text":"“你到底是带来了多少钱，把钱拿出来，我们立刻规划一下，该走就走吧，上海是不好多住的。”"}]},{"id":"P02","title":"话到了嘴边","sub":null,"blocks":[{"type":"original","text":"可是当他一走进房间去，太太那冷森森的脸色，使他一看了就觉得不大好。他想要说的话，几次来到嘴边上都没敢说。马伯乐在地板上绕着圈，绕了三四个圈，到底也没敢说。"},{"type":"original","text":"他看样子说了是不大好的，一说太太一定要发脾气。因为太太是爱钱如命的，如果一问她究竟带来了多少钱，似乎他要把钱拿过来的样子。太太一听就非发脾气不可的。"},{"type":"bridge","text":"他终究没有问出来。原作接着写了这对夫妻平日怎样相处、马伯乐常怎样绕着弯子说话；这里删去相关叙述。又过了几天，这件事仍压在他心里。"},{"type":"original","text":"马伯乐除了白天叹气，夜里也叹气之外，他在旅馆里陪着太太住了三天三夜是什么也没有做。"},{"type":"original","text":"每当他想要直截了当地问一问太太到底是带来了多少钱，但到要问的时候，他就不敢啦，因为他看出来了太太的脸色不对。"}]},{"id":"P03","title":"说了几个字，又逃走","sub":null,"blocks":[{"type":"original","text":"“我们……应该……”"},{"type":"original","text":"马伯乐刚一说了三四个字，就被太太的脸色吓住了。"},{"type":"original","text":"“我们不能这样，我们……”"},{"type":"original","text":"他又勉强他说出了几个不着边际的字来，他一看太太的脸色非常之不对，说不定太太要骂他一顿的，他很害怕。他打开旅馆房间的门，下楼就逃了。"},{"type":"original","text":"而且一边下着楼梯，他一边招呼着正从楼梯往上走的约瑟："},{"type":"original","text":"“约瑟，约瑟，快上街去走走吧！”"},{"type":"original","text":"好像那旅馆的房间里边已经发生了不幸，不但马伯乐他自己要赶快地躲开，就是别人他也要把他招呼住的。"},{"type":"bridge","text":"到了第四天，他又在心里抱怨起来，并决心这回一定把钱的事问清楚。这里略去原作含粗俗语言的两段自语，继续读他如何给自己壮胆。"},{"type":"original","text":"马伯乐这回已经下了决心了，这回他可不管这一套，要问，开口就问的，用不着拐弯抹角。就问她到底是从家里带来了多少钱。马伯乐的决心已经定了。"}]},{"id":"P04","title":"气势汹汹地冲上楼","sub":null,"blocks":[{"type":"original","text":"他找了不少的理论根据之外还说了不少的警句："},{"type":"original","text":"“做人要果断。当断不断必受其乱。”"},{"type":"original","text":"“大丈夫，做起事来要直截了当。”"},{"type":"original","text":"“真英雄要敢做敢为。”"},{"type":"original","text":"“大人物要有气派。”"},{"type":"original","text":"马伯乐气冲冲地从街上走进旅馆来了。又气冲冲地走上旅馆的楼梯了。他看了三十二号是他的房间，他勇猛得和一条鲨鱼似的向着三十二号就冲去了。"},{"type":"original","text":"“做人若没有点气派还行吗？”"},{"type":"original","text":"他一边向前冲着，一边用这句话鼓动着自己的勇气。"},{"type":"original","text":"他走到三十二号的门前了，他好像强盗似的，把门一脚踢开了。非常之勇敢，好像要行凶的样子。"},{"type":"original","text":"他走进房间去一看，太太不在。"},{"type":"original","text":"他想：太太大概是在凉台上晒衣裳。"},{"type":"original","text":"于是他飞一般地快，就追到楼顶晒台上去了。"}]},{"id":"P05","title":"最后说出口的是什么？","sub":null,"blocks":[{"type":"bridge","text":"这里略去他担心自己的勇气很快会消失的几段心理活动。随后，他追到了楼顶。"},{"type":"original","text":"等他冲到了楼顶，他的勇气果然消散了。"},{"type":"original","text":"他开口和太太说了一句很温和的话，而且和他在几分钟之前所想要解决的那件严重的事情毫无关系，他向太太说："},{"type":"original","text":"“晴天里洗衣裳，一会就干了。”"},{"type":"original","text":"好像中国人的习惯，彼此一见了先说“天气哈哈哈”一样。马伯乐说完了，还很驯顺地站在太太的一旁。好像他来到晒台上就是为的和太太说这句闲话才来的。在前一分钟他满身的血气消散尽了，是一点也不差，照着他自己所预料的完全消散尽了。"},{"type":"pause","text":"读到这里，可以停一停。想想他一路冲上楼的样子，和最后说出口的话。"}]},{"id":"P06","title":"事情后来怎样了","sub":null,"blocks":[{"type":"bridge","text":"原作接下来还有许多事情，和刚才晒衣服的场景相隔了一段时间，并非紧接同一天的对话。后来妻子发现马伯乐情绪不对，猜他想要什么。他一连否认了几样东西，直到妻子主动问起钱。"},{"type":"original","text":"太太说：“你要钱吗？”"},{"type":"original","text":"马伯乐一听提到钱了，他就全身颤抖起来，他感动得不得了，他几乎要爆炸了的样子。他觉得他的心脏里边，好像中了个炸弹似的，他觉得他的心脏里边拥塞得不得了，说不定一个好好的人，就要立刻破碎了。"},{"type":"original","text":"马伯乐在这种半昏迷的状态之下，他才敢说："},{"type":"original","text":"“我要去汉口呀……”"}]},{"id":"P07","title":"原来，她是这样回答的","sub":null,"blocks":[{"type":"original","text":"太太就笑起来了，把那烫得很细的波浪的长头发，好像大菌子伞似的，伏在马伯乐的身上，说："},{"type":"original","text":"“这很容易，我以为什么了不起的事呢，就是去汉口！那么咱们就一齐去汉口吧。”说着太太就从床上跳到地上去，她跳得那么灵便而轻快，就像她长着蚂蚱腿似的。"},{"type":"original","text":"而且从床底下就把小箱子拉出来了。从箱子里就拿出来一个通红的上边闪着金字的银行的存款折。"},{"type":"original","text":"太太把这存款折就扔给马伯乐了。"},{"type":"bridge","text":"原作接着写马伯乐紧张地遮起窗帘、细看存款折的数目；这里略去这些动作。故事随后这样收束："},{"type":"original","text":"三天以后，他们就收拾了东西，离开上海了。"}]}],"discussion":{"title":"读后交流","intro":"先读故事，再回到这里聊一聊。可以口答，也可以简单写；不要求每翻一页就作答。","questions":[{"id":"P08","label":"第一印象","text":"这个故事里，马伯乐哪一段举动让你印象最深？你觉得他是一个怎样的人？","optional":false,"reference":"回头看看马伯乐在房间里绕圈、话说到“我们……”就跑下楼，以及后来不断给自己壮胆、冲上晒台却只聊天气的描写。你从中看出了他怎样的特点？先说你的判断，再挑真正能说明这个特点的举动，并想想“为什么这个举动能证明我的判断”。如果说出不止一个特点，记得分别找证据。","placeholder":"想写就写，也可以直接继续翻书","referenceLabel":"思考提示","compactReference":true},{"id":"MA-Q2","label":"再聊一个（可选）","text":"马伯乐一直想讲的事为什么拖了这么久？后来事情又怎样解决的？","optional":true,"reference":"马伯乐原本急着和妻子商量什么？他为什么几次话到嘴边又停住，甚至下楼躲开？再看看后来是谁先提起钱，事情又怎么变化。试着把“想说的事—心里的顾虑—实际做法—后来的结果”连起来。还要留意：他担心妻子会生气，那是他当时的猜测，还是故事里已经发生的事？","placeholder":"可以口头说，不必写长段","referenceLabel":"思考提示","compactReference":true}],"reveal":{"id":"ma-teaching","title":"把那一刻说得更准确","lead":"马伯乐心里早有话想说，可一到要开口的时候，又被各种顾虑绊住了，话到了嘴边又收回去。","word":"欲言又止","pinyin":"yù yán yòu zhǐ","tail":"“想说，却又停住不说”，就可以用这个成语来表达。它说的是小说中的一个心理动作，不等于这篇小说只有这一个意思。"},"showQuestionsFromPage":4,"noteBefore":"先安心读故事。读到最后两页，再回头交流人物印象也可以。"}},{"id":"hong","title":"《红楼梦》","author":"曹雪芹","source":"《红楼梦》程甲本第二十八—二十九回","sourceUrl":"https://zh.wikisource.org/zh-hans/红楼梦（程甲本）/二十八","pages":[{"id":"P10","title":"又一位作家怎样写人物的心事","sub":"《红楼梦》· 第二十八回末","blocks":[{"type":"context","text":"曹雪芹写的《红楼梦》，很擅长用人物间的玩笑、眼神和动作写出没有明说的心事。贾宝玉与林黛玉、薛宝钗都很熟悉。书里还有一层背景：有人曾把宝玉的玉与宝钗的金锁联系起来，议论过两人的婚事，这使他们之间的相处有时有些微妙。下面，宝玉向宝钗借看一串珠子，黛玉恰好也在附近。看看这一小段发生了什么。"},{"type":"original","text":"此刻忽见宝玉笑道：“宝姐姐，我瞧瞧你的那香串子？”可巧宝钗左腕上笼着一串，见宝玉问他，少不得褪了下来。"},{"type":"bridge","text":"原作接着写宝玉注意宝钗的容貌，想起旁人议论的“金玉”之事，看得出了神。这里删去相关身体描写和心理描写数句；下面继续接回原文。"}]},{"id":"P11","title":"一个玩笑、一方手帕","sub":"第二十八回末 → 第二十九回初","blocks":[{"type":"original","text":"不觉就呆了，宝钗褪下串子来递与他也忘了接。宝钗见他呆了，自己倒不好意思的，丢下串子，回身才要走，只见林黛玉登着门槛子，嘴里咬着手帕子笑呢。宝钗道：“你又禁不得风吹，怎么又站在那风口里？”林黛玉笑道：“何曾不是在房里的。只因听见天上一声叫，出来瞧了瞧，原来是个呆雁。”宝钗道：“呆雁在那里呢？我也瞧瞧。”林黛玉道：“我才出来，他就‘忒儿’一声飞了。”口里说着，将手里帕子一甩，向宝玉脸上甩来，宝玉不知，正打在眼上，“嗳哟”了一声。"},{"type":"bridge","text":"第二十八回到这里结束。第二十九回开头又从宝玉受惊的瞬间接着写，手帕碰到眼睛仍是同一件事，不是又被甩了一次。"},{"type":"original","text":"话说宝玉正自发怔，不想黛玉将手帕子甩了来，正磞在眼睛上，倒唬了一跳，问：“是谁？”林黛玉摇着头儿笑道：“不敢，是我失了手，因为宝姐姐要看呆雁，我比给他看，不想失了手。”宝玉揉着眼睛，待要说什么，又不好说的。"}]}],"discussion":{"title":"另一种写法","intro":"《马伯乐》写出许多内心活动；《红楼梦》更多让我们从动作、玩笑里体会人物。","questions":[{"id":"P12","label":"读后交流","text":"《马伯乐》把人物心里想的过程写得很多。《红楼梦》里，你从哪个动作或短句看出宝玉似乎想说什么，又停住了？","optional":false,"reference":"回头看看宝玉看珠串时的反应、黛玉的玩笑和手帕甩来后的动作。原文具体写了宝玉什么？哪一句让你感觉他有话想说却停住了？如果还想猜猜他心里怎么想，分清哪些是作者明写的，哪些是我们根据情境推测的。","placeholder":"从原文里找一个动作或短句，说说你的观察","referenceLabel":"思考提示","compactReference":true},{"id":"P13","label":"换个生活场景 · 填空","text":"妹妹走到厨房门口，本来想告诉妈妈自己打碎了杯子。见妈妈正忙着收拾满桌东西，她犹豫了一下。\n妹妹站在门口，________，最终还是没把打碎杯子的事说出来。","optional":true,"reference":"妹妹已经走到厨房门口，却看见妈妈正忙。空格要表现的是她那一刻想开口又停住的样子。想想她原本要说什么、为什么迟疑，再选一个贴合场景的词语或自然说法，不一定要写四个字。","placeholder":"横线上可以填几个字，不一定要四字","referenceLabel":"思考提示","compactReference":true}],"showQuestionsFromPage":1,"noteBefore":"先读读人物的玩笑和动作，读到第 2 页再聊也可以。"}}],"endingNote":"鲁迅《故乡》目前是教研备用延伸，尚无孩子端阅读选段，所以不列入本册页数。","legacyStorageKeys":["literary_reader_CY0002_v06"]};

  input.addEventListener('input',()=>{ state.entries[q.id]=input.value; save(); });
  if (state.submitted[q.id]) {
    appendReference(box,q);
  } else {
    const submit=button('保存记录 · 查看思考提示',()=>{
      if (state.submitted[q.id]) return;
      state.entries[q.id]=input.value;
      state.submitted[q.id]={answer:input.value,at:new Date().toISOString()};
      save();
      submit.remove();
      appendReference(box,q);
    },'questionSave');
    box.append(submit);
  }
  return box;
}
function updateSideStatus(current) {
  $('sideStatus').textContent=current.page.isTeaching?'成语介绍':`${current.n+1} / ${current.chapter.pages.filter(p=>!p.isTeaching).length} · ${current.chapter.title}`;
}
function renderSide(preservePosition=false) {
  const pane=$('sideScroll');
  const scroll=pane.scrollTop;
  const current=FLAT[state.index];
  const ch=current.chapter;
  const d=ch.discussion || {};
  sideChapterId=ch.id;
  pane.replaceChildren();
  $('sideTitle').textContent=d.title || '聊一聊';
  $('sideSubtitle').textContent=d.intro || '先读作品，再自然交流；可以随时停下。';
  updateSideStatus(current);
  if (d.noteBefore) add(pane,'p','readingNote',d.noteBefore);
  for (const q of d.questions || []) {
    if (q.optional) {
      const expanded=!!state.optional[q.id];
      const wrap=add(pane,'section','');
      const toggle=button((expanded?'收起':'展开')+' · '+(q.label || '可选交流'),()=>{
        state.optional[q.id]=!state.optional[q.id]; save(); renderSide(true);
      },'optional');
      toggle.setAttribute('aria-expanded',String(expanded));
      wrap.append(toggle);
      if (expanded) panelQuestion(wrap,q);
    } else panelQuestion(pane,q);
  }
  if (state.index===TOTAL-1 && ROOT.endingNote) add(pane,'p','utility',ROOT.endingNote);
  const util=add(pane,'div','utility');
  add(util,'span','','交流内容写在同一个输入框，随写随存。');
  add(util,'br','');
  util.append(button('导出交流记录',download));
  if (preservePosition) pane.scrollTop=scroll;
}
function go(i) {
  if (!Number.isInteger(i) || i<0 || i>=TOTAL) return;
  state.index=i;
  save();
  render();
  $('bookScroll').scrollTop=0;
}
function render() {
  const current=FLAT[state.index],ch=current.chapter,p=current.page;
  $('counter').textContent=`${state.index+1} / ${TOTAL} 页`;
  $('barFill').style.width=(100*(state.index+1)/TOTAL)+'%';
  const totalReading=ch.pages.filter(v=>!v.isTeaching).length;
  $('chapterName').textContent=p.isTeaching? ch.title+' · 成语介绍' : ch.title+' · '+(current.n+1)+' / '+totalReading+' 页';
  $('topChapter').textContent=p.isTeaching?'从故事中得到的表达':ch.author+' · 文学原文';
  const box=$('bookScroll'); box.replaceChildren();
  const wrap=add(box,'div','content');
  add(wrap,'div','section',p.isTeaching?'读完主篇 · 认识一个表达':ch.title+' · 第 '+(current.n+1)+' 页');
  add(wrap,'h1','book-title',p.title);
  if (p.sub) add(wrap,'div','subtitle',p.sub);
  for (const block of p.blocks) addReadingBlock(wrap,block);
  if (ch.source && !p.isTeaching) {
    const src=add(wrap,'div','sourceLine'); add(src,'span','',ch.source+' · ');
    const url=sourceHref(ch.sourceUrl);
    if (url) {const a=add(src,'a','','公开原文');a.href=url;a.rel='noopener noreferrer';a.target='_blank';}
  }
  $('prev').disabled=state.index===0;
  $('next').disabled=state.index===TOTAL-1;
  const next=FLAT[state.index+1];
  $('next').textContent= next && next.page.isTeaching?'下一页 · 认识一个表达 →': next && next.c!==current.c? '下一篇 '+next.chapter.title+' · 可改天 →':next?'下一页 →':'已经读到最后一页';
  // IMPORTANT: Do not remount the right-side controls when flipping LEFT pages.
  // This preserves its scroll position, focus, typed text and expanded optional items.
  if (sideChapterId !== ch.id) renderSide(false);
  else updateSideStatus(current);
}
function toc() {
  const list=$('tocList'); list.replaceChildren();
  for (let i=0;i<FLAT.length;i++) {
    const x=FLAT[i];
    const b=button('',()=>{ $('toc').hidden=true; go(i); },'tocItem'+(i===state.index?' active':''));
    add(b,'span','',x.chapter.title+'｜'+x.page.title);
    add(b,'small','',`第 ${i+1} 页`); list.append(b);
  }
  $('toc').hidden=false; $('tocClose').focus();
}

function resetReader() {
  const question = '确定清空本篇阅读进度及全部交流记录，从第 1 页重新开始吗？\n\n此操作无法撤销。';
  if (!window.confirm(question)) return;
  // Clear BOTH the current version and any compatible earlier keys.
  // Without clearing legacy data, re-opening the reader could import old answers.
  try {
    const keys = new Set([ROOT.storageKey, ...(ROOT.legacyStorageKeys || [])]);
    for (const key of keys) if (key) localStorage.removeItem(key);
  } catch (e) { /* Browsers may disable local storage. In-page reset still works. */ }
  state = blank();
  save();
  sideChapterId = null; // Force reset of answer widgets and revealed references.
  $('toc').hidden = true;
  render();
  $('bookScroll').scrollTop = 0;
  $('sideScroll').scrollTop = 0;
  window.scrollTo(0, 0);
  $('tocBtn').focus();
  showToast('已清空本篇记录，从第 1 页重新开始');
}

function download() {
  const rows=[ROOT.heading+'｜交流记录','导出时间：'+new Date().toLocaleString('zh-CN'),`上次翻书：第 ${state.index+1} / ${TOTAL} 页`];
  for (const ch of ROOT.chapters) for (const q of ch.discussion?.questions || []) {
    const entry=String(state.entries[q.id] || '');
    if (!entry.trim() && !state.submitted[q.id]) continue;
    rows.push('',ch.title+'｜'+(q.label||'读后交流'),'问题：'+q.text,'交流记录：'+(entry||'（未填写）'));
  }
  const blob=new Blob([rows.join('\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=E('a');
  a.download=ROOT.exportName || '文学阅读_交流记录.txt'; a.href=url;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
$('next').addEventListener('click',()=>go(state.index+1));
$('prev').addEventListener('click',()=>go(state.index-1));
$('later').addEventListener('click',()=>{save();showToast('已记住第 '+(state.index+1)+' / '+TOTAL+' 页，下次打开可以接着读');});
$('tocBtn').addEventListener('click',toc);
$('resetReaderBtn').addEventListener('click',resetReader);
$('tocClose').addEventListener('click',()=>$('toc').hidden=true);
$('toc').addEventListener('click',e=>{if(e.target===$('toc'))$('toc').hidden=true;});
window.addEventListener('keydown',e=>{
  if (!$('toc').hidden) {if (e.key==='Escape') $('toc').hidden=true;return;}
  if (e.target.closest('textarea,input,button,select,[contenteditable]')) return;
  if (e.key==='ArrowRight'&&state.index<TOTAL-1){e.preventDefault();go(state.index+1);}
  if (e.key==='ArrowLeft'&&state.index>0){e.preventDefault();go(state.index-1);}
});
render();
</script></body></html>
